<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#F0662A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MettleUp HQ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>MettleUp HQ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
  <script type="module" src="/pwa.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#gyms">MettleUp <span>HQ</span></a>
    <button id="install" class="button install" type="button" hidden>Install app</button>
    <button id="menu-toggle" class="button menu-toggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
    <div id="menu" class="menu">
      <nav aria-label="HQ pages">
        <a href="#gyms">All gyms</a>
        <a href="#system">System</a>
        <a href="#feedback">Feedback</a>
        <a href="#leads">Leads</a>
        <a href="#deletes">Delete requests</a>
        <a href="#log">Log</a>
      </nav>
      <div class="me"><span id="who"></span> <a href="/auth/logout">Sign out</a></div>
    </div>
    <p id="install-hint" class="install-hint" role="status" hidden></p>
  </header>
  <main id="main"><p class="muted">Loading…</p></main>
</body>
</html>
