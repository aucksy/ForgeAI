# Cross-role journey 4, member step 1 of 2: run-journeys.sh opened the gym's check-in poster link
# /c/<CODE> at the app. The owner added Kiran Desk with mobile 98765 00011 and sold her a Monthly
# plan in the admin app (XJ4a). One tap "Check in", the number asked once, typed, Check in.
# 0048 (R-287): a typed number now waits for the desk's yes first ("Ask the front desk to confirm your
# mobile number..."); before 0048 is live it checks in at once. This step ends on either screen and
# leaves it open: the admin step XJ4c says yes in "Numbers to confirm" when one is waiting, then
# xj-4-checkin-done.yaml finishes (Check in again if asked) and checks "You're in".
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "^Check in at ${GYM}$"
    timeout: 45000
- assertVisible: 'Tap Check in when you are at the gym\.'
- tapOn: "^Check in$"
- extendedWaitUntil:
    visible: 'Type the mobile number your gym has for you\. The app asks only once\.'
    timeout: 30000
- tapOn: "Your mobile number"
- inputText: "98765 00011"
- hideKeyboard
- takeScreenshot: xj4-01-number-typed
- tapOn: "^Check in$"
- extendedWaitUntil:
    visible: '(You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m|Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.)'
    timeout: 30000
- runFlow:
    when:
      visible: 'Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.'
    commands:
      - takeScreenshot: xj4-01b-desk-check
