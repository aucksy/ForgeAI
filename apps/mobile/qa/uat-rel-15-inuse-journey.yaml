# Part UAT, flow 15 (R-345, owner 5 Nov 2026: "I just touched the banner that shows in use and it went
# away, and that little button on the rest timer that says tap in use went away too"). Starts afresh
# (gate-demo: clearState + demo), so it runs first in the part, whatever the other flows do.
# The journey as a member walks it, on a dumbbell move (In use does not open by itself, so the rest
# bar says "Tap to show In use") and on a machine (it opens by itself):
#   1. Lateral Raise set 1 ticked: the rest bar and its hint; the clock opens In use by hand.
#   2. A tap in the MIDDLE of In use closes it: the rest bar stays, the hint stays, the clock counts.
#   3. Opened again, a tap ON the tick ("Show after every set of this exercise"): the screen must stay
#      open, the tick shows ticked, and the rest bar then says In use now opens after every set.
#   4. A tap on "I'm back" (the nearest thing to the tick) closes it; the tick turned off again.
#   5. Leg Extension set 1 ticked (70 kg, a record): R-357 the "New record" pop-up first, then In use opens by itself with the watch's lines (R-346: "Previous ..."
#      and "Next ...", no kg to beat); a middle tap closes it; the bar says In use opens after each set.
# R-364 (owner rule, 5 Nov 2026: every type of UAT): also the app sent to the background and back,
# the notification shade, untick + tick again, a set edited during the rest, a long name on a cable.
# Pictures rel-345-*.png, rel-357-*.png, rel-359-*.png (qa-out/uat-release/).
appId: com.mettleup.app
---
- runFlow: gate-demo.yaml
- tapOn:
    text: "^Workout$"
    index: 0
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Start empty workout$"
- tapOn: "^Start empty workout$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout|^Add exercise$"
    timeout: 30000
# ---------------------------------------------------------------- two exercises: dumbbell + machine
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Add exercise$"
- tapOn: "^Add exercise$"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " Lateral Raise"
- tapOn:
    text: "Select Lateral Raise"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "Lateral Raise set 1 weight, kilograms"
    timeout: 20000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Add exercise$"
- tapOn: "^Add exercise$"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " Leg Extension"
- tapOn:
    text: "Select Leg Extension"
    index: 0
- tapOn: "Add 1"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Leg Extension set 1 weight, kilograms"
# A long rest (5:00) on both, so nothing below races the end of the rest (suspect (b)).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "More for .*Lateral Raise.*"
- tapOn:
    text: "More for .*Lateral Raise.*"
    index: 0
- tapOn: "Rest timer"
- tapOn: "Rest 5:00"
- extendedWaitUntil:
    notVisible: 'For .*Remembered for next time\.'
    timeout: 10000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "More for .*Leg Extension.*"
- tapOn:
    text: "More for .*Leg Extension.*"
    index: 0
- tapOn: "Rest timer"
- tapOn: "Rest 5:00"
- extendedWaitUntil:
    notVisible: 'For .*Remembered for next time\.'
    timeout: 10000
# The machine needs a set still open after set 1, or In use stays closed by design (last set).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Leg Extension set 1 weight, kilograms"
- tapOn:
    text: "^Add set$"
    below:
      text: "Leg Extension set 1 weight, kilograms"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Leg Extension set 1 weight, kilograms"
      VALUE: " 70"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Leg Extension set 1 reps"
      VALUE: " 12"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Lateral Raise set 1 weight, kilograms"
      VALUE: " 10"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Lateral Raise set 1 reps"
      VALUE: " 12"
# ---------------------------------------------------------------- R-359: the card's "Last: ..." row
# The demo has Leg Extension history, so its card shows "Last: <date> · <routine>" in the muscle and
# rest row (R-359: that row now runs under the menu button to the card's edge). Picture for the
# owner's phone size: on the same row as the rest time, or wrapped?
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "More for .*Leg Extension.*"
# Its spoken label is "Previous is from <day>, <routine>" (the words on screen may read "Last: ...").
- assertVisible: '(.*Last: .*|Previous is from .*|Previous: .*)'
- takeScreenshot: rel-359-01-card-last-row
# ---------------------------------------------------------------- 1. dumbbell: the bar and its hint
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Lateral Raise set 1"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 8000
# The first rest may ask about on-time alerts (Android 14); answer it so nothing sits on top.
- tapOn:
    text: "Not now"
    optional: true
- runFlow: sub-popup-gone.yaml
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 3000
    optional: true
- assertNotVisible: 'In use\. .*Tap to close'
- assertVisible: "^Tap to show In use$"
- takeScreenshot: rel-345-01-dumbbell-rest-bar-hint
- tapOn:
    text: 'Rest, \d+ seconds left\. Show machine in use'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- assertVisible:
    text: "Show after every set of this exercise"
    checked: false
# R-346: the Lateral Raise's only set is done, so its In use has no "Next" line; never the kg to beat.
- assertNotVisible: '.*to beat the previous total.*'
- takeScreenshot: rel-345-02-in-use-open
# ---------------------------------------------------------------- 2. a tap in the middle closes it
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 5000
- takeScreenshot: rel-345-03-after-middle-tap
- assertVisible: "Skip rest"
- assertVisible: "^Tap to show In use$"
- copyTextFrom: 'Rest, \d+ seconds left\. Show machine in use'
- evalScript: ${output.restA = maestro.copiedText}
- extendedWaitUntil:
    visible: "never shown, a 2.5 s wait"
    timeout: 2500
    optional: true
- copyTextFrom: 'Rest, \d+ seconds left\. Show machine in use'
- assertTrue: ${maestro.copiedText != output.restA}
# ---------------------------------------------------------------- R-364 interruptions during the rest
- pressKey: Home
- extendedWaitUntil:
    visible: "never shown, a 2 s wait"
    timeout: 2000
    optional: true
- launchApp
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 20000
- assertVisible: "^Tap to show In use$"
- assertNotVisible: 'In use\. .*Tap to close'
- takeScreenshot: rel-345-10-back-from-home
- swipe:
    start: "50%,1%"
    end: "50%,70%"
    duration: 600
- extendedWaitUntil:
    visible: "never shown, a 1.5 s wait"
    timeout: 1500
    optional: true
- takeScreenshot: rel-345-11-shade-down
- back
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 10000
- assertVisible: "^Tap to show In use$"
- assertNotVisible: 'In use\. .*Tap to close'
- takeScreenshot: rel-345-12-shade-closed
# ---------------------------------------------------------------- 3. a tap ON the tick
- tapOn:
    text: 'Rest, \d+ seconds left\. Show machine in use'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- tapOn:
    text: "Show after every set of this exercise"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 2500
    optional: true
- takeScreenshot: rel-345-04-after-tick-tap
# Observation for the report: did the tap on the tick close the screen?
- runFlow:
    when:
      notVisible: 'In use\. .*Tap to close'
    commands:
      - takeScreenshot: rel-345-04b-OBS-tick-tap-CLOSED-the-screen
      - tapOn:
          text: 'Rest, \d+ seconds left\. Show machine in use'
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          visible: 'In use\. .*Tap to close'
          timeout: 8000
- assertVisible:
    text: "Show after every set of this exercise"
    checked: true
- takeScreenshot: rel-345-05-tick-on-screen-open
# ---------------------------------------------------------------- 4. "I'm back" closes; the bar says the new state
- tapOn:
    text: "^I'm back$"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 5000
- assertVisible: "Skip rest"
- takeScreenshot: rel-345-06-bar-after-tick-on
- runFlow:
    when:
      notVisible: "^Tap to show In use$"
    commands:
      - takeScreenshot: rel-345-06b-OBS-hint-GONE-after-tick
# The bar names the new state (R-345 fix): In use now opens by itself after this exercise's sets.
- assertVisible: "^In use opens after each set$"
# Turn it back off from the In use screen: the bar's hint comes back.
- tapOn:
    text: 'Rest, \d+ seconds left\. Show machine in use'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- tapOn:
    text: "Show after every set of this exercise"
    waitToSettleTimeoutMs: 300
- assertVisible:
    text: "Show after every set of this exercise"
    checked: false
- back
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 5000
- assertVisible: "^Tap to show In use$"
- takeScreenshot: rel-345-07-bar-after-tick-off
# ---------------------------------------------------------------- R-364 untick, tick again
- runFlow:
    file: sub-find.yaml
    env:
      FIND: ".*Lateral Raise set 1 complete\\. Tap to undo"
- tapOn:
    text: ".*Lateral Raise set 1 complete\\. Tap to undo"
    index: 0
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Lateral Raise set 1"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 8000
- runFlow: sub-popup-gone.yaml
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 2500
    optional: true
- assertNotVisible: 'In use\. .*Tap to close'
- assertVisible: "^Tap to show In use$"
- takeScreenshot: rel-345-13-untick-retick-bar
- tapOn: "Skip rest"
- extendedWaitUntil:
    notVisible: "Skip rest"
    timeout: 5000
# ---------------------------------------------------------------- 5. machine: a record first, then In use by itself
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Leg Extension set 1"
# R-357 (owner, 5 Nov 2026: "Let the banner start after the toast is done"): 70 kg beats the demo's
# best, so the "New record" pop-up shows first, alone, for its full time; In use opens after it.
- extendedWaitUntil:
    visible: 'New record, Leg Extension\..*'
    timeout: 5000
- assertNotVisible: 'In use\. .*Tap to close'
- takeScreenshot: rel-357-01-record-pop-up-first
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 14000
- assertNotVisible:
    id: "set-popup"
- takeScreenshot: rel-357-02-in-use-after-the-pop-up
- assertVisible:
    text: "Show after every set of this exercise"
    checked: true
# R-346 (owner, 5 Nov 2026): the watch's rest lines for this machine's next set, never the kg to beat.
- assertVisible: 'In use\. (Previous .+\. )?Next .+\. Back in .*'
- assertVisible: '^Next .+ × \d+$'
- assertNotVisible: '.*to beat the previous total.*'
- takeScreenshot: rel-345-08-machine-in-use-by-itself
- tapOn:
    point: "50%,50%"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 5000
- assertVisible: "Skip rest"
- assertVisible: "^In use opens after each set$"
- takeScreenshot: rel-345-09-machine-bar-after-close
# ---------------------------------------------------------------- R-364 edit a set during the rest
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Leg Extension set 2 reps"
      VALUE: " 9"
- assertVisible: "Skip rest"
- assertVisible: "^In use opens after each set$"
- assertNotVisible: 'In use\. .*Tap to close'
- tapOn:
    text: 'Rest, \d+ seconds left\. Show machine in use'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- assertVisible: '^Next .+ × 9$'
- takeScreenshot: rel-345-14-next-follows-the-edit
- back
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 5000
- tapOn: "Skip rest"
# ---------------------------------------------------------------- R-364 edge: a long name on a cable
# "Single-Arm Overhead Cable Extension" (35 letters, cable: In use opens by itself) at this phone's
# size: the name, the Next line, the clock and the tick strip all fit.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Add exercise$"
- tapOn: "^Add exercise$"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " Single-Arm Overhead Cable"
- tapOn:
    text: "Select Single-Arm Overhead Cable Extension"
    index: 0
- tapOn: "Add 1"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Single-Arm Overhead Cable Extension set 1 weight, kilograms"
- tapOn:
    text: "^Add set$"
    below:
      text: "Single-Arm Overhead Cable Extension set 1 weight, kilograms"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Single-Arm Overhead Cable Extension set 1 weight, kilograms"
      VALUE: " 10"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Single-Arm Overhead Cable Extension set 1 reps"
      VALUE: " 12"
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Single-Arm Overhead Cable Extension set 1"
- runFlow: sub-popup-gone.yaml
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- assertVisible: "Single-Arm Overhead Cable Extension"
- assertVisible:
    text: "Show after every set of this exercise"
    checked: true
- takeScreenshot: rel-345-15-long-name-in-use
- back
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 5000
- tapOn: "Skip rest"
