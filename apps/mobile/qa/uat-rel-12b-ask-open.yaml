# Part UAT, flow 12b (gym, after flow 12): R-533 (owner, 14 Nov 2026) "when I responded back from the admin panel,
# there was no notification... and there was no dot". Uma sends one question and leaves it open; run-device-qa.sh then
# answers it as the gym (qa/uat_gym.py answer), and flow 12c checks the red count on the row, opens the reply, and
# checks the count is gone. Skipped (no "A trainer" on "Message your gym") without 0053 (live since 9 Nov 2026).
# R-549 (14 Nov 2026): the question is asked from the one "Message your gym" page, side "A trainer".
appId: com.mettleup.app
---
- tapOn:
    text: "^Gym$"
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Message your gym$'
- tapOn: "^Message your gym$"
# in-view: the page just opened at its top; the hint sits under the Question chip
- extendedWaitUntil:
    visible:
      id: "talk-kind-hint-ready"
    timeout: 30000
- runFlow:
    when:
      notVisible: "^A trainer$"
    commands:
      - back
# R-549: "Ask about your workout" is the "A trainer" side of "Message your gym" (skipped without 0053).
- runFlow:
    when:
      visible: "^A trainer$"
    commands:
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: '^A trainer$'
      - tapOn: "^A trainer$"
      - extendedWaitUntil:
          visible: '^Who should answer\?$'
          timeout: 30000
          optional: true
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Who should answer\?$'
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: '^Any trainer or the owner$'
      - tapOn: "^Any trainer or the owner$"
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: 'For example: How can I squat deeper without pain in my knees\?'
      - tapOn: 'For example: How can I squat deeper without pain in my knees\?'
      - inputText: "QA check: is one rest day enough?"
      - hideKeyboard
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: '^Send question$'
      - tapOn: "^Send question$"
      - extendedWaitUntil:
          visible: 'Waiting for a reply\. You can ask a new question once this one is answered\.'
          timeout: 30000
          optional: true
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'Waiting for a reply\. You can ask a new question once this one is answered\.'
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'QA check: is one rest day enough\?'
      - takeScreenshot: rel-124-ask-open-for-reply
      - back
