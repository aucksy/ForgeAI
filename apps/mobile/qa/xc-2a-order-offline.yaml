# Phone conditions (UAT WP7), condition 2a: NO INTERNET (airplane mode, switched on by the script
# before this flow). The app is opened afresh offline; the shop still shows its last list; QA Bottle
# into the bag; "Place order" -> the plain words, and the bag is KEPT (the line and the button).
appId: com.forgeai.app
---
- runFlow: xc-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- runFlow:
    file: xc-sub-to-bag.yaml
    env:
      PRODUCT: "QA Bottle"
- takeScreenshot: xc2a-01-bag-offline
- tapOn: "^Place order$"
- extendedWaitUntil:
    visible: 'No internet\. Your bag is kept — try again when you''re online\.'
    timeout: 60000
- assertVisible: "Remove QA Bottle from bag"
- assertVisible: "^Place order$"
- assertNotVisible: 'Order \d+ placed.*'
- takeScreenshot: xc2a-02-offline-words-bag-kept
