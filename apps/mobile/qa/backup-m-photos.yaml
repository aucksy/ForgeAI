# Device QA, part M (photos, UAT WP4b, M-157) — after backup-m-record.yaml (which checks the photo
# backup is OFF by default) and BEFORE Android's backup: the member has at least one progress photo
# (one is added from the gallery when there is none: the script pushed the two SAMPLE pictures) and
# turns ON Settings -> Backup -> "Include photos in my backup". The card must then say what it
# backs up ("Backing up your 1 photo (0.1 MB)." / "Backing up all 2 photos (...)."). After the
# uninstall + reinstall, backup-m-photos-check.yaml must find the photos again.
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Body"
- extendedWaitUntil:
    visible: "Add measures"
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Add measures'
- scrollUntilVisible:
    element: "Progress photos"
    direction: UP
    timeout: 20000
- tapOn:
    text: "See all progress photos|Add a progress photo"
    index: 0
- extendedWaitUntil:
    visible: "Add a photo"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Add a photo'
- runFlow:
    when:
      notVisible: 'Progress photo, .*'
    commands:
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'Add a photo'
      - tapOn: "Add a photo"
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'Choose from gallery'
      - tapOn: "Choose from gallery"
      - extendedWaitUntil:
          visible: '(?i)photo taken on.*|^Albums$'
          timeout: 20000
      - tapOn:
          text: '(?i)photo taken on.*'
          index: 0
          optional: true
      - runFlow:
          when:
            visible: '^Albums$'
          commands:
            - tapOn:
                id: '.*icon_thumbnail'
                index: 0
                optional: true
      - extendedWaitUntil:
          visible: 'When was this photo taken\?|Progress photo, .*'
          timeout: 20000
          optional: true
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'When was this photo taken\?|Progress photo, .*'
      # The sample pictures carry no date: the app asks which day (any day will do here).
      - runFlow:
          when:
            visible: 'When was this photo taken\?'
          commands:
            - runFlow:
                file: sub-see.yaml
                env:
                  FIND: 'Previous month'
            - tapOn: "Previous month"
            - tapOn: '\d{4}-\d{2}-01'
      - extendedWaitUntil:
          visible: 'Progress photo, .*'
          timeout: 20000
- takeScreenshot: 181a-backup-prep-photo
- runFlow: sub-back-to-tabs.yaml
# R-320: Android's own backup (the workout count, "Include photos in my backup") left the Backup page,
# which now shows only the MettleUp account. Its page stays for this check, opened by its link.
- openLink: "forgeai://settings/phone-backup"
- extendedWaitUntil:
    visible: "^Your workouts$|^[0-9]+ workouts?$|^No workouts yet$"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Your workouts$|^[0-9]+ workouts?$|^No workouts yet$'
- scrollUntilVisible:
    element: "Include photos in my backup"
    centerElement: true
    timeout: 30000
- tapOn: "Include photos in my backup"
# The row's title is plain text; the switch carries the same name. If the first tap hit the
# text, press the switch itself.
- runFlow:
    when:
      notVisible:
        text: "Include photos in my backup"
        checked: true
    commands:
      - tapOn:
          text: "Include photos in my backup"
          index: 1
- extendedWaitUntil:
    visible: '^Backing up (your 1 photo|all \d+ photos|your newest \d+ photos) \(.+\)\..*'
    timeout: 60000
- assertVisible:
    text: "Include photos in my backup"
    checked: true
- assertNotVisible: 'Couldn.t copy your photos.*'
- takeScreenshot: 181b-backup-photos-on
