# Pages of the member app that SCROLL, and so can hide what a phone-test flow checks (trap 7).
# Read by scripts/ci/flow_scroll_lint.py. The `screens:` list is WRITTEN by that script from the app's
# code (python3 scripts/ci/flow_scroll_lint.py --write-screens); CI fails when it is out of date.
# Edit only `overlays:` (full-screen pop-ups drawn by a layout, not a route) and `pinned:` (texts that
# never scroll away: the tab bar, buttons pinned to the bottom, Android's own dialogs).

overlays:
  - apps/mobile/src/components/UpdatePrompt.tsx
  - apps/mobile/src/components/WatchUpdatePrompt.tsx

pinned:
  - "^Profile$"
  - "^Workout$"
  - "^Gym$"
  - "^(Shop|Gym)$"
  - "^Shop$"
  - "Wait"
  - "(?i)^allow$"
  - "(?i)^don.t allow$"
  - "Skip rest"
  - "15 seconds less"
  - "15 seconds more"
  - "Rest alerts are off. Turn on notifications"
  - "Finish workout"
  - "^Finish workout$"
  - "Log a set to finish"
  - "Log a set to finish|Finish workout"
  - "Save workout"
  - "Save changes"
  - "Minimise workout. It keeps running."
  - "Minimise workout.*"
  - "Go back"
  - "Search exercises"
  - "Search your workouts by exercise or workout name"
  - "Update now"
  - "^Update now$"
  - "^Later$"
  - "Later"
  - "Restart now"
  - "Got it"
  - "^Got it$"

