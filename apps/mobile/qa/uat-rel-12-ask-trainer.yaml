# Part UAT, flow 12 (gym, after flow 8). Since R-586 (owner, 15 Nov 2026; 0096 APPLIED LIVE 15 Nov 2026, R-591) the
# ONE "Message your gym" page asks the type, then "Who should read it?" (no "The gym" / "A trainer" choice any more).
# The phone is a member ("Uma") of the fresh "QA UAT Gym" made by run-device-qa.sh, which has NO trainer yet (the
# trainers are added after this flow, qa/uat_gym.py trainers). So this flow is the EDGE case "no trainers added yet":
#  - the Gym tab has ONE row, "Message your gym" (R-549: the old "Ask about your workout" row is gone, NEGATIVE);
#  - the page has no "Who is it for?", "The gym" or "A trainer" (NEGATIVE: 0096 is live, the old choice must be gone);
#  - Question: the new hint, "Who should read it?" with "Gym owner" as the ONLY choice, the trainers-not-added line,
#    and who reads it ("Only the owner of QA UAT Gym reads your question ...");
#  - her first visit: the list is empty (picture rel-120b).
# Nothing is sent here (the server allows 5 new messages a day; flows 12b and gt send 4).
# A server without 0096 fails this flow on purpose: the release UAT must never pass a picker it did not see.
appId: com.mettleup.app
---
- tapOn:
    text: "^Gym$"
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Message your gym$'
# Uma is on a running paid plan, so the row names the gym and a trainer (GymTalkRow, messagesRowSub).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Ask your gym or a trainer, share feedback or make a complaint$'
# in-view: R-549, the old second row sat right under this one; it must be gone, not just off screen
- assertNotVisible: "^Ask about your workout$"
# in-view: the same rows; a running paid plan is never locked (R-505)
- assertNotVisible: ".*is for members with a running plan.*"
- takeScreenshot: rel-120-gym-tab-ask-row
- tapOn: "^Message your gym$"
# in-view: the page just opened at its top; the hint sits under the Question chip, and once it shows the
# picker is decided (the trainers list is read in the same fetch as the messages)
- extendedWaitUntil:
    visible:
      id: "talk-kind-hint-ready"
    timeout: 30000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Send your gym a question, feedback or a complaint\. Any reply shows on this page\.$'
# in-view: the page just opened at its top, where the old choice was
- assertNotVisible: '^Who is it for\?$'
# in-view: the same place
- assertNotVisible: '^A trainer$'
# in-view: the same place
- assertNotVisible: '^The gym$'
# in-view: the same card; the old two-side top line
- assertNotVisible: '^Write to your gym, or ask a trainer about your workout\..*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^What is it about\?$'
# R-586: the Question hint names the workout too (a question may go to a trainer now).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Ask about timings, fees, your workout and more\.$'
# in-view: the same card; the R-549 hint pointed at "A trainer", which is gone
- assertNotVisible: '.*For workout help, pick "A trainer" above\..*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Who should read it\?$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Gym owner$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Your gym has not added its trainers to the app yet, so only the owner can be picked\.$'
# in-view: the chips sit right above the line just checked; "Gym admin" is for feedback and complaints only
- assertNotVisible: '^Gym admin$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Only the owner of ${GYM} reads your question\. The front desk and trainers do not see it\.$'
# in-view: the same card; the old 0069 line (the owner, front desk AND trainers) must be gone
- assertNotVisible: '^The owner, front desk and trainers at .* read your question\.$'
# in-view: the same card; a question can never go without the name
- assertNotVisible: "^Send without my name$"
- takeScreenshot: rel-120a-message-page-top
# Her first visit to a fresh test gym: nothing sent yet.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Your messages$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^You have not sent a message yet\.$'
- takeScreenshot: rel-120b-messages-empty
- back
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
