# Part UAT, flow 12 (gym, after flow 8): R-319 item 1 "Ask a trainer" ("Ask about your workout" since R-533), and
# since R-549 (owner, 14 Nov 2026, option A) the "A trainer" side of the ONE "Message your gym" row and page.
# The phone is a member ("Uma") of the fresh "QA UAT Gym" made by run-device-qa.sh.
#  - The Gym tab has ONE row, "Message your gym"; the old "Ask about your workout" row is gone (NEGATIVE).
#  - The page asks "Who is it for?": "The gym" or "A trainer". Uma has a running paid plan here ("QA Monthly", ends 4
#    days after the phone's today, qa/uat_gym.py setup), so both show (R-505 HAPPY PATH). Flow 14 checks the NEGATIVE:
#    as a FITPASS pass member there is no "A trainer" and no choice.
#  - Her first visit: the list is empty (picture rel-120b: "You have not sent a message yet.").
#  - "A trainer": no Question / Feedback / Complaint (they always go to the gym), no "(gym owner)" person in the list,
#    "Any trainer or the owner" as before. Send a question, read "Waiting for a reply", take it back.
#  - A gym whose server has no 0053 shows no "A trainer" at all: the flow then checks that and stops.
# The gym's side (Member questions, the reply, the member's Progress card) is checked in the admin panel at a
# phone and a desktop width; see docs/CLAUDE-NOTES.md R-319.
appId: com.mettleup.app
---
- tapOn:
    text: "^Gym$"
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Message your gym$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^(Ask your gym or a trainer, share feedback or make a complaint|Ask a question, share feedback or make a complaint|Your question is waiting for a reply|Your gym replied.*)$'
# in-view: R-549, the old second row sat right under this one; it must be gone, not just off screen
- assertNotVisible: "^Ask about your workout$"
# in-view: the same rows; a running paid plan is never locked (R-505)
- assertNotVisible: ".*is for members with a running plan.*"
- takeScreenshot: rel-120-gym-tab-ask-row
- tapOn: "^Message your gym$"
# in-view: the page just opened at its top; the hint sits under the Question chip
- extendedWaitUntil:
    visible:
      id: "talk-kind-hint-ready"
    timeout: 30000
- takeScreenshot: rel-120a-message-page-top
# ---------------------------------------------------------------- without 0053: no "A trainer", no choice
- runFlow:
    when:
      notVisible: "^A trainer$"
    commands:
      # in-view: the page just opened at its top, where the choice would be
      - assertNotVisible: '^Who is it for\?$'
      - back
# ---------------------------------------------------------------- with 0053: pick "A trainer", ask, wait, take back
- runFlow:
    when:
      visible: "^A trainer$"
    commands:
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Write to your gym, or ask a trainer about your workout\. Every reply shows on this page\.$'
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Who is it for\?$'
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^The gym$'
      # "The gym" is picked first (the row opens it): its line says what it takes (who reads each type is said under
      # the type, R-552).
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Send your gym a question, feedback or a complaint\.$'
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Ask about timings, fees, classes and more\. For workout help, pick "A trainer" above\.$'
      # Her first visit to a fresh test gym: nothing sent yet (a retried flow may already list the question it took back).
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: '^Your messages$'
      - runFlow:
          when:
            visible: '^You have not sent a message yet\.$'
          commands:
            - takeScreenshot: rel-120b-messages-empty
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: '^A trainer$'
      - tapOn: "^A trainer$"
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Ask one question at a time about your workout\.$'
      # in-view: the choice was just tapped at the top of the card; the gym's types sit right here when shown
      - assertNotVisible: '^What is it about\?$'
      # in-view: the same card (Feedback and Complaint always go to the gym, never to a trainer)
      - assertNotVisible: '^Complaint$'
      # in-view: the same card
      - assertNotVisible: '^Send without my name$'
      # A question left open by an earlier run: take it back first.
      - runFlow:
          when:
            visible: "^Take back my question$"
          commands:
            - runFlow:
                file: sub-see.yaml
                env:
                  FIND: '^Take back my question$'
            - tapOn: "^Take back my question$"
            - extendedWaitUntil:
                visible: "^Who should answer\\?$"
                timeout: 30000
                optional: true
            - runFlow:
                file: sub-see.yaml
                env:
                  FIND: '^Who should answer\?$'
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Who should answer\?$'
      - assertNotVisible: ".*is for members with a running plan.*"
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Any trainer or the owner$'
      # in-view: R-549, the trainer list sits right here; the gym owner is no longer a person in it ("The gym" is)
      - assertNotVisible: '.*\(gym owner\)$'
      # The test gym ticks no trainer, so the owner answers; a gym with trainers reads the second line.
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '(Your gym has not listed its trainers in the app yet, so the gym owner will answer\.|Only the person you pick sees your question\. "Any trainer or the owner" sends it to every trainer and the gym owner\.)'
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Any trainer or the owner$'
      - tapOn: "^Any trainer or the owner$"
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'For example: How can I squat deeper without pain in my knees\?'
      - tapOn: "For example: How can I squat deeper without pain in my knees\\?"
      - inputText: "QA check: how many rest days a week?"
      - hideKeyboard
      - assertVisible: "^36 of 500 letters$"
      - takeScreenshot: rel-121-ask-typed
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Send question$'
      - tapOn: "^Send question$"
      - extendedWaitUntil:
          visible: 'Waiting for a reply\. You can ask a new question once this one is answered\.'
          timeout: 30000
      - assertVisible: "QA check: how many rest days a week\\?"
      - assertVisible: "^To any trainer or the owner · (Today|Yesterday), [0-9]{1,2}:[0-9]{2} [ap]m$"
      - takeScreenshot: rel-122-ask-waiting
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Take back my question$'
      - tapOn: "^Take back my question$"
      - extendedWaitUntil:
          visible: "^Who should answer\\?$"
          timeout: 30000
          optional: true
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: '^Who should answer\?$'
      # On his phone (360 dp, font 1.3) the taken-back card's last line can sit below the screen's edge (uat
      # run 42976574875: the card's first lines showed, its status line was off screen): scroll to it first.
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: "^You took this question back\\.$"
      - assertVisible: "^You took this question back\\.$"
      - takeScreenshot: rel-123-ask-taken-back
      - back
