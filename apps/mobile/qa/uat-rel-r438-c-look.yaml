# R-438 flow c: the pop-up and "Check your watch" in the OTHER look (run-device-qa.sh part_u438 flips the
# phone's dark mode first). The watch stays black in both looks; the sheet follows the look.
appId: com.mettleup.app
---
# The phone clock was just put back 25 hours, so "Later" from flow b reads as in the future and the pop-up
# may already be up (a clock set back asks rather than blocking): either is a ready app.
- extendedWaitUntil:
    visible: "^Profile$|Your watch app has an update"
    timeout: 60000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Profile$|Your watch app has an update'
- openLink: "mettleup://qa-update?watchtap=opened&watch=forget"
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Your watch app has an update'
- takeScreenshot: rel-r438-12-offer-other-look
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Update on watch'
- tapOn: "Update on watch"
- extendedWaitUntil:
    visible: "Check your watch"
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Check your watch'
- takeScreenshot: rel-r438-13-check-your-watch-other-look
- tapOn: "^Got it$"
- openLink: "mettleup://qa-update?watch=off"
