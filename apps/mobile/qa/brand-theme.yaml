# Gym branding device QA, part BR — join a branded gym and photograph the app in its look.
# Talks to the LIVE server: needs supabase/migrations/0005_gym_theme.sql applied there (the
# runner skips this part when it is not — run-device-qa.sh probes owner_set_brand first).
#  1. Settings → Your gym → join the branded test gym RAMS01 (RAM'S FITNESS CLUB IMPACT, yellow
#     #F7D411 on #0A0A0C) as "QA Member" (sub-join-gym.yaml; R-77: in no gym there is no Shop tab).
#     The app re-draws in the gym's colours behind the gym's "Welcome to" opening (logo, or its
#     name while the test gym has no logo) and lands on the Workout tab. The opening and the
#     home-screen icon pop-up are photographed by brand-welcome.yaml, which runs just before this.
#  2. Workout, Profile and Shop tabs, each with the gym's mark under the title; a product page
#     (the yellow "Add to bag" button with black words).
#  3. The app closed and opened again: the gym's opening shows at launch, then the gym's colours.
#  4. Leave the gym: ForgeAI's own look is back and the third tab is gone (R-77).
# Screenshots br-*.png (gathered in qa-out/brand/). The opening lasts about a second, so its
# photo is best-effort (an optional wait); everything after it is asserted.
# Saves no workout and places no order; the phone ends outside the gym, as it started.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# brand-welcome.yaml (just before) leaves RAMS01 at its end; if it failed before that, leave here
# from the gym's tab so this join starts from no gym.
- runFlow:
    when:
      visible: "^(Shop|Gym)$"
    commands:
      - tapOn:
          text: "^(Shop|Gym)$"
          index: 0
      - scrollUntilVisible:
          element: "^Leave$"
          # Leave is the last row of the gym's page: it can never be centred (U-Q5), so no centerElement.
          timeout: 30000
      - tapOn: "^Leave$"
      - extendedWaitUntil:
          visible: "^(Leave gym|Leave anyway|Cancel orders? and leave)$"
          timeout: 15000
      - tapOn: "^(Leave gym|Leave anyway|Cancel orders? and leave)$"
      - extendedWaitUntil:
          notVisible: "^(Shop|Gym)$"
          timeout: 45000
      - extendedWaitUntil:
          visible: "^Profile$"
          timeout: 30000
# ---------------------------------------------------------------- 1. join the branded gym
# The join card, in ForgeAI's look (R-77: Settings → Your gym, not the Shop tab).
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Your gym"
- scrollUntilVisible:
    element: "^Join your gym$"
    timeout: 20000
- takeScreenshot: br-00-join-card-forgeai-look
- runFlow: sub-back-to-tabs.yaml
- runFlow:
    file: sub-join-gym.yaml
    env:
      CODE: "RAMS01"
      NAME: "QA Member"
      GYM: "RAM'S FITNESS CLUB IMPACT"
# ---------------------------------------------------------------- 2. the app in the gym's look
- extendedWaitUntil:
    visible: "Your gym: RAM'S FITNESS CLUB IMPACT"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "brand-opening"
    timeout: 10000
- tapOn:
    text: "^Workout$"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Up next: .*|Done today: .*|Workout in progress|Start empty workout"
    timeout: 20000
# The tab keeps its scroll; the gym's name is at its top.
- scrollUntilVisible:
    element: "Your gym: RAM'S FITNESS CLUB IMPACT"
    direction: UP
    timeout: 15000
- takeScreenshot: br-02-workout
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: "Your gym: RAM'S FITNESS CLUB IMPACT"
    timeout: 15000
- takeScreenshot: br-03-profile
# RAMS01 lists products, so its tab is "Shop" (it can read "Gym" until the list arrives).
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "Your gym's shop · pay at the desk"
    timeout: 30000
- extendedWaitUntil:
    visible: "^Shop$"
    timeout: 20000
- assertVisible: "Your gym: RAM'S FITNESS CLUB IMPACT"
- takeScreenshot: br-04-shop
- scrollUntilVisible:
    element: 'Shaker bottle 700 ml, .*'
    centerElement: true
    timeout: 20000
- tapOn: 'Shaker bottle 700 ml, .*'
# The product page writes "700 ml" with a no-break space, hence the ".".
- extendedWaitUntil:
    visible: '^Shaker bottle 700.ml$'
    timeout: 15000
- scrollUntilVisible:
    element: "Add to bag"
    centerElement: true
    timeout: 15000
- takeScreenshot: br-05-product-yellow-button
- back
# ---------------------------------------------------------------- 3. a fresh launch: the opening again
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "brand-opening"
    timeout: 90000
    optional: true
- takeScreenshot: br-06-opening-at-launch
- extendedWaitUntil:
    visible: "Your gym: RAM'S FITNESS CLUB IMPACT"
    timeout: 30000
- takeScreenshot: br-07-workout-after-relaunch
# ---------------------------------------------------------------- 4. leave: ForgeAI's look again
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "Your gym's shop · pay at the desk"
    timeout: 30000
- scrollUntilVisible:
    element: "^Leave$"
    # Leave is the last row of the Shop page: it can never be centred (U-Q5), so no centerElement.
    timeout: 20000
- tapOn: "^Leave$"
- extendedWaitUntil:
    visible: "Leave RAM'S FITNESS CLUB IMPACT\\?"
    timeout: 10000
- assertVisible: ".*goes back to ForgeAI's colours.*"
- tapOn: "^Leave gym$"
# The app re-draws in ForgeAI's look (it may come back on the Workout tab). R-77: no gym, so the
# third tab is gone.
- extendedWaitUntil:
    notVisible: "Your gym: RAM'S FITNESS CLUB IMPACT"
    timeout: 15000
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 20000
- assertNotVisible: "^(Shop|Gym)$"
- takeScreenshot: br-08-left-forgeai-look
