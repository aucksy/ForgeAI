# UAT WP4b, part UF, step 3 of 5: another program holds the database's write lock. Finish -> the
# sheet's "Finish workout": the save is refused. The member must be told ("Could not save ... Your
# sets are still here — tap Finish to try again.", then the banner "Couldn't finish your workout.
# It's still open — tap Finish again.") and the workout must still be open with both sets ticked.
appId: com.mettleup.app
---
- scrollUntilVisible:
    element: '.*\. Open its history and how-to'
    direction: UP
    timeout: 10000
- copyTextFrom:
    text: '.*\. Open its history and how-to'
    index: 0
- runScript: js/uat-exname.js
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Finish workout$"
- tapOn:
    text: "^Finish workout$"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Leave them out"
    optional: true
- tapOn:
    text: "^Finish workout$"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "^Could not save$"
    timeout: 60000
- assertVisible: 'Something went wrong saving your workout\. Your sets are still here — tap Finish to try again\.'
- takeScreenshot: uf-03-could-not-save
- tapOn: "^Close$"
- extendedWaitUntil:
    notVisible: "^Could not save$"
    timeout: 10000
# The Finish sheet may still be up behind the notice: back to the workout.
- tapOn:
    text: "^Keep going$"
    optional: true
- extendedWaitUntil:
    visible: 'Couldn.t finish your workout\. It.s still open — tap Finish again\.'
    timeout: 10000
- takeScreenshot: uf-04-still-open
# Still open with both sets: minimised, the Workout tab's card says so ("2 sets done · 1 exercise";
# the workout page is too long to scroll back to its first rows on the owner phone, run 38993381789).
- tapOn: "Minimise workout. It keeps running."
# The Workout tab can come back scrolled down to the routines (run 39004822935), even past the
# "Routines" heading (runs 39041031088, 39058151408: only routine cards on screen): wait for any
# part only the Workout tab has, then the card is brought onto the screen (sub-find) and checked.
- extendedWaitUntil:
    visible: "^Routines$|Workout in progress|Start routine .*|^New routine$"
    timeout: 20000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Workout in progress"
- assertVisible: '^2 sets done · 1 exercise$'
- takeScreenshot: uf-04b-still-open-two-sets
- tapOn:
    text: "^Resume workout$"
    index: 0
- extendedWaitUntil:
    visible: "Minimise workout. It keeps running."
    timeout: 20000
