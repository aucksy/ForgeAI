# Cross-role journeys 5 and 6, member step: leave gym A (every order there is final by now), then
# join gym B by its code (CODE_B, name GYM_B). The owner of gym B set a brand colour in the admin
# app first (XJ6a), so the app re-draws in the gym's look on joining (branding: new members see it
# at once). The Workout tab is photographed before (ForgeAI's look) and after (the gym's look);
# run-journeys.sh measures the brand colour on both pictures.
appId: com.forgeai.app
---
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "Up next: .*|Done today: .*|Workout in progress|Start empty workout"
    timeout: 20000
- takeScreenshot: xj6-00-workout-forgeai-look
# ---------------------------------------------------------------- leave gym A
- tapOn:
    text: "^Shop$"
    index: 0
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- scrollUntilVisible:
    element: "^Leave$"
    centerElement: true
    timeout: 20000
- tapOn: "^Leave$"
- extendedWaitUntil:
    visible: "Leave ${GYM}'s shop\\?"
    timeout: 15000
- tapOn: "Leave shop"
- extendedWaitUntil:
    visible: "^Your gym's shop$"
    timeout: 30000
# ---------------------------------------------------------------- join gym B (branded)
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "Enter the code from your gym"
- scrollUntilVisible:
    element: "Gym code"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Gym code"
- inputText: "${CODE_B}"
- runFlow:
    when:
      notVisible: "^${CODE_B}$"
    commands:
      - tapOn: "Gym code"
      - eraseText: 10
      - inputText: "${CODE_B}"
- assertVisible: "^${CODE_B}$"
- tapOn: "Name on your orders"
- eraseText: 70
- inputText: " QA Member"
- hideKeyboard
- runFlow: sub-agree.yaml  # launch D5/D6: tick 18+ / terms before joining
- scrollUntilVisible:
    element: "Join your gym's shop"
    centerElement: true
    timeout: 15000
- tapOn: "Join your gym's shop"
- extendedWaitUntil:
    visible: "Join ${GYM_B}\\?"
    timeout: 45000
- tapOn:
    text: "^Join$"
    below:
      text: "Join ${GYM_B}\\?"
# The gym's opening (its name: this gym has no logo) for about a second; best effort.
- extendedWaitUntil:
    visible:
      id: "brand-opening"
    timeout: 45000
    optional: true
- takeScreenshot: xj6-01-opening-after-join
- extendedWaitUntil:
    visible: "Your gym: ${GYM_B}"
    timeout: 45000
- extendedWaitUntil:
    notVisible:
      id: "brand-opening"
    timeout: 15000
- takeScreenshot: xj6-02-joined-gym-look
