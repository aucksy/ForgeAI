# Cross-role journeys 5 and 6, member step: leave gym A (every order there is final by now), then
# join gym B by its code (CODE_B, name GYM_B). The owner of gym B set a brand colour in the admin
# app first (XJ6a), so the app re-draws in the gym's look on joining (branding: new members see it
# at once). The Workout tab is photographed before (ForgeAI's look) and after (the gym's look);
# run-journeys.sh measures the brand colour on both pictures.
# Leave is in Settings → Your gym; the join is on the Gym tab's "Join your gym" screen (sub-join-gym.yaml),
# which waits out gym B's "Welcome to" opening and lands on the Workout tab.
appId: com.mettleup.app
---
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "Up next: .*|Done today: .*|Workout in progress|Start empty workout"
    timeout: 20000
- takeScreenshot: xj6-00-workout-forgeai-look
# ---------------------------------------------------------------- leave gym A
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
# Release A (A4): Leave is in Settings → Your gym only.
- runFlow: sub-leave-gym.yaml
- extendedWaitUntil:
    visible: "Leave ${GYM}\\?"
    timeout: 15000
- tapOn: "^Leave gym$"
# No gym: Settings offers "Join your gym", and the Gym tab is its join screen (Release A).
- extendedWaitUntil:
    visible: "^Join your gym$"
    timeout: 30000
- runFlow: sub-gym-none.yaml
# ---------------------------------------------------------------- join gym B (branded)
- runFlow:
    file: sub-join-gym.yaml
    env:
      CODE: "${CODE_B}"
      NAME: "QA Member"
      GYM: "${GYM_B}"
- extendedWaitUntil:
    visible: "Your gym: ${GYM_B}"
    timeout: 45000
- takeScreenshot: xj6-02-joined-gym-look
