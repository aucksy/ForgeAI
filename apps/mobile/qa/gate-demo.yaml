# Sub-flow for the audit-v2 gate parts (DND, LONGREST, ANIM, MK in run-device-qa.sh): a fresh
# install's state (clearState) with the demo data loaded, the app on the Workout tab. Each gate
# part starts from here, so it can run alone (qa-device.yml `only`) or after the full run.
appId: com.mettleup.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Step 1 of 3|Your name"
    timeout: 90000
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
