# R-440 (10 Nov 2026): the status bar's clock and battery over the full-page pop-ups. On the light look
# they stayed WHITE on the cream page (rel-r438-02-offer): a Modal is its own window and React Native's
# StatusBar only reaches the main one. Each pop-up now sets its window's icons when it shows (ForgeBars
# lines in the run summary). Run by part_u438 twice: after flow a (light look: dark icons) and after
# flow c (phone's dark mode flipped: the dark look, light icons). LOOK = light | dark (picture names).
# The phone's "A new MettleUp is here" (QA link behind=1), then the watch card (watch=forget brings it back).
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "^Profile$|Your watch app has an update|Check your watch"
    timeout: 60000
# Flow c ends on "Check your watch"; flow a on the Workout tab.
- tapOn:
    text: "^Got it$"
    optional: true
- openLink: "mettleup://qa-update?watch=off&behind=1"
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rel-r440-01-phone-update-${LOOK}
- tapOn: "^Later$"
- extendedWaitUntil:
    notVisible: "A new MettleUp is here"
    timeout: 10000
# Up to date again, so the watch card may speak (it waits while a phone update waits).
- openLink: "mettleup://qa-update?behind=0"
- openLink: "mettleup://qa-update?watch=old"
# Each link starts its own check; let this one finish before "forget" (an earlier "Later" may hide it).
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 4000
    optional: true
- openLink: "mettleup://qa-update?watch=forget"
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rel-r440-02-watch-card-${LOOK}
- tapOn: "^Later$"
- extendedWaitUntil:
    notVisible: "Your watch app has an update"
    timeout: 10000
# After the pop-up: the app's own page keeps the icons the look gives it.
- takeScreenshot: rel-r440-03-after-${LOOK}
- openLink: "mettleup://qa-update?watch=off"
