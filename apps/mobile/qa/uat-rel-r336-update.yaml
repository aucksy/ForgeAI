# Part UAT, R-336 "A new MettleUp is here" (5 Nov 2026). Runs after flow f61. This QA build carries the
# 'updateOffer' stand-in (qa-device.yml): the link mettleup://qa-update?behind=N makes the phone see a
# made-up update N versions ahead (a GitHub copy, three made-up What's new lines; the screen says
# "Test build: a made-up update."). Pictures: the full screen (1 version ahead), the Workout tab's orange
# line after "Later", the full screen 3 versions behind (rows + "And the changes from 2 earlier updates."),
# Android's back closes it like "Later"; R-364 negatives (a workout open, a relaunch after "Later", up to
# date) and the app killed on the screen; then behind=0 takes the line away again.
appId: com.mettleup.app
---
# The full screen shows only over the 4 tabs: flow f61 ends on "Ask an AI" (UAT run 41979611551).
- runFlow: sub-back-to-tabs.yaml
- tapOn:
    text: "^Workout$"
    index: 0
# ---------------------------------------------------------------- 1. the full screen, one version ahead
- openLink: "mettleup://qa-update?behind=1"
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 30000
- assertVisible: "(?i)version 0\\.\\d+\\.0 is ready"
- assertVisible: "Tap \"Update now\" to download the file, then open it to install\\. Your workouts stay safe\\."
- assertVisible: "1\\. See which muscles are ready to train today\\."
# Pinned buttons (0.77.0): the last row can sit below the fold on the owner phone.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "3\\. Invite a friend to your gym\\."
- assertNotVisible: "And the changes from .*"
- assertVisible: "Update now"
- takeScreenshot: rel-r336-01-full-screen
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Later$"
- assertVisible: "Test build: a made-up update\\."
- takeScreenshot: rel-r336-02-full-screen-bottom
# ---------------------------------------------------------------- 2. Later -> the orange line on the Workout tab
- tapOn: "^Later$"
- extendedWaitUntil:
    notVisible: "A new MettleUp is here"
    timeout: 10000
- scrollUntilVisible:
    element: "A new version of MettleUp is ready.*"
    direction: UP
    timeout: 15000
- assertVisible: "A new version of MettleUp is ready\\. Update"
- takeScreenshot: rel-r336-03-workout-line
# R-412 (owner, 9 Nov 2026): "What's new" right after the words opens this version's lines inside the line.
- assertNotVisible: "1\\. See which muscles are ready to train today\\."
- tapOn: "^What's new$"
- extendedWaitUntil:
    visible: "1\\. See which muscles are ready to train today\\."
    timeout: 5000
- assertVisible: "3\\. Invite a friend to your gym\\."
# Negative: opening the lines does not start the update (the line stays, no "Downloading").
- assertVisible: "A new version of MettleUp is ready\\. Update"
- assertNotVisible: "Downloading.*"
- takeScreenshot: rel-r412-01-line-whats-new-open
- tapOn: "^Hide what's new$"
- extendedWaitUntil:
    notVisible: "1\\. See which muscles are ready to train today\\."
    timeout: 5000
- assertVisible: "^What's new$"
- takeScreenshot: rel-r412-02-line-whats-new-closed
# ---------------------------------------------------------------- 3. three versions behind: rows + earlier line
- openLink: "mettleup://qa-update?behind=3"
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 30000
- assertVisible: "(?i)you are 3 versions behind"
# 0.77.0: the buttons are pinned at the bottom and only the words scroll; on the large-text owner phone the
# rows and the earlier-updates line can sit below the fold (round 4, run 43062165154): find them.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "2\\. A quick workout for the time you have\\."
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "And the changes from 2 earlier updates\\."
- takeScreenshot: rel-r336-04-three-behind
# Android's back is "Later".
- back
- extendedWaitUntil:
    notVisible: "A new MettleUp is here"
    timeout: 10000
- assertVisible: "A new version of MettleUp is ready\\. Update"
- takeScreenshot: rel-r336-05-after-back
# ---------------------------------------------------------------- 5. negative (R-364): never during a workout
- runFlow: sub-workout-fresh.yaml
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- runFlow: sub-start-blank.yaml
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- openLink: "mettleup://qa-update?behind=2"
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 12000
    optional: true
- assertNotVisible: "A new MettleUp is here"
- takeScreenshot: rel-r336-07-workout-no-screen
# Throw the workout away; the next launch then shows it (proves the link worked and only the workout held it).
- runFlow: sub-back-to-tabs.yaml
- runFlow: sub-workout-fresh.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 30000
- assertVisible: "(?i)you are 2 versions behind"
- takeScreenshot: rel-r336-08-after-workout-next-launch
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Later$"
- tapOn: "^Later$"
# ---------------------------------------------------------------- 6. negative: never twice in a row after "Later"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 12000
    optional: true
- assertNotVisible: "A new MettleUp is here"
- tapOn:
    text: "^Workout$"
    index: 0
- scrollUntilVisible:
    element: "A new version of MettleUp is ready.*"
    direction: UP
    timeout: 15000
- takeScreenshot: rel-r336-09-relaunch-after-later
# ---------------------------------------------------------------- 7. interruption: the app killed on the screen
- openLink: "mettleup://qa-update?behind=4"
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 12000
    optional: true
- assertNotVisible: "A new MettleUp is here"
- tapOn:
    text: "^Workout$"
    index: 0
- scrollUntilVisible:
    element: "A new version of MettleUp is ready.*"
    direction: UP
    timeout: 15000
- takeScreenshot: rel-r336-10-relaunch-after-kill
# ---------------------------------------------------------------- 4. up to date: the line goes
- openLink: "mettleup://qa-update?behind=0"
- extendedWaitUntil:
    notVisible: "A new version of MettleUp is ready.*"
    timeout: 30000
- takeScreenshot: rel-r336-06-up-to-date
- assertNotVisible: "A new MettleUp is here"
# Negative: up to date, a fresh launch shows neither the screen nor the line.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 12000
    optional: true
- assertNotVisible: "A new MettleUp is here"
- assertNotVisible: "A new version of MettleUp is ready.*"
- takeScreenshot: rel-r336-11-up-to-date-relaunch
