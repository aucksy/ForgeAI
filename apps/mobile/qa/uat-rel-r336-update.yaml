# Part UAT, R-336 "A new MettleUp is here" (5 Nov 2026). Runs after flow f61. This QA build carries the
# 'updateOffer' stand-in (qa-device.yml): the link mettleup://qa-update?behind=N makes the phone see a
# made-up update N versions ahead (a GitHub copy, three made-up What's new lines; the screen says
# "Test build: a made-up update."). Pictures: the full screen (1 version ahead), the Workout tab's orange
# line after "Later", the full screen 3 versions behind (rows + "And the changes from 2 earlier updates."),
# Android's back closes it like "Later", then behind=0 takes the line away again.
appId: com.mettleup.app
---
# ---------------------------------------------------------------- 1. the full screen, one version ahead
- openLink: "mettleup://qa-update?behind=1"
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 30000
- assertVisible: "(?i)version 0\\.\\d+\\.0 is ready"
- assertVisible: "Tap \"Update now\" to download the file, then open it to install\\. Your workouts stay safe\\."
- assertVisible: "1\\. See which muscles are ready to train today\\."
- assertVisible: "3\\. Invite a friend to your gym\\."
- assertNotVisible: "And the changes from .*"
- assertVisible: "Update now"
- takeScreenshot: rel-r336-01-full-screen
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Later$"
- assertVisible: "Test build: a made-up update\\."
- takeScreenshot: rel-r336-02-full-screen-bottom
# ---------------------------------------------------------------- 2. Later -> the orange line on the Workout tab
- tapOn: "^Later$"
- extendedWaitUntil:
    notVisible: "A new MettleUp is here"
    timeout: 10000
- scrollUntilVisible:
    element: "A new version of MettleUp is ready.*"
    direction: UP
    timeout: 15000
- assertVisible: "A new version of MettleUp is ready\\. Update"
- takeScreenshot: rel-r336-03-workout-line
# ---------------------------------------------------------------- 3. three versions behind: rows + earlier line
- openLink: "mettleup://qa-update?behind=3"
- extendedWaitUntil:
    visible: "A new MettleUp is here"
    timeout: 30000
- assertVisible: "(?i)you are 3 versions behind"
- assertVisible: "2\\. A quick workout for the time you have\\."
- assertVisible: "And the changes from 2 earlier updates\\."
- takeScreenshot: rel-r336-04-three-behind
# Android's back is "Later".
- back
- extendedWaitUntil:
    notVisible: "A new MettleUp is here"
    timeout: 10000
- assertVisible: "A new version of MettleUp is ready\\. Update"
- takeScreenshot: rel-r336-05-after-back
# ---------------------------------------------------------------- 4. up to date: the line goes
- openLink: "mettleup://qa-update?behind=0"
- extendedWaitUntil:
    notVisible: "A new version of MettleUp is ready.*"
    timeout: 30000
- takeScreenshot: rel-r336-06-up-to-date
