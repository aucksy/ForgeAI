# Copied for the phone-conditions run (UAT WP7, run-conditions.sh) from sub-type.yaml, so a change to the
# phone test parts never moves these flows. Same behaviour.
appId: com.forgeai.app
---
- scrollUntilVisible:
    element: "${FIELD}"
    centerElement: true
    timeout: 15000
- tapOn: "${FIELD}"
- eraseText
- inputText: "${VALUE}"
- hideKeyboard
