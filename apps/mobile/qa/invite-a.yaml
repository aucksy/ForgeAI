# Invite link device QA, part INV (v0.38.0), step A. run-device-qa.sh opened the gym's link
# https://forgeai.aakashpahuja.in/j/FORGE1 at the app (am start -d … -p com.forgeai.app), with the
# phone in no gym. The "Join your gym" screen shows the gym (from the live gym_preview) and ONE
# button. Joining lands on the Workout tab (no longer the shop); the Gym tab then shows the gym.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: "Gym code FORGE1"
    timeout: 30000
- assertVisible: "^Join your gym$"
# R-77: the intro no longer talks about ordering (the shop shows only when the gym has one).
- assertVisible: 'Join to see your membership and your gym''s messages here\. Your workouts stay on this phone\.'
- takeScreenshot: inv-01-join-screen
- tapOn: "Your name"
- eraseText: 70
- inputText: "QA Member"
- hideKeyboard
# The gym's name is the heading (audit C9-34: the button never repeats it).
- assertVisible: "^ForgeAI Test Gym$"
# The button by its full words: "Join your gym" (title) and "Join to see…" (intro) also start with Join.
# Owner profile (360 dp, font 1.3): the button can be below the form.
- runFlow: sub-agree.yaml  # launch D5/D6: tick 18+ / terms before joining
- scrollUntilVisible:
    element: "^Join this gym$"
    centerElement: true
    timeout: 15000
- tapOn: "^Join this gym$"
# Joined = the invite screen has gone, its "Your name" box with it (Release A: the Gym tab is
# there with or without a gym). Then the Workout tab (sub-after-join.yaml).
- extendedWaitUntil:
    notVisible: "Your name"
    timeout: 30000
- runFlow: sub-after-join.yaml
- takeScreenshot: inv-02-joined-workout
# FORGE1 lists products: the Gym tab shows its shop part once the list arrives.
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "Your gym's shop · pay at the desk"
    timeout: 30000
- takeScreenshot: inv-02b-joined-shop
