# Copied for the phone-conditions run (UAT WP7, run-conditions.sh) from sub-gym-none.yaml, so a change to the
# phone test parts never moves these flows. Same behaviour.
appId: com.mettleup.app
---
- runFlow:
    file: xc-sub-back-to-tabs.yaml
- tapOn:
    text: "^Gym$"
    index: 0
- extendedWaitUntil:
    visible: "^Join your gym$"
    timeout: 30000
# The "You left <gym>" note on top pushes this line below the screen edge (run 41494369247, C2c):
# scroll to it, then back to the top, as sub-gym-none.yaml does.
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "No gym\\? Everything else works without one\\."
- scrollUntilVisible:
    element: "^Join your gym$"
    direction: UP
    timeout: 20000