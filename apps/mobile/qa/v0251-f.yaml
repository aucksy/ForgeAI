# v0.25.1 device QA, part F — the owner's Phase 3 decisions on a real phone (runs after
# parts A–E; part C logged a Treadmill Run of 2.4 km in 12:00, i.e. a best pace of 5:00 /km).
# Settings → Units → Body figure: Female → the Statistics body map (redesign R3/R6) → a run: a 400 m sprint (sets no pace)
# and 2 km in 9:00 (a new best pace, 4:30 /km) → finish → the share picture on the female figure
# → the run's exercise page: Best pace in Records, and the 1 km rule behind the i.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
# ---------------------------------------------------------------- body figure
# Redesign R6: Body figure is on Settings → Units.
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Units"
- scrollUntilVisible:
    element: '(?i)body figure'
    centerElement: true
    timeout: 20000
- tapOn: "^Female$"
- takeScreenshot: 70-settings-units-body-figure
# Back to Profile (Units → Settings → Profile); the last-7-days body map is Statistics' first part.
- back
- back
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Statistics"
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 30000
- scrollUntilVisible:
    element: '.*female figure.*'
    timeout: 15000
- takeScreenshot: 71-body-map-female
- back
# ---------------------------------------------------------------- a run: best pace
# No workout left open by an earlier part (run 38144864717: part E's open workout failed this).
- runFlow: sub-workout-fresh.yaml
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- tapOn: "Add exercise"
# Audit Phase 4 (EX-06): the one exercise list — with nothing typed, the last workouts' exercises
# come first under "Recent" (parts C and E logged some today), then "All exercises".
- extendedWaitUntil:
    visible: "(?i)^recent$"
    timeout: 15000
- assertVisible: "All muscles"
- takeScreenshot: 71b-add-exercise-recent
- scrollUntilVisible:
    element: "(?i)^all exercises$"
    timeout: 15000
- tapOn: "Search exercises"
- inputText: " treadmill"
- hideKeyboard
# Phase 2 (LW-15): tick the exercise in the picker, then "Add 1".
- tapOn:
    text: "Select Treadmill Run"
    index: 0
- tapOn: "Add 1"
# LW-27: every box names its exercise and set ("Treadmill Run set 1 distance, kilometres").
- extendedWaitUntil:
    visible: ".* set 1 distance, kilometres"
    timeout: 15000
# Set 1: a 400 m sprint at 3:20 /km — faster than 5:00 /km, but under 1 km: no record.
- tapOn:
    text: ".* set 1 distance, kilometres"
    below:
      text: "More for Treadmill Run"
- inputText: " 0.4"
- tapOn:
    text: ".* set 1 time, minutes and seconds"
    below:
      text: "More for Treadmill Run"
- inputText: " 120"
- hideKeyboard
- tapOn:
    text: "Mark .* set 1 complete"
    below:
      text: "More for Treadmill Run"
    waitToSettleTimeoutMs: 300
- takeScreenshot: 72-sprint-no-record
- tapOn:
    text: "Skip rest"
    optional: true
# Set 2: 2 km in 9:00 — 4:30 /km beats 5:00 /km.
- tapOn: "Add set"
- tapOn:
    text: ".* set 2 distance, kilometres"
    below:
      text: "More for Treadmill Run"
- inputText: " 2"
- tapOn:
    text: ".* set 2 time, minutes and seconds"
    below:
      text: "More for Treadmill Run"
- inputText: " 900"
- hideKeyboard
- tapOn:
    text: "Mark .* set 2 complete"
    below:
      text: "More for Treadmill Run"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'New record.*Best pace.*'
    timeout: 3000
- takeScreenshot: 73-best-pace-record
- tapOn:
    text: "Skip rest"
    optional: true
# Phase 2 (LW-02): Finish opens the "Finish workout?" sheet; its own button (above its
# "Keep going"; the screen's button sits behind it) saves. Both sets are ticked: nothing to ask.
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# Audit Phase 3 (D10): the finish line counts LIFTS that beat a best — the run is one lift, even
# if it set more than one kind of record ("… · 1 lift beat its best").
- extendedWaitUntil:
    visible: '.* · 1 lift beat its best'
    timeout: 15000
# LW-10 / PG-04: a workout without a routine is named by when it started ("Morning workout"; the
# member can rename it on the finish sheet), and so is its share picture (75) — never "Full Body".
- assertVisible: '(Morning|Afternoon|Evening|Night) workout done'
- assertNotVisible: "Full Body done"
# LW-21: the records fold shut under "New records": open them before looking for Best pace.
- scrollUntilVisible:
    element: "New records"
    centerElement: true
    timeout: 20000
- tapOn: "New records"
- scrollUntilVisible:
    element: 'Best pace.*'
    centerElement: true
    timeout: 20000
- takeScreenshot: 74-finish-best-pace
- scrollUntilVisible:
    element: "Share as a picture"
    timeout: 20000
- tapOn: "Share as a picture"
- extendedWaitUntil:
    visible: "Send it to WhatsApp, Instagram or any app."
    timeout: 15000
# Owner profile (360 dp, font 1.3): the preview fills the sheet and the button is below it.
- scrollUntilVisible:
    element: "Share picture"
    centerElement: true
    timeout: 15000
- takeScreenshot: 75-share-picture-female
- back
- scrollUntilVisible:
    element: "Done"
    timeout: 20000
- tapOn: "Done"
# ---------------------------------------------------------------- the run's records + the 1 km rule
# Done goes to the Workout tab; the exercise is Profile → Exercises (redesign R5), its page opens
# on Summary, where the records are.
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 20000
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " treadmill"
- hideKeyboard
- tapOn:
    text: "View Treadmill Run"
    index: 0
- extendedWaitUntil:
    visible: "^Summary$"
    timeout: 15000
# "Longest distance" is also the chart picker's label above the chart now (design pass): scroll
# to the records heading first, then to the row.
- scrollUntilVisible:
    element: "Personal records"
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element: "4:30 /km"
    timeout: 20000
# The pace itself, not just its label: the "—" row before any 1 km set has the label too.
- assertVisible: "4:30 /km"
- assertNotVisible: "Best pace counts only.*"
- takeScreenshot: 76-run-records
# Redesign R5: the heading is "Personal records" (Hevy's words), its i spoken so.
- tapOn: "Personal records, more information"
- assertVisible: "Best pace counts only sets of 1 km or more, so a short sprint can't set it."
- takeScreenshot: 77-run-records-info
