# Part INV, step F3 (QR self check-in): the same poster scanned again the same day. One tap; no
# number is asked (the gym kept the one that matched), nothing is written twice: "already checked in". Then Leave, so the
# phone ends in no gym, like step E.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: 'Tap Check in when you are at the gym\.'
    timeout: 30000
- tapOn: '^Check in$'
- extendedWaitUntil:
    visible: 'You''re in ✓ [0-9]{1,2}:[0-9]{2} [ap]m'
    timeout: 30000
- assertVisible: 'You were already checked in at QA Check-in Gym today\. Nothing more to do\.'
- assertNotVisible: 'Your mobile number'
- takeScreenshot: inv-f3-already-in
- tapOn: '^Done$'
# Done goes to the Gym tab (its shop is off; its unbranded title is its name).
- extendedWaitUntil:
    visible: '^QA Check-in Gym$'
    timeout: 20000
# Release A (A4): Leave is in Settings → Your gym only.
- runFlow: sub-leave-gym.yaml
- extendedWaitUntil:
    visible: 'Leave QA Check-in Gym\?'
    timeout: 15000
- tapOn: '^Leave gym$'
# Release A: in no gym, Settings offers "Join your gym" and the Gym tab is its join screen.
- extendedWaitUntil:
    visible: '^Join your gym$'
    timeout: 20000
- runFlow: sub-gym-none.yaml
