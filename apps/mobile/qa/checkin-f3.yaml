# Part INV, step F3 (QR self check-in): the same poster scanned again the same day. One tap; no
# number is asked (the gym kept the one that matched), nothing is written twice: "already checked in". Then Leave, so the
# phone ends in no gym, like step E.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: 'Tap Check in when you are at the gym\.'
    timeout: 30000
- tapOn: '^Check in$'
- extendedWaitUntil:
    visible: 'You''re in ✓ [0-9]{1,2}:[0-9]{2} [ap]m'
    timeout: 30000
- assertVisible: 'You were already checked in at QA Check-in Gym today\. Nothing more to do\.'
- assertNotVisible: 'Your mobile number'
- takeScreenshot: inv-f3-already-in
- tapOn: '^Done$'
# Done goes to the gym's tab (R-77: "Gym" here, its shop is off; its unbranded title is its name).
- extendedWaitUntil:
    visible: '^QA Check-in Gym$'
    timeout: 20000
- scrollUntilVisible:
    element: '^Leave$'
    # Leave is the last row of the gym's page: it can never be centred (U-Q5), so no centerElement.
    timeout: 20000
- tapOn: '^Leave$'
- extendedWaitUntil:
    visible: 'Leave QA Check-in Gym\?'
    timeout: 15000
- tapOn: '^Leave gym$'
# R-77: no gym, no third tab; the app is on Workout.
- extendedWaitUntil:
    notVisible: '^(Shop|Gym)$'
    timeout: 20000
- extendedWaitUntil:
    visible: '^Profile$'
    timeout: 20000
- assertNotVisible: '^(Shop|Gym)$'
