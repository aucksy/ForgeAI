# Redesign device QA, part R — the 3-tab redesign, photographed screen by screen (runs after part
# P9 and its shortcut check, before the P7 large-text tours and M). Normal text, gesture
# navigation. Screenshots r-*.png (the script gathers them in qa-out/redesign/).
#  1. Workout tab (R1/R4): only Workout · Profile · Shop; the Up next card; Start empty workout,
#     Routines with New folder, New routine and Explore; the followed folder "Jaipur (6)" open,
#     tagged Following, its "Next" routine; a routine's ⋯ and a folder's ⋯; Explore.
#  2. Profile (R2): header (Edit profile, share, Settings), stats, the history chart in each chip
#     (Duration · Kg/Lb lifted · Reps) and each range (Last 12 weeks · Last 12 months · All time), a bar
#     tapped; the 4 Dashboard tiles' screens (Statistics, Exercises, Measures, Calendar + its Year
#     view); a feed card and its ⋯; a workout page and its ⋯; an exercise page's 3 tabs.
#  3. Settings (R6): the list and 3 pages (Units, Workouts, About); Edit profile.
#  4. Shop (S2, the gym's real shop on the LIVE server): the join card, join the test gym FORGE1 as
#     "QA Member", its products, the shaker, Add to bag, the Bag, Place order, "Order N placed",
#     My orders (Ordered: "The gym is getting it ready"), Cancel order ("You cancelled this order",
#     the placed line gone), Leave; then the sample shop (S1 demo).
# Saves no workout (part M reads its count afresh). The chart's chip and range are put back to
# Kg/Lb lifted and Last 12 weeks. The one gym order placed is cancelled (its stock goes back) and
# the phone leaves the gym, so the Shop ends on the join card.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# ---------------------------------------------------------------- 1. the Workout tab
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "Up next: .*|Done today: .*|Workout in progress"
    timeout: 30000
# A workout left open by an earlier part that failed (run 38870025551: "Workout in progress",
# so no "Start empty workout") costs only that part: thrown away as a member would, then back to
# the top of the tab.
- runFlow:
    when:
      visible: "Workout in progress"
    commands:
      - runFlow: sub-workout-fresh.yaml
      - scrollUntilVisible:
          element: "Up next: .*|Done today: .*"
          direction: UP
          centerElement: true
          timeout: 20000
# Three tabs: Workout (opens first), Profile, Shop. Home, History and Progress are gone (this
# part runs with gesture navigation, so no system "Home" button is on screen).
- assertVisible: "^Shop$"
- assertNotVisible: "^Home$"
- assertNotVisible: "^History$"
- assertNotVisible: "^Progress$"
- takeScreenshot: r-01-workout-top
- scrollUntilVisible:
    element: "^Routines$"
    centerElement: true
    timeout: 30000
- assertVisible: "Start empty workout"
- assertVisible: "New folder"
- assertVisible: "New routine"
- assertVisible: "Explore"
# Part L follows "Jaipur": its folder is first, open, tagged "Following".
- scrollUntilVisible:
    element: 'Jaipur \(6\)'
    centerElement: true
    timeout: 20000
- assertVisible: "Jaipur folder, 6 routines, open, Following"
- takeScreenshot: r-02-workout-folders
# The routine Up next names carries the "Next" tag (part L did Push 1 today: Pull 1 is next).
- scrollUntilVisible:
    element: "Start routine Pull 1"
    centerElement: true
    timeout: 20000
- assertVisible: "Pull 1, next, .*"
- takeScreenshot: r-02b-workout-next-routine
# ---------------------------------------------------------------- a routine's ⋯
- tapOn: "More for Pull 1"
- extendedWaitUntil:
    visible: "Share routine"
    timeout: 10000
- assertVisible: "Duplicate routine"
- assertVisible: "Edit routine"
- assertVisible: "Move up"
- assertVisible: "Move down"
- assertVisible: "Move to folder…"
- assertVisible: "Delete routine"
- takeScreenshot: r-03-routine-menu
- back
- extendedWaitUntil:
    notVisible: "Duplicate routine"
    timeout: 10000
# ---------------------------------------------------------------- a folder's ⋯
- scrollUntilVisible:
    element: "More for Jaipur"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "More for Jaipur"
- extendedWaitUntil:
    visible: "Rename folder"
    timeout: 10000
- assertVisible: "Add new routine"
- assertVisible: "Share folder"
- assertVisible: "Easy weeks….*"
- assertVisible: "Stop following"
- assertVisible: "Delete folder"
- takeScreenshot: r-04-folder-menu
- back
- extendedWaitUntil:
    notVisible: "Rename folder"
    timeout: 10000
# ---------------------------------------------------------------- Explore
- scrollUntilVisible:
    element: "Explore"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Explore"
- extendedWaitUntil:
    visible: "Build a plan"
    timeout: 20000
- assertVisible: "A plan built for you, or a ready program."
- takeScreenshot: r-05-explore
- scrollUntilVisible:
    element: "Import routines from Hevy"
    centerElement: true
    timeout: 30000
- assertVisible: "Bring routines in"
- assertVisible: "Import a routine file"
- takeScreenshot: r-05b-explore-bring-routines-in
- back
- extendedWaitUntil:
    visible: "^Routines$|Up next: .*|Done today: .*"
    timeout: 15000
# ---------------------------------------------------------------- 2. the Profile page
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 30000
- assertVisible: "Settings"
- assertVisible: "Share this month as a picture"
- assertVisible: '^Workouts: [\d,]+$'
- assertVisible: '^Weeks in a row: [\d,]+$'
- assertVisible: '^Records: [\d,]+$'
- assertVisible: "Range: Last 12 weeks. Change"
- takeScreenshot: r-06-profile-top
# The chart's chips: Duration · Kg lifted (Lb lifted after part I's units) · Reps.
- scrollUntilVisible:
    element: "^Duration$"
    centerElement: true
    timeout: 20000
# index 0: the chip (a feed card below can carry a "Reps" or "Lb lifted" figure too).
- tapOn:
    text: "^Duration$"
    index: 0
- extendedWaitUntil:
    visible: "Duration, last 12 weeks.*"
    timeout: 10000
- takeScreenshot: r-07-chart-duration
- tapOn:
    text: "^Reps$"
    index: 0
- extendedWaitUntil:
    visible: "Reps, last 12 weeks.*"
    timeout: 10000
- takeScreenshot: r-07b-chart-reps
- tapOn:
    text: '^(Kg|Lb) lifted$'
    index: 0
- extendedWaitUntil:
    visible: '(Kg|Lb) lifted, last 12 weeks.*'
    timeout: 10000
- takeScreenshot: r-07c-chart-lifted
- assertVisible: "Tap a bar to see one week"
# Tap a bar (each is a button "<period>: <number>"): the big number shows that bar.
- tapOn:
    text: '.*: [1-9][\d,]* (kg|lb)'
    index: 0
- takeScreenshot: r-08-chart-bar-tapped
# The way back to the range's total (the big number is the 12-week total until a bar is tapped).
- tapOn: "Show 12-week total"
- extendedWaitUntil:
    visible: "(Kg|Lb) lifted in the last 12 weeks · .*"
    timeout: 10000
# The ranges: Last 12 weeks · Last 12 months · All time (the "Show" sheet).
- tapOn: "Range: Last 12 weeks. Change"
- extendedWaitUntil:
    visible: "^Show$"
    timeout: 10000
- assertVisible: "^All time$"
- takeScreenshot: r-08b-chart-range-sheet
- tapOn: "^Last 12 months$"
- extendedWaitUntil:
    visible: "Range: Last 12 months. Change"
    timeout: 15000
- takeScreenshot: r-08c-chart-year
- tapOn: "Range: Last 12 months. Change"
- extendedWaitUntil:
    visible: "^Show$"
    timeout: 10000
- tapOn: "^All time$"
- extendedWaitUntil:
    visible: "Range: All time. Change"
    timeout: 15000
- extendedWaitUntil:
    visible: "(Kg|Lb) lifted since .* · .*"
    timeout: 10000
- takeScreenshot: r-08d-chart-all-time
# Put the range back (the chart keeps the last choice).
- tapOn: "Range: All time. Change"
- extendedWaitUntil:
    visible: "^Show$"
    timeout: 10000
- tapOn:
    text: "^Last 12 weeks$"
    below:
      text: "^Show$"
- extendedWaitUntil:
    visible: "Range: Last 12 weeks. Change"
    timeout: 15000
# ---------------------------------------------------------------- the 4 tiles
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Statistics"
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 30000
- assertVisible: "Sets per muscle group"
- takeScreenshot: r-09-statistics
- scrollUntilVisible:
    element: "Main exercises"
    centerElement: true
    timeout: 30000
- takeScreenshot: r-09b-statistics-main-exercises
- back
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- assertVisible: "Create an exercise"
- takeScreenshot: r-10-exercises
- back
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Measures"
- extendedWaitUntil:
    visible: "Progress photos"
    timeout: 20000
- assertVisible: "Add measures"
- assertVisible: "^Body weight$"
- takeScreenshot: r-11-measures
- back
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Calendar"
- extendedWaitUntil:
    visible: "Log a past workout"
    timeout: 20000
- assertVisible: "^Streak$"
- assertVisible: "Search workouts"
- takeScreenshot: r-12-calendar
- tapOn: "^Year$"
- extendedWaitUntil:
    visible: 'Show 20\d\d'
    timeout: 15000
- takeScreenshot: r-12b-calendar-year
- back
# ---------------------------------------------------------------- a feed card and its ⋯
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 15000
- scrollUntilVisible:
    element: "More for .*"
    centerElement: true
    timeout: 30000
- takeScreenshot: r-13-feed-card
- tapOn:
    text: "More for .*"
    index: 0
- extendedWaitUntil:
    visible: "Save as routine"
    timeout: 10000
- assertVisible: "Repeat workout"
- assertVisible: "Edit workout"
- assertVisible: "Share as a picture"
- assertVisible: "Share as text"
- assertVisible: "Delete workout"
- takeScreenshot: r-13b-feed-menu
- back
- extendedWaitUntil:
    notVisible: "Save as routine"
    timeout: 10000
# ---------------------------------------------------------------- a workout page
- tapOn:
    text: '.*\. Open$'
    index: 0
- extendedWaitUntil:
    visible: '[A-Z][a-z]+day, \d{1,2} [A-Z][a-z]{2} \d{4} · \d\d:\d\d.*'
    timeout: 15000
- takeScreenshot: r-14-workout-page
# Redesign R5: Edit / Repeat sit behind ⋯ ("More"), as on the feed.
- tapOn: "More"
- extendedWaitUntil:
    visible: "Edit workout"
    timeout: 10000
- assertVisible: "Repeat workout"
- takeScreenshot: r-14b-workout-page-more
- back
- extendedWaitUntil:
    notVisible: "Repeat workout"
    timeout: 10000
# ---------------------------------------------------------------- an exercise page's 3 tabs
# Tap an exercise on the workout page → its page, which opens on Summary.
- scrollUntilVisible:
    element: '.*\. Open the exercise'
    centerElement: true
    timeout: 20000
- tapOn:
    text: '.*\. Open the exercise'
    index: 0
- extendedWaitUntil:
    visible: "^Summary$"
    timeout: 15000
- assertVisible: "^History$"
- assertVisible: "^How to$"
- takeScreenshot: r-15-exercise-summary
- tapOn: "^History$"
- extendedWaitUntil:
    visible: '.*Open the workout'
    timeout: 15000
- takeScreenshot: r-15b-exercise-history
- tapOn: "^How to$"
- extendedWaitUntil:
    visible: "How to do it"
    timeout: 15000
- takeScreenshot: r-15c-exercise-how-to
# The exercise page → the workout page → Profile.
- back
- back
# ---------------------------------------------------------------- 3. Settings and Edit profile
- runFlow:
    file: sub-settings-open.yaml
- assertVisible: "^Workouts$"
- assertVisible: "^Units$"
- assertVisible: "^Notifications$"
- assertVisible: "^Widgets$"
- takeScreenshot: r-16-settings
- scrollUntilVisible:
    element: "^About$"
    centerElement: true
    timeout: 20000
- assertVisible: "^Your gym$"
- assertVisible: "^Backup$"
- assertVisible: "^Export & import$"
- assertVisible: "^Your data$"
- takeScreenshot: r-16b-settings-bottom
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Units"
- extendedWaitUntil:
    visible: "lb, miles"
    timeout: 15000
- assertVisible: "(?i)body figure"
- takeScreenshot: r-17-settings-units
- back
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Workouts"
- extendedWaitUntil:
    visible: "Workout sounds"
    timeout: 15000
- takeScreenshot: r-18-settings-workouts
- back
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "About"
- extendedWaitUntil:
    visible: "Credits"
    timeout: 15000
- takeScreenshot: r-19-settings-about
- back
# Settings → Profile → Edit profile (the pencil). Nothing is typed, so nothing changes.
- back
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 15000
- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: 'Bio, up to \d+ characters'
    timeout: 15000
- assertVisible: "Name"
- assertVisible: "Link"
- takeScreenshot: r-20-edit-profile
- back
# ---------------------------------------------------------------- 4. the Shop (S2: the gym's real shop)
# Not joined yet, the Shop tab is the join card. Join the fixed test gym (code FORGE1, "ForgeAI
# Test Gym", supabase/migrations/0002_shop.sql) as "QA Member" — this talks to the LIVE server,
# so every wait after a tap that calls it is long. The shaker is ordered, then cancelled (its
# stock goes back), and the phone leaves the gym at the end so later parts (P7) meet the join card.
- extendedWaitUntil:
    visible: "^Shop$"
    timeout: 15000
- tapOn:
    text: "^Shop$"
    index: 0
- extendedWaitUntil:
    visible: "^Your gym's shop$"
    timeout: 20000
- assertVisible: "Enter the code from your gym"
- assertVisible: "See a sample shop"
- takeScreenshot: r-21-shop-join
# The code box cleans what is typed to capitals, letters and digits. The emulator can drop the
# first key into a freshly focused box (trap 5): if the box does not read FORGE1, type it again.
- tapOn: "Gym code"
- inputText: "FORGE1"
- runFlow:
    when:
      notVisible: "^FORGE1$"
    commands:
      - tapOn: "Gym code"
      - eraseText: 10
      - inputText: "FORGE1"
- assertVisible: "^FORGE1$"
# The name starts as the profile's name; replace it.
- tapOn: "Name on your orders"
- eraseText: 70
- inputText: " QA Member"
- takeScreenshot: r-21b-shop-join-filled
# Enter on the name box joins (it is the keyboard's "Go"). Wait for the gym's shop; only if the
# phone is still on the join card after that (the keyboard swallowed Enter, or the join failed),
# tap Join. (The Join button keeps its word while joining, so "still visible" alone proves nothing.)
- pressKey: Enter
- extendedWaitUntil:
    visible: "^ForgeAI Test Gym$"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible: "^Your gym's shop$"
    commands:
      - scrollUntilVisible:
          element: "^Join$"
          centerElement: true
          timeout: 10000
      - tapOn: "^Join$"
- extendedWaitUntil:
    visible: "^ForgeAI Test Gym$"
    timeout: 45000
- extendedWaitUntil:
    visible: 'Whey protein 1 kg, .*'
    timeout: 45000
- assertVisible: "Your gym's shop · pay at the desk"
- assertVisible: "My orders"
- assertVisible: "Bag, empty"
- assertNotVisible: 'Sample shop — .*'
- takeScreenshot: r-21c-shop-grid
- scrollUntilVisible:
    element: 'Shaker bottle 700 ml, .*'
    centerElement: true
    timeout: 20000
- tapOn: 'Shaker bottle 700 ml, .*'
# The product page writes "700 ml" with a no-break space (the number never wraps from its unit),
# so the title is matched with "." there; the grid card's spoken label keeps the plain name.
- extendedWaitUntil:
    visible: '^Shaker bottle 700.ml$'
    timeout: 15000
- takeScreenshot: r-22-shop-product
- scrollUntilVisible:
    element: "Add to bag"
    centerElement: true
    timeout: 15000
- tapOn: "Add to bag"
- extendedWaitUntil:
    visible: "Added 1 to your bag"
    timeout: 10000
- assertVisible: "Bag, 1 item"
- takeScreenshot: r-22b-added-to-bag
# "Go to bag" appears under the "Added 1 to your bag" line, at the page's end, so it opens below
# the screen's edge (trap 23; run 38144864717 failed "Element not found: Go to bag" here).
- scrollUntilVisible:
    element: "Go to bag"
    centerElement: true
    timeout: 15000
- tapOn: "Go to bag"
- extendedWaitUntil:
    visible: "^Bag$"
    timeout: 15000
- scrollUntilVisible:
    element: "^Place order$"
    centerElement: true
    timeout: 15000
- assertVisible: 'Pay at the desk when you collect it\. Nothing is charged in the app\.'
- assertNotVisible: "Place demo order"
- takeScreenshot: r-23-bag
- tapOn: "^Place order$"
# The order goes to the gym's server; My orders opens with the placed line on top.
- extendedWaitUntil:
    visible: 'Order \d+ placed\. Pay at the desk when you collect it\.'
    timeout: 45000
- assertVisible: "^My orders$"
# The pill says "Ordered"; the line under it only adds what the pill does not (never the word again).
- extendedWaitUntil:
    visible: "^The gym is getting it ready$"
    timeout: 20000
- assertNotVisible: 'Ordered — .*'
- assertVisible: '\d+ × Shaker bottle 700.ml'
- takeScreenshot: r-24-my-orders
# Cancel it: the app's own question; its red "Cancel order" is the one under its title (the
# order card's own "Cancel order" sits behind the sheet).
- scrollUntilVisible:
    element: "Cancel order"
    centerElement: true
    timeout: 15000
- tapOn: "Cancel order"
- extendedWaitUntil:
    visible: 'Cancel this order\?'
    timeout: 10000
- takeScreenshot: r-25-cancel-order-question
- tapOn:
    text: "Cancel order"
    below:
      text: 'Cancel this order\?'
- extendedWaitUntil:
    visible: "^You cancelled this order$"
    timeout: 45000
# A cancelled order can no longer be cancelled (its button goes once the sheet has slid away).
- extendedWaitUntil:
    notVisible: "Cancel order"
    timeout: 10000
# The green "Order N placed" line is gone once its order is cancelled (it sat over the Cancelled card).
- assertNotVisible: 'Order \d+ placed.*'
- takeScreenshot: r-26-order-cancelled
# My orders replaced the Bag, so Back may land on the product page first, then the Shop.
- back
- runFlow:
    when:
      notVisible: "^ForgeAI Test Gym$"
    commands:
      - back
- extendedWaitUntil:
    visible: "^ForgeAI Test Gym$"
    timeout: 15000
# Leave the gym (the row at the shop's end): the app's own question, then the join card again.
- scrollUntilVisible:
    element: "^Leave$"
    centerElement: true
    timeout: 20000
- assertVisible: "Gym: ForgeAI Test Gym"
- tapOn: "^Leave$"
- extendedWaitUntil:
    visible: 'Leave ForgeAI Test Gym''s shop\?'
    timeout: 10000
- takeScreenshot: r-27-leave-question
- tapOn: "Leave shop"
- extendedWaitUntil:
    visible: "^Your gym's shop$"
    timeout: 15000
- takeScreenshot: r-27b-shop-join-again
# The sample shop (S1 demo) opens from the join card, plainly labelled; Back returns to the card.
- scrollUntilVisible:
    element: "See a sample shop"
    centerElement: true
    timeout: 15000
- tapOn: "See a sample shop"
- extendedWaitUntil:
    visible: "^Sample shop$"
    timeout: 15000
- assertVisible: 'Sample shop — these are example products.*'
- takeScreenshot: r-28-sample-shop
- back
- extendedWaitUntil:
    visible: "^Your gym's shop$"
    timeout: 15000
- tapOn:
    text: "^Workout$"
    index: 0
