# Redesign device QA, part R — the 3-tab redesign, photographed screen by screen (runs after part
# P9 and its shortcut check, before the P7 large-text tours and M). Normal text, gesture
# navigation. Screenshots r-*.png (the script gathers them in qa-out/redesign/).
#  1. Workout tab (R1/R4): the 4 tabs Workout · Progress · Gym · Profile (Release A); the Up next card; Start empty workout,
#     Routines with New folder, New routine and Find a plan; the followed folder "Jaipur (6)" open,
#     tagged Following, its "Next" routine; a routine's ⋯ and a folder's ⋯; Find a plan.
#  2. Profile (R2): header (Edit profile, share, Settings), stats, the history chart in each chip
#     (Duration · Kg/Lb lifted · Reps) and each range (Last 12 weeks · Last 12 months · All time), a bar
#     tapped; Progress → Charts, Exercises and Body, and Profile's Calendar (+ its Year
#     view); a feed card and its ⋯; a workout page and its ⋯; an exercise page's 3 tabs.
#  3. Settings (Release A: 6 headed groups) and 4 pages (Units, Rest timer and sounds, How the app
#     picks your next weight, About); Your profile (the one profile editor).
#  4. The gym's real shop (S2) on the LIVE server: the Gym tab's "Join your gym" screen (Release A:
#     the Gym tab is always there), join the test gym FORGE1 as "QA Member" (sub-join-gym.yaml), its
#     products, the shaker, Add to bag, the Bag, Place order, "Order N placed",
#     My orders (Ordered: "The gym is getting it ready"), Cancel order ("You cancelled this order",
#     the placed line gone), Leave; then (UAT U-G1) join again, order the shaker and Leave WITH it
#     open: the question says "You have 1 open order (₹…). Leaving cancels it.", and a third join
#     sees the shaker's stock back where it was. Leave is in Settings → Your gym (A4).
# Saves no workout (part M reads its count afresh). The chart's chip and range are put back to
# Kg/Lb lifted and Last 12 weeks. Both gym orders placed are cancelled (their stock goes back) and
# the phone leaves the gym, so the app ends in no gym (the Gym tab offers "Join your gym").
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# ---------------------------------------------------------------- 1. the Workout tab
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "Up next: .*|Done today: .*|Workout in progress"
