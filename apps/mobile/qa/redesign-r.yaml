# A workout left open by an earlier part that failed (run 38870025551: "Workout in progress",
# so no "Start empty workout") costs only that part: thrown away as a member would, then back to
# the top of the tab.
- runFlow:
    when:
      visible: "Workout in progress"
    commands:
      - runFlow: sub-workout-fresh.yaml
      - scrollUntilVisible:
          element: "Up next: .*|Done today: .*"
          direction: UP
          centerElement: true
          timeout: 20000
# Release A (A1/A5): 4 tabs, always the same 4, with or without a gym: Workout (opens first),
# Progress, Gym, Profile. Home and History are gone (this part runs with gesture navigation, so no
# system "Home" button is on screen).
- assertVisible: "^Progress$"
- assertVisible: "^Gym$"
- assertNotVisible: "^Shop$"
- assertNotVisible: "^Home$"
- assertNotVisible: "^History$"
- takeScreenshot: r-01-workout-top
