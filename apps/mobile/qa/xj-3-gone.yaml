# Cross-role journey 3, member step 2: the owner took the message back (XJ3b). It is gone from
# the member's inbox, and the bell has no count.
appId: com.mettleup.app
---
- runFlow: xj-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- extendedWaitUntil:
    visible: "^Messages from your gym$"
    timeout: 30000
- tapOn: "^Messages from your gym$"
- extendedWaitUntil:
    visible: "^No messages yet$"
    timeout: 30000
- assertNotVisible: "QA journeys: closed on Monday"
- takeScreenshot: xj3-03-inbox-empty
- back
