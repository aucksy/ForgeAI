# Part INV, step D: a link whose code no gym has — says so, and points at the Gym tab's code box
# (Release A: the Gym tab's one "Join your gym" screen; the button is "Type a gym code").
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "This link is not a gym's"
    timeout: 30000
- assertVisible: 'No gym has the code ZZZZZ9\. Ask your gym for a new link, or type their code in the Gym tab\.'
- takeScreenshot: inv-06-unknown-code
- tapOn: "^Type a gym code$"
# Release A: the Gym tab's "Join your gym" screen with its code box.
- extendedWaitUntil:
    notVisible: "This link is not a gym's"
    timeout: 20000
- scrollUntilVisible:
    element: "Gym code"
    timeout: 20000
- assertVisible: "^Join your gym$"
- takeScreenshot: inv-06b-type-a-code
