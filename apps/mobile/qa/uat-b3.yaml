# UAT WP4b, part UB (M-07, step 3 of 4): back from Android's share sheet (the script pressed Back),
# the screen says what to do with the file. Then "Try again" while the database is STILL damaged:
# the error screen again (a real retry that failed), never the welcome screen. The script then puts
# the database back exactly as it was (tools/uat-root.sh db-restore).
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: 'Keep this file somewhere safe\. If you need help, send it to your gym, who can pass it to MettleUp to open\.'
    timeout: 20000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'MettleUp could not start'
- takeScreenshot: ub-04-file-saved-note
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Try again$'
- tapOn: "^Try again$"
- extendedWaitUntil:
    visible: "^Try again$"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Try again$'
- extendedWaitUntil:
    visible: "MettleUp could not start"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'MettleUp could not start'
# R-277: the welcome opens on "Get stronger every week" (its one-screen start view).
- assertNotVisible: "Step 1 of 3|Your name|Start fresh|Get stronger every week|Use without an account|Load demo data instead"
- assertNotVisible: "^Profile$"
- takeScreenshot: ub-05-try-again-still-broken
