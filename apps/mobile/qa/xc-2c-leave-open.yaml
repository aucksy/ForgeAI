# Phone conditions (UAT WP7), condition 2c: Leave with NO INTERNET while orders are still open (3 when
# 2a, 3a and 3b all ordered). The question names them; "Cancel orders and leave" cannot reach the gym,
# so the member is told the orders are still placed and they are still in the gym ("Not now"):
# nothing is left half-done.
appId: com.forgeai.app
---
- runFlow: xc-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "^Leave$"
- tapOn: "^Leave$"
- extendedWaitUntil:
    visible: "Leave ${GYM}\\?"
    timeout: 30000
- assertVisible: '.*You have \d+ open orders? .*Leaving cancels (it|them)\..*'
- takeScreenshot: xc2c-01-leave-question-open-orders
- tapOn: "Cancel orders? and leave"
- extendedWaitUntil:
    visible: "Your order isn't cancelled yet"
    timeout: 60000
- assertVisible: 'No internet\. Your orders? (is|are) still placed and you''re still in the gym\. Try again when you''re online\.'
- takeScreenshot: xc2c-02-not-cancelled-offline
- tapOn: "Not now"
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "^Leave$"
