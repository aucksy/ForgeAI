# Device QA, part M (record) — runs after parts A–L, N and P7, BEFORE Android's backup. Opens Settings → Backup
# (redesign R6) and scrolls to its card, whose first line is the member's workout count ("12 workouts").
# The script reads that exact line off the screen and part M (after) must find it again once the
# app has been uninstalled, reinstalled and restored from the backup.
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
# Redesign R6: the Backup card is Settings → Backup (the Profile page's gear).
# R-320: Android's own backup (the workout count, "Include photos in my backup") left the Backup page,
# which now shows only the MettleUp account. Its page stays for this check, opened by its link.
- openLink: "forgeai://settings/phone-backup"
- extendedWaitUntil:
    visible: "^Your workouts$|^[0-9]+ workouts?$|^No workouts yet$"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Your workouts$|^[0-9]+ workouts?$|^No workouts yet$'
# The count loads a moment after the card ("Your workouts" first); wait for the number.
- scrollUntilVisible:
    element: '^[0-9]+ workouts?$'
    centerElement: true
    timeout: 30000
# Audit Phase 5 (PG-17 / D11): under the count, "Include photos in my backup" — OFF unless the
# member turns it on (part D's photos never did), and the card says what Off means.
- scrollUntilVisible:
    element: "Include photos in my backup"
    centerElement: true
    timeout: 20000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Off: photos stay on this phone only\..*'
- takeScreenshot: 179-backup-photos-off
# The script reads the count off the screen right after this flow: bring it back into view.
- scrollUntilVisible:
    element: '^[0-9]+ workouts?$'
    direction: UP
    centerElement: true
    timeout: 20000
- takeScreenshot: 180-before-backup-workouts
