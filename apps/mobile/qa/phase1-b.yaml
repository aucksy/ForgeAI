# Phase 1 device QA, part B — after the phone slept through the rest.
# Notification shade is already open (adb). Tap the workout's notification → back in the workout →
# minimise → the Workout tab's Up next card says "Workout in progress" with Resume workout (no bar
# on the Workout tab, redesign R1) → Resume → minimise → the bar on Profile → remove an exercise →
# Finish → the "Finish workout?" sheet → summary with its "Update routine?" sheet → Keep original
# → Profile → Settings → Workouts.
#
# v0.37.1 (audit C4): the tap on the notification is part B0 (phase1-b0.yaml), so the script can
# read the notification list between the tap and this part (the live card must be back). This part
# starts on the workout screen B0 left open.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- tapOn: "Minimise workout.*"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 15000
- takeScreenshot: 12a-workout-tab-resume-card
# Audit Phase 7 (packet B, src/tracker/lib/miniBar.ts) / redesign R1: on the Workout tab the Up
# next card itself says "Workout in progress" with "Resume workout", so the minimised bar is NOT
# shown there (two of the same thing). Every other tab keeps the bar (Profile, below).
- assertVisible: "Workout in progress"
- assertNotVisible: ".*Tap to open the workout"
- takeScreenshot: 12-workout-in-progress-card
# Owner profile (360 dp, font 1.3): the red link can sit below the screen's edge.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Discard workout"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Resume workout"
- tapOn: "Resume workout"
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 15000
# Minimise goes back to where the workout was opened from: the Workout tab, its card still there.
- tapOn: "Minimise workout.*"
- extendedWaitUntil:
    visible: "Resume workout"
    timeout: 15000
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: ".*Tap to open the workout"
    timeout: 15000
- takeScreenshot: 12b-minimised-bar-on-profile
- tapOn: ".*Tap to open the workout"
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 15000
- tapOn:
    text: "More for .*"
    index: 1
- tapOn: "Remove exercise"
- tapOn: "(?i)^remove$"
- takeScreenshot: 13-exercise-removed
# Phase 2 (LW-02): Finish opens the "Finish workout?" sheet; its own "Finish workout" saves.
# The sheet's button is the one above its "Keep going" (the screen's button sits behind it).
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- takeScreenshot: 13b-finish-sheet
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
# LW-11: "Update routine?" is now the app's own sheet over the summary, asked once it shows.
- extendedWaitUntil:
    visible: "Update routine"
    timeout: 30000
- assertVisible: 'Update ".*"\?'
- takeScreenshot: 14-update-routine-prompt
# Audit Phase 5 (PG-04): the finish screen and its share picture name the workout after the
# routine it was started from — the name this sheet asks about ('Update "Push 1"?' → "Push 1").
- copyTextFrom: 'Update ".*"\?'
- evalScript: '${output.routineName = maestro.copiedText.slice(8, -2)}'
# "Keep original" is also the sheet's × and its dimmed backdrop: tap the button under "Update routine".
- tapOn:
    text: "Keep original"
    below:
      text: "Update routine"
- extendedWaitUntil:
    notVisible: "Update routine"
    timeout: 10000
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# The banner reads "<workout name> done" (the share picture's title is the same name).
- assertVisible: "${output.routineName} done"
- takeScreenshot: 15-finish-summary
- scrollUntilVisible:
    element: "Done"
    timeout: 15000
- tapOn: "Done"
# Done goes to the Workout tab. Redesign R6: the workout settings are Profile → Settings → Workouts.
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Workouts"
- scrollUntilVisible:
    element: "Track RPE"
    timeout: 30000
- takeScreenshot: 16-settings-workouts
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Workout sounds"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Track RPE"
