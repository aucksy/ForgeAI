# UAT WP4b, part UK (M-110), step 1 of 5: the REAL Today widget on the home screen.
#   - Settings -> Widgets -> "Add Today" -> Android's "Add to home screen": the widget is placed.
#   - Its "Start" (the widget's own keyed link) starts today's routine AT ONCE: the workout screen,
#     never the calm "Start <routine>?" question (that is for a link without the key).
#   - During the workout the widget says "Workout in progress. Resume"; tapped, it resumes it (set 1
#     still ticked).
# Ends with the workout open and the app in the background; the script then reads the app-icon
# shortcuts Android holds (dumpsys shortcut) and opens them as the launcher does (steps 2-5).
# Starts from a fresh install with the demo (gate-demo.yaml), so it runs alone (only=uk).
appId: com.mettleup.app
---
- runFlow: gate-demo.yaml
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Widgets"
- scrollUntilVisible:
    element: "Add Today"
    centerElement: true
    timeout: 15000
- tapOn: "Add Today"
- extendedWaitUntil:
    visible: '(?i).*(add to home screen|add automatically|^add$).*'
    timeout: 15000
- tapOn: '(?i)^(add to home screen|add)$'
- pressKey: Home
- extendedWaitUntil:
    visible: '^TODAY$'
    timeout: 15000
# Back into the app once: it writes what the widget shows whenever it comes to the front.
- launchApp:
    stopApp: false
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Home-screen widgets|^Profile$"
    timeout: 30000
# 0.72.0 (R-320): the Today widget shows what to beat on the routine's first lifts, so it is spoken
# "Today: Push Day A. 6 exercises. Barbell Bench Press 72.5 kg × 8 last time · try 75 × 5. Overhead
# Press 40 kg × 8 last time · try 42.5 × 5. Start" (Widgets.kt); the demo has a last time for them.
- pressKey: Home
- extendedWaitUntil:
    visible: 'Today: .+\. \d+ exercises?\. .+ × \d+ last time · try .+\. Start'
    timeout: 30000
- copyTextFrom: 'Today: .+\. \d+ exercises?\. .+ × \d+ last time · try .+\. Start'
- runScript: js/uat-widget.js
- takeScreenshot: uk-01-widget-start
# ---------------------------------------------------------------- the widget's Start
- tapOn: 'Today: .+\. \d+ exercises?\. .+ × \d+ last time · try .+\. Start'
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- assertNotVisible: 'Start ${output.routineRe}\?'
- assertNotVisible: "Not now"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '${output.firstRe}\. Open its history and how-to'
- takeScreenshot: uk-02-started-by-the-widget
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "${output.firstRe} set 1 weight, kilograms"
      VALUE: " 60"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "${output.firstRe} set 1 reps"
      VALUE: " 5"
- tapOn:
    text: "Mark ${output.firstRe} set 1 complete"
    waitToSettleTimeoutMs: 300
- runFlow: sub-inuse-close.yaml
- tapOn:
    text: "Keep [0-9].*"
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
- assertVisible: '${output.firstRe} set 1 complete\. Tap to undo'
# ---------------------------------------------------------------- the widget's Resume
- pressKey: Home
- extendedWaitUntil:
    visible: 'Today: .+\. Workout in progress\. Resume'
    timeout: 30000
- takeScreenshot: uk-03-widget-resume
- tapOn: 'Today: .+\. Workout in progress\. Resume'
- extendedWaitUntil:
    visible: "Minimise workout. It keeps running."
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '${output.firstRe} set 1 complete\. Tap to undo'
- takeScreenshot: uk-04-resumed-by-the-widget
- pressKey: Home
