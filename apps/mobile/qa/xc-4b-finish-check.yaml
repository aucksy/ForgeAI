# Phone conditions (UAT WP7), condition 4b: killed with the finish sheet open, opened again: the
# workout is still OPEN (not finished behind the member's back, not lost), set 1 still ticked. Then it
# is thrown away (Discard) so the import that follows starts from the demo alone.
appId: com.forgeai.app
---
- runFlow: xc-sub-reopened.yaml
- assertNotVisible: "Workout complete"
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: 'Barbell Bench Press set 1 complete\. Tap to undo'
- takeScreenshot: xc4b-02-after-kill-still-open
- runFlow: xc-sub-back-to-tabs.yaml
- runFlow: xc-sub-workout-fresh.yaml
