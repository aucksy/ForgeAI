# Sub-flow (called with runFlow; not a part of its own): R-482 (part u482). A fresh install (clearState) restores one
# of the backup files qa/tools/make_r482_backups.py made from the phone's day (pushed to Downloads by the script),
# from the welcome screen exactly as part UBK does (qa/uat-bk.yaml), then opens the Workout tab with the Up next
# card on screen.
#   - runFlow:
#       file: sub-uat-r482-restore.yaml
#       env:
#         FILE: 'qa-r482-ppl\.zip'     # a regex for the file's name in Android's file picker
#         NEXT: 'Legs'                 # the routine the Up next card must name
# No `env:` default here (trap 22).
appId: com.mettleup.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead'
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead'
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Bring workouts$"
- tapOn: "^Bring workouts$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^A MettleUp backup$"
- tapOn: "^A MettleUp backup$"
- extendedWaitUntil:
    visible: "^Choose backup file$"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Choose backup file$'
- tapOn: "^Choose backup file$"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-r482).*'
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '(?i).*(recent|downloads|files|qa-r482).*'
- runFlow:
    when:
      notVisible: "${FILE}"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- extendedWaitUntil:
    visible: "${FILE}"
    timeout: 15000
- tapOn: "${FILE}"
- extendedWaitUntil:
    visible: "^In this backup$"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^In this backup$'
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Restore$"
- tapOn: "^Restore$"
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 15000
- scrollUntilVisible:
    element: "Up next: ${NEXT}.*"
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Up next: ${NEXT}.*'
