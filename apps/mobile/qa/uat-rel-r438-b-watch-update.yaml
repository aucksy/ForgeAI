# R-438 flow b: the phone clock is 25 hours on from flow a's "Later" (run-device-qa.sh part_u438), so the
# next app open asks again. Then each answer to "Update on watch": opened ("Check your watch" + the drawn
# watch's Update button), failed (the search-for-it fallback), no watch; Try again; and never in a workout.
# R-444: after "Update on watch" it never asks again for the same phone version (watch=forget resets it).
appId: com.mettleup.app
---
- stopApp
- launchApp
# ---------------------------------------------------------------- 1. time: after 24 hours it asks again
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 60000
- takeScreenshot: rel-r438-06-next-day-again
# ---------------------------------------------------------------- 2. the watch's Play Store opened
- tapOn: "Update on watch"
- extendedWaitUntil:
    visible: "Check your watch"
    timeout: 20000
- assertVisible: "Look at your watch and tap Update there\\..*"
- assertVisible: "Tap this on your watch"
- assertVisible: "Nothing on your watch\\? Try again"
- takeScreenshot: rel-r438-07-check-your-watch
- tapOn: "^Got it$"
- extendedWaitUntil:
    notVisible: "Check your watch"
    timeout: 10000
# R-444 (negative): after "Update on watch" + "Got it" the watch is still old (Play may have no watch
# update for this member), yet the next app open does NOT ask again for this phone version.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 15000
    optional: true
- assertNotVisible: "Your watch app has an update"
- takeScreenshot: rel-r444-01-no-ask-after-update-tap
# ---------------------------------------------------------------- 3. negative: it did not open on the watch
- openLink: "mettleup://qa-update?watchtap=failed&watch=forget"
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 20000
- tapOn: "Update on watch"
- extendedWaitUntil:
    visible: "The update did not start"
    timeout: 20000
- assertVisible: "Open Play Store on your watch, search for MettleUp and tap Update\\."
- takeScreenshot: rel-r438-08-did-not-start
# Try again keeps the plain answer (the stand-in still fails).
- tapOn: "^Try again$"
- extendedWaitUntil:
    visible: "The update did not start"
    timeout: 20000
- tapOn: "^Got it$"
- extendedWaitUntil:
    notVisible: "The update did not start"
    timeout: 10000
# ---------------------------------------------------------------- 4. negative: the watch is not connected
- openLink: "mettleup://qa-update?watchtap=none&watch=forget"
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 20000
- tapOn: "Update on watch"
- extendedWaitUntil:
    visible: "Your watch is not connected"
    timeout: 20000
- assertVisible: "Check that Bluetooth is on.*"
- takeScreenshot: rel-r438-09-not-connected
- tapOn: "^Got it$"
- extendedWaitUntil:
    notVisible: "Your watch is not connected"
    timeout: 10000
# ---------------------------------------------------------------- 5. negative: never during a workout
- runFlow: sub-workout-fresh.yaml
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- runFlow: sub-start-blank.yaml
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- openLink: "mettleup://qa-update?watchtap=opened&watch=forget"
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 12000
    optional: true
- assertNotVisible: "Your watch app has an update"
- takeScreenshot: rel-r438-10-workout-no-popup
# Throw the workout away; the next open then shows it (proves only the workout held it back).
- runFlow: sub-back-to-tabs.yaml
- runFlow: sub-workout-fresh.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Your watch app has an update"
    timeout: 60000
- takeScreenshot: rel-r438-11-after-workout-next-open
- tapOn: "^Later$"
