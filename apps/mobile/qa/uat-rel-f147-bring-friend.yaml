# Part UAT, flow F147 (gym, after flow 12): "Bring a friend" on the Gym tab (4-5 Nov 2026).
# The phone is a member ("Uma") of the fresh "QA UAT Gym" made by run-device-qa.sh.
#  - Until the gym's server has 0056 (NOT applied live yet), this QA build (qa-device.yml writes
#    extra.qaStandIns) shows a made-up answer: 7 free days, "Friends who joined: 2", and a line saying it is
#    test data. Store and GitHub builds never show it (they hide the card instead).
#  - Once 0056 is live, the real answer shows: "Friends who joined: 0" (a fresh gym), no free-days line.
# Either way: read the words, tap "Invite a friend" and photograph the phone's share menu (the message).
# The friend's page and the gym's side (Enquiries, the free days) are checked in the admin panel's e2e
# (apps/dashboard/e2e/friend-uat.spec.mjs) at a phone and a desktop width.
appId: com.mettleup.app
---
- tapOn:
    text: "^Gym$"
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "^Invite a friend$"
    direction: DOWN
    timeout: 20000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Bring a friend$'
- assertVisible: '^Send a friend a link to your gym\. They leave their number, and the gym calls them\.$'
- takeScreenshot: rel-f147-1-friend-card
# ---------------------------------------------------------------- without 0056: the QA stand-in, said on screen
- runFlow:
    when:
      visible: "^Test build: made-up numbers.*"
    commands:
      - assertVisible: "^Friends who joined: 2$"
      - assertVisible: "^When a friend joins, your gym can add 7 free days to your plan\\.$"
# ---------------------------------------------------------------- with 0056: the real answer
- runFlow:
    when:
      notVisible: "^Test build: made-up numbers.*"
    commands:
      - assertVisible: "^Friends who joined: 0$"
      - assertNotVisible: "^When a friend joins, .*"
# ---------------------------------------------------------------- the share menu with the ready message
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Invite a friend$'
- tapOn: "^Invite a friend$"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: rel-f147-2-share-menu
- assertVisible: ".*Come and train with me at QA UAT Gym!.*"
- back
