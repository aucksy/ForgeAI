# Sub-flow (called with runFlow; not a part of its own): F194 UAT. Close-Grip Lat Pulldown set N at
# KG x REPS, typed and ticked (a row is added first when the card has fewer than N). No `env:` default
# here (trap 22).
appId: com.mettleup.app
---
- runFlow:
    when:
      notVisible: "Close-Grip Lat Pulldown set ${N} weight, .*"
    commands:
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: "^Add set$"
      - tapOn:
          text: "^Add set$"
          index: 0
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Close-Grip Lat Pulldown set ${N} weight, .*"
      VALUE: " ${KG}"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Close-Grip Lat Pulldown set ${N} reps.*"
      VALUE: " ${REPS}"
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: "Close-Grip Lat Pulldown set ${N}"
- tapOn:
    text: "Keep [0-9].*"
    optional: true
- extendedWaitUntil:
    visible: 'Skip rest|In use\. .*'
    timeout: 8000
    # The last set of the exercise starts no rest timer, so this wait may miss.
    optional: true
