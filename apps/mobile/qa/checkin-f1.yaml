# Part INV, step F1 (QR self check-in, 15 Oct 2026). run-device-qa.sh made a fresh ONLINE gym on
# the live server (gym_create_online, "QA Check-in Gym"), put one member on its roster with the
# mobile +91 98765 00002 (crm_push), and opened the gym's INVITE link /j/<CODE> at the app. Join it,
# so the phone is that gym's member before the check-in poster's link is opened (F2).
# The join lands on the Workout tab. The gym lists NO products (gym_create_online seeds no
# shop), so its Gym tab page says "Your gym" (no bag, no product grid).
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: 'Gym code .*'
    timeout: 30000
- tapOn: 'Your name'
- eraseText: 70
- inputText: 'QA Member'
- hideKeyboard
# Owner profile (360 dp, font 1.3): the button can be below the form.
- runFlow: sub-agree.yaml  # launch D5/D6: tick 18+ / terms before joining
- scrollUntilVisible:
    element: '^Join this gym$'
    centerElement: true
    timeout: 15000
- tapOn: '^Join this gym$'
# Joined = the invite screen has gone, its "Your name" box with it (Release A: the Gym tab is there
# with or without a gym). Then the Workout tab (sub-after-join.yaml).
- extendedWaitUntil:
    notVisible: 'Your name'
    timeout: 30000
- runFlow: sub-after-join.yaml
- takeScreenshot: inv-f1-joined
# The gym's tab while its shop is off.
- tapOn:
    text: '^(Shop|Gym)$'
    index: 0
- extendedWaitUntil:
    visible: '^QA Check-in Gym$'
    timeout: 30000
- assertVisible: '^Gym$'
- assertVisible: '^Your gym$'
- assertNotVisible: 'Bag, .*'
# Release A: membership first, then "Check in" (the phone's camera reads the poster); no Leave here (A4).
- assertVisible: '^Check in$'
- assertNotVisible: '^Leave$'
- takeScreenshot: inv-f1-gym-tab
