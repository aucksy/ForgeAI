# Copied for the phone-conditions run (UAT WP7, run-conditions.sh) from sub-progress-row.yaml, so a change to the
# phone test parts never moves these flows. Same behaviour.
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "^Progress$"
    timeout: 30000
- tapOn:
    text: "^Progress$"
    index: 0
# The tab keeps its scroll position (at 200 % text a row can sit above or below the screen's edge):
# look UP first, then down.
- scrollUntilVisible:
    element: "^${ROW}$"
    direction: UP
    centerElement: true
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: "^${ROW}$"
    commands:
      - scrollUntilVisible:
          element: "^${ROW}$"
          centerElement: true
          timeout: 20000
- tapOn: "^${ROW}$"
