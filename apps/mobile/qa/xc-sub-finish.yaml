# Phone conditions (UAT WP7), sub-flow: finish the live workout (any rest skipped, untouched rows
# left out) and close the summary. Ends on the tabs.
appId: com.mettleup.app
---
- tapOn:
    text: "Skip rest"
    optional: true
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "^Finish workout$"
- tapOn:
    text: "^Finish workout$"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Leave them out"
    optional: true
- tapOn:
    text: "^Finish workout$"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Update routine|Workout complete"
    timeout: 30000
- runFlow:
    when:
      visible: "Update routine"
    commands:
      - tapOn:
          text: "Keep original"
          below:
            text: "Update routine"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "^Done$"
- tapOn: "^Done$"
