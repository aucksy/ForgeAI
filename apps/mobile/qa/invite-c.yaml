# Part INV, step C: another gym's link (RAMS01) while in FORGE1 — "Switch to this gym" joins the new
# gym first and only then lets FORGE1 go; then Leave, so the phone ends in no gym as it started.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: "Gym code RAMS01"
    timeout: 30000
- assertVisible: 'You''re in .* now\. Switching .*'
- takeScreenshot: inv-04-switch
- assertVisible: "^RAM'S FITNESS CLUB IMPACT$"
- runFlow: sub-agree.yaml  # launch D5/D6: tick 18+ / terms before joining
# The tick box pushes the button ~100 dp lower: bring it on screen before the tap.
- scrollUntilVisible:
    element: "^Switch to this gym$"
    timeout: 15000
- tapOn: "^Switch to this gym$"
# Switched = the branded gym's mark is up (the third tab was there before, so it proves nothing).
- extendedWaitUntil:
    visible: "Your gym: RAM'S FITNESS CLUB IMPACT"
    timeout: 30000
# R-77: the welcome opening, then the home-screen icon pop-up (closed with "Not now"), on Workout.
- runFlow: sub-after-join.yaml
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "Your gym: RAM'S FITNESS CLUB IMPACT"
    timeout: 30000
- takeScreenshot: inv-05-switched

# Release A (A4): Leave is in Settings → Your gym only.
- runFlow: sub-leave-gym.yaml
- extendedWaitUntil:
    visible: 'Leave RAM''S FITNESS CLUB IMPACT\?'
    timeout: 10000
- tapOn: "^Leave gym$"
# Leaving a branded gym redraws the app in ForgeAI's colours (it may land on the Workout tab, or stay
# on Settings, now offering "Join your gym"; as in part BR). Release A: the Gym tab is its join screen.
- extendedWaitUntil:
    notVisible: "Your gym: RAM'S FITNESS CLUB IMPACT"
    timeout: 20000
- extendedWaitUntil:
    visible: "^Profile$|^Join your gym$"
    timeout: 20000
- runFlow: sub-gym-none.yaml
