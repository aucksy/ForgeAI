# UAT upic (exercise pictures, 12 Nov 2026): our own start/end pictures (since 13 Nov, R-490: look D, the drawn
# man in the orange tank top of the main set; the grey 3D look A is gone) on the
# exercise page for exercises RepDB has no picture of. From a fresh install with the demo (part_upic).
# Happy path: a two-picture exercise (Tate Press: Start + End), a dumbbell curl (Alternating Hammer Curl),
# a hold (Wall Sit: one "Hold" picture, no End). Negative: an exercise with no picture of either kind
# (Iso-Lateral Chest Press) shows no picture frame. Regression: a RepDB exercise still shows its own pictures.
# Pictures rel-pics-*.png (read them: the right athlete, nothing cut off, card colour behind).
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
# The list: the small picture next to the name.
- tapOn: "Search exercises"
- inputText: " tate press"
- hideKeyboard
- takeScreenshot: rel-pics-01-list-tate
- tapOn:
    text: "View Tate Press"
    index: 0
- extendedWaitUntil:
    visible: "Start position of Tate Press"
    timeout: 20000
- assertVisible: "End position of Tate Press"
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Start$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^End$'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rel-pics-02-tate
# R-491 (14 Nov 2026, one look everywhere): the How to card's small picture is the orange-tank close-up (not the
# old grey line drawing), no drawing credit, and the moving demo loops the orange-tank start and end pictures.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^How to$'
- tapOn: "^How to$"
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'How to do it'
- assertNotVisible: "Drawing: Everkinetic.*"
- takeScreenshot: rel-pics-02b-tate-howto
- tapOn:
    text: "Watch how to do Tate Press"
    index: 0
# in-view: the demo sheet opens on top of the screen; it never needs a scroll.
- extendedWaitUntil:
    visible: "Moving demo of the exercise"
    timeout: 15000
- assertNotVisible: "Drawing: Everkinetic.*"
- takeScreenshot: rel-pics-02c-tate-demo
- back
- back
# The search keeps its text after back: clear it with the X (eraseText left letters behind on 12 Nov).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " alternating hammer curl"
- hideKeyboard
- tapOn:
    text: "View Alternating Hammer Curl"
    index: 0
- extendedWaitUntil:
    visible: "Start position of Alternating Hammer Curl"
    timeout: 20000
- assertVisible: "End position of Alternating Hammer Curl"
- takeScreenshot: rel-pics-03-hammer
- back
# A barbell exercise (13 Nov 2026: the first barbell pictures): Start + End, the bar in both hands.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " wide-grip barbell curl"
- hideKeyboard
- tapOn:
    text: "View Wide-Grip Barbell Curl"
    index: 0
- extendedWaitUntil:
    visible: "Start position of Wide-Grip Barbell Curl"
    timeout: 20000
- assertVisible: "End position of Wide-Grip Barbell Curl"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rel-pics-03b-barbell
- back
# A cable-machine exercise (13 Nov 2026: the first cable pictures): Start + End, both handles on the cables.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " overhead cable curl"
- hideKeyboard
- tapOn:
    text: "View Overhead Cable Curl"
    index: 0
- extendedWaitUntil:
    visible: "Start position of Overhead Cable Curl"
    timeout: 20000
- assertVisible: "End position of Overhead Cable Curl"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rel-pics-03c-cable
- back
# A lever machine (13 Nov 2026: the first gym-machine pictures, plain machines of our own): Start + End.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " machine lat pulldown"
- hideKeyboard
- tapOn:
    text: "View Machine Lat Pulldown"
    index: 0
- extendedWaitUntil:
    visible: "Start position of Machine Lat Pulldown"
    timeout: 20000
- assertVisible: "End position of Machine Lat Pulldown"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rel-pics-03d-machine
- back
# Look D (13 Nov 2026, R-490): an exercise that only got a picture in the drawn look: Start + End.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " weighted chin-up"
- hideKeyboard
- tapOn:
    text: "View Weighted Chin-Up"
    index: 0
- extendedWaitUntil:
    visible: "Start position of Weighted Chin-Up"
    timeout: 20000
- assertVisible: "End position of Weighted Chin-Up"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: rel-pics-03e-drawn
- back
# A hold: one picture, labelled Hold, no End.
# The search keeps its text after back: clear it with the X (eraseText left letters behind on 12 Nov).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " wall sit"
- hideKeyboard
- tapOn:
    text: "View Wall Sit"
    index: 0
- extendedWaitUntil:
    visible: "Hold position of Wall Sit"
    timeout: 20000
- assertNotVisible: "End position of Wall Sit"
- assertNotVisible: "Start position of Wall Sit"
- takeScreenshot: rel-pics-04-wall-sit
- back
# Negative: no picture of either kind, so no picture frame.
# The search keeps its text after back: clear it with the X (eraseText left letters behind on 12 Nov).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " iso-lateral chest press"
- hideKeyboard
- tapOn:
    text: "View Iso-Lateral Chest Press"
    index: 0
- extendedWaitUntil:
    visible: "^How to$"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^How to$'
- assertNotVisible: "Start position of.*"
- assertNotVisible: "Hold position of.*"
- takeScreenshot: rel-pics-05-no-picture
- back
# Regression: a RepDB exercise keeps its pictures.
# The search keeps its text after back: clear it with the X (eraseText left letters behind on 12 Nov).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Clear the search'
- tapOn: "Clear the search"
- tapOn: "Search exercises"
- inputText: " barbell curl"
- hideKeyboard
- tapOn:
    text: "View Barbell Curl"
    index: 0
- extendedWaitUntil:
    visible: "Start position of Barbell Curl"
    timeout: 20000
- takeScreenshot: rel-pics-06-repdb
