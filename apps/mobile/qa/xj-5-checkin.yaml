# Cross-role journey 5, member step 1 of 2: run-journeys.sh opened gym B's check-in poster link
# /c/<CODE_B>. The owner imported a 2-row CSV in the admin app (XJ5a); one row, Meera Import, holds
# the mobile 98765 00021. The phone types it once and taps Check in.
# 0048 (R-287): a typed number now waits for the desk's yes first; before 0048 is live it is matched
# at once. This step ends on either screen and leaves it open: the admin step XJ5c says yes in
# "Numbers to confirm" when one is waiting, then xj-5-checkin-done.yaml finishes and checks the result.
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "^Check in at ${GYM_B}$"
    timeout: 45000
- assertVisible: 'Tap Check in when you are at the gym\.'
- tapOn: "^Check in$"
- extendedWaitUntil:
    visible: 'Type the mobile number your gym has for you\. The app asks only once\.'
    timeout: 30000
- tapOn: "Your mobile number"
- inputText: "98765 00021"
- hideKeyboard
- tapOn: "^Check in$"
- extendedWaitUntil:
    visible: '(You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m|Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.)'
    timeout: 30000
- runFlow:
    when:
      visible: 'Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.'
    commands:
      - takeScreenshot: xj5-00-desk-check
