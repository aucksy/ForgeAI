# Part UAT, R-355 flow a (owner, 5 Nov 2026: "the watch app stopped showing the exercise name ... after
# the last set. So maybe we just have to start showing the name of the next exercise"). Starts afresh
# (gate-demo: clearState + demo). The cloud emulator has no watch, so the run checks what the phone TELLS
# the watch: run-device-qa.sh (part_u355) reads the phone's "watch next: <exercise> | <set> | <text>"
# lines (WearSync, logcat) and the rest card in the notification list right after this flow.
#   Exercise A: Leg Extension, B: Lateral Raise. The demo history decides how many sets each has (runs
#   41989492320 / 41994556433: 3 each), so every set of A is ticked in order (rests skipped) and the rest
#   after A's LAST set is the one read.
#   A's set 1 ticked -> the rest. The flow ENDS during that rest (the shell reads it there).
# Pictures rel-r355-*.png (qa-out/uat-release/).
appId: com.mettleup.app
---
- runFlow: gate-demo.yaml
- tapOn:
    text: "^Workout$"
    index: 0
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Start empty workout$"
- tapOn: "^Start empty workout$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout|^Add exercise$"
    timeout: 30000
# ---------------------------------------------------------------- A: Leg Extension
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Add exercise$"
- tapOn: "^Add exercise$"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " Leg Extension"
- tapOn:
    text: "Select Leg Extension"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "Leg Extension set 1 weight, kilograms"
    timeout: 20000
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Leg Extension set 1 weight, kilograms"
      VALUE: " 40"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Leg Extension set 1 reps"
      VALUE: " 10"
# ---------------------------------------------------------------- B: Lateral Raise (its sets from history)
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Add exercise$"
- tapOn: "^Add exercise$"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " Lateral Raise"
- tapOn:
    text: "Select Lateral Raise"
    index: 0
- tapOn: "Add 1"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Lateral Raise set 1 weight, kilograms"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Lateral Raise set 1 weight, kilograms"
      VALUE: " 10"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Lateral Raise set 1 reps"
      VALUE: " 12"
- takeScreenshot: rel-r355-01-two-exercises
# ---------------------------------------------------------------- every set of A; the rest after its LAST names B
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Leg Extension set 1"
# The rest starts; on a machine In use may cover the rest bar at once (run 42006104824).
- extendedWaitUntil:
    visible: 'Skip rest|In use\. .*Tap to close'
    timeout: 8000
- tapOn:
    text: "Not now"
    optional: true
# Leg Extension is a machine: In use opens by itself a few seconds after set 1 (after any record toast,
# R-357; run 42002288489 saw it 13 s in). Its tick is turned OFF for this exercise and it is closed with
# "I'm back", so it never covers sets 2 and 3. Its own lines were right in those runs (Leg Extension,
# "Previous 55 kg x 11", "Next 40 kg x 10": the NEXT set of the same exercise).
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: 'In use\. .*Tap to close'
    commands:
      - takeScreenshot: rel-r355-02-in-use-after-set-1
      - tapOn:
          text: "Show after every set of this exercise"
          waitToSettleTimeoutMs: 300
      - tapOn:
          text: "^I.m back$"
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          notVisible: 'In use\. .*Tap to close'
          timeout: 5000
- scrollUntilVisible:
    element: "Mark .*Leg Extension set 2 complete"
    centerElement: true
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "Mark .*Leg Extension set 2 complete"
    commands:
      - tapOn:
          text: "Skip rest"
          optional: true
      - runFlow:
          file: sub-uat-tick.yaml
          env:
            WHO: ".*Leg Extension set 2"
      - extendedWaitUntil:
          visible: 'Skip rest|All sets done|Finish workout|In use\. .*Tap to close'
          timeout: 8000
# In use opens a moment after the tick (after any record toast, R-357): wait for it, then close it.
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 'In use\. .*Tap to close'
    commands:
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          notVisible: 'In use\. .*Tap to close'
          timeout: 5000
- scrollUntilVisible:
    element: "Mark .*Leg Extension set 3 complete"
    centerElement: true
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "Mark .*Leg Extension set 3 complete"
    commands:
      - tapOn:
          text: "Skip rest"
          optional: true
      - runFlow:
          file: sub-uat-tick.yaml
          env:
            WHO: ".*Leg Extension set 3"
      - extendedWaitUntil:
          visible: 'Skip rest|All sets done|Finish workout|In use\. .*Tap to close'
          timeout: 8000
# In use opens a moment after the tick (after any record toast, R-357): wait for it, then close it.
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 'In use\. .*Tap to close'
    commands:
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          notVisible: 'In use\. .*Tap to close'
          timeout: 5000
- scrollUntilVisible:
    element: "Mark .*Leg Extension set 4 complete"
    centerElement: true
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "Mark .*Leg Extension set 4 complete"
    commands:
      - tapOn:
          text: "Skip rest"
          optional: true
      - runFlow:
          file: sub-uat-tick.yaml
          env:
            WHO: ".*Leg Extension set 4"
      - extendedWaitUntil:
          visible: 'Skip rest|All sets done|Finish workout|In use\. .*Tap to close'
          timeout: 8000
# In use opens a moment after the tick (after any record toast, R-357): wait for it, then close it.
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 'In use\. .*Tap to close'
    commands:
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          notVisible: 'In use\. .*Tap to close'
          timeout: 5000
- scrollUntilVisible:
    element: "Mark .*Leg Extension set 5 complete"
    centerElement: true
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: "Mark .*Leg Extension set 5 complete"
    commands:
      - tapOn:
          text: "Skip rest"
          optional: true
      - runFlow:
          file: sub-uat-tick.yaml
          env:
            WHO: ".*Leg Extension set 5"
      - extendedWaitUntil:
          visible: 'Skip rest|All sets done|Finish workout|In use\. .*Tap to close'
          timeout: 8000
# In use opens a moment after the tick (after any record toast, R-357): wait for it, then close it.
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 'In use\. .*Tap to close'
    commands:
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          notVisible: 'In use\. .*Tap to close'
          timeout: 5000
# In use never opens after an exercise's last set (R-299); closed here if it ever does.
- runFlow:
    when:
      visible: 'In use\. .*Tap to close'
    commands:
      - takeScreenshot: rel-r355-02-OBS-in-use-after-last-set
      - tapOn:
          point: "50%,50%"
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          notVisible: 'In use\. .*Tap to close'
          timeout: 5000
- assertVisible: "Skip rest"
- takeScreenshot: rel-r355-03-rest-after-a-last-set
# R-364 interruption: the app goes to the background mid-rest (Home). The shell reads the phone's last
# word to the watch and the rest card AFTER this, so both must still name Lateral Raise, set 1.
- pressKey: Home
- extendedWaitUntil:
    visible: "never shown, a 3 s wait in the background"
    timeout: 3000
    optional: true
- takeScreenshot: rel-r355-03b-app-in-background
