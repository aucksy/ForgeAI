# Part UAT, flow D7 (owner, 10 Nov 2026, privacy audit decision D7, "all as recommended"): the "I'm 18 or
# older, and I agree to MettleUp's terms and privacy notice" box before "Continue with Google", on the
# welcome screen and in Settings -> "Backup and restore" (src/shop/useTermsAgreement.ts, joinTerms.ts).
#  1. Fresh install: the box sits above "Continue with Google", not ticked, with "Terms" and "Privacy notice";
#     no message yet (negative: nothing says "Please tick the box above" before a tap).
#  2. "Continue with Google" without the tick: "Please tick the box above. You need to be 18 or older and agree
#     to the terms and privacy notice." and Google's sign-in does not open (the welcome stays: "Join my gym" is still there).
#  3. Tick: the message goes. Untick + tap again: the message is back (an untick takes the tick back).
#  4. Interruption: ticked, the app killed and opened again: the box is remembered (not shown again).
#  5. "Load demo data instead" starts this phone afresh, so (like "Erase all data") it forgets the tick:
#     Settings -> "Backup and restore" shows the box above "Continue with Google"; a tap without it shows the
#     message; ticked, the page left and opened again: no box. 5b: "Find my Drive backup" (Google's sign-in too)
#     shows the same box and refuses without it; after the tick it shows no box.
#  Not testable in the cloud: Google's own sign-in after the tick (it cannot run here; checked on his phone).
#  Pictures rel-d7-*.png. Runs alone with only=uage, and in the whole uat part. Leaves the app on the tabs.
appId: com.mettleup.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Skip$|Get stronger every week|Load demo data instead"
    timeout: 90000
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Get stronger every week"
    timeout: 90000
# ---------------------------------------------------------------- 1. the box, not ticked, no message
- scrollUntilVisible:
    element: "^Continue with Google$"
    centerElement: true
    timeout: 20000
- assertVisible:
    text: "I'm 18 or older, and I agree to MettleUp's terms and privacy notice"
    checked: false
- assertVisible: "^Terms$"
- assertVisible: "^Privacy notice$"
- assertNotVisible: "Please tick the box above.*"
- takeScreenshot: rel-d7-1-welcome-box
# ---------------------------------------------------------------- 2. Continue without the tick
- tapOn: "^Continue with Google$"
- extendedWaitUntil:
    visible: "^Please tick the box above\\. You need to be 18 or older and agree to the terms and privacy notice\\.$"
    timeout: 10000
- assertVisible: "^Join my gym$"
- assertNotVisible: "Signing in…"
- takeScreenshot: rel-d7-2-welcome-not-ticked
# ---------------------------------------------------------------- 3. tick, untick, tick
- tapOn: "I'm 18 or older.*"
- assertVisible:
    text: "I'm 18 or older.*"
    checked: true
- assertNotVisible: "Please tick the box above.*"
- takeScreenshot: rel-d7-3-welcome-ticked
- tapOn: "I'm 18 or older.*"
- assertVisible:
    text: "I'm 18 or older.*"
    checked: false
- tapOn: "^Continue with Google$"
- extendedWaitUntil:
    visible: "^Please tick the box above\\. You need to be 18 or older and agree to the terms and privacy notice\\.$"
    timeout: 10000
- tapOn: "I'm 18 or older.*"
- assertVisible:
    text: "I'm 18 or older.*"
    checked: true
# ---------------------------------------------------------------- 4. app killed and opened: remembered
- stopApp
- launchApp:
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Skip$|Get stronger every week|Load demo data instead"
    timeout: 90000
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Get stronger every week"
    timeout: 90000
- scrollUntilVisible:
    element: "^Continue with Google$"
    centerElement: true
    timeout: 20000
- assertNotVisible: "I'm 18 or older.*"
- assertNotVisible: "Please tick the box above.*"
- takeScreenshot: rel-d7-4-welcome-remembered
# ---------------------------------------------------------------- 5. Settings, after the demo started the phone afresh
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Backup and restore"
- extendedWaitUntil:
    visible: "^Keep your workouts on MettleUp$"
    timeout: 15000
- scrollUntilVisible:
    element: "^Continue with Google$"
    centerElement: true
    timeout: 20000
- assertVisible:
    text: "I'm 18 or older, and I agree to MettleUp's terms and privacy notice"
    checked: false
- assertNotVisible: "Please tick the box above.*"
- tapOn: "^Continue with Google$"
- extendedWaitUntil:
    visible: "^Please tick the box above\\. You need to be 18 or older and agree to the terms and privacy notice\\.$"
    timeout: 10000
# Google's sign-in did not open: still on the page, the button right above the line (the card's title is
# scrolled off the top on his phone, run 42992878027).
- assertVisible: "^Continue with Google$"
- takeScreenshot: rel-d7-5-settings-not-ticked
# 5b. "Find my Drive backup" opens Google's sign-in too (0.77.0 review): the same box, and no sign-in without it.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Bring back a Google Drive backup$"
- tapOn: "^Bring back a Google Drive backup$"
- extendedWaitUntil:
    visible: "^Find my Drive backup$"
    timeout: 15000
- assertVisible:
    text: "I'm 18 or older, and I agree to MettleUp's terms and privacy notice"
    checked: false
- assertNotVisible: "Please tick the box above.*"
- tapOn: "^Find my Drive backup$"
- extendedWaitUntil:
    visible: "^Please tick the box above\\. You need to be 18 or older and agree to the terms and privacy notice\\.$"
    timeout: 10000
- assertVisible: "^Find my Drive backup$"
- assertNotVisible: "Working…"
- takeScreenshot: rel-d7-5b-drive-not-ticked
- back
- extendedWaitUntil:
    visible: "^Bring back a Google Drive backup$"
    timeout: 15000
- scrollUntilVisible:
    element: "^Continue with Google$"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "I'm 18 or older.*"
- assertVisible:
    text: "I'm 18 or older.*"
    checked: true
- assertNotVisible: "Please tick the box above.*"
- takeScreenshot: rel-d7-6-settings-ticked
- runFlow: sub-back-to-tabs.yaml
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Backup and restore"
- extendedWaitUntil:
    visible: "^Keep your workouts on MettleUp$"
    timeout: 15000
- scrollUntilVisible:
    element: "^Continue with Google$"
    centerElement: true
    timeout: 20000
- assertNotVisible: "I'm 18 or older.*"
- takeScreenshot: rel-d7-7-settings-remembered
# The tick given above also counts for "Find my Drive backup" (one tick per phone).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Bring back a Google Drive backup$"
- tapOn: "^Bring back a Google Drive backup$"
- extendedWaitUntil:
    visible: "^Find my Drive backup$"
    timeout: 15000
- assertNotVisible: "I'm 18 or older.*"
- takeScreenshot: rel-d7-8-drive-remembered
- back
- runFlow: sub-back-to-tabs.yaml
