# UAT WP4b, part UK (M-110), step 4 of 5: the SAME Start link opened again after it was used (a
# replayed or doubled link: its key was spent by the start in step 3). It must not start anything
# by itself: the calm one-tap question "Start <routine>?" with "Not now". "Not now" -> the Workout
# tab with nothing open. -e ROUTINE=<the routine's name, regex-escaped>.
appId: com.mettleup.app
---
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: 'Start ${ROUTINE}\?'
    timeout: 30000
- assertVisible: "^Not now$"
- assertNotVisible: "Log a set to finish|Finish workout"
- takeScreenshot: uk-07-spent-link-asks-first
- tapOn: "^Not now$"
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
# 0.72.0 put "Muscles ready today" between Up next and "Start empty workout", so on the owner
# profile (360 dp, font 1.3) the button sits below the edge of a tab that opens at the top: look
# down first, then up (sub-find), never up only.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Start empty workout"
# R-372 (5 Nov 2026): the owner switched off "Muscles ready today" and Quick workout; neither may show.
- assertNotVisible: ".*Muscles ready today.*"
- assertNotVisible: ".*Every muscle is rested.*"
- assertNotVisible: ".*Quick workout for the time you have.*"
- assertNotVisible: "Resume workout"
- pressKey: Home
