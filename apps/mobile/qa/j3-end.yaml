# Part J3, end: photograph the order after the drag, then discard the workout (the app's own
# "Discard workout?" sheet), so later parts start with no workout open.
appId: com.mettleup.app
---
- takeScreenshot: j3-after-drag
- scrollUntilVisible:
    element: "Discard workout"
# No centerElement: the button is the last thing in the list and cannot reach the middle, so
# Maestro kept scrolling for 20 s with it in plain view (run 41098827956, owner).
    timeout: 20000
- tapOn: "Discard workout"
- extendedWaitUntil:
    visible: 'Discard workout\?'
    timeout: 10000
- tapOn: "^Discard$"
- extendedWaitUntil:
    visible: "Start empty workout|Start routine.*"
    timeout: 30000
