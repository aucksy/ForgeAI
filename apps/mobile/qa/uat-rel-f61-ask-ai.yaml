# Part UAT, F61 "Ask your own AI" (4 Nov 2026). After flow f59 (the demo plus today's own workout),
# at 360 dp and font 1.3. Settings -> Your data -> "Ask an AI about your workouts": the page's words,
# the text of the last 4 weeks (each exercise's best set, the question at the end; no name, phone or
# body weight), then "Share to an AI app" opens Android's share sheet, which is closed again.
appId: com.mettleup.app
---
# Flow f59 used to open the app on the Workout tab before this flow; it is gone (R-372), and flow 9 ends on
# the "Workout complete" screen, so start from the Workout tab here (run 42099510423 failed on that screen).
- launchApp
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 60000
- tapOn:
    text: "^Workout$"
    index: 0
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Ask an AI about your workouts"
- extendedWaitUntil:
    visible: "^Ask an AI$"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Ask an AI$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Get advice on your training from an AI app you already use, like ChatGPT or Gemini\..*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'MettleUp sends nothing\. You choose where the text goes\. Your name, phone number and body weight are left out\.'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Share to an AI app'
- takeScreenshot: rel-f61-01-ask-ai-top
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "The text you will share"
- assertVisible: "(?s)My gym workouts from the last 4 weeks \\(.* to .*\\)\\..*workouts? in 4 weeks, about .* a week\\..*Best set .*"
- assertNotVisible: "(?s).*(body ?weight|\\+91|Demo).*Best set.*"
- takeScreenshot: rel-f61-02-ask-ai-text
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "(?s).*My question: Based on these workouts, what should I change in the next 4 weeks to keep getting stronger\\? Please answer in short, simple steps\\."
- takeScreenshot: rel-f61-03-ask-ai-question
- scrollUntilVisible:
    element: "Share to an AI app"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Share to an AI app"
# Android's share sheet (its own words differ by version): the app is no longer in front.
- extendedWaitUntil:
    notVisible: "^Ask an AI$"
    timeout: 15000
- takeScreenshot: rel-f61-04-share-sheet
- back
# Back on the page, still scrolled to the button: the title can sit above the top edge on the owner phone
# (0.77.0 gate round 5, run 43106093184), so the button proves the app is in front again.
- extendedWaitUntil:
    visible: "Share to an AI app"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Share to an AI app'
- assertNotVisible: "Sharing text"
