# Part UAT, F61 "Ask your own AI" (4 Nov 2026). After flow f59 (the demo plus today's own workout),
# at 360 dp and font 1.3. Settings -> Your data -> "Ask an AI about your workouts": the page's words,
# the text of the last 4 weeks (each exercise's best set, the question at the end; no name, phone or
# body weight), then "Share to an AI app" opens Android's share sheet, which is closed again.
appId: com.mettleup.app
---
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Ask an AI about your workouts"
- extendedWaitUntil:
    visible: "^Ask an AI$"
    timeout: 15000
- assertVisible: "Get advice on your training from an AI app you already use, like ChatGPT or Gemini\\..*"
- assertVisible: "MettleUp sends nothing\\. You choose where the text goes\\. Your name, phone number and body weight are left out\\."
- assertVisible: "Share to an AI app"
- takeScreenshot: rel-f61-01-ask-ai-top
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "The text you will share"
- assertVisible: "(?s)My gym workouts from the last 4 weeks \\(.* to .*\\)\\..*workouts? in 4 weeks, about .* a week\\..*Best set .*"
- assertNotVisible: "(?s).*(body ?weight|\\+91|Demo).*Best set.*"
- takeScreenshot: rel-f61-02-ask-ai-text
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "(?s).*My question: Based on these workouts, what should I change in the next 4 weeks to keep getting stronger\\? Please answer in short, simple steps\\."
- takeScreenshot: rel-f61-03-ask-ai-question
- scrollUntilVisible:
    element: "Share to an AI app"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Share to an AI app"
# Android's share sheet (its own words differ by version): the app is no longer in front.
- extendedWaitUntil:
    notVisible: "^Ask an AI$"
    timeout: 15000
- takeScreenshot: rel-f61-04-share-sheet
- back
- extendedWaitUntil:
    visible: "^Ask an AI$"
    timeout: 15000
