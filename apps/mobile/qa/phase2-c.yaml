# Phase 2 device QA, part C — exercises (runs after parts A and B; demo data is loaded).
# Redesign R5: the Exercise library is Profile → Exercises (its "New exercise" is "Create" top
# right), and the exercise page has 3 tabs (Summary · History · How to; "How to do it" and the
# Easier / Harder versions are on How to). Library with pictures and finer muscles → the moving demo behind a tap → exercise page →
# an empty workout with every new kind of set: a timed plank on the stopwatch, bodyweight
# pull-ups (body weight counts in volume), an assisted pull-up, dumbbells "kg each" with the
# Counting choice, a treadmill run (distance + time) → finish → sets per muscle → new exercise form.
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- takeScreenshot: 20-library
- tapOn: "Search exercises"
- inputText: " front raise"
- hideKeyboard
- takeScreenshot: 21-library-search
# The small picture opens the moving demo; the row itself opens the exercise page.
# R-170: Lateral Raise now plays its approved clip instead of the credited drawings (part CLIP), so
# the drawings' sheet is checked on an exercise with no clip and none planned (not in QUEUE.md).
- tapOn:
    text: "Show how to do Dumbbell Front Raise"
    index: 0
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Drawing: Everkinetic.*"
    timeout: 10000
- takeScreenshot: 22-demo-sheet
- back
# Audit Phase 4 (EX-01): search understands how people type — plurals and the muscle as a word
# ("bicep curls" finds the curls) and no space ("benchpress" finds Barbell Bench Press).
- tapOn: "Search exercises"
- eraseText
- inputText: " bicep curls"
- hideKeyboard
- extendedWaitUntil:
    visible: "View .*Curl"
    timeout: 10000
- assertNotVisible: "No exercises found"
- takeScreenshot: 22b-search-bicep-curls
- tapOn: "Search exercises"
- eraseText
- inputText: " benchpress"
- hideKeyboard
- extendedWaitUntil:
    visible: "View Barbell Bench Press"
    timeout: 10000
- takeScreenshot: 22c-search-benchpress
# A typed name that is not an exercise: "Did you mean Dumbbell Curl?" sits above "Create “…”".
# Both are the list's last rows (under the matches): scroll to the LOWER one, centred. Run
# 38144864717 scrolled to "Did you mean" alone and stopped on a 12-pixel sliver of it at the
# screen's bottom edge (trap 12), so "Create" was still below the screen.
- tapOn: "Search exercises"
- eraseText
- inputText: " dumbell curl"
- hideKeyboard
# Run 39066056700 (owner phone): "Create" is the list's LAST row, so it can't always be centred and
# the plain centred scroll gave up with it on screen. sub-find: centred if it can, else as it is.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Create “dumbell curl”"
- assertVisible:
    text: "Create “dumbell curl”"
    below:
      text: 'Did you mean Dumbbell Curl\?.*'
- takeScreenshot: 22d-search-did-you-mean
- tapOn: "Search exercises"
- eraseText
- inputText: " pull-up"
- hideKeyboard
- tapOn:
    text: "View Pull[- ][Uu]p"
    index: 0
# The page opens on Summary; "How to do it" and the versions are on the How to tab.
- extendedWaitUntil:
    visible: "^How to$"
    timeout: 15000
- tapOn: "^How to$"
- extendedWaitUntil:
    visible: "How to do it"
    timeout: 15000
- takeScreenshot: 23-exercise-page
- assertVisible: "Easier:.*|Harder:.*"
- back
- back
# ---------------------------------------------------------------- empty workout, new set kinds
# Back on Profile: the empty workout starts from the Workout tab (none left open by part B).
- runFlow: sub-workout-fresh.yaml
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
# Plank: TIME column + stopwatch.
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " plank"
- hideKeyboard
# Phase 2 (LW-15): the picker ticks exercises ("Select X"), then one "Add N" adds them.
- tapOn:
    text: "Select Plank"
    index: 0
- assertVisible: "Unselect Plank"
- tapOn: "Add 1"
# LW-27: set controls name their exercise and set ("Start the timer for Plank set 1").
- extendedWaitUntil:
    visible: "Start the timer for .* set 1"
    timeout: 15000
- tapOn: "Start the timer for .* set 1"
- extendedWaitUntil:
    visible: "Start timer"
    timeout: 10000
- tapOn: "Start timer"
- extendedWaitUntil:
    visible: "0:0[3-9] so far"
    timeout: 15000
- takeScreenshot: 24-hold-stopwatch
- tapOn:
    text: "Stop and save .*"
    waitToSettleTimeoutMs: 300
- takeScreenshot: 25-plank-set-saved
- tapOn:
    text: "Skip rest"
    optional: true
# Pull-up: REPS only. (Demo data keeps the seed's name "Pull Up": a name the member or Hevy gave is never
# restyled; only the library's own older spellings take the one style, e.g. "Pull-Up", EX-20.)
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " pull-up"
- hideKeyboard
- tapOn:
    text: "Select Pull[- ][Uu]p"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "More for Pull[- ][Uu]p"
    timeout: 15000
- tapOn:
    text: ".* set 1 reps"
    below:
      text: "More for Pull[- ][Uu]p"
- inputText: " 8"
- hideKeyboard
- tapOn:
    text: "Mark .* set 1 complete"
    below:
      text: "More for Pull[- ][Uu]p"
- tapOn:
    text: "Skip rest"
    optional: true
# Assisted pull-up: ASSIST KG + REPS.
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " assisted pull"
- hideKeyboard
- tapOn:
    text: "Select Assisted Pull-Up.*"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "ASSIST KG"
    timeout: 15000
- tapOn:
    text: ".* set 1 assistance, kilograms"
    below:
      text: "More for Assisted Pull-Up.*"
- inputText: " 20"
- tapOn:
    text: ".* set 1 reps"
    below:
      text: "More for Assisted Pull-Up.*"
- inputText: " 8"
- hideKeyboard
- takeScreenshot: 26-assisted-row
# Dumbbells: "KG EACH" and the Counting choice.
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " dumbbell bench"
- hideKeyboard
- tapOn:
    text: "Select Dumbbell Bench Press.*"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "KG EACH"
    timeout: 15000
- tapOn:
    text: "More for Dumbbell Bench Press.*"
    index: 0
- tapOn: "Counting"
- extendedWaitUntil:
    visible: ".*Past workouts keep theirs.*"
    timeout: 10000
- takeScreenshot: 27-counting-sheet
- tapOn: "Two dumbbells.*"
# Treadmill: KM + TIME.
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " treadmill"
- hideKeyboard
- tapOn:
    text: "Select Treadmill.*"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: ".* set 1 distance, kilometres"
    timeout: 15000
- tapOn:
    text: ".* set 1 distance, kilometres"
    below:
      text: "More for Treadmill.*"
- inputText: " 2.4"
- tapOn:
    text: ".* set 1 time, minutes and seconds"
    below:
      text: "More for Treadmill.*"
- inputText: " 1200"
- hideKeyboard
- takeScreenshot: 28-workout-all-kinds
# Phase 2 (LW-02/-03): Finish opens the "Finish workout?" sheet. The assisted pull-up and the
# run hold numbers but were never ticked: the sheet asks, and "Save them" keeps them (the old
# Finish saved them without asking; this part checks them on the summary).
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- assertVisible: '\d+ sets? ha(s|ve) numbers but .*ticked\.'
- tapOn: "Save them"
- takeScreenshot: 28b-finish-sheet-save-them
# The sheet's own button: the one above its "Keep going" (the screen's button sits behind it).
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# LW-10 / PG-04: a workout without a routine is named by when it started ("Afternoon workout
# done"; the share picture's title is the same name) — never the old placeholder "Full Body".
- assertVisible: '(Morning|Afternoon|Evening|Night) workout done'
- assertNotVisible: "Full Body done"
- takeScreenshot: 29-finish
# LW-21: long lists fold shut under a heading with a count ("4 muscles · see them"): open them.
- scrollUntilVisible:
    element: "Sets per muscle"
    centerElement: true
    timeout: 20000
- tapOn: "Sets per muscle"
- extendedWaitUntil:
    visible: '\d+ muscles? · hide (it|them)'
    timeout: 5000
- takeScreenshot: 30-sets-per-muscle
- scrollUntilVisible:
    element: "^Exercises$"
    centerElement: true
    timeout: 20000
- tapOn: "^Exercises$"
- extendedWaitUntil:
    visible: '\d+ exercises? · hide (it|them)'
    timeout: 5000
- takeScreenshot: 31-finish-exercises
- scrollUntilVisible:
    element: "Done"
    timeout: 20000
- tapOn: "Done"
# ---------------------------------------------------------------- custom exercise form
# Done goes to the Workout tab; the form is Profile → Exercises → "Create" (was "New exercise").
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Create an exercise"
- extendedWaitUntil:
    visible: "How you log it"
    timeout: 15000
- tapOn: "Exercise name"
- inputText: " Wall Plank Hold"
- hideKeyboard
- tapOn: "^Time$"
# Owner profile (360 dp, font 1.3): the muscle and gear chips run past the screen's edge.
- scrollUntilVisible:
    element: "^Abs$"
    centerElement: true
    timeout: 15000
- tapOn: "^Abs$"
- scrollUntilVisible:
    element: "^Bodyweight$"
    centerElement: true
    timeout: 15000
- tapOn: "^Bodyweight$"
- takeScreenshot: 32-new-exercise-form
- scrollUntilVisible:
    element: "Save exercise"
    timeout: 15000
- takeScreenshot: 33-new-exercise-photo
- tapOn: "Save exercise"
- extendedWaitUntil:
    visible: "Wall Plank Hold"
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "No sets logged yet"
- takeScreenshot: 34-custom-exercise-page
