# Phase 2 device QA, part C — exercises (runs after parts A and B; demo data is loaded).
# Library with pictures and finer muscles → the moving demo behind a tap → exercise page →
# an empty workout with every new kind of set: a timed plank on the stopwatch, bodyweight
# pull-ups (body weight counts in volume), an assisted pull-up, dumbbells "kg each" with the
# Counting choice, a treadmill run (distance + time) → finish → sets per muscle → new exercise form.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 60000
- tapOn: "^Workout$"
- extendedWaitUntil:
    visible: "Exercise library"
    timeout: 30000
- tapOn: "Exercise library"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- takeScreenshot: 20-library
- tapOn: "Search exercises"
- inputText: " lateral raise"
- hideKeyboard
- takeScreenshot: 21-library-search
# The small picture opens the moving demo; the row itself opens the exercise page.
- tapOn:
    text: "Show how to do .*Lateral Raise.*"
    index: 0
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Drawing: Everkinetic.*"
    timeout: 10000
- takeScreenshot: 22-demo-sheet
- back
# Audit Phase 4 (EX-01): search understands how people type — plurals and the muscle as a word
# ("bicep curls" finds the curls) and no space ("benchpress" finds Barbell Bench Press).
- tapOn: "Search exercises"
- eraseText
- inputText: " bicep curls"
- hideKeyboard
- extendedWaitUntil:
    visible: "View .*Curl"
    timeout: 10000
- assertNotVisible: "No exercises found"
- takeScreenshot: 22b-search-bicep-curls
- tapOn: "Search exercises"
- eraseText
- inputText: " benchpress"
- hideKeyboard
- extendedWaitUntil:
    visible: "View Barbell Bench Press"
    timeout: 10000
- takeScreenshot: 22c-search-benchpress
# A typed name that is not an exercise: "Did you mean Dumbbell Curl?" sits above "Create “…”".
- tapOn: "Search exercises"
- eraseText
- inputText: " dumbell curl"
- hideKeyboard
- scrollUntilVisible:
    element: 'Did you mean Dumbbell Curl\?.*'
    timeout: 20000
- assertVisible:
    text: "Create “dumbell curl”"
    below:
      text: 'Did you mean Dumbbell Curl\?.*'
- takeScreenshot: 22d-search-did-you-mean
- tapOn: "Search exercises"
- eraseText
- inputText: " pull-up"
- hideKeyboard
- tapOn:
    text: "View Pull[- ][Uu]p"
    index: 0
- extendedWaitUntil:
    visible: "How to do it"
    timeout: 15000
- takeScreenshot: 23-exercise-page
- assertVisible: "Easier:.*|Harder:.*"
- back
- back
# ---------------------------------------------------------------- empty workout, new set kinds
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 20000
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
# Plank: TIME column + stopwatch.
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " plank"
- hideKeyboard
# Phase 2 (LW-15): the picker ticks exercises ("Select X"), then one "Add N" adds them.
- tapOn:
    text: "Select Plank"
    index: 0
- assertVisible: "Unselect Plank"
- tapOn: "Add 1"
# LW-27: set controls name their exercise and set ("Start the timer for Plank set 1").
- extendedWaitUntil:
    visible: "Start the timer for .* set 1"
    timeout: 15000
- tapOn: "Start the timer for .* set 1"
- extendedWaitUntil:
    visible: "Start timer"
    timeout: 10000
- tapOn: "Start timer"
- extendedWaitUntil:
    visible: "0:0[3-9] so far"
    timeout: 15000
- takeScreenshot: 24-hold-stopwatch
- tapOn:
    text: "Stop and save .*"
    waitToSettleTimeoutMs: 300
- takeScreenshot: 25-plank-set-saved
- tapOn:
    text: "Skip rest"
    optional: true
# Pull-up: REPS only. (Demo data keeps the seed's name "Pull Up": a name the member or Hevy gave is never
# restyled; only the library's own older spellings take the one style, e.g. "Pull-Up", EX-20.)
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " pull-up"
- hideKeyboard
- tapOn:
    text: "Select Pull[- ][Uu]p"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "More for Pull[- ][Uu]p"
    timeout: 15000
- tapOn:
    text: ".* set 1 reps"
    below:
      text: "More for Pull[- ][Uu]p"
- inputText: " 8"
- hideKeyboard
- tapOn:
    text: "Mark .* set 1 complete"
    below:
      text: "More for Pull[- ][Uu]p"
- tapOn:
    text: "Skip rest"
    optional: true
# Assisted pull-up: ASSIST KG + REPS.
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " assisted pull"
- hideKeyboard
- tapOn:
    text: "Select Assisted Pull-Up.*"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "ASSIST KG"
    timeout: 15000
- tapOn:
    text: ".* set 1 assistance, kilograms"
    below:
      text: "More for Assisted Pull-Up.*"
- inputText: " 20"
- tapOn:
    text: ".* set 1 reps"
    below:
      text: "More for Assisted Pull-Up.*"
- inputText: " 8"
- hideKeyboard
- takeScreenshot: 26-assisted-row
# Dumbbells: "KG EACH" and the Counting choice.
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " dumbbell bench"
- hideKeyboard
- tapOn:
    text: "Select Dumbbell Bench Press.*"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "KG EACH"
    timeout: 15000
- tapOn:
    text: "More for Dumbbell Bench Press.*"
    index: 0
- tapOn: "Counting"
- extendedWaitUntil:
    visible: ".*Past workouts keep theirs.*"
    timeout: 10000
- takeScreenshot: 27-counting-sheet
- tapOn: "Two dumbbells.*"
# Treadmill: KM + TIME.
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " treadmill"
- hideKeyboard
- tapOn:
    text: "Select Treadmill.*"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: ".* set 1 distance, kilometres"
    timeout: 15000
- tapOn:
    text: ".* set 1 distance, kilometres"
    below:
      text: "More for Treadmill.*"
- inputText: " 2.4"
- tapOn:
    text: ".* set 1 time, minutes and seconds"
    below:
      text: "More for Treadmill.*"
- inputText: " 1200"
- hideKeyboard
- takeScreenshot: 28-workout-all-kinds
# Phase 2 (LW-02/-03): Finish opens the "Finish workout?" sheet. The assisted pull-up and the
# run hold numbers but were never ticked: the sheet asks, and "Save them" keeps them (the old
# Finish saved them without asking; this part checks them on the summary).
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- assertVisible: '\d+ sets? ha(s|ve) numbers but .*ticked\.'
- tapOn: "Save them"
- takeScreenshot: 28b-finish-sheet-save-them
# The sheet's own button: the one above its "Keep going" (the screen's button sits behind it).
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
- takeScreenshot: 29-finish
# LW-21: long lists fold shut under a heading with a count ("4 muscles · see them"): open them.
- scrollUntilVisible:
    element: "Sets per muscle"
    centerElement: true
    timeout: 20000
- tapOn: "Sets per muscle"
- extendedWaitUntil:
    visible: '\d+ muscles? · hide (it|them)'
    timeout: 5000
- takeScreenshot: 30-sets-per-muscle
- scrollUntilVisible:
    element: "^Exercises$"
    centerElement: true
    timeout: 20000
- tapOn: "^Exercises$"
- extendedWaitUntil:
    visible: '\d+ exercises? · hide (it|them)'
    timeout: 5000
- takeScreenshot: 31-finish-exercises
- scrollUntilVisible:
    element: "Done"
    timeout: 20000
- tapOn: "Done"
# ---------------------------------------------------------------- custom exercise form
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- tapOn: "^Workout$"
- tapOn: "Exercise library"
- tapOn: "New exercise"
- extendedWaitUntil:
    visible: "How you log it"
    timeout: 15000
- tapOn: "Exercise name"
- inputText: " Wall Plank Hold"
- hideKeyboard
- tapOn: "^Time$"
- tapOn: "^Abs$"
- tapOn: "^Bodyweight$"
- takeScreenshot: 32-new-exercise-form
- scrollUntilVisible:
    element: "Save exercise"
    timeout: 15000
- takeScreenshot: 33-new-exercise-photo
- tapOn: "Save exercise"
- extendedWaitUntil:
    visible: "No sets logged yet"
    timeout: 15000
- assertVisible: "Wall Plank Hold"
- takeScreenshot: 34-custom-exercise-page
