# Sub-flow of part UD (uat-d.yaml): from Settings -> Bring in from Hevy or Strong, import qa-hevy.csv (12 workouts,
# pushed to Downloads by the script) with REPLACE over the member's ONE own workout. The option and
# the question name it ("Delete all 1 of your workout", "Delete 1 workout first?", "1 of them is only
# in ForgeAI"); the result is "12 workouts imported". Leaves the app on the result page.
appId: com.mettleup.app
---
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Import from Hevy"
- tapOn: "Import from Hevy"
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 15000
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-hevy\\.csv"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy\\.csv"
- extendedWaitUntil:
    visible: "^Date range$"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Replace$"
- tapOn: "^Replace$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: 'Delete all 1 of your workout in MettleUp, then import\. You can undo right after\.'
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Replace with 12 workouts$"
- takeScreenshot: ud-06a-replace-chosen
- tapOn: "^Replace with 12 workouts$"
- extendedWaitUntil:
    visible: 'Delete 1 workout first\?'
    timeout: 15000
- assertVisible: '1 of them is only in MettleUp, not in this file\. A copy is kept while you stay on this screen, so you can undo\.'
- takeScreenshot: ud-06b-delete-first-question
- tapOn:
    text: "^Replace$"
    below:
      text: 'Delete 1 workout first\?'
- extendedWaitUntil:
    visible: "^12 workouts imported$"
    timeout: 120000
- takeScreenshot: ud-06c-replaced
