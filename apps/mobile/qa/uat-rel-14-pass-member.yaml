# Part UAT, flow 14 (gym, after flow 12): F123 pass members (FITPASS, cultpass), 4-5 Nov 2026.
# run-device-qa.sh has just made "Uma Desk" a FITPASS pass member on the fresh "QA UAT Gym" (qa/uat_gym.py
# make-pass: passCompany FITPASS from today, her paid plan cancelled), as the admin app's member form saves it.
# Until supabase 0055 is live (NOT applied yet) the server cannot say "pass member", so make-pass also gives her
# a running plan named "QA pass stand-in: FITPASS": the old server then lets her check-in through, as 0055 does,
# and this QA build (qa-device.yml: extra.qaStandIns has passMember) reads that plan as the pass and says so on
# screen ("Test build: a stand-in pass ..."). Store builds never do. With 0055 live the server's answer wins and
# the note is gone; every other word is the same either way.
# The words BEFORE 0055 on a store build ("Please see the desk", "No plan yet") were photographed in qa-device
# run 41890370772 (rel-140/141-pass-card-before-0055).
# The desk's side (Add member as a pass member, Pass visit, the monthly count) is the admin panel's e2e
# (apps/dashboard/e2e/pass.spec.mjs). CODE and GYM are passed by run-device-qa.sh (-e); no `env:` default.
appId: com.mettleup.app
---
- openLink: "forgeai://c/${CODE}"
- extendedWaitUntil:
    visible: "^Check in at ${GYM}$"
    timeout: 45000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Check in$'
- tapOn: "^Check in$"
# The gym's day is India's: when the chain crosses midnight IST (18:30 UTC) after flow 7's check-in, this is a NEW
# day's check-in (runs 43743131861 / 43743134223, 15 Nov 2026). Either way she is let in.
# No apostrophe and no {n} counts here: a text with ${...} is run as JavaScript; "You're" broke it ("Missing close
# quote", run 43748701031) and so did [0-9]{1,2} ("Expected eof but found }", run 43753637769).
- extendedWaitUntil:
    visible: '^(You were already checked in at ${GYM} today\. Nothing more to do\.|You.re checked in at [0-9][0-9]?:[0-9][0-9] [ap]m)$'
    timeout: 30000
# A pass member is covered: the check-in never sends her to the desk.
- assertNotVisible: '.*Please see the desk.*'
- takeScreenshot: rel-140-pass-checkin
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Done$"
- tapOn: "^Done$"
- tapOn:
    text: "^Gym$"
    index: 0
    optional: true
# "My membership": the pass, no plan to renew.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^FITPASS member$"
- assertVisible: '^You train at ${GYM} with FITPASS\. There is no plan to renew\.$'
- assertVisible: '^Scan the gym''s check-in QR when you arrive\. The gym counts it as a FITPASS visit\.$'
- assertVisible: '^[0-9]+ days? at the gym this month\.$'
- assertNotVisible: "^Renew my plan$"
- assertNotVisible: "^Pause my plan$"
- assertNotVisible: ".*Your plan has ended.*"
- assertNotVisible: ".*QA pass stand-in.*"
# Until 0055 is live: this QA build's stand-in, said on screen.
- runFlow:
    when:
      visible: "^Test build: a stand-in pass.*"
    commands:
      # in-view: this runs only when the line is already on screen (the when: above)
      - assertVisible: '^Test build: a stand-in pass, because your gym''s server does not have this yet\.$'
- takeScreenshot: rel-141-pass-card
# The rest of the Gym tab stays open to a pass member (nothing there needs a plan): Bring a friend is near the end.
- scrollUntilVisible:
    element:
      text: "^Invite a friend$"
    direction: DOWN
    timeout: 20000
- takeScreenshot: rel-142-pass-gym-tab-below
# 5 Nov 2026: a pass member has no plan, so the card never offers "free days to your plan".
- assertNotVisible: '.*free days? to your plan.*'
# R-505 (owner, 14 Nov 2026): the old "Ask about your workout" (0053) is only for members on a running paid gym plan,
# and since R-549 it has no row of its own. R-586 (0096 live, 15 Nov 2026): on "Message your gym" ANY member may pick
# a trainer by name (the owner asked that members can pick "any" trainer), so the pass member sees "Who should read
# it?" with Tara (Vikram was unticked by flow r586a/b). NEGATIVE checks: no old row, no "Who is it for?" / "A trainer".
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Check in$"
- scrollUntilVisible:
    element:
      text: "^Ask about your workout$"
    direction: DOWN
    timeout: 15000
    optional: true
- assertNotVisible: "^Ask about your workout$"
- assertNotVisible: ".*Your trainer or the gym owner replies here.*"
- assertNotVisible: ".*is for members with a running plan.*"
- takeScreenshot: rel-143-pass-no-ask-trainer
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Message your gym$"
# The pass member's row: the gym's own line (the row's trainer side is the old 0053 plan rule).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Ask a question, share feedback or make a complaint$'
- tapOn: "^Message your gym$"
# in-view: the page just opened at its top; the hint sits under the Question chip
- extendedWaitUntil:
    visible:
      id: "talk-kind-hint-ready"
    timeout: 30000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Ask about timings, fees, your workout and more\.$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Who should read it\?$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Tara Singh( \(your trainer\))?$'
# in-view: the chips just checked; Vikram was unticked (flow r586b)
- assertNotVisible: '^Vikram Rao$'
# in-view: the page just opened at its top, where the old choice was
- assertNotVisible: "^A trainer$"
# in-view: the same place
- assertNotVisible: '^Who is it for\?$'
# in-view: the same card
- assertNotVisible: ".*For workout help.*"
# in-view: the same card; the gym side's own first line, not the two-side one
- assertNotVisible: '^Write to your gym, or ask a trainer about your workout\..*'
- takeScreenshot: rel-144-pass-message-no-ask-hint
- back
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
