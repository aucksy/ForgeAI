# Sub-flow (called with runFlow; not a part of its own): the Workout tab with NO workout open, its
# "Start empty workout" centred on screen. A part that starts a workout calls this first, so a
# part that failed earlier with its workout still open (run 38144864717: part E's left F, G and H1
# with "Workout in progress" and no "Start empty workout" — the tab hides it while one is open)
# costs only itself. The open workout is thrown away the member's way: the Workout tab's red
# "Discard workout" link → the app's own sheet "Discard workout?" → its "Discard" button.
#   - runFlow: sub-workout-fresh.yaml
# Call it with the tab bar on screen. The tab keeps its scroll position, so it looks UP.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
- tapOn:
    text: "^Workout$"
    index: 0
- scrollUntilVisible:
    element: "Start empty workout|Resume workout"
    direction: UP
    centerElement: true
    timeout: 30000
- runFlow:
    when:
      visible: "Resume workout"
    commands:
      - scrollUntilVisible:
          element: "^Discard workout$"
          centerElement: true
          timeout: 15000
      - tapOn: "^Discard workout$"
      - extendedWaitUntil:
          visible: 'Discard workout\?'
          timeout: 10000
      # The sheet's own button (the link behind it says "Discard workout").
      - tapOn: "^Discard$"
- scrollUntilVisible:
    element: "Start empty workout"
    direction: UP
    centerElement: true
    timeout: 30000
- assertNotVisible: "Resume workout"
