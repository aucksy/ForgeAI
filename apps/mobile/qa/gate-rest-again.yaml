# Audit v2 gate part LONGREST, second rest: the open workout (gate-rest.yaml started it; the
# phone was just woken), the first exercise's rest changed to REST (e.g. "Rest 0:30"), set 2
# ticked: a second rest runs, so its "Rest is over" comes within ~2 minutes of the first one
# (Android 15+ notification cooldown). Called with: maestro test -e REST="Rest 0:30" gate-rest-again.yaml
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- tapOn:
    text: "More for .*"
    index: 0
- tapOn: "Rest timer"
- tapOn: "${REST}"
- tapOn:
    text: 'Mark .* set 2 complete'
    index: 0
- assertVisible: "Skip rest"
- takeScreenshot: gate-second-rest-running
