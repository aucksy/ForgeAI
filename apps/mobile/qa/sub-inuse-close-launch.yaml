# After the app is brought back (launchApp) with a set ticked from the notification while it was
# away: that rest started while the workout screen was loaded, so In use opens on return (R-70).
# Same as sub-inuse-close.yaml, but waits up to 6 s, as the app may still be coming to the front.
appId: com.mettleup.app
---
# R-357: In use waits for a set's pop-up to go first.
- runFlow: sub-popup-gone.yaml
- extendedWaitUntil:
    visible: '.*[Ii]n use\. .*Back in .*'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: '.*[Ii]n use\. .*Back in .*'
    commands:
      - back
      - extendedWaitUntil:
          notVisible: '.*[Ii]n use\. .*Back in .*'
          timeout: 5000
