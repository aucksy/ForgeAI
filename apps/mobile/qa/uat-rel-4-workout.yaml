# Part UAT, flow 4 of 5: the workout flow 3 left open (Machine Day, Weight step Large). Checked as the
# member sees it:
#  - R-304/R-307/R-311 "In use": opens by itself after a NON-last set on a barbell lift and on a
#    machine; never after an exercise's LAST set; a dumbbell move off a bench (Lateral Raise) does not
#    open it, and its rest clock says "Tap: In use" (R-299) and opens it by hand.
#  - R-346: the In use screen shows the watch's rest lines, "Previous ..." and "Next ..." (its spoken label).
#  - R-308: Stay keeps the Pec Deck at 40 kg (the card goes); Try takes the Leg Extension to 40 kg
#    with the reason line "Stuck at 45 kg, so a small step back to 40 kg."
#  - R-310 (owner: "suggesting 38 kg ... this machine only has 5 kg increments"): Pec Deck set 1 at
#    40 kg x 7, RPE 10 (goal 10): the next set says "Set 1 was very hard, so try 35 kg." Never 38.
#  - R-298: a rest that runs out leaves no red "+0:30 over" row: the bar goes.
#  - R-300: a short set gives no "add a set" line.
appId: com.mettleup.app
---
# ---------------------------------------------------------------- bench (barbell): In use by itself
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Bench Press set 1"
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- assertVisible: 'In use\. (Previous .+\. )?Next .+\. Back in .*'
- takeScreenshot: rel-30-in-use-bench-set-1
- runFlow: sub-uat-rest-clear.yaml
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Bench Press set 2"
- runFlow: sub-uat-rest-clear.yaml
# The bench's LAST set: the rest starts, In use stays closed (the member leaves that bench anyway).
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Bench Press set 3"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 8000
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 3000
    optional: true
- assertNotVisible: 'In use\. .*Tap to close'
- takeScreenshot: rel-31-bench-last-set-no-in-use
- runFlow: sub-uat-rest-clear.yaml
# ---------------------------------------------------------------- Pec Deck: Stay, then very hard
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Stay at 40 kg$"
- tapOn: "^Stay at 40 kg$"
- extendedWaitUntil:
    notVisible: 'Stuck at 40 kg for 4 workouts\..*'
    timeout: 10000
- assertNotVisible: "^Try 35 kg$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Target 40 kg · .*'
- takeScreenshot: rel-32-pec-deck-after-stay
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Pec Deck Fly set 1 weight, kilograms"
      VALUE: " 40"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Pec Deck Fly set 1 reps"
      VALUE: " 7"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Add RPE for .*Pec Deck Fly set 1"
- tapOn:
    text: "Add RPE for .*Pec Deck Fly set 1"
    index: 0
- extendedWaitUntil:
    visible: "How hard was it\\? \\(RPE\\)"
    timeout: 10000
- tapOn: "RPE 10: .*"
- extendedWaitUntil:
    notVisible: "How hard was it\\? \\(RPE\\)"
    timeout: 10000
# The RPE tap ticks the set: a machine with sets still open -> In use by itself, with the beat line.
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- assertVisible: 'In use\. (Previous .+\. )?Next .+\. Back in .*'
- takeScreenshot: rel-33-in-use-pec-deck-beat-line
- runFlow: sub-uat-rest-clear.yaml
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Set 1 was very hard, so try 35 kg\.$'
- assertNotVisible: '.*\b38 kg.*'
- assertNotVisible: '^38$'
- assertNotVisible: '(?i).*add a set.*'
# R-324 (4 Nov 2026): the live line asks for what the box shows after a very hard set (× 10), never × 12.
# R-335 (98ff8e0e): the live line now reads "Next set: 35 kg × 10 · Done: ...".
- assertVisible: '^Next set: 35 kg × 10 · .*'
- assertNotVisible: '.*35 kg × 12.*'
- takeScreenshot: rel-34-pec-deck-very-hard-35-not-38
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Pec Deck Fly set 2"
- runFlow: sub-uat-rest-clear.yaml
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Pec Deck Fly set 3"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 8000
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 3000
    optional: true
- assertNotVisible: 'In use\. .*Tap to close'
- takeScreenshot: rel-35-pec-deck-last-set-no-in-use
- runFlow: sub-uat-rest-clear.yaml
# ---------------------------------------------------------------- Leg Extension: Try 40 kg
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Try 40 kg$"
- tapOn: "^Try 40 kg$"
- extendedWaitUntil:
    notVisible: 'Stuck at 45 kg for 4 workouts\..*'
    timeout: 10000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Stuck at 45 kg, so a small step back to 40 kg\.$'
- takeScreenshot: rel-36-leg-extension-after-try
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Leg Extension set 1"
- runFlow: sub-uat-rest-clear.yaml
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Leg Extension set 2"
- runFlow: sub-uat-rest-clear.yaml
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Leg Extension set 3"
- runFlow: sub-uat-rest-clear.yaml
- takeScreenshot: rel-37-leg-extension-done
# ---------------------------------------------------------------- Lateral Raise: "Tap: In use"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "More for .*Lateral Raise.*"
- tapOn:
    text: "More for .*Lateral Raise.*"
    index: 0
- tapOn: "Rest timer"
- tapOn: "Rest 0:30"
- extendedWaitUntil:
    notVisible: 'For .*Remembered for next time\.'
    timeout: 10000
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Lateral Raise set 1"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 8000
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 3000
    optional: true
- assertNotVisible: 'In use\. .*Tap to close'
- assertVisible: "^Tap to show In use$"
- takeScreenshot: rel-38-lateral-raise-tap-in-use
# The clock opens it by hand.
- tapOn:
    text: 'Rest, \d+ seconds left\. Show machine in use'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'In use\. .*Tap to close'
    timeout: 8000
- takeScreenshot: rel-39-in-use-by-hand
- back
- extendedWaitUntil:
    notVisible: 'In use\. .*Tap to close'
    timeout: 5000
# Let the 0:30 rest run out: the bar goes, no "+0:30 over" row (R-298).
- extendedWaitUntil:
    notVisible: "Skip rest"
    timeout: 75000
- assertNotVisible: '.*\d:\d\d over.*'
- assertNotVisible: "^Tap to show In use$"
- takeScreenshot: rel-40-rest-ran-out-no-over-row
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: ".*Lateral Raise set 2"
- runFlow: sub-uat-rest-clear.yaml
- assertNotVisible: '(?i).*add a set.*'
- takeScreenshot: rel-41-all-sets-done
