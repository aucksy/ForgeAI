# Copied for the phone-conditions run (UAT WP7, run-conditions.sh) from sub-workout-fresh.yaml, so a change to the
# phone test parts never moves these flows. Same behaviour.
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
- tapOn:
    text: "^Workout$"
    index: 0
- scrollUntilVisible:
    element: "Start empty workout|Resume workout"
    direction: UP
    centerElement: true
    timeout: 15000
    optional: true
# 0.78.0 round (15 Nov 2026), as sub-workout-fresh.yaml since 4 Nov: cards above "Up next" (the "New in this
# version" card after an update) can push the button below the edge.
- runFlow:
    when:
      notVisible: "Start empty workout|Resume workout"
    commands:
      - scrollUntilVisible:
          element: "Start empty workout|Resume workout"
          centerElement: true
          timeout: 20000
- runFlow:
    when:
      visible: "Resume workout"
    commands:
      - scrollUntilVisible:
          element: "^Discard workout$"
          centerElement: true
          timeout: 15000
      - tapOn: "^Discard workout$"
      - extendedWaitUntil:
          visible: 'Discard workout\?'
          timeout: 10000
      # The sheet's own button (the link behind it says "Discard workout").
      - tapOn: "^Discard$"
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "Start empty workout"
# in-view: the tab hides this button while a workout is open; it never shows next to "Start empty workout"
- assertNotVisible: "Resume workout"
