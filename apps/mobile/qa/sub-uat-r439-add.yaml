# Sub-flow (called with runFlow; not a part of its own): R-439 / R-436 UAT. Add the exercise EX (found
# by typing SEARCH) to the open workout, below the cards already there (tapOn never scrolls, trap 9).
# No `env:` default here (trap 22).
appId: com.mettleup.app
---
- scrollUntilVisible:
    element:
      text: "Add exercise"
    timeout: 20000
- tapOn: "Add exercise"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " ${SEARCH}"
- tapOn:
    text: "Select ${EX}"
    index: 0
# R-602 (16 Nov 2026, run 43796624722 part uatr454a): the keyboard stays open after the tick and
# covers "Add 1"; the tap hit the suggestion strip ("press" became "pressure") and nothing was added.
# Close it first, as uat-d.yaml does (the keyboard is open here, so Back only closes it, trap 20).
- hideKeyboard
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "More for ${EX}"
    timeout: 20000
