# Sub-flow (called with runFlow; not a part of its own): type VALUE into the box FIELD (a regex for its
# spoken label, e.g. "Barbell Bench Press set 1 weight, kilograms"), then close the keyboard.
#   - runFlow:
#       file: sub-type.yaml
#       env:
#         FIELD: "Barbell Bench Press set 1 reps"
#         VALUE: " 8"
# The box is centred first (owner profile: a set row can sit under the keyboard or below the edge);
# what was in it is erased; VALUE starts with a space (trap 5: the emulator drops the first key).
# The keyboard is closed right after typing, while it is surely open (trap 20: hideKeyboard is
# Back, and a Back with no keyboard would leave the editor). No `env:` default here (trap 22).
appId: com.mettleup.app
---
- scrollUntilVisible:
    element: "${FIELD}"
    centerElement: true
    timeout: 15000
- tapOn: "${FIELD}"
- eraseText
- inputText: "${VALUE}"
- hideKeyboard
