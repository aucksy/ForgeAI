# Sub-flow (called with runFlow; not a part of its own). Release A (A5) put Charts, Exercises, Records and
# Body on a Progress tab; F199 (owner R-403, 8 Nov 2026) moved them into the Profile tab, under the chart and
# the Today line, as "Your progress" (src/app/(tabs)/profile.tsx). Opens the Profile tab and taps the row:
#   - runFlow:
#       file: sub-progress-row.yaml
#       env:
#         ROW: "Charts"
# ROW is the row's title: "Charts", "Exercises", "Records" or "Body". The row is found by its test id
# (progress-row-<ROW>): the Profile header's "Records" number has the same word. Call it with the tab bar
# on screen. The tab is tapped with index 0: the top-most match (trap 18). The tab keeps its scroll
# position (at 200 % text a row can sit above or below the screen's edge): look UP first, then down,
# and centre the row so it is clear of the "Demo data · Remove" bar. No `env:` default (trap 22).
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 30000
- tapOn:
    text: "^Profile$"
    index: 0
- scrollUntilVisible:
    element:
      id: "progress-row-${ROW}"
    direction: UP
    centerElement: true
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "progress-row-${ROW}"
    commands:
      - scrollUntilVisible:
          element:
            id: "progress-row-${ROW}"
          centerElement: true
          timeout: 20000
- tapOn:
    id: "progress-row-${ROW}"
