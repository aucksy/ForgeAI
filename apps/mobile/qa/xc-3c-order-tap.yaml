# Phone conditions (UAT WP7), condition 3c: on a link with a 2 s delay, PRODUCT into the bag and
# "Place order" tapped; the flow ends straight after the tap. The script switches airplane mode on a
# few seconds later, aiming at the moment the gym has written the order but its answer is still on
# the way back (the "lost answer" case); xc-3c-outcome.yaml then reads what the screen says.
appId: com.forgeai.app
---
- runFlow: xc-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 90000
- runFlow:
    file: xc-sub-to-bag.yaml
    env:
      PRODUCT: "${PRODUCT}"
- tapOn:
    text: "^Place order$"
    waitToSettleTimeoutMs: 100
    retryTapIfNoChange: false
