# v0.37.1 device QA, part H3A (audit C1: "Complete set" with ForgeAI closed). Runs after part H2,
# which left its workout open with Barbell Bench Press's sets 1-3 ticked, its LAST set (4 of 4)
# still to do, and a 0:30 rest on the exercise (run 38390826292: the live card read "Set 4 of 4";
# adding a set made it "4 of 5"). Here: the app goes to the background on that set. The script then STOPS the app's process
# (Android closed it) and checks the live card is up with "Complete set" (part H3B taps it).
appId: com.mettleup.app
---
- launchApp:
    stopApp: false
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "More for Barbell Bench Press|Resume workout|^Workout$"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: "More for Barbell Bench Press"
    commands:
      - tapOn:
          text: "^Workout$"
          optional: true
      - extendedWaitUntil:
          visible: "Resume workout"
          timeout: 20000
      - tapOn: "Resume workout"
- extendedWaitUntil:
    visible: "More for Barbell Bench Press"
    timeout: 20000
- scrollUntilVisible:
    element: 'Mark Barbell Bench Press set 4 complete'
    centerElement: true
    timeout: 10000
- takeScreenshot: h3a-set-4-to-do
- pressKey: Home
