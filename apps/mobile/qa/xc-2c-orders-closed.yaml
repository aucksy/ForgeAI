# Phone conditions (UAT WP7), condition 2c (online): the owner marked every order collected (the
# script, on the server). My orders on the phone catches up: no order is "Ordered" any more.
appId: com.mettleup.app
---
- runFlow: xc-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "^My orders.*"
- tapOn: "^My orders.*"
- extendedWaitUntil:
    visible: "^My orders$"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "^Ordered$"
    timeout: 60000
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: "^Collected$"
- takeScreenshot: xc2c-03-orders-collected
