# Part UAT, R-482 flow a (owner, 13 Nov 2026: "build all 5"): tip 1, the happy path, with Undo.
# A fresh install restores qa-r482-ppl.zip (qa/tools/make_r482_backups.py): "QA Tips" = Push, Pull, Legs, no calf
# exercise in any routine, every routine done, the first 20 days ago, the last two Push and Pull: Up next is Legs.
#   1. Up next: Legs shows "None of your routines trains your calves. Add 3 sets of Standing Calf Raise to your Legs
#      routine?" with Add, Not now and "I skip this on purpose"; never the old "Easy add" words; no Swap on tip 1.
#   1b. R-492: "Smart suggestion" on top; its (i) opens "Why we suggest this": the 3 routines counted, "Calves: 0 sets
#      a week", why, "Nothing changes unless you tap Add ...", where to turn tips off; Back closes it.
#   2. Add -> "Standing Calf Raise added to your Legs routine." with Undo -> Undo: Legs is back to its 5 exercises
#      (See exercises: no Standing Calf Raise) and the tip is back.
#   3. Add again, the Undo bar left to go: no tip; See exercises: Standing Calf Raise last, 3 sets, 6 exercises.
#   4. The app restarted: still Up next: Legs, no tip (the calves are trained now; no swap tip the same week).
# Pictures rel-r482-a*.png.
appId: com.mettleup.app
---
- runFlow:
    file: sub-uat-r482-restore.yaml
    env:
      FILE: 'qa-r482-ppl\.zip'
      NEXT: 'Legs'
# ---------------------------------------------------------------- 1. the tip on Legs
- extendedWaitUntil:
    visible: 'None of your routines trains your calves\. Add 3 sets of Standing Calf Raise to your Legs routine\?'
    timeout: 20000
    optional: true
- runFlow:
    file: sub-find.yaml
    env:
      FIND: 'None of your routines trains your calves\. Add 3 sets of Standing Calf Raise to your Legs routine\?'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Add$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Not now.*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'I skip this on purpose.*'
- assertNotVisible: '(?i).*easy add.*'
- assertNotVisible: '^Swap$'
- takeScreenshot: rel-r482-a1-tip-calves
# ---------------------------------------------------------------- R-492: "Smart suggestion" and its (i)
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Smart suggestion.*'
- tapOn:
    text: 'Smart suggestion.*'
    waitToSettleTimeoutMs: 300
# in-view: the sheet's title, pinned at its top, just opened
- extendedWaitUntil:
    visible: '^Why we suggest this$'
    timeout: 6000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'We added up the sets planned in your 3 routines: Push, Pull and Legs\. Each one is done once a week\.'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Calves: 0 sets a week'
- takeScreenshot: rel-r482-a1b-why-calves
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'None of your exercises mainly works your calves\. A few sets a week give them direct work of their own\.'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Nothing changes unless you tap Add\. Add puts 3 sets of Standing Calf Raise at the end of your Legs routine\. You can undo it right after\.'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'You can turn these suggestions off in Settings.*Muscle tips.*'
- takeScreenshot: rel-r482-a1c-why-calves-end
- back
- extendedWaitUntil:
    notVisible: '^Why we suggest this$'
    timeout: 6000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: 'None of your routines trains your calves\. Add 3 sets of Standing Calf Raise to your Legs routine\?'
# ---------------------------------------------------------------- 2. Add, then Undo
# Scrolled DOWN first, as a member does (phone run 43564289562): the Undo bar floats at the bottom of the screen,
# above the tab bar, so it is on screen whatever the scroll. Add centred, then the page pushed up a fifth more.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Add$'
- swipe:
    start: 50%, 70%
    end: 50%, 50%
    duration: 1000
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Add$'
- takeScreenshot: rel-r482-a2a-scrolled-before-add
- tapOn:
    text: "^Add$"
    waitToSettleTimeoutMs: 300
# in-view: the Undo bar floats at the bottom of the screen, never in the scrolled page (no scroll on purpose)
- extendedWaitUntil:
    visible: 'Standing Calf Raise added to your Legs routine\.'
    timeout: 6000
# in-view: the bar's Undo button, on screen with no scroll (the bug: it was above the screen)
- assertVisible: 'Undo: Standing Calf Raise added to your Legs routine\.|^Undo$'
- takeScreenshot: rel-r482-a2-added-undo-bar
# in-view: the Undo bar floats at the bottom of the screen (it goes after ~6 s, no time for a scroll)
- tapOn:
    text: 'Undo: Standing Calf Raise added to your Legs routine\.|^Undo$'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'None of your routines trains your calves\. Add 3 sets of Standing Calf Raise to your Legs routine\?'
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'None of your routines trains your calves\. Add 3 sets of Standing Calf Raise to your Legs routine\?'
- assertNotVisible: 'Standing Calf Raise added to your Legs routine\.'
- takeScreenshot: rel-r482-a3-undone-tip-back
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^See exercises$'
- tapOn: "^See exercises$"
- extendedWaitUntil:
    visible: "Barbell Squat"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Barbell Squat'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '.*5 exercises.*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Plank'
- assertNotVisible: "Standing Calf Raise"
- takeScreenshot: rel-r482-a4-legs-after-undo
- back
# ---------------------------------------------------------------- 3. Add again and keep it
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Add$'
- tapOn:
    text: "^Add$"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'Standing Calf Raise added to your Legs routine\.'
    timeout: 6000
- extendedWaitUntil:
    notVisible: 'Standing Calf Raise added to your Legs routine\.'
    timeout: 20000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Up next: Legs.*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^See exercises$'
- assertNotVisible: 'None of your routines.*'
- assertNotVisible: 'Your routines give.*'
- takeScreenshot: rel-r482-a5-added-no-tip
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^See exercises$'
- tapOn: "^See exercises$"
- extendedWaitUntil:
    visible: "Barbell Squat"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '.*6 exercises.*'
- runFlow:
    file: sub-find.yaml
    env:
      FIND: 'Standing Calf Raise'
- assertVisible:
    text: 'Standing Calf Raise'
    below:
      text: 'Plank'
- takeScreenshot: rel-r482-a6-legs-with-calf-raise
- back
# The routine's own page (its card on the Workout tab) shows the planned sets ("See exercises" shows the
# workout preview, which has no set count).
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Legs, .*'
- tapOn: '^Legs, .*'
- extendedWaitUntil:
    visible: 'Standing Calf Raise'
    timeout: 15000
    optional: true
- runFlow:
    file: sub-find.yaml
    env:
      FIND: 'Standing Calf Raise'
# in-view: the line right under Standing Calf Raise, just centred by sub-find
- assertVisible:
    text: '3 sets.*'
    below:
      text: 'Standing Calf Raise'
- takeScreenshot: rel-r482-a6b-legs-page-3-sets
- back
# ---------------------------------------------------------------- 4. after a restart
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 15000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Up next: Legs.*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^See exercises$'
# A tip read after the card: give a wrong one time to appear before saying there is none.
- extendedWaitUntil:
    visible: 'None of your routines.*|Your routines give.*'
    timeout: 8000
    optional: true
- assertNotVisible: 'None of your routines.*'
- assertNotVisible: 'Your routines give.*'
- assertNotVisible: '(?i).*easy add.*'
- takeScreenshot: rel-r482-a7-restart-no-tip
