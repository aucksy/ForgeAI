# Sub-flow (not a part of its own; called with runFlow from other flows). Release A (A7,
# docs/ux/MEMBER-APP-MAP.md §3.3): Settings, behind the Profile page's gear (accessibilityLabel
# "Settings", src/app/(tabs)/profile.tsx), is ONE page in 6 headed groups (src/components/settings/
# settingsLines.ts): You (Your profile, Units) · Workouts (Weekly goal, Rest timer and sounds, How the
# app picks your next weight, Plates and bars, Last time's numbers, Rate how hard each set felt,
# Muscle tips) · Reminders and phone (Reminders, Health Connect, Widgets) · Your gym (Join your gym,
# or Gym logo on my home screen + Leave <gym>) · Your data (Backup, Save as a spreadsheet, Bring in
# from Hevy or Strong, Erase or start over) · Help (What's new, Send feedback, About).
# This opens that page. Call it with the app's tab bar on screen (any tab), or already on the page.
# The Profile tab is tapped with index 0: the top-most match (trap 18, 3-button navigation).
# The page is taller than the screen: any of three rows says "on the page", and it is then scrolled
# back to its top. Group headings are drawn in capitals: tap rows, never headings.
appId: com.mettleup.app
---
- runFlow:
    when:
      notVisible: "^Your profile$|^Backup$|^About$|^Your details$|^Export & import$"
    commands:
      - extendedWaitUntil:
          visible: "^Profile$"
          timeout: 30000
      - tapOn:
          text: "^Profile$"
          index: 0
      # The gear sits in the Profile page's header (never scrolls away).
      - extendedWaitUntil:
          visible: "Edit profile"
          timeout: 30000
      - tapOn: "Settings"
- scrollUntilVisible:
    element: "^Your profile$|^Your details$"
    direction: UP
    timeout: 20000
