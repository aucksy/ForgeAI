# Audit Phase 9 device QA, part P9 — "beyond Hevy" (runs after part N, before the P7 tours and M).
#  1. Settings → Workouts → Weekly goal 3 on the − / + stepper (redesign R6): the Workout tab's
#     Up next card reads "This week: N of 3 workouts" (redesign R1: Home is gone); then Off again.
#     On the same page (13 Oct 2026): "Previous values" with its two choices, left on Any workout.
#  2. A workout: Bench Press, two sets. The entry bar on the keyboard: "+ 2.5" (kg) or "+ 5" (lb,
#     part I's units) steps the weight box; "Copy to sets below" fills set 2 ("Copied to 1 set below"
#     with Undo); "+ 1" steps the reps. Both sets ticked, then Finish.
#  3. Finish screen: "Share as text" opens Android's share menu with the workout as text.
#  4. Bench Press page (Profile → Exercises, redesign R5): ⋯ → "Start records fresh…" → "Start fresh": "Records since …" shows;
#     ⋯ → "Count all records again" → "Count all again": the line goes.
# Saves one workout (part M reads its count afresh, before its backup).
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# ---------------------------------------------------------------- 1. weekly goal
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Workouts"
- scrollUntilVisible:
    element: "(?i)^weekly goal$"
    centerElement: true
    timeout: 30000
# Oct 2026: the goal is a "− N +" stepper (eight round chips did not fit one row at large text).
# From whatever it was: down to Off (a tap on the dimmed − does nothing), then up three.
- repeat:
    times: 7
    commands:
      - tapOn: "Fewer workouts a week"
- assertVisible:
    text: "^Off$"
    below:
      text: "(?i)^weekly goal$"
- repeat:
    times: 3
    commands:
      - tapOn: "More workouts a week"
- assertVisible:
    text: "^3$"
    below:
      text: "(?i)^weekly goal$"
- assertVisible: "Workouts a week. The Workout tab shows how many are left."
- takeScreenshot: p9-01-weekly-goal
# 13 Oct 2026: "Previous values" (Any workout / Same routine), under the weekly goal. R-61 (22 Oct 2026):
# "Same folder" is retired.
- scrollUntilVisible:
    element: "(?i)^previous values$"
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element: "^Same routine$"
    timeout: 30000
- assertVisible: "^Any workout$"
- assertNotVisible: "^Same folder$"
- tapOn: "^Any workout$"
- scrollUntilVisible:
    # C3-3 + R-61: heavy and light days of one folder keep their own Target; a newer workout elsewhere leads.
    element: "Previous, Target and notes come from the last time you did the exercise, in any folder. Heavy and light days in one folder keep their own Target. Applies from your next workout."
    timeout: 30000
- takeScreenshot: p9-01b-previous-values
# Workouts → Settings → Profile → the Workout tab. Part L finished Push 1 today, so the card is
# "Done today: Push 1" with its goal line, "This week: N of 3 workouts".
- back
- back
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- tapOn:
    text: "^Workout$"
    index: 0
- scrollUntilVisible:
    element: '.*This week: \d+ of 3 workouts.*'
    direction: UP
    centerElement: true
    timeout: 30000
- takeScreenshot: p9-02-workout-goal
# ---------------------------------------------------------------- 2. the entry bar
- runFlow: sub-workout-fresh.yaml
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 30000
- tapOn: "Add exercise"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " bench press"
- tapOn:
    text: "Select Barbell Bench Press"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: ".* set 1 weight, (kilograms|pounds)"
    timeout: 20000
# A second set to copy into (an empty exercise may start with one).
- runFlow:
    when:
      notVisible: ".* set 2 weight, (kilograms|pounds)"
    commands:
      - scrollUntilVisible:
          element: "Add set"
          centerElement: true
          timeout: 20000
      - tapOn: "Add set"
- extendedWaitUntil:
    visible: ".* set 2 weight, (kilograms|pounds)"
    timeout: 10000
- tapOn: ".* set 1 weight, (kilograms|pounds)"
- eraseText
- inputText: "100"
# The bar sits on the keyboard: one step up (2.5 kg, or 5 lb).
- extendedWaitUntil:
    visible: "Copy to sets below"
    timeout: 10000
- takeScreenshot: p9-03-entry-bar
- tapOn: "\\+ (2\\.5|5)"
- extendedWaitUntil:
    visible: "^(102\\.5|105)$"
    timeout: 5000
- tapOn: "Copy to sets below"
# The bench starts with as many sets as last time. After part I (one set in lb, plus the one
# added above) it has 2, so 1 set below. Run 38870025551 (owner profile) had part I fail before its
# workout, so last time was part J's Hevy bench (3 sets): the copy filled 2 sets and said so,
# and "1 set below" never came. The count is checked exactly for both cases.
- runFlow:
    when:
      notVisible: ".* set 3 weight, (kilograms|pounds)"
    commands:
      - extendedWaitUntil:
          visible: "Copied to 1 set below"
          timeout: 5000
- runFlow:
    when:
      visible: ".* set 3 weight, (kilograms|pounds)"
    commands:
      - assertNotVisible: ".* set 4 weight, (kilograms|pounds)"
      - extendedWaitUntil:
          visible: "Copied to 2 sets below"
          timeout: 5000
- takeScreenshot: p9-04-copied
- tapOn: ".* set 1 reps"
- eraseText
- inputText: "8"
- tapOn: "\\+ 1"
- extendedWaitUntil:
    visible: "^9$"
    timeout: 5000
- hideKeyboard
# Set 2 got set 1's weight (and its reps at the time of the copy: none yet → its own hint).
- assertVisible:
    text: "^(102\\.5|105)$"
    below:
      text: ".* set 1 reps"
- tapOn:
    text: "Mark .* set 1 complete"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Keep [0-9].*"
    optional: true
- tapOn:
    text: "Skip rest"
    optional: true
- tapOn:
    text: "Mark .* set 2 complete"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Keep [0-9].*"
    optional: true
- takeScreenshot: p9-05-ticked
- tapOn:
    text: "Skip rest"
    optional: true
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
- tapOn:
    text: "Keep original"
    optional: true
# ---------------------------------------------------------------- 3. share as text
- scrollUntilVisible:
    element: "Share as text"
    centerElement: true
    timeout: 20000
- takeScreenshot: p9-06-finish
- tapOn: "Share as text"
# Android's share menu (only the SYSTEM chooser has these).
- extendedWaitUntil:
    visible: '(Copy|Nearby|Sharing text|Here is my workout from ForgeAI.*)'
    timeout: 20000
- takeScreenshot: p9-07-share-text-menu
- back
- scrollUntilVisible:
    element: "Done"
    timeout: 20000
- tapOn: "Done"
# ---------------------------------------------------------------- 4. start records fresh
# Done goes to the Workout tab; the exercise is Profile → Exercises (redesign R5).
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 20000
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " bench press"
- hideKeyboard
- tapOn:
    text: "View Barbell Bench Press"
    index: 0
# Owner profile (360 dp, font 1.3): the records can sit below the screen's edge; the ⋯ is in the
# header, so it is brought back (centred, clear of the status bar) before the tap.
- extendedWaitUntil:
    visible: "Options for .*"
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Heaviest weight"
- scrollUntilVisible:
    element: "Options for .*"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Options for .*"
- tapOn: "Start records fresh.*"
- extendedWaitUntil:
    visible: 'Start records fresh\?'
    timeout: 10000
- takeScreenshot: p9-08-records-fresh-ask
- tapOn: "^Start fresh$"
- scrollUntilVisible:
    element: "(Records since|No records since) .*"
    centerElement: true
    timeout: 20000
- takeScreenshot: p9-09-records-since
- scrollUntilVisible:
    element: "Options for .*"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Options for .*"
- tapOn: "Count all records again"
- extendedWaitUntil:
    visible: 'Count all records again\?'
    timeout: 10000
- tapOn: "^Count all again$"
- extendedWaitUntil:
    notVisible: "(Records since|No records since) .*"
    timeout: 10000
- back
- back
# ---------------------------------------------------------------- weekly goal off again
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 20000
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Workouts"
- scrollUntilVisible:
    element: "(?i)^weekly goal$"
    centerElement: true
    timeout: 30000
- repeat:
    times: 7
    commands:
      - tapOn: "Fewer workouts a week"
- assertVisible:
    text: "^Off$"
    below:
      text: "(?i)^weekly goal$"
