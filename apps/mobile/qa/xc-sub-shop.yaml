# Phone conditions (UAT WP7), sub-flow: the app closed and opened again, then the gym's tab. Copied
# from xj-sub-shop.yaml (WP6) so a change there never moves these flows.
# R-77: the third tab shows only with a gym joined, as "Gym" until the gym lists a product, then
# "Shop" (the run's gym lists four).
appId: com.mettleup.app
---
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
