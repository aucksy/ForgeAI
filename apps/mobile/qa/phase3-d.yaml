# Phase 3 device QA, part D — progress (runs after parts A–C; demo data + today's workouts).
# Progress: reports card + "last 7 days" body map → the monthly report (calendar, records,
# muscles, share picture) → the year so far → personal records (all kinds) → measurements
# (log two) → progress photos (two SAMPLE pictures pushed by run-device-qa.sh) → compare.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Progress$"
    timeout: 60000
- tapOn: "^Progress$"
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 30000
- takeScreenshot: 40-progress-top
# ---------------------------------------------------------------- monthly report
- tapOn: 'Open the .* report'
- extendedWaitUntil:
    visible: "Monthly report"
    timeout: 20000
- extendedWaitUntil:
    visible: "COACH"
    timeout: 20000
- takeScreenshot: 41-month-report
# Audit Phase 3 (PG-22): full numbers use Latin digits and the PHONE's grouping. This emulator is
# en-US, so a month's volume reads "228,288 kg", never the Indian "2,28,288" the app used to force.
- assertNotVisible: '(?s).*\d,\d\d,\d\d\d.*'
# The share button sits in the header, which scrolls away: use it before scrolling.
- tapOn: "Share as a picture"
- extendedWaitUntil:
    visible: "Share picture"
    timeout: 15000
- takeScreenshot: 44-month-share-picture
- back
- scrollUntilVisible:
    element: 'Days you trained.*'
    timeout: 15000
- takeScreenshot: 42-month-calendar
# D10: the records heading counts LIFTS ("3 lifts beat their best"; "New records" when none),
# no longer every kind of record ("7 new records").
- scrollUntilVisible:
    element: '(New records|[\d,]+ lifts? beat (its|their) best)'
    timeout: 15000
- assertNotVisible: '[\d,]+ new records?'
- scrollUntilVisible:
    element: "Sets per muscle"
    timeout: 15000
- takeScreenshot: 43-month-records-muscles
- back
# ---------------------------------------------------------------- year so far
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 15000
- tapOn: 'Open the year in review for .*'
- extendedWaitUntil:
    visible: "Year in review"
    timeout: 20000
- extendedWaitUntil:
    visible: "COACH"
    timeout: 20000
- takeScreenshot: 45-year-review
- assertNotVisible: '(?s).*\d,\d\d,\d\d\d.*'
# D10: the year's tile counts lifts ("Lifts up"), and the streak tile is in weeks (D9).
- scrollUntilVisible:
    element: "Lifts up"
    timeout: 15000
- assertNotVisible: "New records"
- assertVisible: "Longest streak"
- scrollUntilVisible:
    element: "Most trained"
    timeout: 15000
- takeScreenshot: 46-year-review-more
- back
# ---------------------------------------------------------------- personal records
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 15000
- scrollUntilVisible:
    element: "Personal Records"
    timeout: 20000
- scrollUntilVisible:
    element: 'Measurements\..*'
    timeout: 20000
- takeScreenshot: 47-records-and-body
# PG-11: the body-weight change always says its span ("+3.6 kg" over "in 90 days", or "since
# 13 Jul 2025" for a long one). It sits above the Measurements row.
- scrollUntilVisible:
    element: '(in \d+ days?|since \d{1,2} [A-Z][a-z]{2} \d{4})'
    direction: UP
    timeout: 15000
- takeScreenshot: 47b-body-weight-span
# Audit Phase 3 (D10): the link no longer carries a count ("See all records"); the records page
# counts LIFTS in its subtitle ("5 lifts beat their best · every record, newest first"). The
# link shows only with more than 6 records; it sits just above the body-weight card.
- scrollUntilVisible:
    element: 'See all records'
    direction: UP
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: 'See all records'
    commands:
      - tapOn: 'See all records'
      - extendedWaitUntil:
          visible: 'Personal records'
          timeout: 15000
      - assertVisible: '[\d,]+ lifts? beat (its|their) best · every record, newest first'
      - takeScreenshot: 48-all-records
      - back
# ---------------------------------------------------------------- volume + streak (Phase 3 numbers)
# PG-22: the range's volume is a full number grouped the phone's way. The demo's 13 weeks lift
# well over 100,000 kg, so on this en-US phone it must read "650,000 kg lifted" (Western), never
# "6,50,000" (Indian) or "650k".
- scrollUntilVisible:
    element: '[\d,]+ kg lifted'
    centerElement: true
    timeout: 20000
- assertVisible: '\d{1,3}(,\d{3})* kg lifted'
- assertNotVisible: '(?s).*\d,\d\d,\d\d\d.*'
- takeScreenshot: 48b-volume-western-grouping
# D9: Progress shows THE streak in weeks, the same rule as Home and History.
- scrollUntilVisible:
    element: '\d+-week streak.*'
    centerElement: true
    timeout: 20000
- assertNotVisible: '(?i).*day streak.*'
- takeScreenshot: 48c-progress-week-streak
# ---------------------------------------------------------------- measurements
- scrollUntilVisible:
    element: 'Measurements\..*'
    direction: UP
    timeout: 20000
- tapOn: 'Measurements\..*'
- extendedWaitUntil:
    visible: "Log measurements"
    timeout: 15000
- takeScreenshot: 50-measurements
- tapOn: "Log measurements"
- extendedWaitUntil:
    visible: "Waist in centimetres"
    timeout: 15000
- tapOn: "Waist in centimetres"
- inputText: " 80.2"
- tapOn: "Arm in centimetres"
- inputText: " 36"
- hideKeyboard
# The bottom box with the keyboard open: the screen shrinks above the keyboard and brings
# the box into view (third review: the keyboard used to cover Hips, Thigh, Calf and Save).
- tapOn: "Calf in centimetres"
- inputText: " 38"
- takeScreenshot: 51b-keyboard-room
- hideKeyboard
- takeScreenshot: 51-log-measurements
- scrollUntilVisible:
    element: "Save measurements"
    timeout: 15000
- tapOn: "Save measurements"
- extendedWaitUntil:
    visible: "Log measurements"
    timeout: 15000
- tapOn:
    text: "^Waist$"
    index: 0
- takeScreenshot: 52-waist-trend
- scrollUntilVisible:
    element: "Latest"
    timeout: 15000
- takeScreenshot: 53-measurements-latest
- back
# ---------------------------------------------------------------- progress photos
- scrollUntilVisible:
    element: 'Progress photos\..*'
    timeout: 20000
- tapOn: 'Progress photos\..*'
- extendedWaitUntil:
    visible: "Add a photo"
    timeout: 15000
- takeScreenshot: 54-photos-empty
- tapOn: "Add a photo"
- tapOn: "Choose from gallery"
- extendedWaitUntil:
    visible: '(?i)photos|albums|recent|.*photo.*'
    timeout: 15000
- takeScreenshot: 55-system-photo-picker
# Android's photo picker: each picture is labelled "Photo taken on <date>"; its thumbnail
# view id is a second way in if the label differs on this system image.
- tapOn:
    text: '(?i)photo taken on.*'
    index: 0
    optional: true
- runFlow:
    when:
      visible: '^Albums$'
    commands:
      - tapOn:
          id: '.*icon_thumbnail'
          index: 0
          optional: true
- extendedWaitUntil:
    visible: 'Progress photo, .*'
    timeout: 20000
- tapOn: "Add a photo"
- tapOn: "Choose from gallery"
- extendedWaitUntil:
    visible: '(?i)photos|albums|recent|.*photo.*'
    timeout: 15000
- tapOn:
    text: '(?i)photo taken on.*'
    index: 1
    optional: true
- runFlow:
    when:
      visible: '^Albums$'
    commands:
      - tapOn:
          id: '.*icon_thumbnail'
          index: 1
          optional: true
- extendedWaitUntil:
    visible: "Compare two photos"
    timeout: 20000
- takeScreenshot: 56-photos-grid
- tapOn:
    text: 'Progress photo, .*'
    index: 0
- extendedWaitUntil:
    visible: "Delete photo"
    timeout: 10000
- takeScreenshot: 57-photo-viewer
- back
- tapOn: "Compare two photos"
- tapOn:
    text: 'Progress photo, .*'
    index: 0
- tapOn:
    text: 'Progress photo, .*'
    index: 1
- extendedWaitUntil:
    visible: "Before"
    timeout: 15000
- takeScreenshot: 58-photo-compare
- back
- back
