# Phase 3 device QA, part D — progress (runs after parts A–C; demo data + today's workouts).
# Redesign R3: the Progress tab is gone. What it held now lives behind the Profile page's
# Dashboard: Statistics (last 7 days + body map, sets per muscle group, muscle distribution with
# kg lifted, main exercises, records, reports), Measures (body weight, measurements and the
# progress photos, one page), and an exercise's trend on its own page (Profile → Exercises).
# Walk: Statistics top → the monthly report (calendar, records, muscles, share picture) → the year
# so far → all records → tap a muscle → kg lifted grouped the phone's way → weeks in a row on the
# Profile → a distance lift's trend (part C's Treadmill Run) → Measures: a 765 kg weigh-in kept,
# then fixed → measurements (log three, delete one, Undo) → progress photos (two SAMPLE pictures
# pushed by run-device-qa.sh: a tall one and a wide one, neither dated) → change a date → compare.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Statistics"
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 30000
- assertVisible: "Sets per muscle group"
# A new member's Statistics is one line ("No workouts yet", src/app/stats.tsx) — not this member.
# (Not checked on the phone for a new member: no part reaches the tabs before part A loads the demo.)
- assertNotVisible: "No workouts yet"
- takeScreenshot: 40-statistics-top
# ---------------------------------------------------------------- monthly report
- scrollUntilVisible:
    element: 'Open the .* report'
    centerElement: true
    timeout: 30000
- tapOn:
    text: 'Open the .* report'
    index: 0
- extendedWaitUntil:
    visible: "Monthly report"
    timeout: 20000
# PG-30: the rule-written note is no longer signed "COACH" while the coach is hidden.
- extendedWaitUntil:
    visible: "IN SHORT"
    timeout: 20000
- assertNotVisible: "COACH"
- takeScreenshot: 41-month-report
# Audit Phase 3 (PG-22): full numbers use Latin digits and the PHONE's grouping. This emulator is
# en-US, so a month's volume reads "228,288 kg", never the Indian "2,28,288" the app used to force.
- assertNotVisible: '(?s).*\d,\d\d,\d\d\d.*'
# The share button sits in the header, which scrolls away: use it before scrolling.
- tapOn: "Share as a picture"
- extendedWaitUntil:
    visible: "Share picture"
    timeout: 15000
- takeScreenshot: 44-month-share-picture
- back
- scrollUntilVisible:
    element: 'Days you trained.*'
    timeout: 15000
- takeScreenshot: 42-month-calendar
# D10: the records heading counts LIFTS ("3 lifts beat their best"; "New records" when none),
# no longer every kind of record ("7 new records").
- scrollUntilVisible:
    element: '(New records|[\d,]+ lifts? beat (its|their) best)'
    timeout: 15000
- assertNotVisible: '[\d,]+ new records?'
- scrollUntilVisible:
    element: "Sets per muscle"
    timeout: 15000
- takeScreenshot: 43-month-records-muscles
# PG-14: "and N more" became "See all N", which opens exactly that month's records.
- scrollUntilVisible:
    element: 'See all [\d,]+ records of .*'
    direction: UP
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: 'See all [\d,]+ records of .*'
    commands:
      - tapOn: 'See all [\d,]+ records of .*'
      - extendedWaitUntil:
          visible: '^Records$'
          timeout: 15000
      - assertVisible: '[\d,]+ lifts? beat (its|their) best in .* · [\d,]+ records?, newest first'
      - takeScreenshot: 43b-month-all-records
      - back
- back
# ---------------------------------------------------------------- year so far
# Back on Statistics: the Reports card is its last section, its last row near the screen edge.
- scrollUntilVisible:
    element: 'Open the year in review for .*'
    centerElement: true
    timeout: 20000
- tapOn:
    text: 'Open the year in review for .*'
    index: 0
- extendedWaitUntil:
    visible: "Year in review"
    timeout: 20000
- extendedWaitUntil:
    visible: "IN SHORT"
    timeout: 20000
- takeScreenshot: 45-year-review
- assertNotVisible: '(?s).*\d,\d\d,\d\d\d.*'
# D10: the year's tile counts lifts ("Lifts up"), and the streak tile is in weeks (D9).
- scrollUntilVisible:
    element: "Lifts up"
    timeout: 15000
- assertNotVisible: "New records"
- assertVisible: "Longest streak"
- scrollUntilVisible:
    element: "Most trained"
    timeout: 15000
- takeScreenshot: 46-year-review-more
- back
# ---------------------------------------------------------------- records
# Statistics → Records: the latest three and "See all" (spoken "See all records"), which opens
# every record; the records page counts LIFTS in its subtitle (D10).
- extendedWaitUntil:
    visible: 'Open the year in review for .*'
    timeout: 15000
- scrollUntilVisible:
    element: "See all records"
    direction: UP
    centerElement: true
    timeout: 20000
- takeScreenshot: 47-statistics-records
- tapOn: "See all records"
- extendedWaitUntil:
    visible: '^Records$'
    timeout: 15000
- assertVisible: '[\d,]+ lifts? beat (its|their) best · [\d,]+ records?, newest first'
- takeScreenshot: 48-all-records
- back
# ---------------------------------------------------------------- tap a muscle
# Statistics → Last 7 days: the body map, and a chip for each trained muscle ("Chest · 12").
- scrollUntilVisible:
    element: "Tap a muscle for its sets"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^[A-Z][A-Za-z ]+ · [\d.]+$'
    index: 0
- extendedWaitUntil:
    visible: '.* in the last 7 days'
    timeout: 15000
- takeScreenshot: 47c-muscle-sheet
- back
# ---------------------------------------------------------------- kg lifted, the phone's grouping
# PG-22: Muscle distribution's "Kg lifted" tile over a Year (the whole demo: well over 100,000 kg)
# is a full number grouped the phone's way: on this en-US phone "650,000 kg", never "6,50,000"
# (Indian) or "650k". Its Period chips sit right under "Sets this period against the one before"
# (the 12 months chip above it belongs to Sets per muscle group; "Year" until the 13 Oct 2026 audit).
- scrollUntilVisible:
    element: "Sets this period against the one before"
    centerElement: true
    timeout: 20000
- tapOn:
    text: "^12 months$"
    below:
      text: "Sets this period against the one before"
- scrollUntilVisible:
    element: '^Kg lifted, .*'
    centerElement: true
    timeout: 20000
- assertVisible: '^Kg lifted, \d{1,3}(,\d{3})+ kg.*'
- assertNotVisible: '(?s).*\d,\d\d,\d\d\d.*'
- takeScreenshot: 48b-volume-western-grouping
- back
# ---------------------------------------------------------------- weeks in a row
# D9: THE streak in weeks, the same rule everywhere: the Profile header's "Weeks in a row".
- scrollUntilVisible:
    element: '^Weeks in a row: [\d,]+$'
    direction: UP
    timeout: 20000
- assertNotVisible: '(?i).*day streak.*'
- takeScreenshot: 48c-profile-week-streak
# ---------------------------------------------------------------- a distance lift's trend
# PG-09: any exercise's trend — now on its own page (Profile → Exercises). Part C ran a Treadmill
# Run today, so its Summary must show it (not "No sets logged yet").
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " treadmill"
- hideKeyboard
- tapOn:
    text: "View Treadmill Run"
    index: 0
- extendedWaitUntil:
    visible: "Last time · .*"
    timeout: 15000
- assertVisible: "Treadmill Run"
- assertNotVisible: "No sets logged yet"
- takeScreenshot: 40b-any-exercise-trend
- back
- back
# ---------------------------------------------------------------- Measures: body weight
# PG-11: the body-weight change always says its span: "+3.6 kg since 13 Jul" under the graph.
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Measures"
- extendedWaitUntil:
    visible: "Progress photos"
    timeout: 20000
- extendedWaitUntil:
    visible: '.* (kg|lb) since \d{1,2} [A-Z][a-z]{2}'
    timeout: 15000
- takeScreenshot: 47b-body-weight-span
# ---------------------------------------------------------------- body weight: a 765 kg typo, fixed
# PG-16: the "+" form has a Date row. PG-03: 765 (meant 76.5) gets one gentle question
# ("765 kg — that's 9.5× your last. Keep it?", Keep it / Fix it), never a refusal. Keep it, then
# tap the entry → its sheet (value, Day, Save, Delete) → 76.5 → Save: the list shows 76.5 kg.
# Measures opens on Body weight, so the "+" form ("Add measures") puts the body-weight box first.
- tapOn: "Add measures"
- extendedWaitUntil:
    visible: "Body weight in kg"
    timeout: 15000
- assertVisible: 'Date: Today\. Change the day'
- tapOn: "Body weight in kg"
- inputText: " 765"
- hideKeyboard
- scrollUntilVisible:
    element: "^Save$"
    centerElement: true
    timeout: 15000
- tapOn: "^Save$"
- extendedWaitUntil:
    visible: '765 kg — that.s .*× your last\. Keep it\?'
    timeout: 10000
- assertVisible: "Fix it"
- takeScreenshot: 47d-weight-typo-question
- tapOn: "Keep it"
- extendedWaitUntil:
    visible: "Progress photos"
    timeout: 15000
- scrollUntilVisible:
    element: '.*, 765 kg\. Fix or delete'
    centerElement: true
    timeout: 20000
- takeScreenshot: 47e-weight-765-kept
- tapOn: '.*, 765 kg\. Fix or delete'
- extendedWaitUntil:
    visible: "Fix this weigh-in"
    timeout: 10000
- assertVisible: "Delete this entry"
- tapOn:
    text: "Body weight in kg"
    below:
      text: "Fix this weigh-in"
- eraseText
- inputText: " 76.5"
- takeScreenshot: 47f-weigh-in-sheet
# The sheet rides above the keyboard, so its Save is on screen (no hideKeyboard: Back would
# close the sheet).
- tapOn: "^Save$"
- extendedWaitUntil:
    notVisible: "Fix this weigh-in"
    timeout: 10000
- extendedWaitUntil:
    visible: '.*, 76\.5 kg\. Fix or delete'
    timeout: 10000
- assertNotVisible: '.*765 kg.*'
- takeScreenshot: 47g-weight-fixed
# ---------------------------------------------------------------- measurements
# The Waist chip, then "+": the form opens with the Waist box first (the measure on show).
- scrollUntilVisible:
    element: "^Waist$"
    direction: UP
    timeout: 20000
- tapOn:
    text: "^Waist$"
    index: 0
- takeScreenshot: 50-measures-waist
# The "+" sits in the page's title row, which scrolls with the page: after the history above it
# can be just off the top (run 38150955406), so bring it back first.
- scrollUntilVisible:
    element: "Add measures"
    direction: UP
    timeout: 20000
- tapOn: "Add measures"
- extendedWaitUntil:
    visible: "Waist in centimetres"
    timeout: 15000
- assertVisible: 'Date: Today\. Change the day'
- tapOn: "Waist in centimetres"
- inputText: " 80.2"
- scrollUntilVisible:
    element: "Arm in centimetres"
    centerElement: true
    timeout: 15000
- tapOn: "Arm in centimetres"
- inputText: " 36"
# The bottom box with the keyboard open: the screen shrinks above the keyboard and brings
# the box into view (third review: the keyboard used to cover the last boxes and Save).
- scrollUntilVisible:
    element: "Calf in centimetres"
    centerElement: true
    timeout: 15000
- tapOn: "Calf in centimetres"
- inputText: " 38"
- takeScreenshot: 51b-keyboard-room
- hideKeyboard
- takeScreenshot: 51-log-measurements
- scrollUntilVisible:
    element: "^Save$"
    centerElement: true
    timeout: 15000
- tapOn: "^Save$"
# The form's title is "Add measures" too (the button's name): wait for its boxes to go first.
- extendedWaitUntil:
    notVisible: "Waist in centimetres"
    timeout: 15000
- extendedWaitUntil:
    visible: "Progress photos"
    timeout: 15000
- scrollUntilVisible:
    element: "^Waist$"
    direction: UP
    timeout: 20000
- tapOn:
    text: "^Waist$"
    index: 0
- takeScreenshot: 52-waist-trend
- scrollUntilVisible:
    element: "Tap an entry to fix or delete it."
    timeout: 15000
- takeScreenshot: 53-measurements-latest
# PG-03 / PG-16: tap an entry → its sheet (value, Day, Save, Delete); Delete shows an Undo bar
# (never "Are you sure?"), and Undo puts the entry back.
- scrollUntilVisible:
    element: '.*, 80\.2 cm\. Fix or delete'
    centerElement: true
    timeout: 15000
- tapOn: '.*, 80\.2 cm\. Fix or delete'
- extendedWaitUntil:
    visible: "Fix this waist entry"
    timeout: 10000
- assertVisible: 'Day: Today\. Change the day'
- assertVisible: "^Save$"
- takeScreenshot: 53b-measurement-entry-sheet
- tapOn: "Delete this entry"
- extendedWaitUntil:
    visible: 'Undo: Waist on .* deleted'
    timeout: 10000
- assertNotVisible: '.*, 80\.2 cm\. Fix or delete'
- takeScreenshot: 53c-measurement-undo-bar
- tapOn:
    text: 'Undo: Waist on .* deleted'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: '.*, 80\.2 cm\. Fix or delete'
    timeout: 10000
# ---------------------------------------------------------------- progress photos
# Measures → the Progress photos strip at the top: none yet, so "Add a progress photo" opens the
# photos page (the same page as before the redesign).
- scrollUntilVisible:
    element: "Progress photos"
    direction: UP
    timeout: 20000
- tapOn:
    text: "Add a progress photo"
    index: 0
- extendedWaitUntil:
    visible: "Add a photo"
    timeout: 15000
# D11: photos are not in the backup until the member turns it on (Settings → Backup).
- assertVisible: 'Private\. They stay on this phone\.'
- takeScreenshot: 54-photos-empty
- tapOn: "Add a photo"
- tapOn: "Choose from gallery"
- extendedWaitUntil:
    visible: '(?i)photos|albums|recent|.*photo.*'
    timeout: 15000
- takeScreenshot: 55-system-photo-picker
# Android's photo picker: each picture is labelled "Photo taken on <date>"; its thumbnail
# view id is a second way in if the label differs on this system image.
- tapOn:
    text: '(?i)photo taken on.*'
    index: 0
    optional: true
- runFlow:
    when:
      visible: '^Albums$'
    commands:
      - tapOn:
          id: '.*icon_thumbnail'
          index: 0
          optional: true
# PG-16: the sample pictures are PNGs with no date of their own, so the app asks the day
# instead of silently using today. Day cells are named by their date ("2026-09-01").
- extendedWaitUntil:
    visible: 'When was this photo taken\?'
    timeout: 20000
- assertVisible: 'It came without a date of its own.*'
- takeScreenshot: 55b-photo-undated-question
- tapOn: "Previous month"
- tapOn: '\d{4}-\d{2}-01'
- extendedWaitUntil:
    notVisible: 'When was this photo taken\?'
    timeout: 10000
- extendedWaitUntil:
    visible: 'Progress photo, .*'
    timeout: 20000
- tapOn: "Add a photo"
- tapOn: "Choose from gallery"
- extendedWaitUntil:
    visible: '(?i)photos|albums|recent|.*photo.*'
    timeout: 15000
- tapOn:
    text: '(?i)photo taken on.*'
    index: 1
    optional: true
- runFlow:
    when:
      visible: '^Albums$'
    commands:
      - tapOn:
          id: '.*icon_thumbnail'
          index: 1
          optional: true
- extendedWaitUntil:
    visible: 'When was this photo taken\?'
    timeout: 20000
- tapOn: "Previous month"
- tapOn: '\d{4}-\d{2}-15'
- extendedWaitUntil:
    notVisible: 'When was this photo taken\?'
    timeout: 10000
- extendedWaitUntil:
    visible: "Compare two photos"
    timeout: 20000
- takeScreenshot: 56-photos-grid
# The viewer: zoom, "Save to phone gallery", "Change date", "Delete photo" (PG-16/17/18).
- tapOn:
    text: 'Progress photo, .*'
    index: 0
- extendedWaitUntil:
    visible: "Delete photo"
    timeout: 10000
- assertVisible: "Save to phone gallery"
- assertVisible: "Change date"
- takeScreenshot: 57-photo-viewer
# Change date: the photo's own month opens; the 8th is a week from either sample's day (the
# 1st and the 15th), so the compare below must read "1 week apart" whichever photo this is.
- tapOn: "Change date"
- extendedWaitUntil:
    visible: "Photo date"
    timeout: 10000
- tapOn: '\d{4}-\d{2}-08'
- extendedWaitUntil:
    visible: "Change date"
    timeout: 10000
- assertVisible: '[A-Z][a-z]{2}, 8 [A-Z][a-z]{2}( \d{4})?'
- takeScreenshot: 57b-photo-date-changed
# Save to phone gallery hands the photo to Android's share list (the app has no gallery
# module). Assert text only the SYSTEM chooser shows, as part E does; Back closes it.
- tapOn: "Save to phone gallery"
- extendedWaitUntil:
    visible: '(Sharing image|Sharing 1 image|No recommended people to share with)'
    timeout: 20000
- takeScreenshot: 57c-save-to-gallery-share-list
- back
- extendedWaitUntil:
    visible: "Close photo"
    timeout: 10000
- tapOn: "Close photo"
- extendedWaitUntil:
    visible: "Compare two photos"
    timeout: 10000
- assertNotVisible: "This phone has no share list.*"
- assertNotVisible: "Couldn.t hand the photo over.*"
# PG-18: compare shows each photo WHOLE (sample 1 is tall 600x800, sample 2 wide 800x600 with
# orange side bands that a cropped view would cut off — look for both bands in 58).
- tapOn: "Compare two photos"
- tapOn:
    text: 'Progress photo, .*'
    index: 0
- tapOn:
    text: 'Progress photo, .*'
    index: 1
- extendedWaitUntil:
    visible: "Before"
    timeout: 15000
- assertVisible: "After"
- assertVisible: "1 week apart"
- assertVisible: "Tap a photo to open it and pinch to zoom."
- takeScreenshot: 58-photo-compare
- tapOn: 'Before, .*\. Open to zoom'
- extendedWaitUntil:
    visible: 'Before · .*'
    timeout: 10000
- takeScreenshot: 58b-compare-before-full
- doubleTapOn: "Before photo"
- takeScreenshot: 58c-compare-before-zoomed
- tapOn: "Close photo"
- tapOn: 'After, .*\. Open to zoom'
- extendedWaitUntil:
    visible: 'After · .*'
    timeout: 10000
- takeScreenshot: 58d-compare-after-full
- tapOn: "Close photo"
- back
- back
