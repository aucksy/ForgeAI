# Part INV, step E (gym messages, Phase 1): run-device-qa.sh made a fresh demo gym on the live
# server ("QA Inbox Gym", with the sample products), sent it one announcement ("QA: gym closed on
# Sunday") with that gym's own key, and opened the gym's invite link. Join it (R-77: it lands on the
# Workout tab); on the Gym tab the bell shows 1 new; the inbox shows the message; back on the
# gym's page the count is gone. Then Leave (Settings → Your gym), so the phone ends in no gym.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: "Gym code .*"
    timeout: 30000
- tapOn: "Your name"
- eraseText: 70
- inputText: "QA Member"
- hideKeyboard
# Owner profile (360 dp, font 1.3): the button can be below the form.
- runFlow: sub-agree.yaml  # launch D5/D6: tick 18+ / terms before joining
- scrollUntilVisible:
    element: "^Join this gym$"
    centerElement: true
    timeout: 15000
- tapOn: "^Join this gym$"
# Joined = the invite screen has gone, its "Your name" box with it (Release A: the Gym tab is
# there with or without a gym). Then the Workout tab (sub-after-join.yaml).
- extendedWaitUntil:
    notVisible: "Your name"
    timeout: 30000
- runFlow: sub-after-join.yaml
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "^QA Inbox Gym$"
    timeout: 30000
- extendedWaitUntil:
    visible: "Messages from your gym, 1 new"
    timeout: 30000
- takeScreenshot: inv-07-bell-one-new
- tapOn: "Messages from your gym, 1 new"
- extendedWaitUntil:
    visible: "QA: gym closed on Sunday"
    timeout: 20000
- assertVisible: "Gym closed"
- takeScreenshot: inv-08-inbox
- back
- extendedWaitUntil:
    visible: "^Messages from your gym$"
    timeout: 20000
- assertNotVisible: "Messages from your gym, 1 new"
# Release A (A4): Leave is in Settings → Your gym only.
- runFlow: sub-leave-gym.yaml
- extendedWaitUntil:
    visible: 'Leave QA Inbox Gym\?'
    timeout: 15000
- tapOn: "^Leave gym$"
# Release A: in no gym, Settings offers "Join your gym" and the Gym tab is its join screen.
- extendedWaitUntil:
    visible: "^Join your gym$"
    timeout: 20000
- runFlow: sub-gym-none.yaml
