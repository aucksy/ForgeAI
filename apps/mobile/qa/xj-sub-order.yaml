# Cross-role journeys (UAT WP6), sub-flow: in the gym's shop, order ONE of PRODUCT (its stock line
# must read STOCK first), pay at the desk. Ends on My orders with the order placed ("Ordered").
appId: com.mettleup.app
---
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "${PRODUCT}, .*"
- tapOn: "${PRODUCT}, .*"
- extendedWaitUntil:
    visible: "^${PRODUCT}$"
    timeout: 15000
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "^${STOCK}$"
- scrollUntilVisible:
    element: "Add to bag"
    centerElement: true
    timeout: 15000
- tapOn: "Add to bag"
- extendedWaitUntil:
    visible: "Added 1 to your bag"
    timeout: 10000
- scrollUntilVisible:
    element: "Go to bag"
    centerElement: true
    timeout: 15000
- tapOn: "Go to bag"
- extendedWaitUntil:
    visible: "^Bag$"
    timeout: 15000
- scrollUntilVisible:
    element: "^Place order$"
    centerElement: true
    timeout: 15000
- tapOn: "^Place order$"
- extendedWaitUntil:
    visible: 'Order \d+ placed\. Pay at the desk when you collect it\.'
    timeout: 45000
- extendedWaitUntil:
    visible: "^The gym is getting it ready$"
    timeout: 20000
