# Sub-flow (runFlow only): read the Target line of exercise EX by its id ("target-line-<name>",
# ExerciseLogCard) and compare its words EXACTLY with WANT.
#   - runFlow:
#       file: sub-uat-r454-line.yaml
#       env:
#         EX: "Incline Dumbbell Press"
#         WANT: "Previous set volume beaten! +80 kg / Done 1,800 kg · Previous 1,720 kg"
# R-498 (owner, 14 Nov 2026): the green line is two lines in one text (a line break between them) and
# "+80 kg" holds a no-break space. WANT writes the break as " / " and the no-break space as a plain space;
# the read text is changed the same way before the exact compare (nothing else is loosened). EX is matched
# as a pattern (an id is a regex), so "Pull[- ][Uu]p" works.
# Why not sub-find: on the owner-sized phone (360 dp, font 1.3) a text search for the green line missed
# it in 3 of 4 runs while the screen dump held exactly those words (runs 43210287083, 43219512924,
# 43237985357). The id never changes with the words, and the words are then compared as plain text.
# No `env:` default here (trap 22). Both scrolls are optional: copyTextFrom is the real check.
appId: com.mettleup.app
---
- scrollUntilVisible:
    element:
      id: "target-line-${EX}"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "target-line-${EX}"
    commands:
      - scrollUntilVisible:
          element:
            id: "target-line-${EX}"
          direction: UP
          timeout: 20000
          optional: true
- copyTextFrom:
    id: "target-line-${EX}"
- evalScript: "${console.log('target-line ' + EX + ' reads ' + maestro.copiedText)}"
- assertTrue: "${maestro.copiedText.split(String.fromCharCode(160)).join(' ').split(String.fromCharCode(10)).join(' / ') == WANT}"
