# Store screens (R-126), step C: what the member sees of their progress, then the Gym tab before a
# gym. Pictures: Profile top (s-07a), the 12-week chart (s-07b), Progress → Body (s-07c), the
# Calendar (s-07d), Barbell Bench Press → History with its chart (s-03), Join your gym (s-06).
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s-07a-profile
- scrollUntilVisible:
    element: '^(Kg|Lb) lifted$'
    centerElement: true
    timeout: 20000
    optional: true
- takeScreenshot: s-07b-profile-chart
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Body"
- extendedWaitUntil:
    visible: "Add measures"
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s-07c-body
- back
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Charts"
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s-07e-charts
- scrollUntilVisible:
    element: "Sets per muscle group"
    centerElement: true
    timeout: 15000
    optional: true
- takeScreenshot: s-07f-charts-muscles
- back
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Calendar"
- extendedWaitUntil:
    visible: "Log a past workout|Search workouts|^Year$"
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element: "^Year$"
    direction: UP
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s-07d-calendar
- runFlow: sub-back-to-tabs.yaml
# The bench's own page: Progress → Exercises → search.
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- scrollUntilVisible:
    element: '.*Barbell Bench Press.*'
    centerElement: true
    timeout: 20000
- tapOn:
    text: '.*Barbell Bench Press.*'
    index: 0
- extendedWaitUntil:
    visible: "^Summary$"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s-03a-bench-summary
- tapOn: "^History$"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s-03-bench-history
- scrollUntilVisible:
    element:
      id: "date-line-chart"
    centerElement: true
    timeout: 10000
    optional: true
- takeScreenshot: s-03b-bench-chart
- tapOn: "^Summary$"
- scrollUntilVisible:
    element:
      id: "date-line-chart"
    centerElement: true
    timeout: 10000
    optional: true
- takeScreenshot: s-03c-bench-summary-chart
- runFlow: sub-back-to-tabs.yaml
# No gym yet: the Gym tab is "Join your gym".
- runFlow: sub-gym-none.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s-06-join-gym
- runFlow: sub-back-to-tabs.yaml
