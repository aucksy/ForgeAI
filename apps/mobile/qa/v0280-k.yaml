# v0.28.0 device QA, part K — an export shared to ForgeAI, the way a person does it (runs after
# part J). The script opens Android's Files app; here: hold qa-hevy.csv in Downloads → Share →
# ForgeAI. The import opens on that file's preview, without picking it.
appId: com.forgeai.app
---
- extendedWaitUntil:
    visible: '(?i).*(downloads|recent|files|qa-hevy).*'
    timeout: 30000
- runFlow:
    when:
      notVisible: "qa-hevy.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- longPressOn: "qa-hevy.*"
- takeScreenshot: 159-files-selected
- tapOn:
    text: "Share"
- extendedWaitUntil:
    visible: "ForgeAI"
    timeout: 20000
- takeScreenshot: 159b-share-menu
- tapOn: "ForgeAI"
- extendedWaitUntil:
    visible: "Already in ForgeAI"
    timeout: 60000
- assertVisible: "qa-hevy.csv"
# Audit Phase 4 (IM-09): part J imported this file already, so the preview says so first and
# offers no "Merge 12 workouts" that would add 0.
- scrollUntilVisible:
    element: "All 12 workouts are already here"
    centerElement: true
    timeout: 15000
- assertNotVisible: "(Merge|Import) 12 workouts"
- takeScreenshot: 160-shared-file-preview
- tapOn: "Close"
