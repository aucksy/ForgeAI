# Part UAT, R-358 / R-362 / R-364 flow c (after flow b; run-device-qa.sh moves the phone's clock to 75 s
# before midnight first, so this workout crosses midnight). Preacher curl, still "One side at a time".
#  - POSITIVE: 10 x 19 per side beats flow b's best one-side set (10 x 18): "New record" pops up.
#  - R-362 NEGATIVE: 10 x 20 is a record too, but one pop-up per exercise per workout: none.
#  - Interruption: the app is killed and opened again mid-workout; set 1 unticked and ticked again:
#    no pop-up again (the workout remembers it already showed one).
# Pictures rel-r358-c-*.png.
appId: com.mettleup.app
---
- runFlow:
    file: sub-uat-r358-start.yaml
    env:
      COUNTING: "keep"
- assertVisible: ".*REPS/SIDE.*"
# Flow b's history must be 10 x 18 (not a mistyped 183): set 1 is pre-filled from it.
- assertNotVisible: "183"
# Set 1 typed and ticked here (not via sub-uat-r358-set): the pop-up is looked for straight after the
# tick, with no wait for the rest bar in between (it shows for 6.2 s).
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Dumbbell Preacher Curl set 1 weight, .*"
      VALUE: " 10"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Dumbbell Preacher Curl set 1 reps.*"
      VALUE: " 19"
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: "Dumbbell Preacher Curl set 1"
- extendedWaitUntil:
    visible: "New record.*"
    timeout: 6000
- takeScreenshot: rel-r358-c-real-record-pops-up
- runFlow: sub-uat-rest-clear.yaml
- runFlow:
    file: sub-uat-r358-set.yaml
    env:
      N: "2"
      KG: "10"
      REPS: "20"
- assertNotVisible: "New record.*"
- takeScreenshot: rel-r358-c-second-record-medal-only
- runFlow: sub-uat-rest-clear.yaml
# ---------------------------------------------------------------- the app killed mid-workout
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Resume workout|Dumbbell Preacher Curl set 1 complete.*"
    timeout: 60000
- tapOn:
    text: "Resume workout"
    optional: true
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Dumbbell Preacher Curl set 1 complete. Tap to undo"
- tapOn: "Dumbbell Preacher Curl set 1 complete. Tap to undo"
- runFlow:
    file: sub-uat-tick.yaml
    env:
      WHO: "Dumbbell Preacher Curl set 1"
- extendedWaitUntil:
    visible: 'Skip rest|In use\. .*'
    timeout: 8000
- assertNotVisible: "New record.*"
- takeScreenshot: rel-r358-c-after-restart-no-repeat
- runFlow: sub-uat-r358-finish.yaml
- takeScreenshot: rel-r358-c-finish-lists-records
