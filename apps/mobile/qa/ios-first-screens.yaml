# iPhone only (R-339, 5 Nov 2026): the first screens of the iPhone simulator build, photographed.
# Run by .github/workflows/ios.yml (never by the Android QA scripts). Fresh install -> intro ->
# welcome -> demo data -> each tab -> Settings (where the "Not on iPhone yet" line sits).
# The welcome screen ("Get stronger every week", "Continue with Google") comes after the intro's Skip.
# Every step after the launch is optional, so one changed word costs one picture, not the rest.
#
# 12 Nov 2026 (run 43166949570): ios-06-profile-tab and ios-07-settings showed the Gym tab. On iPhone the
# Profile tab with its new-feature dot reads "Profile, New", so "^Profile$" never matched, the taps were
# skipped and the pictures were taken anyway. Now every picture waits for words only its own screen has
# and is taken ONLY when they are there (runFlow when + assertVisible): a missing picture, never a
# wrong one. ios.yml lists any missing picture.
appId: com.mettleup.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 120000
- takeScreenshot: ios-01-first-screen
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Continue with Google|Get stronger every week|Start fresh|Welcome to MettleUp|Load demo data instead"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: "Continue with Google|Get stronger every week|Start fresh|Welcome to MettleUp|Load demo data instead"
    commands:
      - assertVisible: "Continue with Google|Get stronger every week|Start fresh|Welcome to MettleUp|Load demo data instead"
      - takeScreenshot: ios-02-welcome
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
    optional: true
- tapOn:
    text: "Load demo data instead"
    optional: true
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
    optional: true
- tapOn:
    text: "(?i)^load demo$"
    optional: true
# Workout tab: "Start empty workout" is on no other screen.
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 90000
    optional: true
- runFlow:
    when:
      visible: "Start empty workout"
    commands:
      - assertVisible: "Start empty workout"
      - takeScreenshot: ios-03-workout-tab
# Gym tab: the tab reads "Gym" (or "Gym, New" with a dot); "Scan the poster" / "Join your gym" are its own.
- tapOn:
    text: "^Gym(, New)?$"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Scan the poster|Join your gym|With your gym in the app"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Scan the poster|Join your gym|With your gym in the app"
    commands:
      - assertVisible: "Scan the poster|Join your gym|With your gym in the app"
      - takeScreenshot: ios-05-gym-tab
# Profile tab: the tab reads "Profile, New" while a new feature waits; "Edit profile" is its header button.
- tapOn:
    text: "^Profile(, New)?$"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Edit profile"
    commands:
      - assertVisible: "Edit profile"
      - takeScreenshot: ios-06-profile-tab
# F199 (R-403): no Progress tab any more; its rows ("Your progress") are lower on Profile.
- scrollUntilVisible:
    element:
      id: "progress-row-Charts"
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "progress-row-Charts"
    commands:
      - assertVisible:
          id: "progress-row-Charts"
      - takeScreenshot: ios-04-progress-tab
# Settings: the gear sits in the Profile header (never scrolls away); "Light or dark" and
# "Rest timer and sounds" are Settings rows and nowhere else.
- tapOn:
    text: "^Settings$"
    optional: true
- extendedWaitUntil:
    visible: ".*Light or dark.*|.*Rest timer and sounds.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: ".*Light or dark.*|.*Rest timer and sounds.*"
    commands:
      - assertVisible: ".*Light or dark.*|.*Rest timer and sounds.*"
      - takeScreenshot: ios-07-settings
- scrollUntilVisible:
    element: "Not on iPhone yet.*"
    centerElement: true
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Not on iPhone yet.*"
    commands:
      - assertVisible: "Not on iPhone yet.*"
      - takeScreenshot: ios-08-settings-not-on-iphone
