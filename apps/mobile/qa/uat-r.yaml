# UAT work package 4, part UR (U-M4): the live workout's never-pressed actions, each checked on the
# screen after the press:
#   6. Start while a workout is open: Push Day A is open with set 1 ticked; "Start routine Pull Day A"
#      asks "A workout is already open" (naming the 1 set it would delete). "Resume workout" lands
#      on Push Day A with set 1 still ticked; "Discard and start new" opens Pull Day A with nothing
#      ticked and Push Day A's first exercise gone. Then that workout is discarded.
#   5. In Push Day A again: a set ticked and UNticked keeps its typed weight and reps; set 2 removed
#      with its set menu ("Remove set") and with a swipe ("Delete"), each followed by "Undo": set 2
#      is back with its weight.
#   4. Set 2 removed for good, set 1 ticked, Finish: the summary asks 'Update "Push Day A"?';
#      "Update routine"; the app is stopped and opened again: the routine's page shows one set fewer
#      on that exercise.
# Starts from a fresh install with the demo (gate-demo.yaml), so it runs alone (only=ur) or in the
# whole run (after part M).
appId: com.forgeai.app
---
- runFlow: gate-demo.yaml
# ---------------------------------------------------------------- the routine's first exercise, before
- tapOn:
    text: "^Workout$"
    index: 0
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Push Day A$"
- tapOn: "^Push Day A$"
- extendedWaitUntil:
    visible: "^Start routine$"
    timeout: 20000
- copyTextFrom:
    text: '(\d+ warm-ups? · )?\d+ sets? · .*'
    index: 0
- runScript:
    file: js/uat-sets.js
    env:
      KEY: rsets
- takeScreenshot: ur-01-routine-before
- back
# ---------------------------------------------------------------- 6. start while a workout is open
- runFlow: sub-workout-fresh.yaml
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Start routine Push Day A"
- tapOn: "Start routine Push Day A"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- scrollUntilVisible:
    element: '.*\. Open its history and how-to'
    direction: UP
    timeout: 10000
- copyTextFrom:
    text: '.*\. Open its history and how-to'
    index: 0
- runScript: js/uat-exname.js
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "${output.exRe} set 1 weight, kilograms"
      VALUE: " 50"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "${output.exRe} set 1 reps"
      VALUE: " 5"
- tapOn:
    text: "Mark ${output.exRe} set 1 complete"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Keep [0-9].*"
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
- assertVisible: "${output.exRe} set 1 complete\\. Tap to undo"
- tapOn: "Minimise workout. It keeps running."
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Start routine Pull Day A"
- tapOn: "Start routine Pull Day A"
- extendedWaitUntil:
    visible: "A workout is already open"
    timeout: 15000
- assertVisible: 'Resume it, or discard it and start this one\. Discarding deletes its 1 set\.'
- takeScreenshot: ur-02-already-open
# The sheet's own button (the Workout tab's card behind it says "Resume workout" too).
- tapOn:
    text: "^Resume workout$"
    below:
      text: "A workout is already open"
- extendedWaitUntil:
    visible: "${output.exRe}\\. Open its history and how-to"
    timeout: 20000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "${output.exRe} set 1 complete\\. Tap to undo"
- takeScreenshot: ur-03-resumed
- tapOn: "Minimise workout. It keeps running."
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Start routine Pull Day A"
- tapOn: "Start routine Pull Day A"
- extendedWaitUntil:
    visible: "A workout is already open"
    timeout: 15000
- tapOn: "Discard and start new"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish"
    timeout: 30000
- scrollUntilVisible:
    element: '.*\. Open its history and how-to'
    direction: UP
    timeout: 10000
- assertNotVisible: "${output.exRe}\\. Open its history and how-to"
- assertNotVisible: '.* complete\. Tap to undo'
- takeScreenshot: ur-04-discarded-started-new
# Throw the new one away (the live screen's own link and question).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Discard workout$"
- tapOn: "^Discard workout$"
- extendedWaitUntil:
    visible: 'Discard workout\?'
    timeout: 10000
- tapOn: "^Discard$"
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 30000
# ---------------------------------------------------------------- 5. untick keeps; remove + Undo
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Start routine Push Day A"
- tapOn: "Start routine Push Day A"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "${output.exRe} set 1 weight, kilograms"
      VALUE: " 52.5"
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "${output.exRe} set 1 reps"
      VALUE: " 9"
- tapOn:
    text: "Mark ${output.exRe} set 1 complete"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Keep [0-9].*"
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "${output.exRe} set 1 complete\\. Tap to undo"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Mark ${output.exRe} set 1 complete"
    timeout: 10000
- copyTextFrom: "${output.exRe} set 1 weight, kilograms"
- assertTrue: '${maestro.copiedText == "52.5"}'
- copyTextFrom: "${output.exRe} set 1 reps"
- assertTrue: '${maestro.copiedText == "9"}'
- takeScreenshot: ur-05-unticked-kept
# Set 2 gets its own weight, so "back" can be told from a new empty row.
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "${output.exRe} set 2 weight, kilograms"
      VALUE: " 47.5"
# (a) The set menu's "Remove set", then Undo.
- tapOn: '${output.exRe} set 2(, RPE [\d.]+)?\. Change set type'
- extendedWaitUntil:
    visible: "Remove set"
    timeout: 10000
- tapOn:
    text: "Remove set"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Set removed"
    timeout: 3000
- takeScreenshot: ur-06-set-removed
- tapOn:
    text: "^Undo$"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "${output.exRe} set 2 weight, kilograms"
    timeout: 5000
- copyTextFrom: "${output.exRe} set 2 weight, kilograms"
- assertTrue: '${maestro.copiedText == "47.5"}'
# (b) A swipe to the left shows "Delete"; tapped, then Undo.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Mark ${output.exRe} set 2 complete"
- swipe:
    from:
      text: "Mark ${output.exRe} set 2 complete"
    direction: LEFT
- extendedWaitUntil:
    visible: "Delete ${output.exRe} set 2"
    timeout: 5000
- takeScreenshot: ur-07-swiped
- tapOn:
    text: "Delete ${output.exRe} set 2"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Set removed"
    timeout: 3000
- tapOn:
    text: "^Undo$"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "${output.exRe} set 2 weight, kilograms"
    timeout: 5000
- copyTextFrom: "${output.exRe} set 2 weight, kilograms"
- assertTrue: '${maestro.copiedText == "47.5"}'
- takeScreenshot: ur-08-undo-back
# ---------------------------------------------------------------- 4. one set fewer -> Update routine
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '${output.exRe} set 2(, RPE [\d.]+)?\. Change set type'
- tapOn: '${output.exRe} set 2(, RPE [\d.]+)?\. Change set type'
- extendedWaitUntil:
    visible: "Remove set"
    timeout: 10000
- tapOn: "Remove set"
- assertNotVisible: "${output.exRe} set ${output.rsets} weight, kilograms"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Mark ${output.exRe} set 1 complete"
- tapOn:
    text: "Mark ${output.exRe} set 1 complete"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Keep [0-9].*"
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Finish workout$"
- tapOn:
    text: "^Finish workout$"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Leave them out"
    optional: true
- tapOn:
    text: "^Finish workout$"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: 'Update "Push Day A"\?'
    timeout: 30000
- assertVisible: 'You did a different number of sets on .*${output.exRe}.*'
- takeScreenshot: ur-09-update-routine-question
- tapOn: "Update routine"
- extendedWaitUntil:
    visible: '"Push Day A" is updated for next time\.'
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Done$"
- tapOn: "^Done$"
# Reopened after the app is stopped: the routine itself changed.
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 60000
- tapOn:
    text: "^Workout$"
    index: 0
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Push Day A$"
- tapOn: "^Push Day A$"
- extendedWaitUntil:
    visible: "^Start routine$"
    timeout: 20000
- copyTextFrom:
    text: '(\d+ warm-ups? · )?\d+ sets? · .*'
    index: 0
- runScript:
    file: js/uat-sets.js
    env:
      KEY: rsetsAfter
- takeScreenshot: ur-10-routine-after
- assertTrue: '${output.rsetsAfter == output.rsets - 1}'
- back
