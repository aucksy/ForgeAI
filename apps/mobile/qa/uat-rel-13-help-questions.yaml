# Part UAT, flow 13: "Your questions" (R-319 item 10, owner 4 Nov 2026: "where do I see the answer as a
# member? ... There is no record of the answers in my app today"). After flow 6 (the app is set up).
#  - Settings -> "Help and feedback" shows "Your questions" under the Send button.
#  - A question sent from here shows "Sending. The answer usually takes a few seconds." and then stays in
#    "Your questions" with its answer, or with "The MettleUp team will reply here." when there is no AI
#    answer (until about 12 Nov 2026 the help box's AI credit is low, so the plain thanks is expected).
#  - Still there after the app starts again (kept on the phone).
# The team's reply ("Reply from the MettleUp team", "New") needs a reply typed in HQ; checked by hand
# once the panel's 0009 is applied (see docs/plans/R-319-alerts.md, "Checks").
# Note: this sends ONE real message to MettleUp's help box, marked as a QA message.
appId: com.mettleup.app
---
- runFlow: sub-back-to-tabs.yaml
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Help and feedback"
- extendedWaitUntil:
    visible: "^Send$"
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Your questions$"
- takeScreenshot: rel-130-your-questions-empty
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Type here, or tap Speak$"
- tapOn: "^Type here, or tap Speak$"
- inputText: "QA check: how do I pause my plan"
- hideKeyboard
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Send$"
- tapOn: "^Send$"
# The answer (or the plain thanks) can take up to about 40 s when the help box is slow.
- extendedWaitUntil:
    notVisible: "^Sending\\. The answer usually takes a few seconds\\.$"
    timeout: 60000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^QA check: how do I pause my plan$"
- assertVisible: "^Your questions$|^QA check: how do I pause my plan$"
- extendedWaitUntil:
    visible: "^Did this solve it\\?$|^The MettleUp team will reply here\\.$|^Waiting for the answer\\. It usually takes a few seconds\\.$"
    timeout: 20000
- takeScreenshot: rel-131-your-questions-after-send
# Kept on the phone: still listed after a restart.
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- runFlow: sub-back-to-tabs.yaml
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Help and feedback"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^QA check: how do I pause my plan$"
- takeScreenshot: rel-132-your-questions-after-restart
- runFlow: sub-back-to-tabs.yaml
