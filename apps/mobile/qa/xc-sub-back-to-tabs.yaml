# Copied for the phone-conditions run (UAT WP7, run-conditions.sh) from sub-back-to-tabs.yaml, so a change to the
# phone test parts never moves these flows. Same behaviour.
appId: com.mettleup.app
---
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            notVisible: "^Profile$"
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 3000
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 15000
