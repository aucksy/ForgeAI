# v0.27.0 device QA, part I — the rest of Phase 5 (runs after parts A–H). Strong import (an
# older Strong file in pounds and miles, pushed to Downloads by the script; since Phase 1 it is
# the import over the demo: the demo goes, the member gives a name; since audit Phase 4 the
# kg-or-lb question shows a real set and nothing is chosen for the member) → the same Strong file
# through "Import from Hevy" reads as Strong and is all already here → Units "lb, miles"
# → the imported bench in lb and the run's pace per mile → Health Connect: Connect, allow on
# Health Connect's own screen, send past workouts → workout reminders → a home-screen widget
# → a workout logged in lb and finished (sent to Health Connect). Audit Phase 6: the "Around your
# phone" rows are checked by their real texts (src/tracker/phone/PhoneCard.tsx, reminders.ts
# reminderCaption, healthConnect.ts sendResultText): Health Connect "On. Each workout …", the
# reminders row off and on (day picker + "Reminder time … Change"), the widgets row before and
# after a widget is placed ("1 on your home screen. …"). Part I2 (phase6-i2.yaml) checks the
# reminders row with notifications blocked.
# Redesign R6: the imports are Settings → Export & import; Units, Health Connect, Notifications
# (reminders) and Widgets are their own Settings pages (sub-settings-page.yaml). History in lb is
# the Profile feed; the exercise library is Profile → Exercises.
appId: com.forgeai.app
---
# v0.39.0: Maestro's launchApp ALLOWS EVERY PERMISSION by default (pm grant on each one), which
# undid the script's revoke and is why Connect was never pressed with nothing allowed. Health
# Connect's two permissions are denied here; everything else stays allowed.
- launchApp:
    permissions:
      all: allow
      android.permission.health.WRITE_EXERCISE: deny
      android.permission.health.WRITE_ACTIVE_CALORIES_BURNED: deny
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
# Part H2 leaves its workout open: discard it first (its own Discard, then the dialog's).
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "Start empty workout|Resume workout"
    timeout: 30000
- runFlow:
    when:
      visible: "Resume workout"
    commands:
      - tapOn: "^Discard workout$"
      - tapOn: "^Discard$"
      - extendedWaitUntil:
          visible: "Start empty workout"
          timeout: 15000
# ---------------------------------------------------------------- import from Strong
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Export & import"
- scrollUntilVisible:
    element: "Import from Strong"
    centerElement: true
    timeout: 30000
- tapOn: "Import from Strong"
- extendedWaitUntil:
    visible: "Choose Strong file"
    timeout: 15000
- takeScreenshot: 120-strong-import
- tapOn: "Choose Strong file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-strong).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-strong.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-strong.*"
- extendedWaitUntil:
    visible: "This file does not say its units.*"
    timeout: 20000
# Audit Phase 4 (IM-06): asked with a real set from the file (its heaviest: Squat 185), and
# nothing is chosen for the member — the import button waits for the answer.
- assertVisible: 'Squat \(Barbell\) 185 — kg or lb\?'
- takeScreenshot: 120b-strong-units-question
- scrollUntilVisible:
    element: "Choose kg or lb first"
    centerElement: true
    timeout: 15000
- scrollUntilVisible:
    element: "Pounds and miles"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: "Pounds and miles"
# Phase 1 (DS-05 / IM-01): part A loaded the demo, so this first import is over the demo. The
# preview says the whole demo goes first (the member's own workouts from parts A–H stay) and asks
# for the member's name (required: an empty name is refused with "Your name, please."). The name
# box is found by its hint; "Your name" is also the label above it.
- scrollUntilVisible:
    element: "First and last name"
    centerElement: true
    timeout: 15000
- assertVisible: "The demo goes first"
- assertVisible: ".*Your own \\d+ workouts? stays?\\."
- tapOn: "First and last name"
- inputText: "Test Member"
- hideKeyboard
# Replace / Merge sit below the demo card. Merge is already chosen (own workouts are here); tap it
# anyway, the way a member confirms the choice. IM-09: the button says what will happen
# ("Import 2 workouts": both are new), no longer "Merge 2 workouts".
- scrollUntilVisible:
    element: "^Merge$"
    centerElement: true
    timeout: 15000
- tapOn: "^Merge$"
- takeScreenshot: 121-strong-preview
- scrollUntilVisible:
    element: "Import 2 workouts"
    centerElement: true
    timeout: 15000
- tapOn: "Import 2 workouts"
- extendedWaitUntil:
    visible: "2 workouts imported"
    timeout: 30000
# The demo's removal can be undone on this screen (a safety copy was taken first).
- assertVisible: "Undo import"
- takeScreenshot: 122-strong-imported
- tapOn: "^Done$"
# ---------------------------------------------------------------- a Strong file through "Import from Hevy"
# Audit Phase 4 (IM-18): a file is told apart by its content — the Strong file picked through
# "Import from Hevy" reads as Strong (the screen turns into "Import from Strong"); IM-09: it was
# just imported, so "All 2 workouts are already here". Closed without importing.
# Done closes the import: back on Settings → Export & import.
- scrollUntilVisible:
    element: "Import from Hevy"
    centerElement: true
    timeout: 30000
- tapOn: "Import from Hevy"
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 15000
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-strong).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-strong.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-strong.*"
- extendedWaitUntil:
    visible: "All 2 workouts are already here"
    timeout: 20000
- assertVisible: "Import from Strong"
- assertNotVisible: "Migrate from Hevy"
- takeScreenshot: 122b-strong-through-hevy-all-here
- tapOn: "Go back"
# ---------------------------------------------------------------- pounds and miles
# Back on Export & import → Settings → Units.
- extendedWaitUntil:
    visible: "Import from Strong"
    timeout: 15000
- back
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Units"
- extendedWaitUntil:
    visible: "lb, miles"
    timeout: 15000
- tapOn: "lb, miles"
- takeScreenshot: 123-units-lb-miles
# Units → Settings → Profile: the feed (History's list until redesign R2) in lb.
- back
- back
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 15000
- scrollUntilVisible:
    element: "More for .*"
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 124-profile-feed-lb
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Exercises"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " outdoor run"
- hideKeyboard
- tapOn:
    text: "View Outdoor Run"
    index: 0
# The exercise page opens on Summary, which leads with "Last time · Best".
- extendedWaitUntil:
    visible: "Last time.*"
    timeout: 15000
- scrollUntilVisible:
    element: '.*/mi.*'
    centerElement: true
    timeout: 20000
- takeScreenshot: 125-run-pace-per-mile
- back
- back
# ---------------------------------------------------------------- around your phone
# Redesign R6: Settings lists Health Connect (only once the app has read its state, so it is
# waited for), Notifications and Widgets as pages of their own.
- runFlow:
    file: sub-settings-open.yaml
- scrollUntilVisible:
    element: "^Health Connect$"
    centerElement: true
    timeout: 30000
- takeScreenshot: 126-settings-list
- tapOn: "^Health Connect$"
# v0.39.0: the script took Health Connect access AWAY before this part (the install grants it),
# so the page must say "Connect" and Connect must really open the system's permission screen.
# Before v0.39.0 this step accepted "Turn on" and an optional permission screen, so it never saw
# that Connect did nothing on Android 14+ (the screen never opened). Both are required now.
- extendedWaitUntil:
    visible: "^Connect$"
    timeout: 15000
- tapOn:
    text: "^Connect$"
    below:
      text: "Health Connect"
- extendedWaitUntil:
    visible: '(?i)^(allow all|allow|get started)$'
    timeout: 20000
- tapOn:
    text: '(?i)^(get started|continue|next)$'
    optional: true
- takeScreenshot: 127-health-connect-permissions
- tapOn:
    text: '(?i)^allow all$'
    optional: true
- tapOn: '(?i)^allow$'
- extendedWaitUntil:
    visible: "Send past workouts"
    timeout: 20000
# Audit Phase 6 (PH-03): the row says it is on, and what goes where.
- assertVisible: 'On\. Each workout you finish goes to Health Connect with its calories \(an estimate\), so Google Fit and Samsung Health show it\.'
- takeScreenshot: 128-health-connect-on
- tapOn: "Send past workouts"
# PH-03: the line under the button says what "Send past workouts" really did. The import above
# replaced the demo, so the member's own workouts are sent (not "Nothing sent. Workouts on demo
# data are never sent.").
- extendedWaitUntil:
    visible: 'Sent \d+ workouts? to Health Connect\.'
    timeout: 30000
- takeScreenshot: 129-health-connect-sent
# ---------------------------------------------------------------- reminders
# Health Connect → Settings → Notifications.
- back
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Notifications"
- scrollUntilVisible:
    element: "Workout reminders"
    centerElement: true
    timeout: 15000
# Off, the row says what it would do (audit Phase 6: on the usual days, at the usual time).
- assertVisible: 'A quiet reminder on your usual training days, at your usual time\.'
# Two "Workout reminders" on screen: the row's title (not tappable) and its switch (named after
# the row). Tap one; if the row still reads "off", tap the other.
- tapOn:
    text: "Workout reminders"
    index: 0
- runFlow:
    when:
      visible: 'A quiet reminder on your usual training days, at your usual time\.'
    commands:
      - tapOn:
          text: "Workout reminders"
          index: 1
          optional: true
- tapOn:
    text: '(?i)^allow$'
    optional: true
# On: the weekly pattern (a day picker, Monday to Sunday) and a time, with the next reminder.
- extendedWaitUntil:
    visible: 'Next: .*\. None on a day you already trained or while a workout is open\.'
    timeout: 15000
- scrollUntilVisible:
    element: 'Remind me on Monday'
    timeout: 15000
- assertVisible: 'Remind me on Sunday'
- scrollUntilVisible:
    element: 'Reminder time \d{1,2}:\d{2} (am|pm)\. Change'
    timeout: 15000
# Notifications are allowed (part A allowed every permission), so no "Turn on notifications".
- assertNotVisible: "Turn on notifications"
- assertNotVisible: 'Notifications are off for ForgeAI, so no reminder can arrive\.'
- takeScreenshot: 130-reminders-on
# ---------------------------------------------------------------- widgets
# Notifications → Settings → Widgets.
- back
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Widgets"
- scrollUntilVisible:
    element: "Add Today"
    centerElement: true
    timeout: 15000
# None on the home screen yet: the row says what the widgets show, with both Add buttons.
- assertVisible: "Home-screen widgets"
- assertVisible: "Today's workout and your week, on your home screen\\."
- assertVisible: "Add This week"
- tapOn: "Add Today"
- extendedWaitUntil:
    visible: '(?i).*(add to home screen|add automatically|^add$).*'
    timeout: 15000
- takeScreenshot: 131-widget-add-dialog
- tapOn: '(?i)^(add to home screen|add)$'
- pressKey: Home
- extendedWaitUntil:
    visible: '^TODAY$'
    timeout: 15000
- takeScreenshot: 132-home-screen-widget
# Back in the app, the Widgets page counts the one just placed (re-read on every return). The app
# comes back on that page; if Android restarted it, it opens on the Workout tab: go there again.
- launchApp:
    stopApp: false
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Home-screen widgets|^Profile$"
    timeout: 30000
- runFlow:
    when:
      notVisible: "Home-screen widgets"
    commands:
      - runFlow:
          file: sub-settings-page.yaml
          env:
            PAGE: "Widgets"
- extendedWaitUntil:
    visible: '\d+ on your home screen\. Add another, or long-press your home screen . Widgets . ForgeAI\.'
    timeout: 15000
- takeScreenshot: 132b-widgets-row-counts-it
# ---------------------------------------------------------------- a workout in lb
# Widgets → Settings → Profile, then the Workout tab.
- back
- back
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 15000
- tapOn:
    text: "^Workout$"
    index: 0
- scrollUntilVisible:
    element: "Start empty workout"
    centerElement: true
    timeout: 30000
- tapOn: "Start empty workout"
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " bench press"
- hideKeyboard
# Phase 2 (LW-15): tick the exercise in the picker, then "Add 1".
- tapOn:
    text: "Select Barbell Bench Press"
    index: 0
- tapOn: "Add 1"
# LW-27: "Barbell Bench Press set 1 weight, pounds" / "… set 1 reps".
- extendedWaitUntil:
    visible: ".* set 1 weight, pounds"
    timeout: 15000
- tapOn:
    text: ".* set 1 weight, pounds"
    below:
      text: "More for Barbell Bench Press"
- eraseText
- inputText: " 145"
- tapOn:
    text: ".* set 1 reps"
    below:
      text: "More for Barbell Bench Press"
- eraseText
- inputText: " 5"
- hideKeyboard
- takeScreenshot: 133-set-in-lb
- tapOn:
    text: "Mark .* set 1 complete"
    index: 0
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
    waitToSettleTimeoutMs: 300
# Phase 2 (LW-02): Finish opens the "Finish workout?" sheet; its own button (above its
# "Keep going"; the screen's button sits behind it) saves.
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# An empty workout has no routine to update; if the summary ever asks (LW-11, the app's own
# sheet), keep the routine as it is: the button under "Update routine".
- tapOn:
    text: "Keep original"
    below:
      text: "Update routine"
    optional: true
- takeScreenshot: 134-finish-in-lb
# 15 Oct 2026: photos on a workout (as Hevy). The finish screen's Photos box opens the camera /
# gallery choice; closed again without picking (a picker on an emulator is not a member's photo).
- scrollUntilVisible:
    element: "Add photo"
    centerElement: true
    timeout: 15000
- assertVisible: "0 of 4"
- tapOn: "Add photo"
- extendedWaitUntil:
    visible: "Add a photo to this workout"
    timeout: 10000
- assertVisible: "Take a photo"
- assertVisible: "Choose from gallery"
- takeScreenshot: 134b-workout-photo-choice
- back
