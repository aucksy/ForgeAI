# Phone conditions (UAT WP7), condition 2 setup (online): join the run's own fresh gym by typing its
# code (CODE, gym name GYM); the shop lists the products the owner added (QA Bottle, QA Band,
# QA Rope). Same steps as WP6's xj-1-join-order.yaml.
# R-77: in no gym there is no Shop tab: the join is in Settings → Your gym (sub-join-gym.yaml), and
# it lands on the Workout tab; then the gym's tab ("Shop" once its list has arrived).
appId: com.forgeai.app
---
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- runFlow:
    file: sub-join-gym.yaml
    env:
      CODE: "${CODE}"
      NAME: "QA Member"
      GYM: "${GYM}"
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- extendedWaitUntil:
    visible: "QA Bottle, .*"
    timeout: 45000
- extendedWaitUntil:
    visible: "^Shop$"
    timeout: 20000
- takeScreenshot: xc2-00-joined
