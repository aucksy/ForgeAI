# Phone conditions (UAT WP7), condition 2 setup (online): join the run's own fresh gym by typing its
# code (CODE, gym name GYM); the shop lists the products the owner added (QA Bottle, QA Band,
# QA Rope). Same steps as WP6's xj-1-join-order.yaml.
# The join is on the Gym tab's "Join your gym" screen (sub-join-gym.yaml, Release A), and it lands
# on the Workout tab; then the Gym tab (its "Shop" part once the list has arrived).
appId: com.mettleup.app
---
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- runFlow:
    file: sub-join-gym.yaml
    env:
      CODE: "${CODE}"
      NAME: "QA Member"
      GYM: "${GYM}"
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
# Release A: the Gym tab, membership and Check in first; its "Shop" part once the list arrives.
- scrollUntilVisible:
    element: "QA Bottle, .*"
    timeout: 45000
- scrollUntilVisible:
    element: "^Shop$"
    direction: UP
    timeout: 20000
- takeScreenshot: xc2-00-joined
