# Cross-role journeys 5 and 6, last member step: leave gym B. The question says the app goes back
# to ForgeAI's colours, and it does: the gym's name is gone and the Gym tab offers "Join your gym"
# again (Release A). The phone ends in no gym, as it started.
appId: com.mettleup.app
---
- runFlow: xj-sub-shop.yaml
- extendedWaitUntil:
    visible: "Your gym: ${GYM_B}"
    timeout: 45000
# Release A (A4): Leave is in Settings → Your gym only.
- runFlow: sub-leave-gym.yaml
- extendedWaitUntil:
    visible: "Leave ${GYM_B}\\?"
    timeout: 15000
- assertVisible: ".*goes back to MettleUp's colours.*"
- tapOn: "^Leave gym$"
- extendedWaitUntil:
    notVisible: "Your gym: ${GYM_B}"
    timeout: 20000
- extendedWaitUntil:
    visible: "^Profile$|^Join your gym$"
    timeout: 20000
- runFlow: sub-gym-none.yaml
- takeScreenshot: xj6-05-left-forgeai-look
