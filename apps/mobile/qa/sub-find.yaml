# Sub-flow (called with runFlow; not a part of its own): bring FIND (a regex for a visible text)
# onto the screen, centred, wherever it is on the page: down first, then up. Then it must be
# visible: this is a scroll before a check, never a weaker check.
#   - runFlow:
#       file: sub-find.yaml
#       env:
#         FIND: "Track RPE"
# Audit v2 (16 Oct 2026): on the owner's phone (360 dp, font 1.3) much of what a flow checks sits
# below the screen's edge, and a plain assertVisible / extendedWaitUntil never scrolls (trap 7).
# Centred (trap 12/13): a sliver at the edge, or a row under the status bar, would pass but not tap.
# No `env:` default here (trap 22).
appId: com.mettleup.app
---
- scrollUntilVisible:
    element: "${FIND}"
    centerElement: true
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "${FIND}"
    commands:
      - scrollUntilVisible:
          element: "${FIND}"
          direction: UP
          centerElement: true
          timeout: 20000
- assertVisible: "${FIND}"
