# v0.28.0 device QA, part J — the member's own Hevy routines (runs after parts A–I). A real-format
# Hevy .csv (text dates, which v0.27.0 read as no workouts) is imported; then the routines found
# in it are checked one per screen, followed, and land in the folder "From Hevy" (a tap on a routine
# opens its preview). The same file imported again says "All 12 workouts are already here", adds
# nothing, and updates "From Hevy" (no second folder). Since Phase 1 the demo is
# already gone (part I's import removed it), so this preview has no demo card. Then: Home's Today card
# opens the day's exercises first, and "Add exercise" inside a workout offers "Create “…”" (a
# distance exercise in metres), which lands in the workout.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- tapOn: "^Profile$"
# Audit Phase 7: the imports sit inside Profile's folded "Gym, backup and data".
- runFlow:
    file: sub-profile-fold-open.yaml
- scrollUntilVisible:
    element: "Import from Hevy"
    centerElement: true
    timeout: 90000
- tapOn: "Import from Hevy"
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 15000
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-hevy.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy.*"
- extendedWaitUntil:
    visible: "^Date range$"
    timeout: 20000
# Audit Phase 4 (IM-08): the date range carries its years — 3 "Legs Old" in March 2024 to
# September 2026 — so years of history never read like months.
- assertVisible: "Mar 2024 → Sep 2026"
# Every name in this file is one ForgeAI knows (some under another name): nothing to ask.
- assertNotVisible: '.* new to ForgeAI'
# Phase 1 (DS-05 / IM-01): part I's import took the demo away, so this is an ordinary import over
# the member's own data: no "The demo goes first" card, no name box.
- assertNotVisible: "The demo goes first"
- scrollUntilVisible:
    element: "^Merge$"
    centerElement: true
    timeout: 15000
- tapOn: "^Merge$"
- takeScreenshot: 140-hevy-csv-preview
# IM-09: the button says what will happen ("Import 12 workouts": all are new).
- scrollUntilVisible:
    element: "Import 12 workouts"
    centerElement: true
    timeout: 15000
- tapOn: "Import 12 workouts"
- extendedWaitUntil:
    visible: "12 workouts imported"
    timeout: 30000
- scrollUntilVisible:
    element: "Bring my routines in"
    centerElement: true
    timeout: 15000
- takeScreenshot: 141-hevy-imported-routines-next
- tapOn: "Bring my routines in"
# ---------------------------------------------------------------- 1. routines found
- extendedWaitUntil:
    visible: "We found 2 routines in your Hevy workouts"
    timeout: 15000
- assertNotVisible: "Morning workout.*"
- tapOn: "1 older name.*"
- extendedWaitUntil:
    visible: "Legs Old"
    timeout: 5000
- takeScreenshot: 142-routines-found
- tapOn: "Check these 2"
# ---------------------------------------------------------------- 2. one routine per screen
- extendedWaitUntil:
    visible: "Also done in Push A"
    timeout: 10000
- assertVisible: "1 of 2"
- assertVisible: "Triceps Pushdown"
- tapOn: "Chest Fly \\(Machine\\)"
- takeScreenshot: 143-check-push-a
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "2 of 2"
    timeout: 10000
- assertVisible: "Pull A"
- takeScreenshot: 144-check-pull-a
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
# ---------------------------------------------------------------- 3. follow them?
- extendedWaitUntil:
    visible: "Follow these as your plan\\?"
    timeout: 10000
- assertVisible: ".*in the order you do them: Push A, Pull A.*"
- takeScreenshot: 145-follow-question
- tapOn: "Follow them"
# ---------------------------------------------------------------- 4. done
- extendedWaitUntil:
    visible: "2 routines in From Hevy"
    timeout: 15000
- takeScreenshot: 146-routines-saved
- tapOn: "Open routines"
- extendedWaitUntil:
    visible: "From Hevy"
    timeout: 15000
- takeScreenshot: 147-from-hevy-folder
- scrollUntilVisible:
    element: "Push A"
    centerElement: true
    timeout: 30000
# Audit Phase 4: a compact row with a small Start; the row opens the routine's calm preview.
- assertVisible: "Start Push A"
- tapOn: "Push A"
# Hevy's "Chest Fly (Machine)" is the library's Pec Deck Fly (the history landed there too).
- extendedWaitUntil:
    visible: 'Push Day · \d+ exercises · From Hevy.*'
    timeout: 15000
- assertVisible: "Start routine"
# v0.29.1: five exercises now (Skull Crusher added to the file), so it is below the fold.
- scrollUntilVisible:
    element: "Pec Deck Fly"
    centerElement: true
    timeout: 20000
- takeScreenshot: 148-push-a-routine
- back
- back
# ---------------------------------------------------------------- Home: the next routine
- tapOn: "^Home$"
- takeScreenshot: 149-home-today
# Audit Phase 3 / Phase 7: the answer card's link names where it goes — "See exercises" under
# "Next: <routine>" (whose own button is "Start"), or "See what’s next" once today's routine is
# done ("Done today: Push A" / "Next: Pull A"); both open the Today page. Never "Start workout"
# on a tap that only opens another screen (SH-23).
- assertNotVisible: "Start workout"
- runFlow:
    when:
      visible: "See exercises|See what.s next"
    commands:
      - tapOn: "See exercises|See what.s next"
      - extendedWaitUntil:
          visible: "Change this routine"
          timeout: 15000
      - takeScreenshot: 149b-today-preview
      - back
# ---------------------------------------------------------------- the same file again
- tapOn: "^Profile$"
# The fold should still be open (the Profile tab kept its screen); opened again only if shut.
- runFlow:
    file: sub-profile-fold-open.yaml
- scrollUntilVisible:
    element: "Import from Hevy"
    centerElement: true
    timeout: 90000
- tapOn: "Import from Hevy"
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-hevy.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy.*"
- extendedWaitUntil:
    visible: "Already in ForgeAI"
    timeout: 20000
# Audit Phase 4 (IM-09): a file already imported says so first, and offers no "Merge 12" that
# would add 0 — straight on to the routines.
- scrollUntilVisible:
    element: "All 12 workouts are already here"
    centerElement: true
    timeout: 15000
- assertNotVisible: "(Merge|Import) 12 workouts"
- takeScreenshot: 150-reimport-preview
- scrollUntilVisible:
    element: "Bring my routines in"
    centerElement: true
    timeout: 15000
- tapOn: "Bring my routines in"
- tapOn: "Check these 2"
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Follow these as your plan\\?"
    timeout: 10000
- tapOn: "Follow them"
- extendedWaitUntil:
    visible: ".*From Hevy is updated from this file.*"
    timeout: 15000
- takeScreenshot: 151-reimport-updated
- tapOn: "Open routines"
- extendedWaitUntil:
    visible: "From Hevy"
    timeout: 15000
- takeScreenshot: 152-one-from-hevy-folder
- back
# ---------------------------------------------------------------- the Workout tab's "See the exercises"
- tapOn: "^Workout$"
- runFlow:
    when:
      visible: "See the exercises"
    commands:
      - tapOn: "See the exercises"
      - extendedWaitUntil:
          visible: "Change this routine"
          timeout: 15000
      - takeScreenshot: 153-today-preview-from-workout
      - back
# ---------------------------------------------------------------- "Create “…”" inside a workout
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 15000
- tapOn: "Start empty workout"
- scrollUntilVisible:
    element: "Add exercise"
    centerElement: true
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: "Sled Drag QA"
- hideKeyboard
- extendedWaitUntil:
    visible: "Create “Sled Drag QA”"
    timeout: 10000
- takeScreenshot: 154-create-offer
- tapOn: "Create “Sled Drag QA”"
- extendedWaitUntil:
    visible: "How you log it"
    timeout: 15000
- tapOn: "^Distance$"
- extendedWaitUntil:
    visible: "Distance in"
    timeout: 5000
- tapOn: "^Metres$"
- scrollUntilVisible:
    element: "^Abs$"
    centerElement: true
    timeout: 10000
- tapOn: "^Abs$"
- scrollUntilVisible:
    element: "^Other$"
    centerElement: true
    timeout: 10000
- tapOn: "^Other$"
- takeScreenshot: 155-create-form-metres
- scrollUntilVisible:
    element: "Save and add to workout"
    centerElement: true
    timeout: 15000
- tapOn: "Save and add to workout"
- extendedWaitUntil:
    visible: "Sled Drag QA"
    timeout: 15000
- assertVisible: "^M$"
- takeScreenshot: 156-created-in-workout
- scrollUntilVisible:
    element: "Discard workout"
    centerElement: true
    timeout: 15000
- tapOn: "Discard workout"
- tapOn: "^Discard$"
