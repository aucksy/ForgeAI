# v0.28.0 device QA, part J — the member's own Hevy routines (runs after parts A–I). A real-format
# Hevy .csv (text dates, which v0.27.0 read as no workouts) is imported; then the routines found
# in it are checked one per screen, followed, and land in the folder "From Hevy". The same file
# imported again adds nothing and updates "From Hevy" (no second folder). Then: Home's Today card
# opens the day's exercises first, and "Add exercise" inside a workout offers "Create “…”" (a
# distance exercise in metres), which lands in the workout.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- tapOn: "^Profile$"
- scrollUntilVisible:
    element: "Import from Hevy"
    centerElement: true
    timeout: 90000
- tapOn: "Import from Hevy"
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 15000
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-hevy.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy.*"
- extendedWaitUntil:
    visible: "^Merge$"
    timeout: 20000
- tapOn: "^Merge$"
- takeScreenshot: 140-hevy-csv-preview
- scrollUntilVisible:
    element: "Merge 12 workouts"
    centerElement: true
    timeout: 15000
- tapOn: "Merge 12 workouts"
- extendedWaitUntil:
    visible: "12 workouts imported"
    timeout: 30000
- scrollUntilVisible:
    element: "Bring my routines in"
    centerElement: true
    timeout: 15000
- takeScreenshot: 141-hevy-imported-routines-next
- tapOn: "Bring my routines in"
# ---------------------------------------------------------------- 1. routines found
- extendedWaitUntil:
    visible: "We found 2 routines in your Hevy workouts"
    timeout: 15000
- assertNotVisible: "Morning workout.*"
- tapOn: "1 older name.*"
- extendedWaitUntil:
    visible: "Legs Old"
    timeout: 5000
- takeScreenshot: 142-routines-found
- tapOn: "Check these 2"
# ---------------------------------------------------------------- 2. one routine per screen
- extendedWaitUntil:
    visible: "Also done in Push A"
    timeout: 10000
- assertVisible: "1 of 2"
- assertVisible: "Triceps Pushdown"
- tapOn: "Chest Fly \\(Machine\\)"
- takeScreenshot: 143-check-push-a
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "2 of 2"
    timeout: 10000
- assertVisible: "Pull A"
- takeScreenshot: 144-check-pull-a
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
# ---------------------------------------------------------------- 3. follow them?
- extendedWaitUntil:
    visible: "Follow these as your plan\\?"
    timeout: 10000
- assertVisible: ".*in the order you do them: Push A, Pull A.*"
- takeScreenshot: 145-follow-question
- tapOn: "Follow them"
# ---------------------------------------------------------------- 4. done
- extendedWaitUntil:
    visible: "2 routines in From Hevy"
    timeout: 15000
- takeScreenshot: 146-routines-saved
- tapOn: "Open routines"
- extendedWaitUntil:
    visible: "From Hevy"
    timeout: 15000
- takeScreenshot: 147-from-hevy-folder
- scrollUntilVisible:
    element: "Push A"
    centerElement: true
    timeout: 30000
- tapOn: "Push A"
# Hevy's "Chest Fly (Machine)" is the library's Pec Deck Fly (the history landed there too).
- extendedWaitUntil:
    visible: "Push Day · From Hevy"
    timeout: 15000
# v0.29.1: five exercises now (Skull Crusher added to the file), so it is below the fold.
- scrollUntilVisible:
    element: "Pec Deck Fly"
    centerElement: true
    timeout: 20000
- takeScreenshot: 148-push-a-routine
- back
- back
# ---------------------------------------------------------------- Home: the next routine
- tapOn: "^Home$"
- takeScreenshot: 149-home-today
- runFlow:
    when:
      visible: "See workout"
    commands:
      - tapOn: "See workout"
      - extendedWaitUntil:
          visible: "Change this routine"
          timeout: 15000
      - takeScreenshot: 149b-today-preview
      - back
# ---------------------------------------------------------------- the same file again
- tapOn: "^Profile$"
- scrollUntilVisible:
    element: "Import from Hevy"
    centerElement: true
    timeout: 90000
- tapOn: "Import from Hevy"
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-hevy.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy.*"
- extendedWaitUntil:
    visible: "Already in ForgeAI"
    timeout: 20000
- takeScreenshot: 150-reimport-preview
- scrollUntilVisible:
    element: "Merge 12 workouts"
    centerElement: true
    timeout: 15000
- tapOn: "Merge 12 workouts"
- extendedWaitUntil:
    visible: "0 workouts imported"
    timeout: 30000
- scrollUntilVisible:
    element: "Bring my routines in"
    centerElement: true
    timeout: 15000
- tapOn: "Bring my routines in"
- tapOn: "Check these 2"
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Follow these as your plan\\?"
    timeout: 10000
- tapOn: "Follow them"
- extendedWaitUntil:
    visible: ".*From Hevy now matches this file.*"
    timeout: 15000
- takeScreenshot: 151-reimport-updated
- tapOn: "Open routines"
- extendedWaitUntil:
    visible: "From Hevy"
    timeout: 15000
- takeScreenshot: 152-one-from-hevy-folder
- back
# ---------------------------------------------------------------- the Workout tab's "See the exercises"
- tapOn: "^Workout$"
- runFlow:
    when:
      visible: "See the exercises"
    commands:
      - tapOn: "See the exercises"
      - extendedWaitUntil:
          visible: "Change this routine"
          timeout: 15000
      - takeScreenshot: 153-today-preview-from-workout
      - back
# ---------------------------------------------------------------- "Create “…”" inside a workout
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 15000
- tapOn: "Start empty workout"
- scrollUntilVisible:
    element: "Add exercise"
    centerElement: true
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: "Sled Drag QA"
- hideKeyboard
- extendedWaitUntil:
    visible: "Create “Sled Drag QA”"
    timeout: 10000
- takeScreenshot: 154-create-offer
- tapOn: "Create “Sled Drag QA”"
- extendedWaitUntil:
    visible: "How you log it"
    timeout: 15000
- tapOn: "^Distance$"
- extendedWaitUntil:
    visible: "Distance in"
    timeout: 5000
- tapOn: "^Metres$"
- scrollUntilVisible:
    element: "^Abs$"
    centerElement: true
    timeout: 10000
- tapOn: "^Abs$"
- scrollUntilVisible:
    element: "^Other$"
    centerElement: true
    timeout: 10000
- tapOn: "^Other$"
- takeScreenshot: 155-create-form-metres
- scrollUntilVisible:
    element: "Save and add to workout"
    centerElement: true
    timeout: 15000
- tapOn: "Save and add to workout"
- extendedWaitUntil:
    visible: "Sled Drag QA"
    timeout: 15000
- assertVisible: "^M$"
- takeScreenshot: 156-created-in-workout
- scrollUntilVisible:
    element: "Discard workout"
    centerElement: true
    timeout: 15000
- tapOn: "Discard workout"
- tapOn:
    id: "android:id/button1"
