# v0.28.0 device QA, part J — the member's own Hevy routines (runs after parts A–I). A real-format
# Hevy .csv (text dates, which v0.27.0 read as no workouts) is imported; then the routines found
# in it are checked one per screen, followed, and land in the folder "From Hevy" (a tap on a routine
# opens its preview). The same file imported again says "All 12 workouts are already here", adds
# nothing, and updates "From Hevy" (no second folder). Since Phase 1 the demo is
# already gone (part I's import removed it), so this preview has no demo card. Then: the Workout
# tab's Up next card opens the day's exercises first, and "Add exercise" inside a workout offers
# "Create “…”" (a distance exercise in metres), which lands in the workout.
# Redesign: the imports are Settings → Export & import (R6); "Open routines" lands on the Workout
# tab, where folders sit inline as "From Hevy (2)" with routine cards (R4); Home is gone (R1).
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Bring in from Hevy or Strong"
- scrollUntilVisible:
    element: "Import from Hevy"
    centerElement: true
    timeout: 30000
- tapOn: "Import from Hevy"
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 15000
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-hevy.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy.*"
- extendedWaitUntil:
    visible: "^Date range$"
    timeout: 20000
# Audit Phase 4 (IM-08): the date range carries its years — 3 "Legs Old" in March 2024 to
# September 2026 — so years of history never read like months.
- assertVisible: "Mar 2024 → Sep 2026"
# Every name in this file is one ForgeAI knows (some under another name): nothing to ask.
- assertNotVisible: '.* new to MettleUp'
# Phase 1 (DS-05 / IM-01): part I's import took the demo away, so this is an ordinary import over
# the member's own data: no "The demo goes first" card, no name box.
- assertNotVisible: "The demo goes first"
- scrollUntilVisible:
    element: "^Merge$"
    centerElement: true
    timeout: 15000
- tapOn: "^Merge$"
- takeScreenshot: 140-hevy-csv-preview
# IM-09: the button says what will happen ("Import 12 workouts": all are new).
- scrollUntilVisible:
    element: "Import 12 workouts"
    centerElement: true
    timeout: 15000
- tapOn: "Import 12 workouts"
- extendedWaitUntil:
    visible: "12 workouts imported"
    timeout: 30000
- scrollUntilVisible:
    element: "Bring my routines in"
    centerElement: true
    timeout: 15000
- takeScreenshot: 141-hevy-imported-routines-next
- tapOn: "Bring my routines in"
# ---------------------------------------------------------------- 1. routines found
- extendedWaitUntil:
    visible: "We found 2 routines in your Hevy workouts"
    timeout: 15000
- assertNotVisible: "Morning workout.*"
- tapOn: "1 older name.*"
- extendedWaitUntil:
    visible: "Legs Old"
    timeout: 5000
- takeScreenshot: 142-routines-found
- tapOn: "Check these 2"
# ---------------------------------------------------------------- 2. one routine per screen
- extendedWaitUntil:
    visible: "Also done in Push A"
    timeout: 10000
- assertVisible: "1 of 2"
- assertVisible: "Triceps Pushdown"
- tapOn: "Chest Fly \\(Machine\\)"
- takeScreenshot: 143-check-push-a
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "2 of 2"
    timeout: 10000
- assertVisible: "Pull A"
- takeScreenshot: 144-check-pull-a
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
# ---------------------------------------------------------------- 3. follow them?
- extendedWaitUntil:
    visible: "Follow these as your plan\\?"
    timeout: 10000
- assertVisible: ".*in the order you do them: Push A, Pull A.*"
- takeScreenshot: 145-follow-question
- tapOn: "Follow them"
# ---------------------------------------------------------------- 4. done
- extendedWaitUntil:
    visible: "2 routines in From Hevy"
    timeout: 15000
- takeScreenshot: 146-routines-saved
# "Open routines" lands on the Workout tab: the followed folder, open, "From Hevy (2)".
- tapOn: "Open routines"
- scrollUntilVisible:
    element: 'From Hevy \(2\)'
    centerElement: true
    timeout: 15000
- assertVisible: "From Hevy folder, 2 routines, open, Following"
- takeScreenshot: 147-from-hevy-folder
- scrollUntilVisible:
    element: "Start routine Push A"
    centerElement: true
    timeout: 30000
# Redesign R4: a routine card with "Start routine"; the card opens the routine's calm preview.
- scrollUntilVisible:
    element: "^Push A$"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: "^Push A$"
# Hevy's "Chest Fly (Machine)" is the library's Pec Deck Fly (the history landed there too).
- extendedWaitUntil:
    visible: 'Push Day · \d+ exercises · From Hevy.*'
    timeout: 15000
- assertVisible: "Start routine"
# v0.29.1: five exercises now (Skull Crusher added to the file), so it is below the fold.
- scrollUntilVisible:
    element: "Pec Deck Fly"
    centerElement: true
    timeout: 20000
- takeScreenshot: 148-push-a-routine
- back
# ---------------------------------------------------------------- the Workout tab: the next routine
- scrollUntilVisible:
    element: "Up next: .*|Done today: .*"
    direction: UP
    centerElement: true
    timeout: 20000
- takeScreenshot: 149-workout-up-next
# Audit Phase 3 / Phase 7 / redesign R1: the card's link names where it goes — "See exercises"
# under "Up next: <routine>" (whose own button is "Start"), and under "Done today: …" / "Next: …"
# once today's routine is done; it opens the Today page. Never "Start workout" on a tap that only
# opens another screen (SH-23).
- assertNotVisible: "Start workout"
- runFlow:
    when:
      visible: "See exercises"
    commands:
      - tapOn: "See exercises"
      # Owner profile (360 dp, font 1.3): the button sits below the day's exercises.
      - scrollUntilVisible:
          element: "Change this routine"
          centerElement: true
          timeout: 15000
      - takeScreenshot: 149b-today-preview
      - back
# ---------------------------------------------------------------- the same file again
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Bring in from Hevy or Strong"
- scrollUntilVisible:
    element: "Import from Hevy"
    centerElement: true
    timeout: 30000
- tapOn: "Import from Hevy"
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-hevy.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy.*"
- extendedWaitUntil:
    visible: "Already in MettleUp"
    timeout: 20000
# Audit Phase 4 (IM-09): a file already imported says so first, and offers no "Merge 12" that
# would add 0 — straight on to the routines.
- scrollUntilVisible:
    element: "All 12 workouts are already here"
    centerElement: true
    timeout: 15000
- assertNotVisible: "(Merge|Import) 12 workouts"
- takeScreenshot: 150-reimport-preview
- scrollUntilVisible:
    element: "Bring my routines in"
    centerElement: true
    timeout: 15000
- tapOn: "Bring my routines in"
- tapOn: "Check these 2"
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Follow these as your plan\\?"
    timeout: 10000
- tapOn: "Follow them"
- extendedWaitUntil:
    visible: ".*From Hevy is updated from this file.*"
    timeout: 15000
- takeScreenshot: 151-reimport-updated
# One "From Hevy" folder (updated), not a second one. "Open routines" lands on the Workout tab:
# no Back here (Back on the first tab leaves the app).
- tapOn: "Open routines"
- scrollUntilVisible:
    element: 'From Hevy \(2\)'
    centerElement: true
    timeout: 15000
- takeScreenshot: 152-one-from-hevy-folder
# ---------------------------------------------------------------- the Up next card's "See exercises" again
- scrollUntilVisible:
    element: "Up next: .*|Done today: .*"
    direction: UP
    centerElement: true
    timeout: 20000
- runFlow:
    when:
      visible: "See exercises"
    commands:
      - tapOn: "See exercises"
      # Owner profile (360 dp, font 1.3): the button sits below the day's exercises.
      - scrollUntilVisible:
          element: "Change this routine"
          centerElement: true
          timeout: 15000
      - takeScreenshot: 153-today-preview-from-workout
      - back
# ---------------------------------------------------------------- "Create “…”" inside a workout
- runFlow: sub-workout-fresh.yaml
- tapOn: "Start empty workout"
- scrollUntilVisible:
    element: "Add exercise"
    centerElement: true
    timeout: 15000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: "Sled Drag QA"
- hideKeyboard
- extendedWaitUntil:
    visible: "Create “Sled Drag QA”"
    timeout: 10000
- takeScreenshot: 154-create-offer
- tapOn: "Create “Sled Drag QA”"
- extendedWaitUntil:
    visible: "How you log it"
    timeout: 15000
- tapOn: "^Distance$"
- scrollUntilVisible:
    element: "Distance in"
    centerElement: true
    timeout: 10000
- scrollUntilVisible:
    element: "^Metres$"
    centerElement: true
    timeout: 10000
- tapOn: "^Metres$"
- scrollUntilVisible:
    element: "^Abs$"
    centerElement: true
    timeout: 10000
- tapOn: "^Abs$"
- scrollUntilVisible:
    element: "^Other$"
    centerElement: true
    timeout: 10000
- tapOn: "^Other$"
- takeScreenshot: 155-create-form-metres
- scrollUntilVisible:
    element: "Save and add to workout"
    centerElement: true
    timeout: 15000
- tapOn: "Save and add to workout"
- extendedWaitUntil:
    visible: "Sled Drag QA"
    timeout: 15000
- assertVisible: "^M$"
- takeScreenshot: 156-created-in-workout
- scrollUntilVisible:
    element: "Discard workout"
    centerElement: true
    timeout: 15000
- tapOn: "Discard workout"
- tapOn: "^Discard$"
