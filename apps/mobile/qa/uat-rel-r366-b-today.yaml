# Part UAT, R-366 flow b: today's Pull-Up 7, 5, 5 after yesterday's 7, 5, 4 (flow a). Expect
# "Previous reps beaten! +1" over "Done 17 reps · Previous 16 reps" (R-498, owner 14 Nov 2026; was
# "17 reps done · Previous: 16 · +1", and before that "Beat last time's 16 reps (17 done)").
# Pictures rel-r366-b..d-*.png.
appId: com.mettleup.app
---
# ---------------------------------------------------------------- workout 2: today 7, 5, 5
# Flow a left the saved routine open: start it today (the part moved the clock one day on).
- scrollUntilVisible:
    element: "^Start routine$"
    centerElement: true
    timeout: 15000
- tapOn: "^Start routine$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "More for Pull[- ][Uu]p"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Target .*Tap for why\.$'
- takeScreenshot: rel-r366-b-target
- runFlow:
    file: sub-uat-r366-set.yaml
    env:
      N: "1"
      REPS: "7"
- runFlow:
    file: sub-uat-r366-set.yaml
    env:
      N: "2"
      REPS: "5"
- runFlow: sub-uat-rest-clear.yaml
# Negative: 12 done with a set to go, never the finished line yet; the line reads like the kg line.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Next sets?: .* · Done: 12 of \\d+ reps.*"
- assertNotVisible: "(?s).*(\\d+ reps done .*Previous|Previous reps beaten|You matched your previous reps).*"
- takeScreenshot: rel-r366-c-two-sets-not-yet
- runFlow:
    file: sub-uat-r366-set.yaml
    env:
      N: "3"
      REPS: "5"
# The last set starts no rest timer, so no rest to clear here.
# Happy path: the exact words, the previous workout named (owner, 12 Nov 2026: never "last time" here).
# R-498: two lines in one text, read by the line's id (sub-uat-r454-line: a text search can miss it).
- runFlow:
    file: sub-uat-r454-line.yaml
    env:
      EX: "Pull[- ][Uu]p"
      WANT: "Previous reps beaten! +1 / Done 17 reps · Previous 16 reps"
- assertNotVisible: ".*17 reps reached.*"
- assertNotVisible: "(?is).*(beat last time|reps done · Previous:).*"
- assertNotVisible: ".*reached ✓.*"
- takeScreenshot: rel-r366-d-beat-last-time
- runFlow: sub-uat-r358-finish.yaml
