# Part UAT, R-366 flow b: today's Pull-Up 7, 5, 5 after yesterday's 7, 5, 4 (flow a). Expect
# "Beat last time's 16 reps (17 done)". Pictures rel-r366-b..d-*.png.
appId: com.mettleup.app
---
# ---------------------------------------------------------------- workout 2: today 7, 5, 5
# Flow a left the saved routine open: start it today (the part moved the clock one day on).
- scrollUntilVisible:
    element: "^Start routine$"
    centerElement: true
    timeout: 15000
- tapOn: "^Start routine$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "More for Pull[- ][Uu]p"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Target .*Tap for why\.$'
- takeScreenshot: rel-r366-b-target
- runFlow:
    file: sub-uat-r366-set.yaml
    env:
      N: "1"
      REPS: "7"
- runFlow:
    file: sub-uat-r366-set.yaml
    env:
      N: "2"
      REPS: "5"
- runFlow: sub-uat-rest-clear.yaml
# Negative: 12 done with a set to go, never "Beat" yet; the line reads like the kg line.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Next sets?: .* · Done: 12 of today's \\d+ reps.*"
- assertNotVisible: "^Beat last time.*"
- takeScreenshot: rel-r366-c-two-sets-not-yet
- runFlow:
    file: sub-uat-r366-set.yaml
    env:
      N: "3"
      REPS: "5"
# The last set starts no rest timer, so no rest to clear here.
# Happy path: the exact words, last time named.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Beat last time's 16 reps \\(17 done\\)$"
- assertNotVisible: ".*17 reps reached.*"
- assertNotVisible: ".*reached ✓.*"
- takeScreenshot: rel-r366-d-beat-last-time
- runFlow: sub-uat-r358-finish.yaml
