# Audit Phase 7 device QA, parts P7BIG and P7NAV3 — the large-text screen tour (runs after parts
# A–L, N, P9 and R, before M). The script has set the phone's font size to its largest step
# (adb: settings put system font_scale 2.0) and stopped the app; it runs this flow twice: with
# the emulator's usual gesture navigation (NAV=gesture) and, when the image can switch, with
# Android's 3-button bar (NAV=3button). Each screen a member uses is photographed
# (p7-big-<NAV>-*.png; the script gathers them in qa-out/p7-big/). Redesign (3 tabs): the Workout
# tab (top, then its folders), an open workout with a set row, the Profile page (top, its chart,
# its feed), Calendar, Statistics, Settings, and Settings → Your gym's "Join your gym" card.
# R-77: no gym, no shop tab (sample shop removed): the Shop's join card, the sample shop's grid and
# its product page are gone, so this tour checks the tab is absent instead.
# Changes NOTHING: the workout is an empty one with one exercise and no ticked set, thrown away
# with "Discard workout" (the app's own sheet, "Discard workout?" → Discard); a workout an earlier
# part left open is only looked at, then minimised. Nothing is added to the bag; no gym is joined.
# Screenshots every tour takes, whichever way its workout step goes: 10 (P7_SHOTS in
# run-device-qa.sh); the empty-workout branch adds 2 (03b, 03c).
appId: com.forgeai.app
# NAV comes from the script (maestro test -e NAV=gesture|3button). No `env:` default here: a
# flow-level env overrides -e, so both tours were photographed as "gesture" (run 38091447858).
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "(?i)^allow$"
    optional: true
# With Android's 3-button bar the bar's own home button is called "Home" (device QA run
# 38081757903): wait for a tab name the system bar does not have, and tap the app's tabs by
# position (index 0 is the top-most match; the app's tab bar sits above the system bar).
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# ---------------------------------------------------------------- Workout tab: top, then folders
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "Up next: .*|Done today: .*|Workout in progress|Start empty workout"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: p7-big-${NAV}-01-workout-top
- scrollUntilVisible:
    element: "^Routines$"
    centerElement: true
    timeout: 30000
- takeScreenshot: p7-big-${NAV}-02-workout-folders
# ---------------------------------------------------------------- an open workout with a set row
- scrollUntilVisible:
    element: "Start empty workout|Resume workout"
    direction: UP
    centerElement: true
    timeout: 30000
# An earlier part left a workout open: show it as it is, then minimise it (nothing changes).
- runFlow:
    when:
      visible: "Resume workout"
    commands:
      - tapOn: "Resume workout"
      - extendedWaitUntil:
          visible: "Log a set to finish|Finish workout"
          timeout: 30000
      - takeScreenshot: p7-big-${NAV}-03-open-workout
      - tapOn: "Minimise workout.*"
      - extendedWaitUntil:
          visible: "Resume workout"
          timeout: 15000
# None open (the usual case): an empty workout, one exercise, then discarded.
- runFlow:
    when:
      notVisible: "Resume workout"
    commands:
      - tapOn: "Start empty workout"
      - tapOn:
          text: "(?i)^allow$"
          optional: true
      - extendedWaitUntil:
          visible: "Add exercise"
          timeout: 30000
      - tapOn: "Add exercise"
      - extendedWaitUntil:
          visible: "Search exercises"
          timeout: 20000
      - tapOn: "Search exercises"
      - inputText: " bench press"
      # No hideKeyboard: it is Android Back, and with the 3-button bar (part P7NAV3, run
      # 38085995006) that Back closed the picker and then the app. The results and "Add 1" sit
      # above the keyboard (the window shrinks for it).
      # Phase 2 (LW-15): tick the exercise in the picker, then "Add 1".
      - tapOn:
          text: "Select Barbell Bench Press"
          index: 0
      - tapOn: "Add 1"
      # LW-27: "Barbell Bench Press set 1 weight, kilograms" (pounds after part I's "lb, miles").
      - extendedWaitUntil:
          visible: ".* set 1 weight, (kilograms|pounds)"
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: p7-big-${NAV}-03-open-workout
      # 22 Oct 2026 (runs 39734799762 x2): Maestro's swipe starts at the screen's centre, which can
      # land on a set's number box; on Android a drag that starts on a box does not scroll the page
      # (a known React Native behaviour; an app-side fix broke typing in run 39758056150 and was
      # undone). The centre swipe is tried first; if it cannot scroll, swipes from the PREVIOUS
      # column (never a box) reach the link, and the 03a-scroll-fallback picture records it.
      - scrollUntilVisible:
          element: "Discard workout"
          centerElement: true
          timeout: 12000
          optional: true
      - runFlow:
          when:
            notVisible: "Discard workout"
          commands:
            - takeScreenshot: p7-big-${NAV}-03a-scroll-fallback
            - repeat:
                while:
                  notVisible: "Discard workout"
                times: 6
                commands:
                  - swipe:
                      start: "20%, 70%"
                      end: "20%, 35%"
                      duration: 600
      - scrollUntilVisible:
          element: "Discard workout"
          centerElement: true
          timeout: 10000
      - takeScreenshot: p7-big-${NAV}-03b-open-workout-bottom
      - tapOn: "Discard workout"
      - extendedWaitUntil:
          visible: 'Discard workout\?'
          timeout: 10000
      - takeScreenshot: p7-big-${NAV}-03c-discard-question
      # The app's own confirm sheet: its "Discard" button (the link behind it says "Discard workout").
      - tapOn: "^Discard$"
      - scrollUntilVisible:
          element: "Start empty workout"
          centerElement: true
          timeout: 30000
      - assertNotVisible: "Resume workout"
# ---------------------------------------------------------------- Profile: top, chart, feed
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 30000
- scrollUntilVisible:
    element: "^Streak$"
    direction: UP
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: p7-big-${NAV}-04-profile-top
- scrollUntilVisible:
    element: '^(Kg|Lb) lifted$'
    centerElement: true
    timeout: 30000
- takeScreenshot: p7-big-${NAV}-05-profile-chart
- scrollUntilVisible:
    element: "More for .*"
    centerElement: true
    timeout: 30000
- takeScreenshot: p7-big-${NAV}-06-profile-feed
# ---------------------------------------------------------------- Calendar
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Calendar"
- extendedWaitUntil:
    visible: "Log a past workout"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: p7-big-${NAV}-07-calendar
- back
# ---------------------------------------------------------------- Statistics
- runFlow:
    file: sub-profile-tile.yaml
    env:
      TILE: "Statistics"
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: p7-big-${NAV}-08-statistics
- back
# ---------------------------------------------------------------- Settings
- runFlow:
    file: sub-settings-open.yaml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: p7-big-${NAV}-09-settings
- back
# ---------------------------------------------------------------- the gym: no tab, the join card in Settings
# R-77: no gym, no shop tab (sample shop removed). Not joined, there are only Workout and Profile;
# joining is in Settings → Your gym, whose "Join your gym" card is photographed here (nothing typed).
# If an earlier part left this phone joined (a failed BR, INV or INV-f may not leave), leave first
# from the gym's tab so the tour sees the phone as it should be.
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 20000
- runFlow:
    when:
      visible: "^(Shop|Gym)$"
    commands:
      - tapOn:
          text: "^(Shop|Gym)$"
          index: 0
      - scrollUntilVisible:
          element: "^Leave$"
          # Leave is the last row of the gym's page: it can never be centred (U-Q5), so no centerElement.
          timeout: 30000
      - tapOn: "^Leave$"
      - extendedWaitUntil:
          visible: "^(Leave gym|Leave anyway|Cancel orders? and leave)$"
          timeout: 15000
      - tapOn: "^(Leave gym|Leave anyway|Cancel orders? and leave)$"
      - extendedWaitUntil:
          notVisible: "^(Shop|Gym)$"
          timeout: 45000
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 20000
- assertNotVisible: "^(Shop|Gym)$"
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Your gym"
- scrollUntilVisible:
    element: "^Join your gym$"
    timeout: 30000
- scrollUntilVisible:
    element: "Gym code"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: p7-big-${NAV}-10-your-gym-join
- runFlow: sub-back-to-tabs.yaml
- tapOn:
    text: "^Workout$"
    index: 0
