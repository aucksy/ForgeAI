# Part W3 — the "real workout" journey, step 3 of 4. The shade is open (run-device-qa.sh) after the
# warm-up's rest ran out with the phone idle: "Rest is over" (or the live card) opens the workout.
# Then every kind of set, each tick checked for its rest, as the owner trains:
#   - warm-up 2 → a rest;  set 1 with RPE 8 (one tap in the RPE sheet saves and closes it) → a rest;
#   - set 2 made a DROP set (✓ again) → a rest (a drop set used to start none);
#   - set 3 LIGHTER for more reps (40 kg × 15 after 90 kg+ for 5–8) → NO "New record" (it used to
#     announce "Most reps" — not progressive overload); an added set 4 at 100 kg × 6 → a record;
#   - Lateral Raise + Triceps Pushdown made a superset: the first exercise's tick starts NO rest,
#     the second's does (the rest comes after the round).
# Ends with that superset rest running; run-device-qa.sh checks the shade again.
appId: com.forgeai.app
---
- takeScreenshot: w-30-shade-after-warmup-rest
- tapOn: 'Rest is over|Set \d+ of \d+.*|.*Bench Press.*|Workout in progress'
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- takeScreenshot: w-31-back-from-shade
# ---------------------------------------------------------------- warm-up 2
- scrollUntilVisible:
    element: 'Mark .*Bench Press warm-up 2 complete'
    centerElement: true
    timeout: 20000
- tapOn:
    text: 'Mark .*Bench Press warm-up 2 complete'
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 5000
- tapOn: "Skip rest"
# ---------------------------------------------------------------- set 1 with RPE 8
- scrollUntilVisible:
    element: 'Add RPE for .*Bench Press set 1'
    centerElement: true
    timeout: 20000
- tapOn:
    text: 'Add RPE for .*Bench Press set 1'
    index: 0
- extendedWaitUntil:
    visible: "How hard was it\\? \\(RPE\\)"
    timeout: 10000
- takeScreenshot: w-32-rpe-sheet
# 15 Oct 2026 (owner): RPE is its own sheet; ONE tap saves it and closes it — no ✓ "Done".
- assertNotVisible: "^Done$"
- tapOn: "RPE 8: .*"
- extendedWaitUntil:
    notVisible: "How hard was it\\? \\(RPE\\)"
    timeout: 5000
- extendedWaitUntil:
    visible: '.*Bench Press set 1 RPE 8\. Change'
    timeout: 5000
# 15 Oct 2026 (owner): the RPE tap also ticked the set — the rest starts with no ✓ tap.
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 5000
- assertVisible: '.*Bench Press set 1 complete\. Tap to undo'
- takeScreenshot: w-33-set-1-rpe-ticked
- tapOn: "Skip rest"
# ---------------------------------------------------------------- set 2 as a drop set
- tapOn:
    text: '.*Bench Press set 2\. Change set type'
    index: 0
- extendedWaitUntil:
    visible: "^Drop set$"
    timeout: 10000
# 15 Oct 2026: the set-type sheet is set type only — a tap applies and closes it (no ✓ "Done").
- tapOn: "^Drop set$"
- extendedWaitUntil:
    notVisible: "^Drop set$"
    timeout: 5000
- extendedWaitUntil:
    visible: 'Mark .*Bench Press drop set 2 complete'
    timeout: 5000
- tapOn:
    text: 'Mark .*Bench Press drop set 2 complete'
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 5000
- takeScreenshot: w-34-drop-set-rest
- tapOn: "Skip rest"
# ---------------------------------------------------------------- set 3: lighter, more reps
- scrollUntilVisible:
    element: '.*Bench Press set 3 weight, kilograms'
    centerElement: true
    timeout: 20000
- tapOn:
    text: '.*Bench Press set 3 weight, kilograms'
    index: 0
- waitForAnimationToEnd
- eraseText
- inputText: "40"
- tapOn:
    text: '.*Bench Press set 3 reps'
    index: 0
- eraseText
- inputText: "15"
- hideKeyboard
- tapOn:
    text: 'Mark .*Bench Press set 3 complete'
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 5000
# No record pop-up for a lighter set (owner, 13 Oct 2026: more reps at a low weight is not overload).
- assertNotVisible: "New record.*"
- assertNotVisible: ".*Most reps.*"
- takeScreenshot: w-35-lighter-set-no-record
- tapOn: "Skip rest"
# ---------------------------------------------------------------- set 4: heavier than ever
- scrollUntilVisible:
    element: "Add set"
    centerElement: true
    timeout: 20000
- tapOn:
    text: "Add set"
    index: 0
- scrollUntilVisible:
    element: '.*Bench Press set 4 weight, kilograms'
    centerElement: true
    timeout: 20000
- tapOn:
    text: '.*Bench Press set 4 weight, kilograms'
    index: 0
- waitForAnimationToEnd
- eraseText
- inputText: "100"
- tapOn:
    text: '.*Bench Press set 4 reps'
    index: 0
- eraseText
- inputText: "6"
- hideKeyboard
- tapOn:
    text: 'Mark .*Bench Press set 4 complete'
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "New record.*"
    timeout: 4000
- takeScreenshot: w-36-heavier-set-record
- tapOn:
    text: "Skip rest"
    optional: true
# ---------------------------------------------------------------- superset: Lateral Raise + Triceps Pushdown
# Each card's rest is set to 0:30 on the way DOWN (scrolling back up to a card's header can
# leave its ⋯ under the top bar), then the two are made a superset.
- scrollUntilVisible:
    element: "More for .*Lateral Raise.*"
    centerElement: true
    timeout: 30000
- tapOn:
    text: "More for .*Lateral Raise.*"
    index: 0
- tapOn: "Rest timer"
- tapOn: "Rest 0:30"
- extendedWaitUntil:
    notVisible: 'For .*Remembered for next time\.'
    timeout: 10000
- tapOn:
    text: "More for .*Lateral Raise.*"
    index: 0
- tapOn: "^Superset$"
- extendedWaitUntil:
    visible: "Superset with .*Triceps.*"
    timeout: 10000
- tapOn: "Superset with .*Triceps.*"
- extendedWaitUntil:
    visible: "Edit superset"
    timeout: 10000
- scrollUntilVisible:
    element: "More for .*Triceps.*"
    centerElement: true
    timeout: 30000
- tapOn:
    text: "More for .*Triceps.*"
    index: 0
- tapOn: "Rest timer"
- tapOn: "Rest 0:30"
- extendedWaitUntil:
    notVisible: 'For .*Remembered for next time\.'
    timeout: 10000
- takeScreenshot: w-37-superset-made
- scrollUntilVisible:
    element: 'Mark .*Lateral Raise set 1 complete'
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn:
    text: 'Mark .*Lateral Raise set 1 complete'
    index: 0
    waitToSettleTimeoutMs: 300
# The first exercise of the round: straight on to its partner, no rest.
- assertNotVisible: "Skip rest"
- takeScreenshot: w-38-superset-first-no-rest
- scrollUntilVisible:
    element: 'Mark .*Triceps.* set 1 complete'
    centerElement: true
    timeout: 30000
- tapOn:
    text: 'Mark .*Triceps.* set 1 complete'
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 5000
- takeScreenshot: w-39-superset-round-rest
