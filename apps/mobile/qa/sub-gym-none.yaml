# Sub-flow (called with runFlow; not a part of its own). Release A (A1/A2): the Gym tab is ALWAYS
# there, so "in no gym" is no longer "no third tab": it is the Gym tab showing its one "Join your
# gym" screen (src/shop/ShopScreen.tsx JoinGymDoor). This opens the Gym tab and waits for that
# screen. Call it with the tab bar on screen. No `env:` (trap 22).
appId: com.mettleup.app
---
- runFlow:
    file: sub-back-to-tabs.yaml
- tapOn:
    text: "^Gym$"
    index: 0
- extendedWaitUntil:
    visible: "^Join your gym$"
    timeout: 30000
# The line sits under "With your gym in the app": below the screen's edge at 360 dp / font 1.3
# (owner profile, run 40097556274 part R), so it is scrolled to (trap 27), then the page goes back
# to its top: callers photograph the join card and scroll DOWN to "Gym code".
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "No gym\\? Everything else works without one\\."
- scrollUntilVisible:
    element: "^Join your gym$"
    direction: UP
    timeout: 20000
