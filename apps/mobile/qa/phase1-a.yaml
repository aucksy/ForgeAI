# Phase 1 device QA, part A — runs on a cloud Android emulator (.github/workflows/qa-device.yml).
# Demo data → the Workout tab's Up next card (redesign R1) → start today's routine → calm card + menu → per-exercise rest 30s →
# set-type sheet → tick (rest starts) → beat history (live record) → leave the rest running.
appId: com.forgeai.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Step 1 of 3|Your name"
    timeout: 90000
# Audit Phase 7 (D12 = A): the welcome is 3 steps; step 1 asks only the name and an optional
# mobile number (age, height, gym and body weight are no longer asked here).
- assertVisible: "Step 1 of 3"
- assertVisible: "Mobile number, optional"
- assertNotVisible: '(?i)age( in years)?.*'
- assertNotVisible: '(?i)height.*'
- assertNotVisible: '(?i)body weight.*'
# Audit Phase 4 (point 6): switchers are met where they arrive — "Coming from Hevy or Strong?"
# on the welcome screen. Not tapped here: a pick opens the import on the Workout tab.
- scrollUntilVisible:
    element: "Coming from Hevy or Strong\\?"
    timeout: 30000
# Its "From Hevy" sits below the heading: at font 2.0 on 360 dp the heading alone was on screen
# (UAT WP14 run 39000428116). Scrolled to, then it must be visible (sub-find).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "From Hevy"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "From Strong"
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- assertNotVisible: '(?i)height.*'
- assertNotVisible: '(?i)body weight.*'
- takeScreenshot: 00-welcome
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
# Redesign R1: the app opens on the Workout tab (Home is gone). Wait for a tab name the
# 3-button bar lacks (trap 18), then the Workout tab's own button.
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
# The old tabs are gone: only Workout, Profile and Shop.
- assertVisible: "^Shop$"
- assertNotVisible: "^History$"
- assertNotVisible: "^Progress$"
# Audit Phase 3 / redesign R1: the ONE "Today" answer is the Up next card at the top of the
# Workout tab (src/tracker/lib/upNext.ts). The demo history ends yesterday, so today's routine is
# still to do: "Up next: <routine>" over "from <folder> · N exercises · <first> first" (not
# "Done today", not empty), with Start and See exercises.
- extendedWaitUntil:
    visible: 'Up next: .*'
    timeout: 20000
# The card's grey line is hidden from TalkBack (the title says it all), so the pattern also
# accepts the title's spoken line, which carries it.
- assertVisible: '.*from .* · \d+ exercises?.*'
- assertVisible: "^Start$"
- assertVisible: "See exercises"
- takeScreenshot: 01-workout-up-next
# D9: THE streak counts weeks, never days. Redesign R2: it is the Profile header's "Weeks in a
# row" (the demo's 13 weeks end yesterday, so it is above 0); Home's "This week so far" is gone.
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: '^Weeks in a row: [1-9][\d,]*$'
    timeout: 20000
- assertNotVisible: '(?i).*day streak.*'
- takeScreenshot: 01a-profile-weeks-in-a-row
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "See exercises"
    timeout: 20000
# v0.28.0: the card opens the day's exercises first; nothing starts until Start.
- tapOn: "See exercises"
- extendedWaitUntil:
    visible: "^Today$"
    timeout: 20000
# Owner profile (360 dp, font 1.3): six exercises fill the screen and the button is below them.
- scrollUntilVisible:
    element: "Change this routine"
    centerElement: true
    timeout: 20000
- takeScreenshot: 01b-today-preview
- back
- extendedWaitUntil:
    visible: 'Up next: .*'
    timeout: 30000
# Audit Phase 3 (RP-03) / redesign R4: the routine list names the same routine as the card — its
# card carries the "Next" tag (spoken "<name>, next, …") — and the card's Start starts exactly it.
- copyTextFrom: 'Up next: .*'
- evalScript: '${output.upNext = maestro.copiedText.replace(/^Up next: /, "").split(". ")[0]}'
- scrollUntilVisible:
    element: "Start routine ${output.upNext}"
    centerElement: true
    timeout: 30000
- assertVisible: "${output.upNext}, next, .*"
- takeScreenshot: 02-workout-tab
- scrollUntilVisible:
    element: "^Start$"
    direction: UP
    centerElement: true
    timeout: 30000
# The card's own button, "Start" (a routine card's is "Start routine"; "Start <name>" only shows
# after a workout today).
- tapOn: "^Start$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- takeScreenshot: 03-active-workout
# Progression v2: the Target line reads "<weight> · aim for N" (or bodyweight / first-time
# range); tapping it shows the one-sentence reason, tapping again hides it.
- assertVisible: 'Target .*(aim for \d+|×|First time).*Tap for why\.'
- tapOn:
    text: 'Target .*Tap for why\.'
    index: 0
- takeScreenshot: 03b-target-reason
- tapOn:
    text: 'Target .*Tap for why\.'
    index: 0
- tapOn:
    text: "More for .*"
    index: 0
- takeScreenshot: 04-exercise-menu
- tapOn: "Rest timer"
- takeScreenshot: 05-rest-picker
- tapOn: "Rest 0:30"
- takeScreenshot: 06-rest-set-to-30s
# Phase 2 (LW-27): every set control names its exercise and set, e.g.
# "Barbell Bench Press set 1. Change set type", "Mark Barbell Bench Press set 1 complete".
- tapOn:
    text: '.* set 1\. Change set type'
    index: 0
- takeScreenshot: 07-set-type-sheet
- back
# Set 1 is empty: the tick saves the grey hint shown in its boxes (Phase 2, packet B).
- tapOn:
    text: 'Mark .* set 1 complete'
    index: 0
- takeScreenshot: 08-first-set-ticked-rest-running
# D8 / rest-alert audit (owner: "just enable the alarms by default"): exact alarms come with the
# install (USE_EXACT_ALARM) and the script no longer allows them by hand, so the first rest must
# NOT ask "Get rest alerts on time?" — the member never has to find a setting.
- assertNotVisible: 'Get rest alerts on time\?'
- assertVisible: "Skip rest"
- tapOn: "Skip rest"
- tapOn:
    text: '.* set 2 weight, kilograms'
    index: 0
- waitForAnimationToEnd
- eraseText
- waitForAnimationToEnd
- inputText: " 300"
- takeScreenshot: 08b-typed-300
- hideKeyboard
- tapOn:
    text: 'Mark .* set 2 complete'
    index: 0
    # The rest countdown re-renders 4x a second, so "wait until the screen is still"
    # would sit out the whole 3.5 s the record toast is up.
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "New record.*"
    timeout: 3000
- takeScreenshot: 09-new-record
# D7: 300 kg is ~4x the demo bench best (72.5 kg), so the row asks "300 kg — that's 4× your
# best. Keep it?" under the set (already saved; it never refuses). It is on purpose: Keep.
- tapOn:
    text: 'Keep 300.*'
    optional: true
    waitToSettleTimeoutMs: 300
- assertVisible: "Skip rest"
