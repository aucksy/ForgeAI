# Phase 1 device QA, part A — runs on a cloud Android emulator (.github/workflows/qa-device.yml).
# Demo data → start today's routine → calm card + menu → per-exercise rest 30s →
# set-type sheet → tick (rest starts) → beat history (live record) → leave the rest running.
appId: com.forgeai.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Step 1 of 3|Your name"
    timeout: 90000
# Audit Phase 7 (D12 = A): the welcome is 3 steps; step 1 asks only the name and an optional
# mobile number (age, height, gym and body weight are no longer asked here).
- assertVisible: "Step 1 of 3"
- assertVisible: "Mobile number, optional"
- assertNotVisible: '(?i)age( in years)?.*'
- assertNotVisible: '(?i)height.*'
- assertNotVisible: '(?i)body weight.*'
# Audit Phase 4 (point 6): switchers are met where they arrive — "Coming from Hevy or Strong?"
# on the welcome screen. Not tapped here: a pick opens the import after the next Home.
- scrollUntilVisible:
    element: "Coming from Hevy or Strong\\?"
    timeout: 30000
- assertVisible: "From Hevy"
- assertVisible: "From Strong"
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- assertNotVisible: '(?i)height.*'
- assertNotVisible: '(?i)body weight.*'
- takeScreenshot: 00-welcome
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
- extendedWaitUntil:
    visible: "Workout"
    timeout: 90000
- takeScreenshot: 01-home
# Audit Phase 3: Home's one "Today" answer. The demo history ends yesterday, so today's routine is
# still to do: its name over "N exercises from your plan" (not "Done today", not "No plan yet").
# Audit Phase 7: the answer card titles it "Next: <routine>" and its text is also one spoken
# line ("Next: Push 1. 5 exercises from your plan"), which the pattern accepts too.
- extendedWaitUntil:
    visible: '(.*\. )?\d+ exercises? from your plan'
    timeout: 20000
- assertVisible: 'Next: .*'
# D9: THE streak counts weeks, never days. Audit Phase 7: Home's one answer card is followed by
# "This week so far", whose facts line reads "13 weeks in a row · 12,345 kg lifted" (shown only
# while the streak is above 0; the demo's 13 weeks end yesterday, so it is).
- scrollUntilVisible:
    element: '.*\d+ weeks? in a row.*'
    timeout: 15000
- assertNotVisible: '(?i).*day streak.*'
- takeScreenshot: 01a-home-week-streak
# Audit Phase 7: the answer card is "Next: <routine>" with Start, and a quiet "See exercises" link.
- scrollUntilVisible:
    element: "See exercises"
    direction: UP
    timeout: 15000
# v0.28.0: Home's Today card opens the day's exercises first; nothing starts until Start.
- tapOn: "See exercises"
- extendedWaitUntil:
    visible: "Change this routine"
    timeout: 20000
- takeScreenshot: 01b-today-preview
- back
- tapOn: "^Workout$"
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 30000
- takeScreenshot: 02-workout-tab
# Audit Phase 3 (RP-03): the Workout tab names the same routine as Home, and its Start button
# ("Start <that routine>") starts exactly it, by id.
- extendedWaitUntil:
    visible: 'Today: .*'
    timeout: 20000
- tapOn: "Start (?!empty).*"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- takeScreenshot: 03-active-workout
# Progression v2: the Target line reads "<weight> · aim for N" (or bodyweight / first-time
# range); tapping it shows the one-sentence reason, tapping again hides it.
- assertVisible: 'Target .*(aim for \d+|×|First time).*Tap for why\.'
- tapOn:
    text: 'Target .*Tap for why\.'
    index: 0
- takeScreenshot: 03b-target-reason
- tapOn:
    text: 'Target .*Tap for why\.'
    index: 0
- tapOn:
    text: "More for .*"
    index: 0
- takeScreenshot: 04-exercise-menu
- tapOn: "Rest timer"
- takeScreenshot: 05-rest-picker
- tapOn: "Rest 0:30"
- takeScreenshot: 06-rest-set-to-30s
# Phase 2 (LW-27): every set control names its exercise and set, e.g.
# "Barbell Bench Press set 1. Change set type", "Mark Barbell Bench Press set 1 complete".
- tapOn:
    text: '.* set 1\. Change set type'
    index: 0
- takeScreenshot: 07-set-type-sheet
- back
# Set 1 is empty: the tick saves the grey hint shown in its boxes (Phase 2, packet B).
- tapOn:
    text: 'Mark .* set 1 complete'
    index: 0
- takeScreenshot: 08-first-set-ticked-rest-running
# D8: the first rest asks "Get rest alerts on time?" only when exact alarms are off. The script
# allows them before this part, so it should not show; if it does, answer "Not now".
- runFlow:
    when:
      visible: 'Get rest alerts on time\?'
    commands:
      - takeScreenshot: 08a-rest-alerts-question
      - tapOn:
          text: "Not now"
          below:
            text: "Allow"
- assertVisible: "Skip rest"
- tapOn: "Skip rest"
- tapOn:
    text: '.* set 2 weight, kilograms'
    index: 0
- waitForAnimationToEnd
- eraseText
- waitForAnimationToEnd
- inputText: " 300"
- takeScreenshot: 08b-typed-300
- hideKeyboard
- tapOn:
    text: 'Mark .* set 2 complete'
    index: 0
    # The rest countdown re-renders 4x a second, so "wait until the screen is still"
    # would sit out the whole 3.5 s the record toast is up.
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "New record.*"
    timeout: 3000
- takeScreenshot: 09-new-record
# D7: 300 kg is ~4x the demo bench best (72.5 kg), so the row asks "300 kg — that's 4× your
# best. Keep it?" under the set (already saved; it never refuses). It is on purpose: Keep.
- tapOn:
    text: 'Keep 300.*'
    optional: true
    waitToSettleTimeoutMs: 300
- assertVisible: "Skip rest"
