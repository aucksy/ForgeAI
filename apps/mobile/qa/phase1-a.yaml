# Phase 1 device QA, part A — runs on a cloud Android emulator (.github/workflows/qa-device.yml).
# Demo data → the Workout tab's Up next card (redesign R1) → start today's routine → calm card + menu → per-exercise rest 30s →
# set-type sheet → tick (rest starts) → beat history (live record) → leave the rest running.
appId: com.mettleup.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
# R-248: the intro screens (2-3, before the welcome) come first on a fresh install or after an
# erase. Skip them; an older build without them goes straight on.
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead'
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead'
# R-277: the first screen is the one-screen welcome (no step label): the example set card, "Get
# stronger every week", Continue with Google, "Join my gym", "Bring workouts", "Use without an account",
# then the demo. "Bring workouts" is checked first, then "Use without an account" opens step 1
# (checked), and Back returns here.
- assertVisible: "Get stronger every week"
# The decorative set card is one picture to a screen reader, with one label.
- assertVisible: "Example of a logged bench press"
# Audit Phase 4 (point 6): switchers are met where they arrive. R-277: "Bring workouts" opens its own
# screen with "From Hevy" / "From Strong" / "A MettleUp backup". Not tapped here: a pick goes on to
# step 1 and opens the import on the Workout tab after Start training.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Bring workouts$"
- tapOn: "^Bring workouts$"
- extendedWaitUntil:
    visible: "^Bring your workouts$"
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^From Hevy$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^From Strong$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^A MettleUp backup$"
- takeScreenshot: 00-welcome-bring
- scrollUntilVisible:
    element: "^Back$"
    direction: UP
    timeout: 20000
- tapOn: "^Back$"
- extendedWaitUntil:
    visible: "Get stronger every week"
    timeout: 15000
# R-277: "Use without an account" opens step 1.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Use without an account$"
- tapOn: "^Use without an account$"
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 15000
- scrollUntilVisible:
    element: "Step 1 of 3"
    direction: UP
    timeout: 20000
# Audit Phase 7 (D12 = A): the welcome is 3 steps; step 1 asks only the name and an optional
# mobile number (age, height, gym and body weight are no longer asked here).
- assertVisible: "Step 1 of 3"
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Mobile number, optional'
- assertNotVisible: '(?i)age( in years)?.*'
- assertNotVisible: '(?i)height.*'
- assertNotVisible: '(?i)body weight.*'
# R-131: Back on step 1 returns to the start view, where the demo link is.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Back'
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Get stronger every week"
    timeout: 15000
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- assertNotVisible: '(?i)height.*'
- assertNotVisible: '(?i)body weight.*'
- takeScreenshot: 00-welcome
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
# Redesign R1: the app opens on the Workout tab (Home is gone). Wait for a tab name the
# 3-button bar lacks (trap 18), then the Workout tab's own button.
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
# The old tabs are gone. Release A (A1/A5), then F199 (R-403): 3 tabs, always the same 3, with or
# without a gym: Workout, Gym, Profile (Progress moved into Profile).
- assertNotVisible: "^Progress$"
- assertVisible: "^Gym$"
- assertNotVisible: "^Shop$"
- assertNotVisible: "^History$"
# Audit Phase 3 / redesign R1: the ONE "Today" answer is the Up next card at the top of the
# Workout tab (src/tracker/lib/upNext.ts). The demo history ends yesterday, so today's routine is
# still to do: "Up next: <routine>" over "from <folder> · N exercises · <first> first" (not
# "Done today", not empty), with Start and See exercises.
- extendedWaitUntil:
    visible: 'Up next: .*'
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Up next: .*'
# The card's grey line is hidden from TalkBack (the title says it all), so the pattern also
# accepts the title's spoken line, which carries it.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '.*from .* · \d+ exercises?.*'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Start$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'See exercises'
- takeScreenshot: 01-workout-up-next
# D9: THE streak counts weeks, never days. Redesign R2: it is the Profile header's "Weeks in a
# row" (the demo's 13 weeks end yesterday, so it is above 0); Home's "This week so far" is gone.
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: '^Weeks in a row: [1-9][\d,]*$'
    timeout: 20000
- assertNotVisible: '(?i).*day streak.*'
- takeScreenshot: 01a-profile-weeks-in-a-row
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "See exercises"
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'See exercises'
# v0.28.0: the card opens the day's exercises first; nothing starts until Start.
- tapOn: "See exercises"
- extendedWaitUntil:
    visible: "^Today$"
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Today$'
# Owner profile (360 dp, font 1.3): six exercises fill the screen and the button is below them.
- scrollUntilVisible:
    element: "Change this routine"
    centerElement: true
    timeout: 20000
- takeScreenshot: 01b-today-preview
- back
- extendedWaitUntil:
    visible: 'Up next: .*'
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Up next: .*'
# Audit Phase 3 (RP-03) / redesign R4: the routine list names the same routine as the card — its
# card carries the "Next" tag (spoken "<name>, next, …") — and the card's Start starts exactly it.
- copyTextFrom: 'Up next: .*'
- evalScript: '${output.upNext = maestro.copiedText.replace(/^Up next: /, "").split(". ")[0]}'
- scrollUntilVisible:
    element: "Start routine ${output.upNext}"
    centerElement: true
    timeout: 30000
- assertVisible: "${output.upNext}, next, .*"
- takeScreenshot: 02-workout-tab
- scrollUntilVisible:
    element: "^Start$"
    direction: UP
    centerElement: true
    timeout: 30000
# The card's own button, "Start" (a routine card's is "Start routine"; "Start <name>" only shows
# after a workout today).
# The "keep your workouts safe" card (R-320: every member) can push Start below the edge.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Start$"
- tapOn: "^Start$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- takeScreenshot: 03-active-workout
# Progression v2: the Target line reads "<weight> · aim for N" (or bodyweight / first-time
# range); tapping it shows the one-sentence reason, tapping again hides it.
- assertVisible: 'Target .*(aim for \d+|×|First time).*Tap for why\.'
- tapOn:
    text: 'Target .*Tap for why\.'
    index: 0
- takeScreenshot: 03b-target-reason
- tapOn:
    text: 'Target .*Tap for why\.'
    index: 0
- tapOn:
    text: "More for .*"
    index: 0
- takeScreenshot: 04-exercise-menu
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Rest timer'
- tapOn: "Rest timer"
- takeScreenshot: 05-rest-picker
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Rest 0:30'
- tapOn: "Rest 0:30"
- takeScreenshot: 06-rest-set-to-30s
# Phase 2 (LW-27): every set control names its exercise and set, e.g.
# "Barbell Bench Press set 1. Change set type", "Mark Barbell Bench Press set 1 complete".
- tapOn:
    text: '.* set 1\. Change set type'
    index: 0
- takeScreenshot: 07-set-type-sheet
- back
# Set 1 is empty: the tick saves the grey hint shown in its boxes (Phase 2, packet B).
- tapOn:
    text: 'Mark .* set 1 complete'
    index: 0
- runFlow: sub-inuse-close.yaml
- takeScreenshot: 08-first-set-ticked-rest-running
# D8, 0.56.1 (Google Play policy: no USE_EXACT_ALARM): run-device-qa.sh allows "Alarms & reminders"
# before every flow (a member who said yes), so with exact alarms on the first rest must NOT ask
# 'Hear "Rest is over" on time'. The ask with it denied: qa-conditions.yml condition 6 (xc-6-ask-rest).
- assertNotVisible: 'Hear "Rest is over" on time'
- assertVisible: "Skip rest"
- tapOn:
    text: "Skip rest"
    # Maestro waits for a still screen BEFORE it taps, then taps where the button was. The rest
    # countdown never goes still, so it waited ~6 s and the rest could end first: the tap then hit
    # the next exercise's menu (owner phone, run 43219573265, phase1-a). Tap at once instead.
    waitToSettleTimeoutMs: 300
- tapOn:
    text: '.* set 2 weight, kilograms'
    index: 0
- waitForAnimationToEnd
- eraseText
- waitForAnimationToEnd
- inputText: " 300"
- takeScreenshot: 08b-typed-300
- hideKeyboard
- tapOn:
    text: 'Mark .* set 2 complete'
    index: 0
    # The rest countdown re-renders 4x a second, so "wait until the screen is still"
    # would sit out the whole 3.5 s the record toast is up.
    waitToSettleTimeoutMs: 300
# R-362 (owner, 5 Nov 2026): one record pop-up per exercise per workout. Set 1 (the suggested 75 kg
# over the demo's 72.5 kg) already took this exercise's pop-up (its medal shows on set 1), so 300 kg
# gets the medal only. NEGATIVE: no second pop-up (T76: this flow still waited for one).
- assertNotVisible: "New record.*"
- takeScreenshot: 09-no-second-record-pop-up
- runFlow: sub-inuse-close.yaml
# D7: 300 kg is ~4x the demo bench best (72.5 kg), so the row asks "300 kg — that's 4× your
# best. Keep it?" under the set (already saved; it never refuses). It is on purpose: Keep.
- tapOn:
    text: 'Keep 300.*'
    optional: true
    waitToSettleTimeoutMs: 300
- assertVisible: "Skip rest"
