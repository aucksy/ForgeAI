# UAT WP4b, part UB (M-07, step 4 of 4): the database is back (the script restored it in place, the
# app still on its error screen). "Try again" must open the app on the member's own data: the tabs,
# and the Profile's "Workouts: N" exactly as before the damage (-e WORKOUTS=N from step 1).
appId: com.mettleup.app
---
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'MettleUp could not start'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Try again$'
- tapOn: "^Try again$"
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- assertNotVisible: "MettleUp could not start"
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Edit profile'
- scrollUntilVisible:
    element: "^Workouts: ${WORKOUTS}$"
    direction: UP
    centerElement: true
    timeout: 15000
- takeScreenshot: ub-06-back-after-try-again
