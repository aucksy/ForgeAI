# Phone conditions (UAT WP7), condition 2c: Leave with NO INTERNET and nothing open. The phone leaves
# at once and says the gym will be told the next time the app is online.
# Release A: Leave is in Settings → Your gym; after it the Gym tab is its "Join your gym" screen,
# with the "gym will be told" words above the code box.
appId: com.mettleup.app
---
- runFlow: xc-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
# Release A (A4): Leave is in Settings → Your gym only.
- runFlow: xc-sub-leave-gym.yaml
- extendedWaitUntil:
    visible: 'Leave ${GYM}\?'
    timeout: 30000
- assertNotVisible: '.*open order.*'
- tapOn: "^Leave gym$"
- extendedWaitUntil:
    visible: "^Join your gym$"
    timeout: 30000
# The "gym will be told" words show on the Gym tab's "Join your gym" screen (Release A).
- runFlow: xc-sub-gym-none.yaml
- runFlow:
    file: xc-sub-find.yaml
    env:
      FIND: 'You left ${GYM} on this phone\. The gym couldn''t be reached, so it will be told the next time the app is online\.'
- takeScreenshot: xc2c-04-left-offline-words
