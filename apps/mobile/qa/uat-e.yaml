# UAT work package 4, part UE (U-M3, U-M2): "Erase all data", as a solo member and as a gym member,
# and the welcome's "From Hevy" promise.
#   1. Solo (no gym): Settings -> Erase or start over -> "Erase all data": the question names no gym; "Erase
#      everything" lands on the welcome; the app stopped and opened again still opens on it.
#   2. U-M2: on that welcome, "From Hevy" -> ... -> "Start training": the Hevy import MUST open by
#      itself (no way round through Settings: if it does not open, that is an app bug).
#   3. Gym member: join the test gym FORGE1 on the LIVE server (as part R: from the Gym tab's "Join
#      your gym" screen), then Erase: the question names "ForgeAI Test Gym"; after it (and the demo
#      loaded to reach the tabs) the Gym tab offers "Join your gym" again.
# Needs some data to erase: after part UD (its 12 imported workouts) or, alone, the script seeds the
# demo first.
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
# ---------------------------------------------------------------- 1. erase, solo
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Erase or start over"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Erase all data$"
- tapOn: "^Erase all data$"
- extendedWaitUntil:
    visible: 'Erase all data\?'
    timeout: 10000
- assertVisible: 'Every workout, record, routine, body entry, photo and video, your gym and Google Drive links, and your settings\. This phone goes back to new\..*'
- assertNotVisible: '.*You also leave .*'
- takeScreenshot: ue-01-erase-solo-question
- tapOn: "^Erase everything$"
- extendedWaitUntil:
    visible: "Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 60000
# Owner phone: the emulator can open the welcome scrolled down (a text box took focus); the
# step label sits above the screen since 0.57.0's two links under Next (R-123). Back to the top.
- scrollUntilVisible:
    element: "Step 1 of 3"
    direction: UP
    timeout: 20000
- assertVisible: "Welcome to MettleUp"
- assertNotVisible: 'Your \d+ workouts? (is|are) still here.*'
- takeScreenshot: ue-02-erased-welcome
# Stopped and opened again: still the welcome, nothing kept.
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 60000
# Owner phone: the emulator can open the welcome scrolled down (a text box took focus); the
# step label sits above the screen since 0.57.0's two links under Next (R-123). Back to the top.
- scrollUntilVisible:
    element: "Step 1 of 3"
    direction: UP
    timeout: 20000
- assertNotVisible: "^Profile$"
- assertNotVisible: 'Your \d+ workouts? (is|are) still here.*'
- takeScreenshot: ue-03-reopened-welcome
# ---------------------------------------------------------------- 2. U-M2: "From Hevy" opens the import
- tapOn: "Your name"
- inputText: "QA Switcher"
- hideKeyboard
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^From Hevy$"
- tapOn: "^From Hevy$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: 'Your Hevy workouts and routines come in right after you tap Start training\.'
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Next$"
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Kilograms or pounds\\?"
    timeout: 15000
- tapOn: "^Kilograms$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Next$"
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 3 of 3"
    timeout: 15000
- tapOn: "Build muscle"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Intermediate"
- tapOn: "Intermediate"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Start training"
- tapOn: "Start training"
# The promise: the Hevy import is open, by itself.
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 60000
- assertVisible: "Bring your Hevy history in"
- takeScreenshot: ue-04-hevy-import-opened-by-itself
- runFlow: sub-back-to-tabs.yaml
# ---------------------------------------------------------------- 3. erase, gym member
# The join is on the Gym tab's "Join your gym" screen (sub-join-gym.yaml), and it lands on the
# Workout tab. FORGE1 is unbranded, so the Gym tab's title is its name.
- runFlow:
    file: sub-join-gym.yaml
    env:
      CODE: "FORGE1"
      NAME: "QA Member"
      GYM: "ForgeAI Test Gym"
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "^ForgeAI Test Gym$"
    timeout: 45000
- takeScreenshot: ue-05-joined-forge1
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Erase or start over"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Erase all data$"
- tapOn: "^Erase all data$"
- extendedWaitUntil:
    visible: 'Erase all data\?'
    timeout: 10000
- assertVisible: '.*You also leave ForgeAI Test Gym\. With no internet, the gym is told the next time the app is online\.'
- takeScreenshot: ue-06-erase-gym-question
- tapOn: "^Erase everything$"
- extendedWaitUntil:
    visible: "Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 60000
# Owner phone: the emulator can open the welcome scrolled down (a text box took focus); the
# step label sits above the screen since 0.57.0's two links under Next (R-123). Back to the top.
- scrollUntilVisible:
    element: "Step 1 of 3"
    direction: UP
    timeout: 20000
- assertVisible: "Welcome to MettleUp"
# Into the app the quickest way (the demo), then: no gym.
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# No gym after the erase: the Gym tab is its "Join your gym" screen (Release A) and names no gym.
- runFlow: sub-gym-none.yaml
- scrollUntilVisible:
    element: "Gym code"
    timeout: 20000
- assertNotVisible: "^ForgeAI Test Gym$"
- assertNotVisible: "Gym: ForgeAI Test Gym"
- takeScreenshot: ue-07-your-gym-join-card-after-erase
