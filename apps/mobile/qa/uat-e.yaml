# UAT work package 4, part UE (U-M3, U-M2): "Erase all data", as a solo member and as a gym member,
# and the welcome's "From Hevy" promise.
#   1. Solo (no gym): Settings -> Erase or start over -> "Erase all data": the question names no gym; "Erase
#      everything" lands on the welcome; the app stopped and opened again still opens on it.
#   2. U-M2: on that welcome, "From Hevy" -> ... -> "Start training": the Hevy import MUST open by
#      itself (no way round through Settings: if it does not open, that is an app bug).
#   3. Gym member: join the run's own shop gym (TCODE / TGYM, qa_gym shop) on the LIVE server (as part R: from the Gym tab's "Join
#      your gym" screen), then Erase: the question names the gym (TGYM); after it (and the demo
#      loaded to reach the tabs) the Gym tab offers "Join your gym" again.
# Needs some data to erase: after part UD (its 12 imported workouts) or, alone, the script seeds the
# demo first.
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
# ---------------------------------------------------------------- 1. erase, solo
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Erase or start over"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Erase all data$"
- tapOn: "^Erase all data$"
- extendedWaitUntil:
    visible: 'Erase all data\?'
    timeout: 10000
# R-320: Google Drive is named only while a Drive link exists (none on this phone).
- assertVisible: 'Every workout, record, routine, body entry, photo and video, your gym link, and your settings\. This phone goes back to new\..*'
- assertNotVisible: '.*You also leave .*'
- takeScreenshot: ue-01-erase-solo-question
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Erase everything$'
- tapOn: "^Erase everything$"
# R-248: the intro screens (2-3, before the welcome) come first on a fresh install or after an
# erase. Skip them; an older build without them goes straight on.
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead'
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 60000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead'
# R-277: the welcome opens on its one-screen start view (no step label). Back to the top.
- scrollUntilVisible:
    element: "Get stronger every week"
    direction: UP
    timeout: 20000
- assertVisible: "Get stronger every week"
- assertNotVisible: 'Your \d+ workouts? (is|are) still here.*'
- takeScreenshot: ue-02-erased-welcome
# Stopped and opened again: still the welcome, nothing kept.
- launchApp
- tapOn:
    text: "Wait"
    optional: true
# R-248: the intro screens (2-3, before the welcome) come first on a fresh install or after an
# erase. Skip them; an older build without them goes straight on.
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead'
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 60000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead'
# R-277: the welcome opens on its one-screen start view (no step label). Back to the top.
- scrollUntilVisible:
    element: "Get stronger every week"
    direction: UP
    timeout: 20000
- assertNotVisible: "^Profile$"
- assertNotVisible: 'Your \d+ workouts? (is|are) still here.*'
- takeScreenshot: ue-03-reopened-welcome
# ---------------------------------------------------------------- 2. U-M2: "From Hevy" opens the import
# R-277: "Bring workouts" on the start view opens its screen; "From Hevy" there goes straight on to
# step 1, where the name is typed.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Bring workouts$"
- tapOn: "^Bring workouts$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^From Hevy$"
- tapOn: "^From Hevy$"
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 15000
- scrollUntilVisible:
    element: "Step 1 of 3"
    direction: UP
    timeout: 20000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Your name'
- tapOn: "Your name"
- inputText: "QA Switcher"
- hideKeyboard
- runFlow:
    file: sub-find.yaml
    env:
      FIND: 'Your Hevy workouts and routines come in right after you tap Start training\.'
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Next$"
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Kilograms or pounds\\?"
    timeout: 15000
- tapOn: "^Kilograms$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Next$"
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 3 of 3"
    timeout: 15000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Build muscle'
- tapOn: "Build muscle"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Intermediate"
- tapOn: "Intermediate"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Start training"
- tapOn: "Start training"
# The promise: the Hevy import is open, by itself.
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 60000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Choose Hevy file'
- assertVisible: "Bring your Hevy history in"
- takeScreenshot: ue-04-hevy-import-opened-by-itself
- runFlow: sub-back-to-tabs.yaml
# ---------------------------------------------------------------- 3. erase, gym member
# The join is on the Gym tab's "Join your gym" screen (sub-join-gym.yaml), and it lands on the
# Workout tab. the run's shop gym is unbranded, so the Gym tab's title is its name.
- runFlow:
    file: sub-join-gym.yaml
    env:
      CODE: "${TCODE}"
      NAME: "QA Member"
      GYM: "${TGYM}"
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "^${TGYM}$"
    timeout: 45000
- takeScreenshot: ue-05-joined-forge1
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Erase or start over"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Erase all data$"
- tapOn: "^Erase all data$"
- extendedWaitUntil:
    visible: 'Erase all data\?'
    timeout: 10000
- assertVisible: '.*You also leave ${TGYM}\. With no internet, the gym is told the next time the app is online\.'
- takeScreenshot: ue-06-erase-gym-question
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Erase everything$'
- tapOn: "^Erase everything$"
# R-248: the intro screens (2-3, before the welcome) come first on a fresh install or after an
# erase. Skip them; an older build without them goes straight on.
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead'
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 60000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead'
# R-277: the welcome opens on its one-screen start view (no step label). Back to the top.
- scrollUntilVisible:
    element: "Get stronger every week"
    direction: UP
    timeout: 20000
- assertVisible: "Get stronger every week"
# Into the app the quickest way (the demo), then: no gym.
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# No gym after the erase: the Gym tab is its "Join your gym" screen (Release A) and names no gym.
- runFlow: sub-gym-none.yaml
- scrollUntilVisible:
    element: "Gym code"
    timeout: 20000
- assertNotVisible: "^${TGYM}$"
- assertNotVisible: "Gym: ${TGYM}"
- takeScreenshot: ue-07-your-gym-join-card-after-erase
