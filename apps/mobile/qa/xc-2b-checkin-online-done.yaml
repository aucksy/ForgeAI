# Phone conditions (UAT WP7), condition 2b, after xc-2b-checkin-online.yaml and the desk's yes
# (0048). The check-in screen is still open: if it asked for the desk, Check in again goes in. Before
# 0048 is live the phone is already in. Either way: in as Asha.
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: '(You''re checked in.*|First check-in: go to the front desk and ask them to confirm your mobile number\. When they say it is done, tap Check in below\. You do this only once\.)'
    timeout: 60000
- runFlow:
    when:
      visible: 'First check-in: go to the front desk and ask them to confirm your mobile number\. When they say it is done, tap Check in below\. You do this only once\.'
    commands:
      - tapOn: "^Check in$"
- extendedWaitUntil:
    visible: 'You''re checked in.*'
    timeout: 60000
- assertVisible: 'Checked in at ${GYM} as Asha\. Have a good workout\.'
- takeScreenshot: xc2b-02-checkin-online
- tapOn: "^Done$"
