# Cross-role journeys (UAT WP6), seed: a fresh install's state (clearState) with the demo data
# loaded, the app on the Workout tab. Copied from gate-demo.yaml so a change to the phone test parts
# never moves the journeys. Every journey's phone steps start from here.
appId: com.mettleup.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 90000
# R-131: the first screen is the start view (no step label); "Load demo data instead" is at its
# bottom, so scroll down to it (no "Start fresh").
- scrollUntilVisible:
    element: "Load demo data instead"
    timeout: 30000
- tapOn: "Load demo data instead"
- extendedWaitUntil:
    visible: "(?i)load demo"
    timeout: 15000
- tapOn: "(?i)^load demo$"
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 30000
- takeScreenshot: xj-00-seeded
