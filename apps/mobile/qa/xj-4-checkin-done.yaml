# Cross-role journey 4, member step 2 of 2 (after xj-4-checkin.yaml and the admin step XJ4c). The
# check-in screen is still open. 0048: if it asked for the desk's yes, the desk has said it (XJ4c),
# so Check in again goes in. Before 0048 is live the phone is already in. Either way: in as Kiran,
# and NO "see the desk" line: the plan is active today.
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: '(You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m|First check-in: go to the front desk and ask them to confirm your mobile number\. When they say it is done, tap Check in below\. You do this only once\.)'
    timeout: 30000
- runFlow:
    when:
      visible: 'First check-in: go to the front desk and ask them to confirm your mobile number\. When they say it is done, tap Check in below\. You do this only once\.'
    commands:
      - tapOn: "^Check in$"
- extendedWaitUntil:
    visible: 'You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m'
    timeout: 30000
- assertVisible: 'Checked in at ${GYM} as Kiran\. Have a good workout\.'
- assertNotVisible: '.*[Ss]ee the desk.*'
- takeScreenshot: xj4-02-checked-in-plan-active
- tapOn: "^Done$"
