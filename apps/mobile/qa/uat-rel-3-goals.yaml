# Part UAT, flow 3 of 5: rep goals per set under R-350's simple rule (owner, 5 Nov 2026): +1 rep on
# each set below the top of the range, the same under every "Weight step" (it only sizes a weight step).
# History (tools/make_uat_hevy.py): bench last time 60 kg x 10, 8, 6 (range 6-10, just moved up).
#  - Standard and Large alike: 10, 9, 7 (set 1 is at the top, 10; sets 2 and 3 +1).
# The Target box's spoken label is "Target <weight> · <goals>[ · RPE <n>]. <kg line>. Tap for why." (RPE: effort on).
# Launch audit 3 Nov 2026: the label above each exercise's sets reads "Previous: <day> · <workout>".
# Then, with the workout started under Large (it stays open for flow 4):
#  - Pec Deck Fly, 4 flat workouts at 40 kg x 10, 9, 8: no step-back card any more (R-350 removed the
#    stall rule), the same 40 kg with +1 on each set: 11, 10, 9 (never 38: R-310);
#  - Leg Extension, 4 flat workouts at 45 kg x 12, 10, 9: 45 kg, +1 on each set below the top.
appId: com.mettleup.app
---
# The "keep your workouts safe" card (R-320: every member) can push Start below the edge.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Start$"
- tapOn: "^Start$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Target 60 kg · .*Tap for why\.$'
# R-351: the kg to beat is 60 x (10 + 9 + 7) = 1,560 kg, over last time's 60 x 24 = 1,440 kg.
- assertVisible: '^Target 60 kg · 10, 9, 7( · RPE \d+)?\. 1,560 kg to beat · .*'
- takeScreenshot: rel-20-bench-goals-standard
# Launch audit 3 Nov 2026 (#7): the line above the sets says where PREVIOUS comes from as "Previous:
# <day> · <workout>", never "Last:" (owner rule: "Previous", never "Last", where the sets are).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Previous: \d{1,2} [A-Z][a-z]{2}( \d{4})? · .*'
- assertNotVisible: '^Last: \d.*'
- takeScreenshot: rel-20b-previous-not-last
- assertNotVisible: '(?i).*add a set.*'
# Leave it (the tabs), throw it away the member's way, and choose Large.
- back
- runFlow: sub-workout-fresh.yaml
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "How the app picks your next weight"
- extendedWaitUntil:
    visible: '^Weight step, Standard\. Change$'
    timeout: 15000
- tapOn: '^Weight step, Standard\. Change$'
- extendedWaitUntil:
    visible: '^Large\. About 10% more each time$'
    timeout: 10000
- tapOn: '^Large\. About 10% more each time$'
- extendedWaitUntil:
    visible: '^Weight step, Large\. Change$'
    timeout: 10000
- takeScreenshot: rel-21-weight-step-large
- runFlow: sub-back-to-tabs.yaml
- tapOn:
    text: "^Workout$"
    index: 0
# The Workout tab keeps its scroll place, and cards sit above "Up next": look up first.
- scrollUntilVisible:
    element: 'Up next: Machine Day.*'
    direction: UP
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: 'Up next: Machine Day.*'
    timeout: 30000
# The "keep your workouts safe" card (R-320: every member) can push Start below the edge.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Start$"
- tapOn: "^Start$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Log a set to finish|Finish workout"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Target 60 kg · .*Tap for why\.$'
# R-351: the kg to beat is 60 x (10 + 9 + 7) = 1,560 kg, over last time's 60 x 24 = 1,440 kg.
- assertVisible: '^Target 60 kg · 10, 9, 7( · RPE \d+)?\. 1,560 kg to beat · .*'
- takeScreenshot: rel-22-bench-goals-large
# ---------------------------------------------------------------- R-350: no step-back cards, +1 a set
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Target 40 kg · 11, 10, 9( · RPE \d+)?\. 1,200 kg to beat · .*'
- assertNotVisible: '.*Stuck at 40 kg.*'
- assertNotVisible: "^Try 35 kg$"
- assertNotVisible: '.*\b38 kg.*'
- takeScreenshot: rel-23-pec-deck-plus-one
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Target 45 kg · 1[23], 11, 10( · RPE \d+)?\. .*'
- assertNotVisible: '.*Stuck at 45 kg.*'
- assertNotVisible: "^Try 40 kg$"
- takeScreenshot: rel-24-leg-extension-plus-one
- assertNotVisible: '(?i).*add a set.*'
