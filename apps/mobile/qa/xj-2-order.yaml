# Cross-role journey 2, member step 2: order 1 QA Towel again (stock back at 4). The owner cancels
# this one in the admin app (XJ2b).
appId: com.mettleup.app
---
- runFlow: xj-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- runFlow:
    file: xj-sub-order.yaml
    env:
      PRODUCT: "QA Towel"
      STOCK: "4 in stock"
- takeScreenshot: xj2-03-towel-ordered-again
