# Part UBK, first step (1 Nov 2026): the welcome screen's gym code is checked with the gym at once.
# A fresh install's start view (R-277: one screen), "Join my gym" -> the "Join your gym" screen:
#   1. "Scan the poster at your gym" and the "Gym code" box are both there (the scanner itself needs a
#      real poster, so it is not opened here).
#   2. A code no gym has (ZZZZZ9, as part INV-d) -> "No gym has the code ZZZZZ9. ..." under the box.
#   3. The test gym's real code (FORGE1, "ForgeAI Test Gym", as parts INV and R) -> "ForgeAI Test Gym
#      found. Its join screen opens right after setup." and the button "Join ForgeAI Test Gym".
#   4. "Change the code" lets it go again, and Back returns to the start view. uat-bk.yaml then starts
#      from a fresh install (clearState), so nothing here is left for it.
# The check is the live gym_preview (WelcomeGymCode.tsx, welcomeGymChecked): the box losing focus
# (hideKeyboard right after typing, while the keyboard is surely open: trap 20) checks a full code.
appId: com.mettleup.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
# R-248: the intro screens come first on a fresh install. Skip them.
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 90000
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Get stronger every week|Welcome to MettleUp|Restore from a backup|Load demo data instead"
    timeout: 90000
# ---------------------------------------------------------------- 1. "Join my gym" and its two ways in
# Owner profile (360 dp, font 1.3): the buttons can sit below the edge (trap 27).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Join my gym$"
- tapOn: "^Join my gym$"
- extendedWaitUntil:
    visible: "^Join your gym$"
    timeout: 15000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Scan the poster at your gym$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^or type the gym code$"
- takeScreenshot: wg-01-gym-card
# ---------------------------------------------------------------- 2. a code no gym has
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Gym code"
# The emulator can drop the first key into a freshly focused box (trap 5): type it again if needed.
- tapOn: "Gym code"
- inputText: "ZZZZZ9"
- runFlow:
    when:
      notVisible: "^ZZZZZ9$"
    commands:
      - tapOn: "Gym code"
      - eraseText: 10
      - inputText: "ZZZZZ9"
- assertVisible: "^ZZZZZ9$"
# The keyboard is open after typing, so this is not Android's Back. The box loses focus: the check runs.
- hideKeyboard
- extendedWaitUntil:
    visible: "No gym has the code ZZZZZ9.*"
    timeout: 30000
- assertVisible: 'No gym has the code ZZZZZ9\. Check the code with your gym''s desk and type it again\.'
- takeScreenshot: wg-02-no-gym
# ---------------------------------------------------------------- 3. the test gym's real code
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Gym code"
- tapOn: "Gym code"
- eraseText: 10
- inputText: "FORGE1"
# The last letter checks the code by itself; the box closes once the gym answers. Only if a key was
# dropped (trap 5) is the box still open without the answer: type it again.
- extendedWaitUntil:
    visible: "ForgeAI Test Gym found.*"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible: "ForgeAI Test Gym found.*"
    commands:
      - tapOn: "Gym code"
      - eraseText: 10
      - inputText: "FORGE1"
# No hideKeyboard here: the found gym closes the keyboard itself, and hideKeyboard on a closed
# keyboard is Android's Back, which left "Join my gym" (run 41392839160). The 6th letter checks the code.
- extendedWaitUntil:
    visible: "ForgeAI Test Gym found.*"
    timeout: 30000
- assertVisible: 'ForgeAI Test Gym found\. Its join screen opens right after setup\.'
# R-277: the bottom button names the gym (it keeps the code and goes on to the setup questions).
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Join ForgeAI Test Gym$"
# A wrong code's line has gone with it.
- assertNotVisible: "No gym has the code.*"
- takeScreenshot: wg-03-gym-found
# ---------------------------------------------------------------- 4. let it go again
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Change the code$"
- tapOn: "^Change the code$"
- extendedWaitUntil:
    notVisible: "ForgeAI Test Gym found.*"
    timeout: 10000
# Back on the start view (the code is let go, so no "saved" line there).
- scrollUntilVisible:
    element: "^Back$"
    direction: UP
    timeout: 20000
# A tap while the fast scroll still moves only stops it (run 41395557501): wait, tap, and tap once more
# if the Join your gym screen is still there.
- waitForAnimationToEnd
- tapOn: "^Back$"
- extendedWaitUntil:
    visible: "Get stronger every week"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "^Scan the poster at your gym$"
    commands:
      - waitForAnimationToEnd
      - tapOn: "^Back$"
- extendedWaitUntil:
    visible: "Get stronger every week"
    timeout: 15000
- assertNotVisible: "Gym code .* saved.*|ForgeAI Test Gym found.*"
