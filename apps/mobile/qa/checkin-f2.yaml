# Part INV, step F2 (QR self check-in). run-device-qa.sh opened the gym's CHECK-IN link
# https://forgeai.aakashpahuja.in/c/<CODE> at the app (am start -d … -p com.mettleup.app), as the
# camera does when the poster's QR is scanned. The phone is in that gym (F1): one tap "Check in"
# (never by itself: a forwarded link must not check anyone in). The app never sent a mobile number
# at Join, so it asks for it ONCE. A wrong number first (not on the roster: the desk words, with
# the number), then the roster's number → in, as the first name only. The roster member has no
# plan, so "Please see the desk" shows under it (0016).
# 0048 (R-287): a typed number that matches the list now waits for the desk's yes first ("Ask the
# front desk to confirm your mobile number..."). When that shows, the desk says yes the way the admin
# app's "Numbers to confirm" card does (js/desk-approve.js, with the test gym's owner key that
# run-device-qa.sh passes as CI_URL / CI_APIKEY / CI_OWNER_KEY), and the phone taps Check in again.
# Before 0048 is live the number checks in at once, and that step is skipped.
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: '^Check in at QA Check-in Gym$'
    timeout: 30000
- assertVisible: 'Tap Check in when you are at the gym\.'
- takeScreenshot: inv-f2-ready
- tapOn: '^Check in$'
- extendedWaitUntil:
    visible: 'Type the mobile number your gym has for you\. The app asks only once\.'
    timeout: 30000
- assertVisible: 'Type the mobile number your gym has for you\. The app asks only once\.'
- takeScreenshot: inv-f2-ask-number
- tapOn: 'Your mobile number'
- inputText: '9876500003'
- hideKeyboard
- tapOn: '^Check in$'
- extendedWaitUntil:
    visible: 'The gym doesn''t have your mobile number yet\. Ask the desk to add \+91 98765 00003, then scan again\.'
    timeout: 30000
- takeScreenshot: inv-f2-not-on-roster
- tapOn: '^Change my number$'
- tapOn: 'Your mobile number'
# The box still holds the number typed before (kept on purpose, to fix a typo): clear it first.
- eraseText: 20
- inputText: '98765 00002'
- hideKeyboard
- tapOn: '^Check in$'
- extendedWaitUntil:
    visible: '(You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m|Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.)'
    timeout: 30000
- runFlow:
    when:
      visible: 'Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.'
    commands:
      - takeScreenshot: inv-f2-desk-check
      - runScript:
          file: js/desk-approve.js
          env:
            DESK_URL: ${CI_URL}
            DESK_APIKEY: ${CI_APIKEY}
            DESK_KEY: ${CI_OWNER_KEY}
            DESK_PHONE: '+919876500002'
      - tapOn: '^Check in$'
- extendedWaitUntil:
    visible: 'You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m'
    timeout: 30000
- assertVisible: 'Checked in at QA Check-in Gym as QA\. Have a good workout\.'
- assertVisible: 'Your gym membership is not active today\. Please see the desk\.'
- takeScreenshot: inv-f2-checked-in
- tapOn: '^Done$'
