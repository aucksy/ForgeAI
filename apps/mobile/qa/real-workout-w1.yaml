# Part W1 — the "real workout" journey, step 1 of 4: a new member coming from Hevy.
# Audit lesson (13 Oct 2026, D:/Brain/Lessons/forgeai-audits-missed-what-a-real-workout-shows.md):
# the phone is set like the owner's (narrow ~360 dp screen, larger font) and pinned to MONDAY
# 1 MARCH 2027 by run-device-qa.sh; the history is a real-sized Hevy export (~500 workouts over 3
# years, tools/make_big_hevy.py) ending on Saturday 27 Feb. Here: the welcome with "From Hevy",
# the import, "Bring my routines in" → follow them, "Track RPE" on, then the Profile page's numbers
# on a Monday that is also the 1st of a month (the day "Last 3 months" read 0 for the owner).
appId: com.mettleup.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- tapOn:
    text: "Wait"
    optional: true
# R-248: the intro screens (2-3, before the welcome) come first on a fresh install or after an
# erase. Skip them; an older build without them goes straight on.
- extendedWaitUntil:
    visible: "^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Skip$|Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Restore from a backup|Load demo data instead'
- tapOn:
    text: "^Skip$"
    optional: true
- extendedWaitUntil:
    visible: "Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead"
    timeout: 90000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start fresh|Get stronger every week|Welcome to MettleUp|Step 1 of 3|Your name|^Next$|Restore from a backup|Load demo data instead'
# R-277: the first screen is the one-screen welcome. The switcher's way in: "Bring workouts" -> "From Hevy"
# (its import opens after Start training). Tapping it goes straight on to step 1, then the name.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Bring workouts$"
- tapOn: "^Bring workouts$"
- scrollUntilVisible:
    element: "^From Hevy$"
    centerElement: true
    timeout: 30000
- tapOn: "^From Hevy$"
- extendedWaitUntil:
    visible: "Step 1 of 3"
    timeout: 15000
# Owner phone: the emulator can open the welcome scrolled down (a text box took focus). Back to the top.
- scrollUntilVisible:
    element: "Step 1 of 3"
    direction: UP
    timeout: 20000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Your name'
- tapOn: "Your name"
- inputText: "Aakash"
- hideKeyboard
- takeScreenshot: w-00-welcome
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 20000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Kilograms or pounds\\?"
    timeout: 15000
- tapOn: "^Kilograms$"
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 20000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 3 of 3"
    timeout: 15000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Build muscle'
- tapOn: "Build muscle"
- scrollUntilVisible:
    element: "Intermediate"
    centerElement: true
    timeout: 20000
- tapOn: "Intermediate"
- scrollUntilVisible:
    element: "Start training"
    centerElement: true
    timeout: 20000
- takeScreenshot: w-01-welcome-step-3
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start training'
- tapOn: "Start training"
# ---------------------------------------------------------------- the Hevy import (~500 workouts)
# U-M2 (UAT, 17 Oct 2026): "From Hevy" promises the import opens by itself after Start training, so
# it must: no way round through Settings any more (that fallback hid whether the promise held).
- extendedWaitUntil:
    visible: "Choose Hevy file"
    timeout: 60000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Choose Hevy file'
- assertVisible: "Bring your Hevy history in"
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Choose Hevy file'
- tapOn: "Choose Hevy file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-hevy).*'
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '(?i).*(recent|downloads|files|qa-hevy).*'
- runFlow:
    when:
      notVisible: "qa-hevy-big.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- tapOn: "qa-hevy-big.*"
- extendedWaitUntil:
    visible: "^Date range$"
    timeout: 120000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Date range$'
- takeScreenshot: w-02-import-preview
# Three years: the range must carry its years (Feb 2024 → Feb 2027).
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '.*2024 → .*2027'
- tapOn:
    text: "^Merge$"
    optional: true
- scrollUntilVisible:
    element: 'Import [\d,]+ workouts'
    centerElement: true
    timeout: 30000
- copyTextFrom: 'Import [\d,]+ workouts'
- evalScript: '${output.imported = maestro.copiedText.replace(/^Import /, "")}'
- tapOn: 'Import [\d,]+ workouts'
- extendedWaitUntil:
    visible: '[\d,]+ workouts imported'
    timeout: 300000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '[\d,]+ workouts imported'
- assertVisible: "${output.imported} imported"
- takeScreenshot: w-03-imported
- scrollUntilVisible:
    element: "Bring my routines in"
    centerElement: true
    timeout: 15000
- tapOn: "Bring my routines in"
- extendedWaitUntil:
    visible: "We found 3 routines in your Hevy workouts"
    timeout: 60000
- takeScreenshot: w-04-routines-found
- tapOn: "Check these 3"
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "[123] of 3"
          timeout: 20000
      - scrollUntilVisible:
          element: "^Next$"
          centerElement: true
          timeout: 15000
      - tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Follow (this|these) as your plan\\?"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Follow (this|these) as your plan\?'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Follow (it|them)$'
- tapOn: "^Follow (it|them)$"
- extendedWaitUntil:
    visible: "3 routines in From Hevy"
    timeout: 20000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Open routines'
- tapOn: "Open routines"
# ---------------------------------------------------------------- effort on (as the owner has it)
# Release A (A8): "Rate how hard each set felt" (was Track RPE) has its own page; the page's title
# is the same words, so the switch is found by its state.
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Rate how hard each set felt"
- extendedWaitUntil:
    visible: "Adds a box to each set.*"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Adds a box to each set.*'
- runFlow:
    when:
      visible:
        text: "Rate how hard each set felt"
        checked: false
    commands:
      - tapOn:
          text: "Rate how hard each set felt"
          checked: false
- assertVisible:
    text: "Rate how hard each set felt"
    checked: true
- takeScreenshot: w-05-track-rpe-on
- back
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "Previous numbers"
- extendedWaitUntil:
    visible: "^Any workout$"
    timeout: 20000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Any workout$'
- takeScreenshot: w-05b-previous-values
# R-284: Previous numbers → More workout choices → Settings → Profile.
- back
- back
- back
# ---------------------------------------------------------------- Profile on a Monday the 1st
# Monday 1 March 2027, history to Saturday: the last 3 months hold ~40 workouts, so the 3-month
# total can never be 0, and "All time" (3 years) must be bigger than the last 12 months.
- tapOn:
    text: "^Profile$"
    index: 0
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Edit profile'
- assertVisible: '^Workouts: [1-9][\d,]+$'
- assertVisible: '^Weeks in a row: [1-9][\d,]*$'
- takeScreenshot: w-06-profile-top
- scrollUntilVisible:
    element: '^(Kg|Lb) lifted$'
    centerElement: true
    timeout: 20000
- tapOn:
    text: '^(Kg|Lb) lifted$'
    index: 0
# The caption sits above the bars: after the chip the page can be scrolled past it.
# The UP swipe starts mid-screen; at 360 dp / font 1.3 that can be ON the chart, which reads the touch as
# picking a week ("Kg lifted in 18-24 Jan", run 42126016591). Then "Show 3-month total" brings it back.
- scrollUntilVisible:
    element: '(Kg|Lb) lifted in the last 3 months · .*'
    direction: UP
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Show 3-month total"
    commands:
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'Show 3-month total'
      - tapOn: "Show 3-month total"
- scrollUntilVisible:
    element: '(Kg|Lb) lifted in the last 3 months · .*'
    direction: UP
    timeout: 15000
- assertNotVisible: '(Kg|Lb) lifted in the last 3 months · 0 .*'
- takeScreenshot: w-07-chart-3-months
- tapOn: "Range: Last 3 months. Change"
- extendedWaitUntil:
    visible: "^Show$"
    timeout: 10000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Last 12 months$'
- tapOn: "^Last 12 months$"
- extendedWaitUntil:
    visible: "Range: Last 12 months. Change"
    timeout: 15000
- takeScreenshot: w-08-chart-12-months
- tapOn: "Range: Last 12 months. Change"
- extendedWaitUntil:
    visible: "^Show$"
    timeout: 10000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^All time$'
- tapOn: "^All time$"
- extendedWaitUntil:
    visible: "(Kg|Lb) lifted since .* · .*"
    timeout: 15000
- takeScreenshot: w-09-chart-all-time
- tapOn: "Range: All time. Change"
- extendedWaitUntil:
    visible: "^Show$"
    timeout: 10000
- tapOn:
    text: "^Last 3 months$"
    below:
      text: "^Show$"
- extendedWaitUntil:
    visible: "Range: Last 3 months. Change"
    timeout: 15000
- runFlow:
    file: sub-progress-row.yaml
    env:
      ROW: "Charts"
- extendedWaitUntil:
    visible: "Last 7 days"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Last 7 days'
- takeScreenshot: w-10-statistics-monday
- back
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: 'Up next: Push A.*'
    timeout: 30000
- takeScreenshot: w-11-up-next
