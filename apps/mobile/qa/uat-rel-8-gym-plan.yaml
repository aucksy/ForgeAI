# Part UAT, flow 8 (gym, step 2 of 2), after flow 7 and the desk's yes (qa/uat_gym.py confirm):
#  - #9 check-in words: the big line "You're checked in at 6:42 pm" (no tick mark), the line under it.
#  - plan-ends card: the Gym tab reads "My membership" (QA Monthly, ending in a few days) and keeps it;
#    the Workout tab then says "Your plan ends on <Friday, 6 Nov>. Renew at the front desk."
# GYM and ENDS ("Friday, 6 Nov", the day as the app words it) are passed by run-device-qa.sh (-e).
appId: com.mettleup.app
---
- extendedWaitUntil:
    visible: '(You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m|Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.)'
    timeout: 30000
- runFlow:
    when:
      visible: 'Ask the front desk to confirm your mobile number\. They do this only once\. Then tap Check in\.'
    commands:
      - tapOn: "^Check in$"
- extendedWaitUntil:
    visible: '^You''re checked in at [0-9]{1,2}:[0-9]{2} [ap]m$'
    timeout: 30000
- assertVisible: '^Checked in at ${GYM} as Uma( Desk)?\. Have a good workout\.$'
- assertNotVisible: '.*✓.*'
- assertNotVisible: '.*[Ss]ee the desk.*'
- takeScreenshot: rel-80-checked-in
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Done$"
- tapOn: "^Done$"
# ---------------------------------------------------------------- the plan, then the Workout tab
- tapOn:
    text: "^Gym$"
    index: 0
    optional: true
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^QA Monthly$"
- takeScreenshot: rel-81-gym-tab-plan
- tapOn:
    text: "^Workout$"
    index: 0
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Your plan ends on ${ENDS}\\. Renew at the front desk\\.$"
- takeScreenshot: rel-82-plan-ends-card
