# Part UAT, flow 2 of 5: the Settings choice behind the suggested weights.
#  - R-350 (owner, 5 Nov 2026): the stall rule is gone, so Settings -> More workout choices has no
#    "When I'm stuck at a weight" row any more (R-308's sheet was removed with it).
#  - R-303/R-307: Settings -> More workout choices -> How the app picks your next weight -> "Weight
#    step" (was "Weight jumps"): Standard by default. Flow 3 reads the bench's goals under it, then
#    under Large.
appId: com.mettleup.app
---
- runFlow:
    file: sub-settings-page.yaml
    env:
      PAGE: "More workout choices"
- extendedWaitUntil:
    visible: "^How the app picks your next weight$"
    timeout: 15000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^How the app picks your next weight$'
- assertNotVisible: "^When I'm stuck at a weight$"
- assertNotVisible: "^Ask me$"
- takeScreenshot: rel-10-more-workout-choices
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^How the app picks your next weight$'
- tapOn: "^How the app picks your next weight$"
- extendedWaitUntil:
    visible: '^Weight step, Standard\. Change$'
    timeout: 15000
- takeScreenshot: rel-12-weight-step-standard
- back
- back
- back
- tapOn:
    text: "^Workout$"
    index: 0
# The Workout tab keeps its scroll place, and cards sit above "Up next": look up first.
- scrollUntilVisible:
    element: 'Up next: Machine Day.*'
    direction: UP
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: 'Up next: Machine Day.*'
    timeout: 30000
