# Cross-role journeys (UAT WP6), sub-flow: the gym's shop (GYM, unbranded: its name is the title)
# -> My orders. The page asks the gym for news when it opens and every 10 s.
appId: com.mettleup.app
---
- runFlow: xj-sub-shop.yaml
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "^My orders.*"
- tapOn: "^My orders.*"
- extendedWaitUntil:
    visible: "^My orders$"
    timeout: 20000
