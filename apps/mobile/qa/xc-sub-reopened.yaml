# Phone conditions (UAT WP7), sub-flow: the app was just opened again by the script (after the
# process was killed, or after an update), WITHOUT Maestro's launchApp (that force-stops the app,
# which would also cancel its alarms). Waits for the app, then opens the live workout if the app
# came up on the tabs. Ends on the live workout ("Finish workout" / "Log a set to finish").
appId: com.mettleup.app
---
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$|Finish workout|Log a set to finish|Skip rest"
    timeout: 120000
- runFlow:
    when:
      notVisible: "Finish workout|Log a set to finish"
    commands:
      - tapOn:
          text: "^Workout$"
          index: 0
      - scrollUntilVisible:
          element: "Resume workout"
          direction: UP
          centerElement: true
          timeout: 30000
      - tapOn: "Resume workout"
- extendedWaitUntil:
    visible: "Finish workout|Log a set to finish"
    timeout: 30000
