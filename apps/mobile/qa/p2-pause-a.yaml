# Part P2a (15 Oct 2026): pause the workout timer, as Hevy (tap the duration -> Pause). Part H2 left
# a workout open: resume it (or start an empty one). The script then waits 70 s and checks the
# duration did not move (uiautomator dump), and P2b resumes it. Part I discards the workout after.
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- tapOn:
    text: "^Workout$"
    index: 0
- extendedWaitUntil:
    visible: "Start empty workout|Resume workout"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Start empty workout|Resume workout'
- runFlow:
    when:
      visible: "Resume workout"
    commands:
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'Resume workout'
      - tapOn: "Resume workout"
- runFlow:
    when:
      visible: "Start empty workout"
    commands:
      - runFlow:
          file: sub-see.yaml
          env:
            FIND: 'Start empty workout'
      - tapOn: "Start empty workout"
      - runFlow: sub-start-blank.yaml
- extendedWaitUntil:
    visible: 'Workout duration .*Tap to pause\.'
    timeout: 20000
- tapOn: 'Workout duration .*Tap to pause\.'
- extendedWaitUntil:
    visible: "Pause Workout Timer"
    timeout: 10000
- takeScreenshot: p2-timer-menu
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'Pause Workout Timer'
- tapOn: "Pause Workout Timer"
- extendedWaitUntil:
    visible: 'Workout paused\. Ticking a set resumes it\..*'
    timeout: 10000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Paused$'
- takeScreenshot: p2-paused
