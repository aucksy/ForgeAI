# Sub-flow (called with runFlow; not a part of its own). Opens Settings (sub-settings-open.yaml),
# then one of its pages by the row's title, passed in by the caller:
#   - runFlow:
#       file: sub-settings-page.yaml
#       env:
#         PAGE: "Save as a spreadsheet"
# PAGE is a regex for the row's visible title (src/components/settings/settingsLines.ts
# settingsGroups; never a group heading). No `env:` default here: a flow-level default would override the caller's (trap 22).
# The page's own title is the same words, so the caller waits for something ON the page after this.
# Health apps' row shows only once the app has read Health Connect's state: it is waited for.
# R-284: three rare workout pages sit behind "More workout choices", and the backup file's two pages
# behind "Backup and restore": for those PAGE values this taps through that row first.
# Plain == checks only: a /regex/.test(PAGE) condition came out true for EVERY page (run 41453967886).
appId: com.mettleup.app
---
- runFlow:
    file: sub-settings-open.yaml
- runFlow:
    when:
      true: ${PAGE == 'How the app picks your next weight' || PAGE == 'Previous numbers' || PAGE == 'Muscle tips'}
    commands:
      - scrollUntilVisible:
          element: "^More workout choices$"
          centerElement: true
          timeout: 20000
      - tapOn: "^More workout choices$"
      - extendedWaitUntil:
          visible: "^How the app picks your next weight$"
          timeout: 15000
- runFlow:
    when:
      true: ${PAGE == 'Download my data' || PAGE == 'Restore from a backup'}
    commands:
      - scrollUntilVisible:
          element: "^Backup and restore$"
          centerElement: true
          timeout: 20000
      - tapOn: "^Backup and restore$"
      - extendedWaitUntil:
          visible: "^Restore from a backup$|^Download my data$"
          timeout: 15000
- scrollUntilVisible:
    element: "^${PAGE}$"
    centerElement: true
    timeout: 20000
- tapOn: "^${PAGE}$"
