# Phone conditions (UAT WP7), condition 2c: back online, the app is started again (the "next start"
# that sends the kept Leave). In no gym the Gym tab is its "Join your gym" screen (Release A).
appId: com.mettleup.app
---
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
- runFlow: xc-sub-gym-none.yaml
- takeScreenshot: xc2c-05-restarted-online
