# Cross-role journey 1 (UAT WP6), member step 1: join the fresh gym run-journeys.sh made, by typing
# its gym code (CODE, gym name GYM) on the Gym tab's "Join your gym" screen, then order 2 of the QA Shaker the owner
# just added with stock 3 (the admin app, step XJ1a). The product page must say "Only 3 left" first. Ends on My orders:
# Ordered, "The gym is getting it ready", 2 x QA Shaker.
appId: com.mettleup.app
---
- stopApp
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# The join is on the Gym tab's "Join your gym" screen (sub-join-gym.yaml, Release A), and it lands
# on the Workout tab; then the Gym tab (its "Shop" part once the product list has arrived).
- runFlow:
    file: sub-join-gym.yaml
    env:
      CODE: "${CODE}"
      NAME: "QA Member"
      GYM: "${GYM}"
- takeScreenshot: xj1-01-joined-workout
- tapOn:
    text: "^(Shop|Gym)$"
    index: 0
- extendedWaitUntil:
    visible: "^${GYM}$"
    timeout: 45000
- assertVisible: "Pay at the desk"
# Release A: the Gym tab, membership and Check in first; its "Shop" part once the list arrives.
- scrollUntilVisible:
    element: "QA Shaker, .*"
    timeout: 45000
- scrollUntilVisible:
    element: "^Shop$"
    direction: UP
    timeout: 20000
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "QA Towel, .*"
- takeScreenshot: xj1-02-gym-shop
# ---------------------------------------------------------------- order 2 shakers
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "QA Shaker, .*"
- tapOn: "QA Shaker, .*"
- extendedWaitUntil:
    visible: "^QA Shaker$"
    timeout: 15000
# The owner's stock of 3, as the member sees it.
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "^Only 3 left$"
- takeScreenshot: xj1-03-product-only-3-left
- runFlow:
    file: xj-sub-find.yaml
    env:
      FIND: "One more QA Shaker"
- tapOn: "One more QA Shaker"
- assertVisible: "Quantity 2"
- scrollUntilVisible:
    element: "Add to bag"
    centerElement: true
    timeout: 15000
- tapOn: "Add to bag"
- extendedWaitUntil:
    visible: "Added 2 to your bag"
    timeout: 10000
- scrollUntilVisible:
    element: "Go to bag"
    centerElement: true
    timeout: 15000
- tapOn: "Go to bag"
- extendedWaitUntil:
    visible: "^Bag$"
    timeout: 15000
- scrollUntilVisible:
    element: "^Place order$"
    centerElement: true
    timeout: 15000
- assertVisible: 'Pay at the desk when you collect it\. Nothing is charged in the app\.'
- takeScreenshot: xj1-04-bag
- tapOn: "^Place order$"
- extendedWaitUntil:
    visible: 'Order \d+ placed\. Pay at the desk when you collect it\.'
    timeout: 45000
- assertVisible: "^My orders$"
- extendedWaitUntil:
    visible: "^The gym is getting it ready$"
    timeout: 20000
- assertVisible: "^Ordered$"
- assertVisible: '2 × QA Shaker'
- takeScreenshot: xj1-05-ordered
