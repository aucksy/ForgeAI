# Part UAT, flow 12c (gym, after flow 12b). R-533 (owner, 14 Nov 2026) "there was no dot or something in that section
# saying that there's something to be checked", and R-586: the trainer the member picked replies. Runs only when
# qa/uat_gym.py trainer signed in as "Tara Singh" and replied to the question flow 12b sent her (run-device-qa.sh), so
# every check here is strict:
#  - the Gym tab's ONE "Message your gym" row says the gym replied and carries a red count (picture rel-125);
#  - the reply reads under the question, signed with the trainer's first name ("Tara from your gym"), marked New, and
#    the message still says who it went to ("To: Tara Singh") (rel-126);
#  - back on the Gym tab the count and the "replied" line are gone (rel-127).
appId: com.mettleup.app
---
# A fresh read of the row: another tab first, then Gym (the row asks the server each time the tab opens).
- tapOn:
    text: "^Workout$"
- tapOn:
    text: "^Gym.*"
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^Your gym replied\. Tap to read it\.$'
# in-view: the red count sits on the row just brought into view
- assertVisible:
    id: "gym-talk-unread"
- takeScreenshot: rel-125-ask-reply-red-count
- tapOn: '^Your gym replied\. Tap to read it\.$'
# in-view: the page just opened at its top; the sub-see below scrolls to it
- extendedWaitUntil:
    visible: 'QA reply: one rest day is fine, two if your legs still ache\.'
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'QA reply: one rest day is fine, two if your legs still ache\.'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Tara from your gym · (Today|Yesterday), [0-9]{1,2}:[0-9]{2} [ap]m$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^New$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: 'QA check: is one rest day enough\?'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Question · To: Tara Singh · (Today|Yesterday), [0-9]{1,2}:[0-9]{2} [ap]m$'
- takeScreenshot: rel-126-ask-reply-read
- back
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Message your gym$'
# in-view: the row was just brought into view; its count and "replied" line must be gone, not elsewhere.
- assertNotVisible:
    id: "gym-talk-unread"
# in-view: the same row, just brought into view.
- assertNotVisible: '^Your gym replied.*Tap to read.*$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Ask your gym or a trainer, share feedback or make a complaint$'
- takeScreenshot: rel-127-ask-reply-count-gone
