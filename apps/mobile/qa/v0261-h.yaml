# v0.26.1 device QA, part H1 — the rest card (what the watch shows). Runs after parts A–G.
# An empty workout → Barbell Bench Press with a 3:00 rest and 3 sets → tick set 1 → the app
# goes to the background → the phone's shade shows the swipe-away card, since Phase 2 (RT-05) its
# own view: a countdown "2:53 left · Barbell Bench Press, set 2" over "Rest 3:00 · ends …", with
# (Phase 6) three buttons in the order "Done", "+15 s", "Skip" → "+15 s" from the shade → the card
# reads "Rest 3:15". (A watch shows this card's title and text, set as before; its buttons run
# here, on the phone.) The card's "Done" is tapped next, in part H1D (v0261-h1d.yaml), after the
# script has read this card from the notification list.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 60000
- tapOn: "^Workout$"
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 30000
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " bench press"
- hideKeyboard
# Phase 2 (LW-15): tick the exercise in the picker, then "Add 1".
- tapOn:
    text: "Select Barbell Bench Press"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "More for Barbell Bench Press"
    timeout: 15000
# A known rest length, so the card's numbers can be checked.
- tapOn: "More for Barbell Bench Press"
- tapOn: "Rest timer"
- tapOn: "Rest 3:00"
- scrollUntilVisible:
    element: "Add set"
    centerElement: true
    timeout: 15000
- tapOn: "Add set"
- tapOn: "Add set"
- scrollUntilVisible:
    element: "More for Barbell Bench Press"
    direction: UP
    centerElement: true
    timeout: 15000
# LW-27: "Mark Barbell Bench Press set 1 complete". The empty row saves its grey hint (last time).
- tapOn:
    text: "Mark .* set 1 complete"
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 10000
- takeScreenshot: 110-rest-in-app
# ---------------------------------------------------------------- the app in the background
- pressKey: Home
- swipe:
    start: 50%, 1%
    end: 50%, 75%
    duration: 600
- waitForAnimationToEnd:
    timeout: 3000
# The shade swipe sometimes lands on the launcher instead (run 38038041222): try twice more.
- runFlow:
    when:
      notVisible: 'Rest 3:00 · ends .*'
    commands:
      - swipe:
          start: 50%, 0%
          end: 50%, 80%
          duration: 800
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      notVisible: 'Rest 3:00 · ends .*'
    commands:
      - swipe:
          start: 50%, 0%
          end: 50%, 80%
          duration: 800
- extendedWaitUntil:
    visible: 'Rest 3:00 · ends .*'
    timeout: 15000
# A notification lower in the shade shows its buttons only when opened out.
- runFlow:
    when:
      notVisible: '\+15 s'
    commands:
      - swipe:
          from:
            text: 'Rest 3:00 · ends .*'
          direction: DOWN
# Phase 2 (RT-05): the card's big line counts down: '2:53 left · Barbell Bench Press, set 2'.
- assertVisible: '.*Barbell Bench Press, set 2'
# Phase 6: three buttons, Done first, then +15 s, then Skip (left to right in the shade).
- assertVisible: '^Done$'
- assertVisible: '\+15 s'
- assertVisible: '^Skip$'
- assertVisible:
    text: '\+15 s'
    rightOf:
      text: '^Done$'
- assertVisible:
    text: '^Skip$'
    rightOf:
      text: '\+15 s'
- takeScreenshot: 111-shade-rest-card
- tapOn:
    text: '\+15 s'
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: 'Rest 3:15 · ends .*'
    timeout: 10000
- takeScreenshot: 112-shade-after-plus-15
