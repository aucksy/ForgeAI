# Device QA, part M (after) — the app was uninstalled and the SAME APK installed again; Android
# restored its backup. The member must land in the app (not the welcome screen) and Settings →
# Backup must show the same workout count as before the backup.
# The script passes that line in: maestro test -e WORKOUTS_LINE="12 workouts" ...
appId: com.mettleup.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "(?i)^allow$"
    optional: true
# A restored member goes straight to the tabs. Without the restore this is the welcome screen
# (audit Phase 7: 3 steps, opening on "Step 1 of 3"; "Start training" is only on step 3), and
# the wait times out here (Maestro saves a picture of what it saw).
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 90000
# R-277: the first screen of the welcome is the one-screen start view, not "Step 1 of 3".
- assertNotVisible: "Step 1 of 3|Start fresh|Get stronger every week|Use without an account"
- assertNotVisible: "Load demo data instead"
- takeScreenshot: 181-after-reinstall-first-screen
# Redesign R6: the Backup card is Settings → Backup (the Profile page's gear).
# R-320: Android's own backup (the workout count, "Include photos in my backup") left the Backup page,
# which now shows only the MettleUp account. Its page stays for this check, opened by its link.
- openLink: "forgeai://settings/phone-backup"
- extendedWaitUntil:
    visible: "^Your workouts$|^[0-9]+ workouts?$|^No workouts yet$"
    timeout: 30000
    optional: true
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Your workouts$|^[0-9]+ workouts?$|^No workouts yet$'
- scrollUntilVisible:
    element: "^${WORKOUTS_LINE}$"
    centerElement: true
    timeout: 30000
- assertVisible: "^${WORKOUTS_LINE}$"
- takeScreenshot: 182-after-reinstall-workouts
