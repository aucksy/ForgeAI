# Copied for the phone-conditions run (UAT WP7, run-conditions.sh) from sub-leave-gym.yaml, so a change to the
# phone test parts never moves these flows. Same behaviour.
appId: com.forgeai.app
---
- runFlow:
    file: xc-sub-settings-open.yaml
- scrollUntilVisible:
    element: "^Leave .+$"
    centerElement: true
    timeout: 20000
- tapOn: "^Leave .+$"