# Part UAT, flow "gt" (gym, after flow 12): "Message your gym" (owner request, 12 Nov 2026; docs/plans/gym-member-messages.md).
# The phone is a member ("Uma") of the fresh "QA UAT Gym" made by run-device-qa.sh.
#  - Until the gym's server has 0069 (NOT applied live yet), a store build hides the row. This QA build carries the
#    'gymTalk' stand-in (qa-device.yml): the page runs on a pretend gym kept in the phone and says so on screen, and
#    the pretend gym answers each new message once, a moment after it was sent. So the whole member side is seen.
#  - Once 0069 is live the real server answers (no pretend reply): the flow then checks send and "waiting" only.
# Both branches end on the Gym tab.
# Types covered: happy path (send, reply, red count, New, write back), negative (no "without my name" for a question
# or a complaint; empty text cannot be sent), edge (complaint hint says only the owner reads it).
# The gym's side (Member messages in the admin app) is checked by apps/dashboard/e2e/member-messages-uat.spec.mjs.
appId: com.mettleup.app
---
- tapOn:
    text: "^Gym$"
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Message your gym$"
- assertVisible: "^Ask a question, share feedback or make a complaint$"
- assertNotVisible:
    id: "gym-talk-unread"
- takeScreenshot: rel-gt-01-gym-tab-row
- tapOn: "^Message your gym$"
- extendedWaitUntil:
    visible: "^Questions and feedback go to your gym's owner, front desk and trainers\\. Any reply shows on this page\\.$"
    timeout: 30000
- assertVisible: "^What is it about\\?$"
# The page opens at its top, so the test-build note (QA build, server without 0069) is on screen if it is there.
# Decided HERE, before any scrolling: the pretend gym then answers, and the whole member side is checked.
- runFlow:
    when:
      notVisible: "^Test build: these messages stay on this phone and do not reach your gym\\.$"
    commands:
      # The real server (0069 live): send and "waiting" only; the gym answers from the admin app.
      - runFlow: sub-gym-talk-send.yaml
      - back
      - extendedWaitUntil:
          visible: "${GYM}"
          timeout: 30000
- runFlow:
    when:
      visible: "^Test build: these messages stay on this phone and do not reach your gym\\.$"
    commands:
      - takeScreenshot: rel-gt-01b-page-test-build-note
      - runFlow: sub-gym-talk-send.yaml
      - back
      - extendedWaitUntil:
          visible: "${GYM}"
          timeout: 30000
      # A pull asks again (the pretend gym answers 2 seconds after the message).
      - swipe:
          direction: DOWN
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: "^Your gym replied\\. Tap to read it\\.$"
      - assertVisible:
          id: "gym-talk-unread"
      - takeScreenshot: rel-gt-05-row-replied
      - tapOn: "^Your gym replied\\. Tap to read it\\.$"
      - extendedWaitUntil:
          visible: "^Message your gym$"
          timeout: 30000
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: "^Ravi from your gym · (Today|Yesterday), [0-9]{1,2}:[0-9]{2} [ap]m$"
      - assertVisible: "^New$"
      - assertVisible: "Thanks for writing to us\\. We have read your message and will sort it out this week\\."
      - takeScreenshot: rel-gt-06-reply-new
      - tapOn: "^Write back$"
      - inputText: "QA check: thank you"
      - hideKeyboard
      - tapOn: "^Send$"
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: "^Sent\\.$"
      - assertVisible: "QA check: thank you"
      - takeScreenshot: rel-gt-07-wrote-back
      # Read: the red count is gone from the row.
      - back
      - extendedWaitUntil:
          visible: "${GYM}"
          timeout: 30000
      - runFlow:
          file: sub-find.yaml
          env:
            FIND: "^Ask a question, share feedback or make a complaint$"
      - assertNotVisible:
          id: "gym-talk-unread"
      - takeScreenshot: rel-gt-08-row-read
