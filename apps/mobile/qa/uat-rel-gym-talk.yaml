# Part UAT, flow "gt" (gym, after flow 12c): "Message your gym" (owner request, 12 Nov 2026; docs/plans/gym-member-messages.md)
# with R-586 "Who should read it?" (owner, 15 Nov 2026; 0096 APPLIED LIVE 15 Nov 2026, R-591).
# The phone is a member ("Uma") of the fresh "QA UAT Gym" made by run-device-qa.sh, with the two made-up trainers
# flow 12b used ("Tara Singh", her own trainer, and "Vikram Rao"). 0069 is live, so the real server answers: there is
# no QA-build pretend gym any more (its note must not show).
# Types covered: happy path (a question to the owner, a complaint to "Gym admin", feedback to the owner without the
# name, each message's "To: ..." line), negative (no trainer for a complaint or feedback; no "without my name" for a
# question or a complaint), edge (each pick changes who reads it). The server side is checked after this flow
# (qa/uat_gym.py talk-to / trainer: who each message really went to, and that trainers do not see them).
# The gym's side (Member messages in the admin panel, "To: ...") is checked by the admin e2e message-recipient-uat.spec.mjs.
appId: com.mettleup.app
---
- tapOn:
    text: "^Gym$"
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Message your gym$"
# R-549: Uma may also ask a trainer (a running paid plan), so the ONE row names both.
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Ask your gym or a trainer, share feedback or make a complaint$'
# in-view: the red count would sit on the row just brought into view
- assertNotVisible:
    id: "gym-talk-unread"
- takeScreenshot: rel-gt-01-gym-tab-row
- tapOn: "^Message your gym$"
# in-view: the page just opened at its top; the hint sits under the Question chip
- extendedWaitUntil:
    visible:
      id: "talk-kind-hint-ready"
    timeout: 30000
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^Send your gym a question, feedback or a complaint\. Any reply shows on this page\.$'
# in-view: the page just opened at its top, where the QA-build note sat before 0069 was live
- assertNotVisible: "^Test build: these messages stay on this phone and do not reach your gym\\.$"
# in-view: the same place; the R-549 choice is gone with 0096
- assertNotVisible: '^Who is it for\?$'
- runFlow:
    file: sub-see.yaml
    env:
      FIND: '^What is it about\?$'
- runFlow: sub-gym-talk-send.yaml
- back
- extendedWaitUntil:
    visible: "${GYM}"
    timeout: 30000
