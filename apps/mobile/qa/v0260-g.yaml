# v0.26.0 device QA, part G — Phase 4 routines and plans (runs after parts A–F, on the demo
# member: muscle, intermediate, the demo "Push Pull Legs — 6 Day" plan).
# Ready programs → follow one → the plan builder, step by step (Upper / Lower, 4 days, dumbbells
# only, a sore knee, leave out Goblet Squat) → swap in the plan → save and follow it → a routine's
# calm preview → Edit routine: swap for good, share as text, move to another folder → share a
# folder as a file → back on the demo plan: easy weeks on, take one now (with its end date) → the
# easy workout (half the sets, no record pop-up, swap for today) → train normally → open a
# routine file someone shared → "New routine" asks where it goes → reorder mode.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 60000
- tapOn: "^Workout$"
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 30000
- tapOn: "^Routines$"
- extendedWaitUntil:
    visible: "Ready programs"
    timeout: 20000
- takeScreenshot: 80-routines-folders
# ---------------------------------------------------------------- ready programs
- tapOn: "Ready programs"
- extendedWaitUntil:
    visible: "Full Body Basics.*"
    timeout: 15000
- takeScreenshot: 81-programs
- scrollUntilVisible:
    element: "Dumbbell Full Body,.*"
    centerElement: true
    timeout: 20000
- tapOn: "Dumbbell Full Body,.*"
- extendedWaitUntil:
    visible: "Follow this program"
    timeout: 15000
- takeScreenshot: 82-program-dumbbell
- tapOn: "Follow this program"
# Easy weeks start on (the open owner decision's default): week 1, the easy one in week 6.
- extendedWaitUntil:
    visible: "Dumbbell Full Body, 2 routines, your plan, Week 1 · easy week in week 6"
    timeout: 20000
- takeScreenshot: 83-program-followed
# Routines sits above the tabs (no tab bar): Back returns to the Workout tab.
- back
- extendedWaitUntil:
    visible: "Today: Full Body [AB]"
    timeout: 20000
- assertVisible: "Week 1 · easy week in week 6"
- takeScreenshot: 84-workout-today-program
# ---------------------------------------------------------------- the plan builder
- tapOn: "^Routines$"
- extendedWaitUntil:
    visible: "Build a plan"
    timeout: 20000
- tapOn: "Build a plan"
# Audit Phase 4 (RP-17): the answers come in 5 short steps, each with Next (and Back after the
# first): goal and experience → days and split → equipment → sore spots → time and easy weeks.
- extendedWaitUntil:
    visible: "Step 1 of 5"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible: "^Back$"
- takeScreenshot: 84b-builder-step-1
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 2 of 5"
    timeout: 10000
- tapOn: "^4$"
- tapOn: "^Upper / Lower$"
# Back goes one step back with the answers kept (the plan below is still "Upper / Lower · 4
# days"); Next again.
- tapOn: "^Back$"
- extendedWaitUntil:
    visible: "Step 1 of 5"
    timeout: 10000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 2 of 5"
    timeout: 10000
- takeScreenshot: 84c-builder-step-2-kept
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 3 of 5"
    timeout: 10000
- tapOn: "^Dumbbells only$"
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 4 of 5"
    timeout: 10000
- scrollUntilVisible:
    element: "^Knee$"
    centerElement: true
    timeout: 15000
- tapOn: "^Knee$"
- scrollUntilVisible:
    element: "Choose exercises to leave out"
    centerElement: true
    timeout: 15000
- tapOn: "Choose exercises to leave out"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 15000
- tapOn: "Search exercises"
- inputText: " goblet"
- hideKeyboard
- tapOn:
    text: "Leave out Goblet Squat"
    index: 0
- extendedWaitUntil:
    visible: "Keep Goblet Squat"
    timeout: 5000
- takeScreenshot: 85-leave-out-picker
- tapOn: "^Done$"
- scrollUntilVisible:
    element: "Goblet Squat ✕"
    centerElement: true
    timeout: 15000
- takeScreenshot: 86-builder-answers
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 5 of 5"
    timeout: 10000
- scrollUntilVisible:
    element: "Build my plan"
    centerElement: true
    timeout: 15000
- tapOn: "Build my plan"
# RP-17: the finished plan is kept ("Save") or followed ("Save and follow").
- extendedWaitUntil:
    visible: "Save and follow"
    timeout: 15000
- assertVisible: "^Save$"
- assertVisible: "Upper / Lower · 4 days"
- assertVisible: "Without a pull-up bar, rows stand in for pull-ups."
- takeScreenshot: 87-built-plan
- scrollUntilVisible:
    element: "Swap Dumbbell Floor Press"
    centerElement: true
    timeout: 15000
- tapOn: "Swap Dumbbell Floor Press"
- extendedWaitUntil:
    visible: "Swap to Push-Up.*"
    timeout: 10000
- takeScreenshot: 88-plan-swap-sheet
- tapOn: "Swap to Push-Up.*"
- extendedWaitUntil:
    visible: "Swap Push-Up"
    timeout: 10000
- scrollUntilVisible:
    element: "Dumbbell Squat"
    centerElement: true
    timeout: 20000
- takeScreenshot: 89-plan-lower-no-goblet
- scrollUntilVisible:
    element: "Routines, more information"
    centerElement: true
    direction: UP
    timeout: 20000
- tapOn: "Routines, more information"
- assertVisible: "Body-weight moves get harder in steps.*"
- takeScreenshot: 90-plan-ladder-info
- scrollUntilVisible:
    element: "Save and follow"
    centerElement: true
    direction: UP
    timeout: 20000
- tapOn: "Save and follow"
- extendedWaitUntil:
    visible: "Upper / Lower · 4 days, 4 routines, your plan.*"
    timeout: 20000
- takeScreenshot: 91-built-plan-followed
# ---------------------------------------------------------------- the routine preview, then the editor
# Audit Phase 4: routines are compact rows ("Upper A, 5 exercises · Upper") with a small Start
# ("Start Upper A"); a tap on the row opens a calm preview with "Start routine"; Edit sits behind
# "Edit routine" ("Edit Upper A" is gone).
- assertVisible: "Start Upper A"
- tapOn: "Upper A, .*"
- extendedWaitUntil:
    visible: "Start routine"
    timeout: 15000
- assertVisible: '\d+ sets? · .*'
- takeScreenshot: 91b-routine-preview
- tapOn: "Edit routine"
- extendedWaitUntil:
    visible: "More for this routine"
    timeout: 15000
# The member's library may name it "Push-up" or "Push Up".
- tapOn: "Swap Push[- ][Uu]p"
- extendedWaitUntil:
    visible: "In this routine from now on. Your sets and reps stay."
    timeout: 10000
- takeScreenshot: 92-routine-swap-sheet
- tapOn:
    text: "Swap to .*"
    index: 0
- extendedWaitUntil:
    notVisible: "Swap Push[- ][Uu]p"
    timeout: 10000
- takeScreenshot: 93-routine-swapped
- tapOn: "More for this routine"
- extendedWaitUntil:
    visible: "Share routine"
    timeout: 10000
- takeScreenshot: 94-routine-menu
- tapOn: "Share routine"
- extendedWaitUntil:
    visible: "Send as text"
    timeout: 10000
- tapOn: "Send as text"
# Android's share menu: text only the system chooser shows (not ForgeAI's "Share routine",
# which the old loose regex matched).
- extendedWaitUntil:
    visible: '(Sharing text|No recommended people to share with)'
    timeout: 20000
- takeScreenshot: 95-share-text
- back
- tapOn: "More for this routine"
- tapOn: "Move to folder"
- extendedWaitUntil:
    visible: "Dumbbell Full Body, 2 routines"
    timeout: 10000
- tapOn: "Dumbbell Full Body, 2 routines"
- extendedWaitUntil:
    visible: ".*· Dumbbell Full Body"
    timeout: 10000
- takeScreenshot: 96-routine-moved
# Close the editor (back on the preview, which reads the routine again), then the preview.
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "More for this routine"
    timeout: 10000
- extendedWaitUntil:
    visible: '.*· Dumbbell Full Body'
    timeout: 10000
- tapOn: "Close"
# ---------------------------------------------------------------- share a folder as a file
- extendedWaitUntil:
    visible: "More for Upper / Lower · 4 days"
    timeout: 15000
- tapOn: "More for Upper / Lower · 4 days"
- tapOn: "Share folder"
- extendedWaitUntil:
    visible: "Send as a file"
    timeout: 10000
- tapOn: "Send as a file"
# Android's share menu: text only the system chooser shows (not ForgeAI's "Share folder").
- extendedWaitUntil:
    visible: '(Sharing 1 file|Sharing file|No recommended people to share with)'
    timeout: 20000
- takeScreenshot: 97-share-file
- back
# ---------------------------------------------------------------- an easy week on the demo plan
- scrollUntilVisible:
    element: "More for Push Pull Legs — 6 Day"
    centerElement: true
    timeout: 20000
- tapOn: "More for Push Pull Legs — 6 Day"
- tapOn: "Follow this plan, Today's workout"
- extendedWaitUntil:
    visible: "Push Pull Legs — 6 Day, .* routines, your plan, Week 1"
    timeout: 15000
- tapOn: "More for Push Pull Legs — 6 Day"
- tapOn: "Easy week every 6 weeks, Off"
- extendedWaitUntil:
    visible: "Push Pull Legs — 6 Day, .*, Week 1 · easy week in week 6"
    timeout: 15000
- tapOn: "More for Push Pull Legs — 6 Day"
- extendedWaitUntil:
    visible: "Take an easy week now"
    timeout: 10000
- takeScreenshot: 98-folder-menu
- tapOn: "Take an easy week now"
# RP-04: an easy week taken now is the 7 days from the tap, its end date always shown
# ("Easy week until Fri, 16 Oct").
- extendedWaitUntil:
    visible: 'Push Pull Legs — 6 Day, .*, Easy week until [A-Z][a-z]{2}, \d{1,2} [A-Z][a-z]{2}'
    timeout: 15000
- back
# The easy-week note and "Train normally this week" must show whatever Today says (review, HIGH 2).
# Since audit Phase 3 an empty workout (parts C, E, F) never moves or hides Today, so the card
# may read "Today: <routine>" or, with part A's routine counted, "Done today: … · Next: …".
- extendedWaitUntil:
    visible: "Easy week: half the sets, the same weights.*"
    timeout: 20000
# RP-04: the note carries the end date too.
- assertVisible: 'Easy week: half the sets, the same weights\. Until [A-Z][a-z]{2}, \d{1,2} [A-Z][a-z]{2}\.'
- assertVisible: "Train normally this week"
- takeScreenshot: 99-workout-easy-week
# Start a routine of the plan from Routines: the followed folder sits first, open; its first row's
# small Start ("Start Push Day A", whose second lift is Overhead Press).
- tapOn: "^Routines$"
- scrollUntilVisible:
    element: "Start Push Day A"
    centerElement: true
    timeout: 15000
- tapOn: "Start Push Day A"
# LW-24: with a workout already open the app asks (Resume / Discard and start new) instead of
# "Finish your current workout first". None should be open here; if one is, start this one.
- runFlow:
    when:
      visible: "A workout is already open"
    commands:
      - takeScreenshot: 99b-workout-already-open
      - tapOn: "Discard and start new"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Easy week: half the sets, the same weights.*"
    timeout: 30000
- assertVisible: "Target Easy week.*"
- takeScreenshot: 100-easy-workout
# A huge weight is a record in a normal week (part A); an easy week never claims one.
# LW-27: the boxes and the tick name their exercise and set ("… set 1 weight, kilograms").
- tapOn:
    text: ".* set 1 weight, kilograms"
    index: 0
- eraseText
- inputText: " 300"
- hideKeyboard
- tapOn:
    text: "Mark .* set 1 complete"
    index: 0
    waitToSettleTimeoutMs: 300
# The pop-up would show at once and stay 3.5 s; look 1.5 s later.
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible: "New record.*"
- takeScreenshot: 101-easy-no-record
# D7: 300 kg may be 2.5x or more this lift's best, so the row may ask "… Keep it?" (already
# saved; it never refuses). It is on purpose: Keep.
- tapOn:
    text: 'Keep 300.*'
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
# Swap for today: the plan's second lift, nothing ticked on it yet (the demo's Overhead Press
# is linked to the library by its name). Its routine stays as it is.
- scrollUntilVisible:
    element: "More for Overhead Press"
    centerElement: true
    timeout: 20000
    waitToSettleTimeoutMs: 500
- tapOn: "More for Overhead Press"
- tapOn: "Swap exercise, This workout"
- extendedWaitUntil:
    visible: "For this workout only. Your routine stays."
    timeout: 10000
- takeScreenshot: 102-swap-today-sheet
- tapOn:
    text: "Swap to .*"
    index: 0
- extendedWaitUntil:
    notVisible: "More for Overhead Press"
    timeout: 10000
- takeScreenshot: 103-swapped-today
# Finish: saved as an easy-week workout, so the 300 kg set is no record (and no "update the
# routine?" question: half the sets is not a new plan).
# Phase 2 (LW-02): Finish opens the "Finish workout?" sheet; its own button (above its
# "Keep going"; the screen's button sits behind it) saves. Only the ticked 300 kg set holds numbers.
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# The coach line knows it was a planned easy week (not "volume was 80% down").
- extendedWaitUntil:
    visible: "Easy week done.*"
    timeout: 10000
- takeScreenshot: 104-easy-finish
- scrollUntilVisible:
    element: "Done"
    centerElement: true
    timeout: 20000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- tapOn: "^Workout$"
- extendedWaitUntil:
    visible: "Train normally this week"
    timeout: 15000
- tapOn: "Train normally this week"
- extendedWaitUntil:
    notVisible: "Easy week: half the sets, the same weights.*"
    timeout: 15000
- takeScreenshot: 105-trained-normally
# ---------------------------------------------------------------- open a shared routine file
- tapOn: "^Routines$"
- extendedWaitUntil:
    visible: "Add a routine, folder or file"
    timeout: 15000
- tapOn: "Add a routine, folder or file"
- tapOn: "Import a routine file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-shared).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-shared.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- takeScreenshot: 106-file-picker
- tapOn: "qa-shared.*"
- extendedWaitUntil:
    visible: "Routines added"
    timeout: 20000
- assertVisible: "New in your library: Sam's Band Pull.*"
- takeScreenshot: 107-import-done
- tapOn: "(?i)^ok$"
- scrollUntilVisible:
    element: "Shared by Sam, 1 routine.*"
    centerElement: true
    timeout: 20000
- takeScreenshot: 108-imported-folder
# ---------------------------------------------------------------- a new routine asks where it goes
# Audit Phase 4 (RP-08): "New routine" never joins the plan by itself — a folder picker first,
# "My routines" (not followed) at the top, the followed plan last. Nothing is made here.
- tapOn: "Add a routine, folder or file"
- tapOn: "New routine"
- extendedWaitUntil:
    visible: 'Where should the routine go\?'
    timeout: 10000
- assertVisible: "My routines, Not in your plan.*"
- assertVisible:
    text: ".*, Your plan · Today will include it"
    below:
      text: "My routines, Not in your plan.*"
- takeScreenshot: 109-new-routine-folder-picker
- back
- extendedWaitUntil:
    notVisible: 'Where should the routine go\?'
    timeout: 10000
# ---------------------------------------------------------------- reorder mode
# RP-07: "Reorder routines and folders" puts Move up / Move down on routines and folders (in the
# followed folder the order IS the rotation). Looked at; nothing is moved.
- tapOn: "Add a routine, folder or file"
- tapOn: "Reorder routines and folders"
- extendedWaitUntil:
    visible: "Move routines and folders. Your plan goes in this order."
    timeout: 10000
- assertVisible: "Today goes in this order."
- assertVisible: "Move Push Day A down"
- takeScreenshot: 110-reorder-mode
- tapOn: "Done reordering"
- extendedWaitUntil:
    visible: "Start any routine in a tap."
    timeout: 10000
