# v0.26.0 device QA, part G — Phase 4 routines and plans (runs after parts A–F, on the demo
# member: muscle, intermediate, the demo "Push Pull Legs — 6 Day" plan).
# Redesign R4: folders and routine cards sit inline on the Workout tab (Hevy's layout); ready
# programs and the plan builder are behind "Explore"; the old Routines screen (its "+" menu and
# reorder mode) is gone — "Import a routine file" is on Explore, "New routine" on the Workout tab,
# and Move up / Move down in a routine's ⋯.
# Explore → follow a ready program → the plan builder, step by step (Upper / Lower, 4 days,
# dumbbells only, a sore knee, leave out Goblet Squat) → swap in the plan → save and follow it → a
# routine's calm preview → Edit routine: swap for good, share as text, move to another folder →
# share a folder as a file → back on the demo plan: easy weeks on, take one now (with its end
# date) → the easy workout (half the sets, no record pop-up, swap for today) → train normally →
# open a routine file someone shared → "New routine" asks where it goes → a routine's ⋯ moves.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Profile$"
    timeout: 60000
- tapOn:
    text: "^Workout$"
    index: 0
- scrollUntilVisible:
    element: "^Routines$"
    centerElement: true
    timeout: 30000
- assertVisible: "New folder"
- assertVisible: "New routine"
- assertVisible: "Explore"
- takeScreenshot: 80-workout-folders
# ---------------------------------------------------------------- ready programs
- tapOn: "Explore"
- extendedWaitUntil:
    visible: "Build a plan"
    timeout: 20000
- assertVisible: "Full Body Basics.*"
- takeScreenshot: 81-explore-programs
- scrollUntilVisible:
    element: "Dumbbell Full Body,.*"
    centerElement: true
    timeout: 20000
- tapOn: "Dumbbell Full Body,.*"
- extendedWaitUntil:
    visible: "Follow this plan"
    timeout: 15000
- takeScreenshot: 82-program-dumbbell
- tapOn: "Follow this plan"
# Following lands back on the Workout tab. Easy weeks start on (the open owner decision's
# default): the Up next card names the plan's routine with its week line, week 1 with the easy
# one in week 6.
- extendedWaitUntil:
    visible: "Up next: Full Body [AB]"
    timeout: 20000
- assertVisible: "Week 1 · easy week in week 6"
- takeScreenshot: 84-workout-today-program
# The program is a folder on the Workout tab, open, tagged "Following".
- scrollUntilVisible:
    element: "Dumbbell Full Body folder, 2 routines, open, Following"
    centerElement: true
    timeout: 20000
- takeScreenshot: 83-program-followed
# ---------------------------------------------------------------- the plan builder
- scrollUntilVisible:
    element: "Explore"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Explore"
- extendedWaitUntil:
    visible: "Build a plan"
    timeout: 20000
- tapOn: "Build a plan"
# Audit Phase 4 (RP-17): the answers come in 5 short steps, each with Next (and Back after the
# first): goal and experience → days and split → equipment → sore spots → time and easy weeks.
- extendedWaitUntil:
    visible: "Step 1 of 5"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible: "^Back$"
- takeScreenshot: 84b-builder-step-1
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 2 of 5"
    timeout: 10000
- tapOn: "^4$"
- tapOn: "^Upper / Lower$"
# Back goes one step back with the answers kept (the plan below is still "Upper / Lower · 4
# days"); Next again.
- tapOn: "^Back$"
- extendedWaitUntil:
    visible: "Step 1 of 5"
    timeout: 10000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 2 of 5"
    timeout: 10000
- takeScreenshot: 84c-builder-step-2-kept
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 3 of 5"
    timeout: 10000
- tapOn: "^Dumbbells only$"
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 4 of 5"
    timeout: 10000
- scrollUntilVisible:
    element: "^Knee$"
    centerElement: true
    timeout: 15000
- tapOn: "^Knee$"
- scrollUntilVisible:
    element: "Choose exercises to leave out"
    centerElement: true
    timeout: 15000
- tapOn: "Choose exercises to leave out"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 15000
- tapOn: "Search exercises"
- inputText: " goblet"
- hideKeyboard
- tapOn:
    text: "Leave out Goblet Squat"
    index: 0
- extendedWaitUntil:
    visible: "Keep Goblet Squat"
    timeout: 5000
- takeScreenshot: 85-leave-out-picker
- tapOn: "^Done$"
- scrollUntilVisible:
    element: "Goblet Squat ✕"
    centerElement: true
    timeout: 15000
- takeScreenshot: 86-builder-answers
- scrollUntilVisible:
    element: "^Next$"
    centerElement: true
    timeout: 15000
- tapOn: "^Next$"
- extendedWaitUntil:
    visible: "Step 5 of 5"
    timeout: 10000
- scrollUntilVisible:
    element: "Build my plan"
    centerElement: true
    timeout: 15000
- tapOn: "Build my plan"
# RP-17: the finished plan is kept ("Save") or followed ("Save and follow").
- extendedWaitUntil:
    visible: "Save and follow"
    timeout: 15000
- assertVisible: "^Save$"
- assertVisible: "Upper / Lower · 4 days"
- assertVisible: "Without a pull-up bar, rows stand in for pull-ups."
- takeScreenshot: 87-built-plan
- scrollUntilVisible:
    element: "Swap Dumbbell Floor Press"
    centerElement: true
    timeout: 15000
- tapOn: "Swap Dumbbell Floor Press"
- extendedWaitUntil:
    visible: "Swap to Push-Up.*"
    timeout: 10000
- takeScreenshot: 88-plan-swap-sheet
- tapOn: "Swap to Push-Up.*"
- extendedWaitUntil:
    visible: "Swap Push-Up"
    timeout: 10000
- scrollUntilVisible:
    element: "Dumbbell Squat"
    centerElement: true
    timeout: 20000
- takeScreenshot: 89-plan-lower-no-goblet
- scrollUntilVisible:
    element: "Routines, more information"
    centerElement: true
    direction: UP
    timeout: 20000
- tapOn: "Routines, more information"
- assertVisible: "Body-weight moves get harder in steps.*"
- takeScreenshot: 90-plan-ladder-info
- scrollUntilVisible:
    element: "Save and follow"
    centerElement: true
    direction: UP
    timeout: 20000
- tapOn: "Save and follow"
# Saved and followed: back on the Workout tab, the plan's folder open and tagged "Following".
- extendedWaitUntil:
    visible: "Up next: .*"
    timeout: 20000
- scrollUntilVisible:
    element: "Upper / Lower · 4 days folder, 4 routines, open, Following"
    centerElement: true
    timeout: 20000
- takeScreenshot: 91-built-plan-followed
# ---------------------------------------------------------------- the routine preview, then the editor
# Redesign R4: a routine card (name, a grey line of its exercises, ⋯, "Start routine", spoken
# "Start routine Upper A"); a tap on the card opens the calm preview with "Start routine"; Edit
# sits behind "Edit routine".
- scrollUntilVisible:
    element: "Start routine Upper A"
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element: "Upper A, .*"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Upper A, .*"
- extendedWaitUntil:
    visible: "Start routine"
    timeout: 15000
- assertVisible: '\d+ sets? · .*'
- takeScreenshot: 91b-routine-preview
- tapOn: "Edit routine"
- extendedWaitUntil:
    visible: "More for this routine"
    timeout: 15000
# The member's library may name it "Push-up" or "Push Up".
- tapOn: "Swap Push[- ][Uu]p"
- extendedWaitUntil:
    visible: "In this routine from now on. Your sets and reps stay."
    timeout: 10000
- takeScreenshot: 92-routine-swap-sheet
- tapOn:
    text: "Swap to .*"
    index: 0
- extendedWaitUntil:
    notVisible: "Swap Push[- ][Uu]p"
    timeout: 10000
- takeScreenshot: 93-routine-swapped
- tapOn: "More for this routine"
- extendedWaitUntil:
    visible: "Share routine"
    timeout: 10000
- takeScreenshot: 94-routine-menu
- tapOn: "Share routine"
- extendedWaitUntil:
    visible: "Send as text"
    timeout: 10000
- tapOn: "Send as text"
# Android's share menu: text only the system chooser shows (not ForgeAI's "Share routine",
# which the old loose regex matched).
- extendedWaitUntil:
    visible: '(Sharing text|No recommended people to share with)'
    timeout: 20000
- takeScreenshot: 95-share-text
- back
- tapOn: "More for this routine"
- tapOn: "Move to folder"
- extendedWaitUntil:
    visible: "Dumbbell Full Body, 2 routines"
    timeout: 10000
- tapOn: "Dumbbell Full Body, 2 routines"
- extendedWaitUntil:
    visible: ".*· Dumbbell Full Body"
    timeout: 10000
- takeScreenshot: 96-routine-moved
# Close the editor (back on the preview, which reads the routine again), then the preview: back
# on the Workout tab.
- tapOn: "Go back"
- extendedWaitUntil:
    notVisible: "More for this routine"
    timeout: 10000
- extendedWaitUntil:
    visible: '.*· Dumbbell Full Body'
    timeout: 10000
- tapOn: "Go back"
# ---------------------------------------------------------------- share a folder as a file
- scrollUntilVisible:
    element: "More for Upper / Lower · 4 days"
    centerElement: true
    timeout: 20000
- tapOn: "More for Upper / Lower · 4 days"
- tapOn: "Share folder"
- extendedWaitUntil:
    visible: "Send as a file"
    timeout: 10000
- tapOn: "Send as a file"
# Android's share menu: text only the system chooser shows (not ForgeAI's "Share folder").
- extendedWaitUntil:
    visible: '(Sharing 1 file|Sharing file|No recommended people to share with)'
    timeout: 20000
- takeScreenshot: 97-share-file
- back
# ---------------------------------------------------------------- an easy week on the demo plan
# The folder's ⋯ (Hevy's menu, with ForgeAI's plan rows): "Follow this plan", then "Easy weeks…"
# opens its own sheet ("Easy week every 6 weeks", then "Take an easy week now").
- scrollUntilVisible:
    element: "More for Push Pull Legs — 6 Day"
    centerElement: true
    timeout: 20000
- tapOn: "More for Push Pull Legs — 6 Day"
- tapOn: "Follow this plan"
- extendedWaitUntil:
    visible: "Push Pull Legs — 6 Day folder, .* routines, open, Following"
    timeout: 15000
- scrollUntilVisible:
    element: "More for Push Pull Legs — 6 Day"
    centerElement: true
    timeout: 20000
- tapOn: "More for Push Pull Legs — 6 Day"
- extendedWaitUntil:
    visible: "Easy weeks…, Off"
    timeout: 10000
- tapOn: "Easy weeks…, Off"
- extendedWaitUntil:
    visible: "Easy week every 6 weeks, Off"
    timeout: 10000
- tapOn: "Easy week every 6 weeks, Off"
- extendedWaitUntil:
    notVisible: "Easy week every 6 weeks, Off"
    timeout: 10000
- tapOn: "More for Push Pull Legs — 6 Day"
- extendedWaitUntil:
    visible: "Easy weeks…, On"
    timeout: 10000
- tapOn: "Easy weeks…, On"
- extendedWaitUntil:
    visible: "Take an easy week now"
    timeout: 10000
- assertVisible: "Easy week every 6 weeks, On"
- takeScreenshot: 98-folder-menu
- tapOn: "Take an easy week now"
# RP-04: an easy week taken now is the 7 days from the tap, its end date always shown. The
# easy-week note and "Train normally this week" must show on the Up next card whatever it says
# (review, HIGH 2): an empty workout (parts C, E, F) never moves or hides it, so the card may read
# "Up next: <routine>" or, with part A's routine counted, "Done today: …" / "Next: …".
- scrollUntilVisible:
    element: "Easy week: half the sets, the same weights.*"
    direction: UP
    centerElement: true
    timeout: 20000
# RP-04: the note carries the end date ("Until Fri, 16 Oct.").
- assertVisible: 'Easy week: half the sets, the same weights\. Until [A-Z][a-z]{2}, \d{1,2} [A-Z][a-z]{2}\.'
- assertVisible: "Train normally this week"
- takeScreenshot: 99-workout-easy-week
# Start a routine of the plan from its card: the followed folder sits first, open; its first
# routine "Push Day A" (whose second lift is Overhead Press), spoken "Start routine Push Day A".
- scrollUntilVisible:
    element: "Start routine Push Day A"
    centerElement: true
    timeout: 20000
- tapOn: "Start routine Push Day A"
# LW-24: with a workout already open the app asks (Resume / Discard and start new) instead of
# "Finish your current workout first". None should be open here; if one is, start this one.
- runFlow:
    when:
      visible: "A workout is already open"
    commands:
      - takeScreenshot: 99b-workout-already-open
      - tapOn: "Discard and start new"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Easy week: half the sets, the same weights.*"
    timeout: 30000
- assertVisible: "Target Easy week.*"
- takeScreenshot: 100-easy-workout
# A huge weight is a record in a normal week (part A); an easy week never claims one.
# LW-27: the boxes and the tick name their exercise and set ("… set 1 weight, kilograms").
- tapOn:
    text: ".* set 1 weight, kilograms"
    index: 0
- eraseText
- inputText: " 300"
- hideKeyboard
- tapOn:
    text: "Mark .* set 1 complete"
    index: 0
    waitToSettleTimeoutMs: 300
# The pop-up would show at once and stay 3.5 s; look 1.5 s later.
- waitForAnimationToEnd:
    timeout: 1500
- assertNotVisible: "New record.*"
- takeScreenshot: 101-easy-no-record
# D7: 300 kg may be 2.5x or more this lift's best, so the row may ask "… Keep it?" (already
# saved; it never refuses). It is on purpose: Keep.
- tapOn:
    text: 'Keep 300.*'
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
# Swap for today: the plan's second lift, nothing ticked on it yet (the demo's Overhead Press
# is linked to the library by its name). Its routine stays as it is.
- scrollUntilVisible:
    element: "More for Overhead Press"
    centerElement: true
    timeout: 20000
    waitToSettleTimeoutMs: 500
- tapOn: "More for Overhead Press"
- tapOn: "Swap exercise, This workout"
- extendedWaitUntil:
    visible: "For this workout only. Your routine stays."
    timeout: 10000
- takeScreenshot: 102-swap-today-sheet
- tapOn:
    text: "Swap to .*"
    index: 0
- extendedWaitUntil:
    notVisible: "More for Overhead Press"
    timeout: 10000
- takeScreenshot: 103-swapped-today
# Finish: saved as an easy-week workout, so the 300 kg set is no record (and no "update the
# routine?" question: half the sets is not a new plan).
# Phase 2 (LW-02): Finish opens the "Finish workout?" sheet; its own button (above its
# "Keep going"; the screen's button sits behind it) saves. Only the ticked 300 kg set holds numbers.
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# The finish note knows it was a planned easy week (not "80% less kg lifted"). Audit Phase 7: a
# plain line of facts with no "IN SHORT" heading or sparkle (src/tracker/services/coachNote.ts):
# "Easy week: 1 working set at your usual weights, lighter on purpose."
- extendedWaitUntil:
    visible: 'Easy week: [\d,]+ working sets? at your usual weights, lighter on purpose\.'
    timeout: 10000
- assertNotVisible: "IN SHORT"
- takeScreenshot: 104-easy-finish
- scrollUntilVisible:
    element: "Done"
    centerElement: true
    timeout: 20000
- tapOn: "Done"
# Done goes to the Workout tab: the Up next card still carries the easy week's choices.
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- scrollUntilVisible:
    element: "Train normally this week"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: "Train normally this week"
- extendedWaitUntil:
    notVisible: "Easy week: half the sets, the same weights.*"
    timeout: 15000
- takeScreenshot: 105-trained-normally
# ---------------------------------------------------------------- open a shared routine file
# Redesign R4: Explore → Bring routines in → "Import a routine file".
- scrollUntilVisible:
    element: "Explore"
    centerElement: true
    timeout: 15000
- tapOn: "Explore"
- scrollUntilVisible:
    element: "Import a routine file"
    centerElement: true
    timeout: 20000
- tapOn: "Import a routine file"
- extendedWaitUntil:
    visible: '(?i).*(recent|downloads|files|qa-shared).*'
    timeout: 20000
- runFlow:
    when:
      notVisible: "qa-shared.*"
    commands:
      - tapOn:
          text: "Show roots"
          optional: true
      - tapOn:
          text: "Downloads"
          optional: true
- takeScreenshot: 106-file-picker
- tapOn: "qa-shared.*"
- extendedWaitUntil:
    visible: "Routines added"
    timeout: 20000
- assertVisible: "New in your library: Sam's Band Pull.*"
- takeScreenshot: 107-import-done
# Audit Phase 7 (packet B): the notice is the app's own sheet now, not Android's pop-up; its one
# button names what it does, "Close" (src/lib/tell.ts NOTICE_BUTTON), never "OK". Closing it
# lands on the Workout tab, the new folder open.
- tapOn: "^Close$"
- extendedWaitUntil:
    notVisible: "Routines added"
    timeout: 10000
- scrollUntilVisible:
    element: 'Shared by Sam \(1\)'
    centerElement: true
    timeout: 20000
- takeScreenshot: 108-imported-folder
# ---------------------------------------------------------------- a new routine asks where it goes
# Audit Phase 4 (RP-08): "New routine" never joins the plan by itself — a folder picker first,
# "My routines" (not followed) at the top, the followed plan last. Nothing is made here.
- scrollUntilVisible:
    element: "New routine"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn: "New routine"
- extendedWaitUntil:
    visible: 'Where should the routine go\?'
    timeout: 10000
- assertVisible: "My routines, Not in your plan.*"
- assertVisible:
    text: ".*, Your plan · Today will include it"
    below:
      text: "My routines, Not in your plan.*"
- takeScreenshot: 109-new-routine-folder-picker
- back
- extendedWaitUntil:
    notVisible: 'Where should the routine go\?'
    timeout: 10000
# ---------------------------------------------------------------- a routine's moves
# RP-07 / redesign R4: drag is not built; a routine's ⋯ has Move up / Move down / Move to folder…
# (in the followed folder the order IS the rotation). Push Day A is the plan's first routine, so
# it offers Move down and no Move up. Looked at; nothing is moved.
- scrollUntilVisible:
    element: "More for Push Day A"
    centerElement: true
    timeout: 20000
- tapOn: "More for Push Day A"
- extendedWaitUntil:
    visible: "Move down"
    timeout: 10000
- assertNotVisible: "Move up"
- assertVisible: "Move to folder…"
- assertVisible: "Share routine"
- assertVisible: "Duplicate routine"
- assertVisible: "Edit routine"
- assertVisible: "Delete routine"
- takeScreenshot: 110-routine-menu-moves
- back
- extendedWaitUntil:
    notVisible: "Duplicate routine"
    timeout: 10000
