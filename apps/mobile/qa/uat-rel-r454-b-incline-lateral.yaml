# Part UAT, R-454 flow b: the day after flow a (the part moved the phone clock one day on), the routine from
# flow a started. Exact words from his screenshots (owner, 12 Nov 2026).
# Types (R-364):
#   happy path: Incline Dumbbell Press aims 13, 12, 11, 9 (never under last time's 13, 12, 10, 8); the box
#     (R-516, owner 14 Nov 2026) "Previous set volume: 1,720 kg · Today's target: 1,800 kg" over a bar with
#     "0 kg done · 1,800 kg to go", then "1,440 kg done · 360 kg to go" with set 4 open; over target (set 3
#     edited to 25 with set 4 open): "2,000 kg done · +200 kg over target", bar full; and at the end (R-498, owner 14 Nov 2026) "Previous set volume
#     beaten! +80 kg" over "Done 1,800 kg · Previous 1,720 kg";
#   regression: his Lateral Raise: set 1 done at 20 kg x 20 (not the plan's heavier weight) -> sets 2-4 aim
#     20 kg x 17, 15, 19 (never 13, 12, 15); the box keeps "Previous set volume: 1,420 kg" and counts what is
#     done ("400 kg done · ... to go");
#   equal case: 20, 17, 15, 19 = last time's 1,420 kg -> "Previous set volume matched" over
#     "Done 1,420 kg · Previous 1,420 kg";
#   edit after the tick: sets 2-4 changed to 19, 16, 16 (still 1,420) -> the same line;
#   negative: never "1,760", never "Next set: 20 kg × 15" after set 1, never "reached", "beaten (" or the
#     old 12 Nov words ("... done · Previous: ...").
# Each row's aim is proven by ticking it EMPTY (the tick saves the grey hint) and reading the box back
# (sub-uat-r454-hint.yaml). Unit tests: test/tracker/r454RepFloor.test.ts, r454OneGreenRule.test.ts.
# Pictures rel-r454-b..h-*.png.
appId: com.mettleup.app
---
- scrollUntilVisible:
    element: "^Start routine$"
    centerElement: true
    timeout: 15000
- tapOn: "^Start routine$"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "More for Incline Dumbbell Press"
    timeout: 30000
# ---------------------------------------------------------------- (a) Incline Dumbbell Press: 13, 12, 11, 9
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Previous set volume: 1,720.kg · Today's target: 1,800.kg$"
# in-view: the same Target box as the line found just above.
- assertVisible: "^0.kg done · 1,800.kg to go$"
- assertNotVisible: ".*1,760.kg.*"
- assertNotVisible: "^Next set: .*"
- takeScreenshot: rel-r454-b-incline-before
- tapOn: "^Previous set volume: 1,720.kg · Today's target: 1,800.kg$"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Suggested: 40 kg each · 13, 12, 11, 9( · RPE [0-9.]+)?( · Up)?$"
- takeScreenshot: rel-r454-c-incline-why
- runFlow:
    file: sub-uat-r454-hint.yaml
    env:
      EX: "Incline Dumbbell Press"
      N: "1"
      KG: "40"
      REPS: "13"
- runFlow:
    file: sub-uat-r454-hint.yaml
    env:
      EX: "Incline Dumbbell Press"
      N: "2"
      KG: "40"
      REPS: "12"
- runFlow:
    file: sub-uat-r454-hint.yaml
    env:
      EX: "Incline Dumbbell Press"
      N: "3"
      KG: "40"
      REPS: "11"
# The top line names the same number the last row aims for.
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^1,440.kg done · 360.kg to go$"
- takeScreenshot: rel-r454-d-incline-set-4-next
# R-516 over target with a set still open: set 3 edited to 25 -> 520 + 480 + 1,000 = 2,000 of 1,800.
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Incline Dumbbell Press set 3 reps"
      VALUE: " 25"
- runFlow: sub-uat-r439-clear.yaml
- runFlow:
    file: sub-find.yaml
    env:
      FIND: '^2,000.kg done · \+200.kg over target$'
- assertNotVisible: "(?is).*(beaten|matched).*"
- takeScreenshot: rel-r454-d2-incline-over-target
# Back to 11: the box follows the edit.
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Incline Dumbbell Press set 3 reps"
      VALUE: " 11"
- runFlow: sub-uat-r439-clear.yaml
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^1,440.kg done · 360.kg to go$"
- runFlow:
    file: sub-uat-r454-hint.yaml
    env:
      EX: "Incline Dumbbell Press"
      N: "4"
      KG: "40"
      REPS: "9"
- runFlow:
    file: sub-uat-r454-line.yaml
    env:
      EX: "Incline Dumbbell Press"
      WANT: "Previous set volume beaten! +80 kg / Done 1,800 kg · Previous 1,720 kg"
- assertNotVisible: "(?is).*(reached|beaten \\(|done · Previous:).*"
- assertNotVisible: ".*kg each done.*|.*Previous: [0-9,]+ kg each.*|.*of (today.s )?[0-9,]+ kg each.*"
- takeScreenshot: rel-r454-e-incline-done
# ---------------------------------------------------------------- (b) Lateral Raise: set 1 at 20 kg, the rest follow 20 kg
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "Lateral Raise set 1 reps"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^Previous set volume: 1,420.kg · Today's target: [0-9,]+.kg$"
# in-view: the same Target box as the line found just above.
- assertVisible: '^0.kg done · [0-9,]+.kg to go$'
- takeScreenshot: rel-r454-f-lateral-before
- runFlow:
    file: sub-uat-r439-set.yaml
    env:
      EX: "Lateral Raise"
      N: "1"
      KG: "20"
      REPS: "20"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^400.kg done · [0-9,]+.kg to go$"
- assertNotVisible: "^Next set: .*"
- takeScreenshot: rel-r454-g-lateral-after-set-1
- runFlow:
    file: sub-uat-r454-hint.yaml
    env:
      EX: "Lateral Raise"
      N: "2"
      KG: "20"
      REPS: "17"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^740.kg done · [0-9,]+.kg to go$"
- runFlow:
    file: sub-uat-r454-hint.yaml
    env:
      EX: "Lateral Raise"
      N: "3"
      KG: "20"
      REPS: "15"
- runFlow:
    file: sub-find.yaml
    env:
      FIND: "^1,040.kg done · [0-9,]+.kg to go$"
- runFlow:
    file: sub-uat-r454-hint.yaml
    env:
      EX: "Lateral Raise"
      N: "4"
      KG: "20"
      REPS: "19"
# ---------------------------------------------------------------- (d) equal to last time: "Previous set volume matched" (green)
- runFlow:
    file: sub-uat-r454-line.yaml
    env:
      EX: "Lateral Raise"
      WANT: "Previous set volume matched / Done 1,420 kg · Previous 1,420 kg"
- assertNotVisible: "(?is).*(reached|beaten \\(|done · Previous:).*"
- assertNotVisible: ".*kg each done.*|.*Previous: [0-9,]+ kg each.*|.*of (today.s )?[0-9,]+ kg each.*"
- takeScreenshot: rel-r454-h-lateral-same
# Edit after the tick: 20, 19, 16, 16 is 1,420 kg too (his own day).
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Lateral Raise set 2 reps"
      VALUE: " 19"
- runFlow: sub-uat-r439-clear.yaml
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Lateral Raise set 3 reps"
      VALUE: " 16"
- runFlow: sub-uat-r439-clear.yaml
- runFlow:
    file: sub-type.yaml
    env:
      FIELD: "Lateral Raise set 4 reps"
      VALUE: " 16"
- runFlow: sub-uat-r439-clear.yaml
- runFlow:
    file: sub-uat-r439-saved.yaml
    env:
      FIELD: "Lateral Raise set 2 reps"
      WANT: "19"
- runFlow:
    file: sub-uat-r454-line.yaml
    env:
      EX: "Lateral Raise"
      WANT: "Previous set volume matched / Done 1,420 kg · Previous 1,420 kg"
- assertNotVisible: "(?is).*(reached|beaten \\(|done · Previous:).*"
- assertNotVisible: ".*kg each done.*|.*Previous: [0-9,]+ kg each.*|.*of (today.s )?[0-9,]+ kg each.*"
- takeScreenshot: rel-r454-i-lateral-edited-same
