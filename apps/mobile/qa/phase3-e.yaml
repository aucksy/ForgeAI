# Phase 3 device QA, part E — a new kind of record live, the records on the finish screen,
# the workout share picture through to Android's share menu, and the exercise page's
# records card. Runs after part D.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 60000
- tapOn: "^Workout$"
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 30000
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " pull-up"
- hideKeyboard
# Phase 2 (LW-15): tick the exercise in the picker, then "Add 1".
- tapOn:
    text: "Select Pull[- ][Uu]p"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "More for Pull[- ][Uu]p"
    timeout: 15000
# More pull-ups in one set than ever before: "Most reps" (a Phase 3 record kind).
- tapOn:
    text: ".* set 1 reps"
    below:
      text: "More for Pull[- ][Uu]p"
- inputText: " 40"
- hideKeyboard
- tapOn:
    text: "Mark .* set 1 complete"
    below:
      text: "More for Pull[- ][Uu]p"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "New record.*"
    timeout: 3000
- takeScreenshot: 60-most-reps-record
# D7: 40 reps may be 3x or more the member's best, so the row may ask "40 reps — that's …×
# your best. Keep it?" (already saved; it never refuses). It is on purpose: Keep.
- tapOn:
    text: "Keep 40 reps"
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
# Phase 2 (LW-02): Finish opens the "Finish workout?" sheet; its own button (above its
# "Keep going"; the screen's button sits behind it) saves.
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# LW-21: the records fold shut under "New records" with a count ("1 record · see it"): open them.
- scrollUntilVisible:
    element: "New records"
    centerElement: true
    timeout: 20000
- tapOn: "New records"
- extendedWaitUntil:
    visible: '\d+ records? · hide (it|them)'
    timeout: 5000
- takeScreenshot: 61-finish-records
- scrollUntilVisible:
    element: "Share workout"
    timeout: 20000
- tapOn: "Share workout"
- extendedWaitUntil:
    visible: "Share picture"
    timeout: 15000
- takeScreenshot: 62-workout-share-picture
- tapOn: "Share picture"
# Android's share menu (the chooser) lists the apps that can take a picture. Assert text only the
# SYSTEM chooser shows: ForgeAI's own sheet says "Share picture", which an old loose regex matched.
- extendedWaitUntil:
    visible: '(Sharing image|Sharing 1 image|No recommended people to share with)'
    timeout: 20000
- takeScreenshot: 63-android-share-menu
- back
- back
- scrollUntilVisible:
    element: "Done"
    timeout: 20000
- tapOn: "Done"
# ---------------------------------------------------------------- exercise page records
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- tapOn: "^Workout$"
- tapOn: "Exercise library"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " pull-up"
- hideKeyboard
- tapOn:
    text: "View Pull[- ][Uu]p"
    index: 0
- extendedWaitUntil:
    visible: "How to do it"
    timeout: 15000
- scrollUntilVisible:
    element: "Records"
    timeout: 20000
- scrollUntilVisible:
    element: "Most reps"
    timeout: 20000
- takeScreenshot: 64-pull-up-records
- back
- tapOn: "Search exercises"
- eraseText
- inputText: " bench press"
- hideKeyboard
- tapOn:
    text: "View .*Bench Press.*"
    index: 0
- extendedWaitUntil:
    visible: "How to do it|Heaviest set"
    timeout: 15000
- scrollUntilVisible:
    element: "Best set"
    timeout: 20000
- takeScreenshot: 65-bench-chart-by-date
- scrollUntilVisible:
    element: "Best session"
    timeout: 20000
- takeScreenshot: 66-bench-records
# ---------------------------------------------------------------- the coach is hidden
# Owner decision D4 (Phase 0): coach, nutrition and gym sync are hidden from members. Home must
# show no coach card and no calorie rings, and a coach link must land on Home, unsent.
- back
- back
- extendedWaitUntil:
    visible: "^Home$"
    timeout: 20000
- tapOn: "^Home$"
- assertNotVisible: 'Coach insight: .*'
- assertNotVisible: '(?i)^calories$'
- takeScreenshot: 67-home-no-coach
