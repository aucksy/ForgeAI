# Phase 3 device QA, part E — a new kind of record live, the records on the finish screen,
# the workout share picture through to Android's share menu, and the exercise page's
# records card. Runs after part D.
appId: com.forgeai.app
---
- launchApp
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 60000
- tapOn: "^Workout$"
- extendedWaitUntil:
    visible: "Start empty workout"
    timeout: 30000
- tapOn: "Start empty workout"
- tapOn:
    text: "(?i)^allow$"
    optional: true
- extendedWaitUntil:
    visible: "Add exercise"
    timeout: 20000
- tapOn: "Add exercise"
- tapOn: "Search exercises"
- inputText: " pull-up"
- hideKeyboard
# Phase 2 (LW-15): tick the exercise in the picker, then "Add 1".
- tapOn:
    text: "Select Pull[- ][Uu]p"
    index: 0
- tapOn: "Add 1"
- extendedWaitUntil:
    visible: "More for Pull[- ][Uu]p"
    timeout: 15000
# More pull-ups in one set than ever before: "Most reps" (a Phase 3 record kind).
- tapOn:
    text: ".* set 1 reps"
    below:
      text: "More for Pull[- ][Uu]p"
- inputText: " 40"
- hideKeyboard
- tapOn:
    text: "Mark .* set 1 complete"
    below:
      text: "More for Pull[- ][Uu]p"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "New record.*"
    timeout: 3000
- takeScreenshot: 60-most-reps-record
# D7: 40 reps may be 3x or more the member's best, so the row may ask "40 reps — that's …×
# your best. Keep it?" (already saved; it never refuses). It is on purpose: Keep.
- tapOn:
    text: "Keep 40 reps"
    optional: true
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Skip rest"
    optional: true
# Phase 2 (LW-02): Finish opens the "Finish workout?" sheet; its own button (above its
# "Keep going"; the screen's button sits behind it) saves.
- tapOn:
    text: "Finish workout"
    index: 0
- extendedWaitUntil:
    visible: 'Finish workout\?'
    timeout: 10000
- tapOn:
    text: "Finish workout"
    above:
      text: "Keep going"
- extendedWaitUntil:
    visible: "Workout complete"
    timeout: 30000
# Audit Phase 3 (D10): the finish line counts LIFTS that beat a best — one lift here (pull-ups),
# whatever kinds of record it set ("… · 1 lift beat its best").
- extendedWaitUntil:
    visible: '.* · 1 lift beat its best'
    timeout: 15000
# LW-10 / PG-04: a workout without a routine is named by when it started ("Afternoon workout
# done"); the share picture below carries the same name as its title — never "Full Body".
- assertVisible: '(Morning|Afternoon|Evening|Night) workout done'
- assertNotVisible: "Full Body done"
# LW-21: the records fold shut under "New records" with a count. Since Phase 3 (D10) it counts
# lifts, not kinds of record ("1 lift · see it"): open them.
- scrollUntilVisible:
    element: "New records"
    centerElement: true
    timeout: 20000
- tapOn: "New records"
- extendedWaitUntil:
    visible: '1 lift · hide it'
    timeout: 5000
- takeScreenshot: 61-finish-records
- scrollUntilVisible:
    element: "Share as a picture"
    timeout: 20000
- tapOn: "Share as a picture"
- extendedWaitUntil:
    visible: "Share picture"
    timeout: 15000
- takeScreenshot: 62-workout-share-picture
- tapOn: "Share picture"
# Android's share menu (the chooser) lists the apps that can take a picture. Assert text only the
# SYSTEM chooser shows: ForgeAI's own sheet says "Share picture", which an old loose regex matched.
- extendedWaitUntil:
    visible: '(Sharing image|Sharing 1 image|No recommended people to share with)'
    timeout: 20000
- takeScreenshot: 63-android-share-menu
- back
- back
- scrollUntilVisible:
    element: "Done"
    timeout: 20000
- tapOn: "Done"
# ---------------------------------------------------------------- exercise page records
- extendedWaitUntil:
    visible: "^Workout$"
    timeout: 20000
- tapOn: "^Workout$"
- tapOn: "Exercise library"
- extendedWaitUntil:
    visible: "Search exercises"
    timeout: 20000
- tapOn: "Search exercises"
- inputText: " pull-up"
- hideKeyboard
- tapOn:
    text: "View Pull[- ][Uu]p"
    index: 0
- extendedWaitUntil:
    visible: "How to do it"
    timeout: 15000
# Audit Phase 4 (EX-07): the page leads with the member's own answer — "Last time · Today" and
# "Best · <kind>", in the way the exercise is logged.
- assertVisible: 'Last time · .*'
- assertVisible: 'Best · .*'
- takeScreenshot: 63b-pull-up-last-time-best
# Phase 4: no "Records" heading on the page any more; the record tiles sit under the chart.
- scrollUntilVisible:
    element: "Most reps"
    timeout: 20000
- takeScreenshot: 64-pull-up-records
- back
- tapOn: "Search exercises"
- eraseText
- inputText: " bench press"
- hideKeyboard
- tapOn:
    text: "View .*Bench Press.*"
    index: 0
- extendedWaitUntil:
    visible: "How to do it|Heaviest weight"
    timeout: 15000
- scrollUntilVisible:
    element: "Best set"
    timeout: 20000
- takeScreenshot: 65-bench-chart-by-date
- scrollUntilVisible:
    element: "Best workout"
    timeout: 20000
- takeScreenshot: 66-bench-records
# Audit Phase 4 (EX-14 / R2): every past session is there, folded shut under its count
# ("Past workouts" · "13 workouts · see them"), no longer just "the last 15".
- scrollUntilVisible:
    element: "Past workouts"
    centerElement: true
    timeout: 20000
- assertVisible: '[\d,]+ workouts? · see (it|them)'
- assertNotVisible: 'Showing the last .*'
- takeScreenshot: 66b-bench-past-sessions-folded
# ---------------------------------------------------------------- the coach is hidden
# Owner decision D4 (Phase 0): coach, nutrition and gym sync are hidden from members. Home must
# show no coach card and no calorie rings, and a coach link must land on Home, unsent.
- back
- back
- extendedWaitUntil:
    visible: "^Home$"
    timeout: 20000
- tapOn: "^Home$"
- assertNotVisible: 'Coach insight: .*'
- assertNotVisible: '(?i)^calories$'
- takeScreenshot: 67-home-no-coach
