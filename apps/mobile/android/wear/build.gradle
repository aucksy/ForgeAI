// MettleUp for Wear OS (v0.46; ForgeAI then): the watch companion. It shows the phone's rest timer with a ring,
// buzzes when the rest is over (its own exact alarm, so a muted phone alert never matters), and
// shows live heart rate from the watch's sensor while a workout is open.
//
// Built only with -PwithWear=true (settings.gradle). Same applicationId as the phone app and the
// same signing key, which is what lets the Wear Data Layer pair the two (the phone publishes
// /forge/rest and /forge/workout from modules/forge-rest, WearSync.kt).
//
// The Compose compiler plugin is put on this module's own classpath at the project's Kotlin
// version, exactly as expo-modules-core does, so the phone build never loads it.
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
  namespace 'com.forgeai.wear'
  compileSdk rootProject.ext.compileSdkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion

  defaultConfig {
    // MUST equal the phone app's id (android/app/build.gradle; MettleUp, R-105): the Data Layer only
    // connects apps with the same package name and the same signing certificate.
    applicationId 'com.mettleup.app'
    minSdkVersion 30 // Wear OS 3+
    // Play (31 Aug 2026 on): Wear OS apps must target API 35 or higher (phones 36).
    targetSdkVersion 35
    // R-167 (Play): the watch is a second bundle of the same Play app, so it needs its own
    // versionCode: 1_000_000_000 + the phone's (release_checks.wear_version_code_for), passed by CI
    // as -PwearVersionCode. Without it (a local build) the phone's number, as before.
    versionCode (project.hasProperty('wearVersionCode') ? project.property('wearVersionCode').toString().toInteger()
      : project.hasProperty('appVersionCode') ? project.property('appVersionCode').toString().toInteger() : 1)
    versionName (project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : "0.1.0")
  }

  signingConfigs {
    // The phone's own debug key (app/debug.keystore). Release builds are re-signed in CI with the
    // phone's exact key-rotation arguments (release-apk.yml), so the watch and phone match.
    debug {
      storeFile file('../app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
    }
    release {
      signingConfig signingConfigs.debug
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }

  buildFeatures {
    compose true
    buildConfig false
  }

  testOptions {
    unitTests.returnDefaultValues = true
    // R-166: the watch screens are rendered headlessly (Robolectric, WatchScreensRenderTest).
    unitTests.includeAndroidResources = true
    unitTests.all {
      // Roborazzi without its Gradle plugin: write every capture (there are no goldens to compare).
      systemProperty 'roborazzi.test.record', 'true'
      systemProperty 'watchScreens.out', layout.buildDirectory.dir("outputs/watch-screens").get().asFile.absolutePath
      maxHeapSize = '2g'
      // The PNGs are side effects: a cached test task would leave the artifact empty.
      outputs.upToDateWhen { false }
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
  implementation "androidx.activity:activity-compose:1.10.1"
  // Play services pull in androidx.fragment 1.0; the permission request (registerForActivityResult)
  // needs 1.3+ (lint InvalidFragmentVersionForActivityResult, fatal in release).
  implementation "androidx.fragment:fragment:1.8.6"
  implementation "androidx.wear.compose:compose-material:1.4.1"
  implementation "androidx.wear.compose:compose-foundation:1.4.1"
  implementation "androidx.wear:wear-ongoing:1.0.0"
  // BridgingManager: keep the phone's "Rest is over" off the watch (the watch alerts itself).
  implementation "androidx.wear:wear-phone-interactions:1.1.0"
  implementation "androidx.health:health-services-client:1.1.0"
  // Health Services returns ListenableFuture (unregisterMeasureCallbackAsync) but ships Guava only
  // at runtime; the same version on the compile classpath.
  implementation "com.google.guava:guava:32.0.1-android"
  implementation "com.google.android.gms:play-services-wearable:20.0.1"
  // R-166: ambient mode (AmbientLifecycleObserver): the app stays on the dimmed always-on screen.
  implementation "androidx.wear:wear:1.3.0"

  testImplementation "junit:junit:4.13.2"
  // R-166: the watch screens rendered on a small and a large round screen (JVM, no emulator).
  // Pins: Robolectric 4.14.1 renders up to API 35; Roborazzi 1.60.0 is built with Kotlin 2.0.21,
  // readable by this project's Kotlin.
  testImplementation "org.robolectric:robolectric:4.14.1"
  testImplementation "io.github.takahirom.roborazzi:roborazzi:1.60.0"
  testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.60.0"
  testImplementation "androidx.test:core:1.6.1"
  testImplementation "androidx.test.ext:junit:1.2.1"
}
