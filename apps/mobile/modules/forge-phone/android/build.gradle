plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.forgeai'
version = '1.0.0'

android {
  namespace "com.forgeai.phone"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  // T74 (R-356): the gym shortcut icon is DRAWN headlessly (Robolectric, GymShortcutRenderTest) and
  // the PNGs are kept as a CI artifact (wear-build.yml, "shortcut-icons").
  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.all {
      systemProperty 'shortcutIcons.out', layout.buildDirectory.dir("outputs/shortcut-icons").get().asFile.absolutePath
      maxHeapSize = '1g'
      // The PNGs are side effects: a cached test task would leave the artifact empty.
      outputs.upToDateWhen { false }
    }
  }
}

dependencies {
  // Health Connect (Google Fit and Samsung Health read it). Needs Android 9+ at run time; the
  // module checks before every call. Its minSdk 26 is overridden in the manifests.
  implementation 'androidx.health.connect:connect-client:1.1.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  // The permission screen's contract type (already in the app through appcompat).
  implementation 'androidx.activity:activity:1.8.0'
  // R-260: Google Play's in-app update flow (a Play copy updates without leaving the app).
  implementation 'com.google.android.play:app-update:2.1.0'

  // T74 (R-356): ShortcutArtTest (pure rules) and GymShortcutRenderTest (the icon drawn through the
  // launcher masks), run by wear-build.yml (:forge-phone:testDebugUnitTest). Same pins as the watch app.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.14.1"
  testImplementation "androidx.test:core:1.6.1"
}
