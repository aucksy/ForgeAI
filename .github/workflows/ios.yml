name: iPhone build (simulator)

# R-339 (5 Nov 2026, docs/ios/RESEARCH.md plan step 3): build the iPhone app on GitHub's free Mac
# runner (public repo = free standard runners), install it on an iPhone simulator, open it and
# photograph the first screens. No Apple account, no signing, no secrets: a simulator build only.
#
# The ios/ folder is never committed: `expo prebuild --platform ios --clean` makes it here on every
# run from app.json and the config plugins, so nothing hand-edited can drift (inventory section 8.6).
# Artifact "iphone-screens": the PNGs, the xcodebuild log, the simulator log and any crash report.
# R-348 (owner, 5 Nov 2026: "Lets stop building iPhone app. We gotta perfect android first"): paused.
# Runs only when started by hand; put the push trigger back when iPhone work starts again.
on:
  workflow_dispatch:

# Other work pushes to main often: a running build always finishes (40 min of Mac time is not
# thrown away); only the newest waiting one is kept.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      OUT: ${{ github.workspace }}/ios-out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tools on this runner
        run: |
          mkdir -p "$OUT/shots"
          sw_vers
          xcodebuild -version
          pod --version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install JS dependencies
        run: npm ci

      - name: Exercise pictures (RepDB, fetched at build time)
        uses: ./.github/actions/exercise-pictures

      - name: Make the iPhone project (expo prebuild, CI only)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee "$OUT/pod-install.log"

      # Release configuration: the JavaScript is bundled into the app, so it opens with no Metro
      # server. CODE_SIGNING_ALLOWED=NO: a simulator app needs no Apple signing.
      - name: Build for the iPhone simulator
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace $WS, scheme $SCHEME"
          if ! xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
               -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
               -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
               build > "$OUT/xcodebuild.log" 2>&1; then
            grep -E "error:|\*\* BUILD FAILED" "$OUT/xcodebuild.log" | head -60 || true
            echo "----- last 150 lines -----"
            tail -150 "$OUT/xcodebuild.log"
            exit 1
          fi
          tail -5 "$OUT/xcodebuild.log"
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          du -sh "$APP"

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys, re
          d = json.load(sys.stdin)['devices']
          best = None
          for rt, devs in d.items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if re.match(r'iPhone \d+( Pro)?$', x['name']):
                      key = (rt, x['name'])
                      if best is None or key > best[0]: best = (key, x['udid'])
          print(best[1] if best else '')")
          [ -n "$UDID" ] || { xcrun simctl list devices available; echo "::error::no iPhone simulator"; exit 1; }
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      # 12 Nov 2026: the iPhone launch screen (fixed at build time) must be plain, only the background
      # colour (#F6F4F0 light, #1B1F26 dark), so a branded gym's logo is the first logo a member sees.
      # The first simctl picture used to be at 8 s, after the launch screen had gone. Quick screenshots
      # do not work either (run 43176584956: one at 0.3 s, then simctl waited ~15 s until the launch was
      # over). So a screen recording starts BEFORE `simctl launch`; frames are cut from it 10 a second.
      # Each change of picture is kept in shots/launch-frames/ (<look>-<ms after launch>-<main colour>.png);
      # the earliest frame after the launch that is neither black, plain white nor the home screen becomes
      # launch-<look>.png.
      - name: Picture tools (Pillow, ffmpeg)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow imageio-ffmpeg || python3 -m pip install --quiet pillow imageio-ffmpeg
          python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Install, open and photograph (simctl)
        run: |
          xcrun simctl install "$UDID" "$APP"
          ( xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'process == "MettleUp" OR subsystem == "com.facebook.react.log"' > "$OUT/simulator.log" 2>&1 & echo $! > "$RUNNER_TEMP/log.pid" )
          mkdir -p "$OUT/shots/launch-frames" "$RUNNER_TEMP/frames"
          cat > "$RUNNER_TEMP/pick_launch.py" <<'PY'
          import sys, glob, os, shutil, subprocess, collections
          from PIL import Image
          import imageio_ffmpeg
          look, video, launch_ms, keep, out = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4], sys.argv[5]
          tmp = os.path.join(os.environ["RUNNER_TEMP"], "frames", look)
          os.makedirs(tmp, exist_ok=True)
          subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), "-loglevel", "error", "-i", video, "-vf", "fps=10",
                          os.path.join(tmp, "%04d.png")], check=True)
          frames = sorted(glob.glob(os.path.join(tmp, "*.png")))
          print(f"{look}: {len(frames)} frames, launch at {launch_ms} ms into the recording")
          chosen, last_key = None, None
          for i, f in enumerate(frames):
              t = i * 100 - launch_ms
              im = Image.open(f).convert("RGB")
              small = im.resize((max(1, im.width // 6), max(1, im.height // 6)))
              px = list(small.getdata())
              top, n = collections.Counter(px).most_common(1)[0]
              share = n / len(px)
              # The middle of the screen (no status bar): anything far from the main colour is a logo or text.
              w, h = small.size
              mid = list(small.crop((0, h // 6, w, h * 5 // 6)).getdata())
              off = sum(1 for c in mid if max(abs(a - b) for a, b in zip(c, top)) > 24) / len(mid)
              hexc = "%02X%02X%02X" % top
              key = (hexc, round(off * 50))
              if key != last_key:
                  last_key = key
                  name = f"{look}-{t:+06d}ms-{hexc}.png"
                  shutil.copy(f, os.path.join(keep, name))
                  print(f"  {name}: #{hexc} on {share:.0%}, other pixels in the middle {off:.2%}")
              blank = sum(top) < 30 or min(top) >= 252  # black, or plain white (video colours drift a little)
              if chosen is None and t >= 0 and not blank and share >= 0.6:
                  chosen = (f, t, hexc, off)
          if chosen is None:
              print(f"::error::no {look} launch picture: every frame after the launch was black, white or the home screen")
              sys.exit(0)
          f, t, hexc, off = chosen
          shutil.copy(f, out)
          print(f"launch-{look}.png = {t} ms after launch: #{hexc}, other pixels in the middle {off:.2%}")
          PY
          # One launch, filmed from 1.5 s before it until 25 s after.
          film() {
            local look=$1 rec t0 tl
            rm -f "$RUNNER_TEMP/$look.mp4"
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$RUNNER_TEMP/$look.mp4" > "$RUNNER_TEMP/rec-$look.log" 2>&1 &
            rec=$!
            t0=$(python3 -c 'import time; print(time.time())')
            sleep 1.5
            tl=$(python3 -c "import time; print(int((time.time() - $t0) * 1000))")
            xcrun simctl launch "$UDID" com.mettleup.app
            sleep 25
            kill -INT $rec; wait $rec || true
            cat "$RUNNER_TEMP/rec-$look.log"
            cp "$RUNNER_TEMP/$look.mp4" "$OUT/shots/launch-frames/" || true
            python3 "$RUNNER_TEMP/pick_launch.py" "$look" "$RUNNER_TEMP/$look.mp4" "$tl" "$OUT/shots/launch-frames" "$OUT/shots/launch-$look.png"
          }
          # Light first; then back to the home screen and the dark look for the rest of the job.
          xcrun simctl ui "$UDID" appearance light || true
          film light
          xcrun simctl terminate "$UDID" com.mettleup.app || true
          xcrun simctl ui "$UDID" appearance dark || true
          sleep 2
          film dark
          last=26
          for t in 30 40; do
            sleep $(( t - last )); last=$t
            xcrun simctl io "$UDID" screenshot "$OUT/shots/simctl-$(printf %02d $t)s.png"
          done
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.mettleup.app"; then
            echo "The app is still running after 40 s."
          else
            echo "::error::MettleUp is not running 40 s after launch (crash?). See crash reports in the artifact."
            echo "CRASHED=1" >> "$GITHUB_ENV"
          fi
          xcrun simctl terminate "$UDID" com.mettleup.app || true

      - name: Install Maestro
        id: maestro
        continue-on-error: true
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: First screens (Maestro)
        if: steps.maestro.outcome == 'success' && env.CRASHED != '1'
        continue-on-error: true
        timeout-minutes: 25
        working-directory: ${{ env.OUT }}/shots
        run: |
          export MAESTRO_CLI_NO_ANALYTICS=1
          maestro --device "$UDID" test "$GITHUB_WORKSPACE/apps/mobile/qa/ios-first-screens.yaml" \
            --test-output-dir "$OUT/maestro" --debug-output "$OUT/maestro" 2>&1 | tee "$OUT/maestro.log"
          # Run 41974730387: the flow passed but its pictures were not in the working folder.
          # Gather them from wherever this Maestro version wrote them.
          find "$GITHUB_WORKSPACE" "$HOME/.maestro" "$OUT/maestro" -name 'ios-0*.png' \
            -not -path "$OUT/shots/*" -exec cp {} "$OUT/shots/" \; 2>/dev/null || true
          ls -la "$OUT/shots"

      - name: Crash reports and logs
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/log.pid" ] && kill "$(cat "$RUNNER_TEMP/log.pid")" 2>/dev/null || true
          mkdir -p "$OUT/crashes"
          find "$HOME/Library/Logs/DiagnosticReports" -name 'MettleUp*' -newer "$GITHUB_WORKSPACE/package.json" -exec cp {} "$OUT/crashes/" \; 2>/dev/null || true
          ls -la "$OUT/shots" "$OUT/crashes" || true
          if [ -f "$OUT/simulator.log" ]; then
            echo "----- JS errors and warnings in the simulator log -----"
            grep -E "ReactNativeJS|RCTLog|com.facebook.react.log" "$OUT/simulator.log" | grep -iE "error|exception|fatal|unhandled|warn" | head -80 || true
          fi
          [ "${CRASHED:-0}" = "1" ] && exit 1 || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-screens
          path: ${{ env.OUT }}
          retention-days: 7
          if-no-files-found: warn

      # ios-first-screens.yaml takes a picture only when its screen's own words are showing, so a
      # wrong screen is never saved under a right name; a missing picture is reported here instead.
      - name: Every picture is there
        if: always()
        run: |
          missing=0
          for p in launch-light launch-dark ios-01-first-screen ios-02-welcome ios-03-workout-tab ios-04-progress-tab \
                   ios-05-gym-tab ios-06-profile-tab ios-07-settings ios-08-settings-not-on-iphone; do
            if [ -f "$OUT/shots/$p.png" ]; then echo "ok      $p"; else echo "::error::missing picture $p"; missing=1; fi
          done
          exit $missing
