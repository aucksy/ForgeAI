name: Watch (outages and crashes)

# #34 alerts (28 Oct 2026), no new accounts: GitHub itself is the alarm.
# - Every 10 minutes: is the website, the admin app, HQ and the gym server answering?
#   If not, an issue labelled "outage" is opened (GitHub emails the owner; it @mentions him),
#   and closed by itself when everything answers again (scripts/watch/outage.mjs).
# Crash alerts moved out of this PUBLIC repo on 10 Nov 2026 (R-445, owner D2): the private repo
# aucksy/mettleup-crashes runs scripts/watch/crashes.mjs once a day and keeps the crash issues there.
# GitHub may start a scheduled run a few minutes late; that is fine for this.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  outage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/watch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every part answers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watch/outage.mjs
