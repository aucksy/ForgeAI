name: Play upload (testing tracks)

# R-125 (25 Oct 2026): after a v* tag's "Build & Release (APK + AAB)" run SUCCEEDS (its publish job
# only runs for tags, after every gate passed), this puts the release's mettleup-<tag>.aab on Google
# Play's internal test AND the closed test "Closed testing - Alpha" (track "alpha"), each as a
# completed release with the app's What's new lines for that version as release notes. Never
# production. Running it again for the same tag changes nothing (scripts/ci/play_upload.py skips a
# track that already has the versionCode). A problem with the closed track is a warning; internal
# testing still goes out. The release workflow's gates are untouched: this is a separate workflow.
#
# Keyless (Workload Identity Federation): no key file exists, never create one. GitHub's OIDC token
# for this repo (WIF provider condition assertion.repository=='aucksy/ForgeAI') is swapped for a
# short-lived token of mettleup-play@forgeai-d7eea, which Play Console lets release to testing
# tracks and manage the store listing. Both names are repository VARIABLES (not secrets):
# PLAY_WIF_PROVIDER, PLAY_SERVICE_ACCOUNT.
#
# Manual run (Actions → Play upload → Run workflow): tag (e.g. v0.56.1) and dry_run (default ON:
# everything except the commit; Play validates the edit, then it is thrown away).
#
# 26 Oct 2026: started by the release run itself (release-apk.yml job "play-upload", `uses:` this file,
# after "publish"). The old `workflow_run` trigger never fired in this repo after a tag release (0.57.0
# and 0.57.1 both had to be started by hand; test-lab.yml's never fired either), so it is gone: one
# reliable start, never two.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag whose AAB to upload (e.g. v0.57.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: validate on Play, never commit'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose AAB to upload (e.g. v0.56.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: validate on Play, never commit'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload:
    # The release run calls this only after "publish" succeeded; a manual run always goes.
    # One Play edit at a time (an edit committed by one run invalidates another open one).
    concurrency:
      group: play-edit
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC token Workload Identity Federation swaps for Google credentials
    env:
      # Both triggers carry the same inputs (workflow_call from the release run, workflow_dispatch by hand).
      TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v0.57.0."; exit 1
          fi
          echo "Tag $TAG, dry run: $DRY_RUN"

      # The scripts come from main (this workflow's commit); the release notes from the TAG's own
      # What's new file, so they match what that build shows.
      - name: Checkout
        uses: actions/checkout@v4

      - name: The tag's What's new file
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git show "refs/tags/$TAG:apps/mobile/src/lib/whatsNew.ts" > "$RUNNER_TEMP/whatsNew.ts"
          wc -c "$RUNNER_TEMP/whatsNew.ts"

      # The published release's own asset (the gated, signed build), not a rebuild.
      - name: Download mettleup-${{ env.TAG }}.aab from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "mettleup-$TAG.aab" --dir "$RUNNER_TEMP/aab"
          ls -la "$RUNNER_TEMP/aab"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Google API client (pinned)
        run: python -m pip install --disable-pip-version-check -q -r scripts/ci/play-requirements.txt

      - name: Self-tests (Play scripts)
        run: python -m unittest discover -s scripts/ci -p 'test_play_scripts.py' -v

      - name: Google sign-in (keyless, Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - name: Upload to Play (internal + closed testing)
        run: |
          set -euo pipefail
          ARGS=(--tag "$TAG" --aab "$RUNNER_TEMP/aab/mettleup-$TAG.aab" --whats-new "$RUNNER_TEMP/whatsNew.ts" --tracks internal,alpha)
          if [ "$DRY_RUN" = true ]; then ARGS+=(--dry-run); fi
          python scripts/ci/play_upload.py "${ARGS[@]}"

      # R-167 (28 Oct 2026): the WATCH app's bundle (mettleup-<tag>-wear.aab: same package, same upload
      # key, the watch's own versionCode) to the Wear OS internal testing track "wear:qa", in its own
      # Play edit AFTER the phone's (play_upload.py --wear accepts only "wear:" tracks, never
      # production; the phone run above refuses every "wear:" track). A release without a watch
      # bundle (before 0.60.0) is skipped. 29 Oct 2026: a failure here (a wrong track name, Play refusing
      # the bundle) turns this job RED with an error annotation so it is never missed; the phone's tracks
      # were committed by the step above in their own edit and stay out. Track name checked against
      # developers.google.com/android-publisher/tracks: Wear OS prefix "wear", internal testing "qa".
      - name: Upload the watch app to Play (Wear OS internal testing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WEAR_AAB="mettleup-$TAG-wear.aab"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$WEAR_AAB"; then
            echo "::notice::$TAG has no $WEAR_AAB (watch bundles start with 0.60.0): nothing to upload for the watch."
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "mettleup-$TAG-wear.aab" --dir "$RUNNER_TEMP/wear-aab"
          ls -la "$RUNNER_TEMP/wear-aab"
          ARGS=(--wear --tag "$TAG" --aab "$RUNNER_TEMP/wear-aab/$WEAR_AAB" --whats-new "$RUNNER_TEMP/whatsNew.ts" --tracks wear:qa)
          if [ "$DRY_RUN" = true ]; then ARGS+=(--dry-run); fi
          python scripts/ci/play_upload.py "${ARGS[@]}" || { echo "::error title=Watch app not on Play::The watch bundle did not reach Play's Wear OS internal track wear:qa. The phone's tracks are already done and unaffected. See the log above."; exit 1; }
