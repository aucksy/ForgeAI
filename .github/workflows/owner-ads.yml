# MettleUp owner ads: render the 9:16 videos and the 1:1 / 4:5 feed stills from marketing/owner-ads
# (Remotion). Manual runs only. The laptop never renders full videos (owner rule); this does.
# One job per ad, side by side (one runner did ~12 min per ad and hit the hour limit doing all five).
# Output: one artifact per ad, "owner-ads-<id>", kept 3 days (artifact storage is small and shared).
# Voice (scripts/voice-pack.mjs): blank = the voice files in the repo (01-05: Kokoro; 06 has none yet, so
# it renders with music only); "none" = music only; a run id = the voice from that run's artifacts, one file
# <ad-id>/vo-<n>.wav (or .mp3) per line of copy.json's `say` text; voice_name picks the voice's folder.
# Music (scripts/music-pack.mjs): blank = the procedural bed; a music-choices run id + music_name (option number)
# = that option, timed so its own ending lands on the ad's last frame.
# Final render: only=03-own-app,06-progress  voice=<run id>  voice_name=<voice>  music=<run id>  music_name=<n>.
name: owner-ads

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Ad ids, comma-separated (blank = all six)'
        required: false
        default: ''
      voice:
        description: 'Voice: blank = files in the repo, none = music only, or a run id whose artifacts hold <ad-id>/vo-<n>.wav'
        required: false
        default: ''
      voice_name:
        description: "With a run id: the chosen voice's folder name in that run (blank = the only one)"
        required: false
        default: ''
      music:
        description: 'Music: blank = the procedural bed, or a music-choices run id'
        required: false
        default: ''
      music_name:
        description: 'With a music run: the option number (e.g. 2)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - id: ids
        env:
          ONLY: ${{ inputs.only }}
        run: |
          all='01-pending-fee,02-one-member-fee,03-own-app,04-excel-move,05-trainer-leaves,06-progress'
          pick="${ONLY:-$all}"
          echo "ids=$(echo "$pick" | tr -d ' ' | jq -Rc 'split(",") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    defaults:
      run:
        working-directory: marketing/owner-ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System libraries and fonts for headless Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
            fonts-noto-core fonts-dejavu-core || true
          sudo apt-get install -y -q libasound2t64 || sudo apt-get install -y -q libasound2 || true
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Music bed and sound effects (procedural, deterministic)
        run: node scripts/synth-audio.mjs
      - name: Voice
        env:
          ONLY: ${{ matrix.id }}
          VOICE: ${{ inputs.voice }}
          VOICE_NAME: ${{ inputs.voice_name }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/voice-pack.mjs
      - name: Music
        env:
          MUSIC: ${{ inputs.music }}
          MUSIC_NAME: ${{ inputs.music_name }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/music-pack.mjs
      - name: Render videos and feed stills
        env:
          ONLY: ${{ matrix.id }}
          CONCURRENCY: '4'
        run: npx tsx scripts/render-all.ts
      - name: Probe lengths (video vs audio)
        continue-on-error: true
        run: |
          ffprobe() { npx --no-install remotion ffprobe "$@"; }
          for f in out/videos/*.mp4; do
            v=$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 "$f")
            a=$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 "$f")
            echo "$f video=${v}s audio=${a}s size=$(du -h "$f" | cut -f1)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-ads-${{ matrix.id }}
          path: |
            marketing/owner-ads/out/videos/*.mp4
            marketing/owner-ads/out/feed/*.png
          retention-days: 3
          compression-level: 0
