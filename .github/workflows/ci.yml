name: CI

# Typecheck + unit tests for every workspace, on every push and PR.
#
# The release workflow already gates the MOBILE app before its Gradle build, but
# that only runs when a v* tag is pushed. The CRM (apps/dashboard) ships as a web
# build with no tag in the loop, so without this it would have no gate at all —
# and it is the workspace that handles money.
on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # v* tags are covered by release-apk.yml, which runs the same checks
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Audit toolkit (14 Oct 2026): a caught-and-dropped error hid the dead Health Connect button
      # for 11 releases. The count of silent catches may only go down; a new one fails here.
      # 15 Oct 2026: a phone-test file Maestro cannot parse wasted a 2-hour cloud run (a heredoc
      # ate a backslash). Every qa/*.yaml must parse before anything else runs.
      - name: Phone-test files parse
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import glob,yaml,sys; bad=[]
          for p in glob.glob('apps/mobile/qa/*.yaml'):
              try: list(yaml.safe_load_all(open(p, encoding='utf-8')))
              except Exception as e: bad.append(f'{p}: {e}')
          print(chr(10).join(bad) or 'all phone-test files parse'); sys.exit(1 if bad else 0)"

      - name: Silent-catch ratchet
        run: python3 scripts/ci/silent_catch_ratchet.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # Audit toolkit pick 4 (15 Oct 2026): type-aware ESLint for promise errors nobody sees
      # (never awaited, async handler whose rejection is dropped, empty catch). The count per
      # workspace may only go down (scripts/ci/promise_baseline.json).
      - name: Promise ratchet
        run: node scripts/ci/promise_ratchet.mjs

      # Audit v2 B3 (16 Oct 2026): Expo's own project check (duplicate native modules, SDK
      # regressions, config drift). WARN only for now: it never fails the build; what it finds is
      # printed here and as warnings on the run page. The plan's next step makes it fail.
      - name: Expo doctor (mobile, warn only)
        working-directory: apps/mobile
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if npx --yes expo-doctor > "$RUNNER_TEMP/expo-doctor.txt" 2>&1; then
            cat "$RUNNER_TEMP/expo-doctor.txt"
            echo "expo-doctor: every check passed"
          else
            cat "$RUNNER_TEMP/expo-doctor.txt"
            echo "::warning::expo-doctor: $(grep -c '^✖' "$RUNNER_TEMP/expo-doctor.txt") check(s) failed (warn only, see the 'Expo doctor' step's log)"
            grep '^✖' "$RUNNER_TEMP/expo-doctor.txt" | sed 's/^✖ */::warning::expo-doctor: /' || true
          fi

      - name: Typecheck (mobile)
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Unit tests (mobile)
        working-directory: apps/mobile
        run: npm test

      # Time-zone matrix (audit QA-14 / H12). The runner is UTC; members are in India
      # (+5:30, a half-hour offset) and a daylight-saving zone catches DST bugs that neither
      # UTC nor IST can. Same suite, ~15 s each. A test red in only one of these is a real
      # date bug, not a flake.
      - name: Unit tests (mobile, TZ=Asia/Kolkata)
        working-directory: apps/mobile
        env:
          TZ: Asia/Kolkata
        run: npm test

      - name: Unit tests (mobile, TZ=America/New_York)
        working-directory: apps/mobile
        env:
          TZ: America/New_York
        run: npm test

      - name: Typecheck (dashboard/CRM)
        working-directory: apps/dashboard
        run: npm run typecheck

      # Money maths, calendar maths, membership state and the storage adapter.
      - name: Unit tests (dashboard/CRM)
        working-directory: apps/dashboard
        run: npm test

      # Launch H7 (21 Oct 2026): the panel Worker's own code ("Send feedback", deploy/panel).
      - name: Panel Worker tests
        run: node --test deploy/panel

      # ForgeAI HQ (#51): the system owner's panel Worker (sign-in, API, clean-up) and its page logic.
      - name: HQ Worker and page tests
        run: node --test deploy/hq apps/hq/test

      # A build failure here is a shipping failure — the CRM is served as static
      # files, so `vite build` succeeding IS the deployability check.
      - name: Build (dashboard/CRM)
        working-directory: apps/dashboard
        run: npm run build

      # Audit toolkit pick 9 (15 Oct 2026): every panel page of a demo gym at 390 px and 1280 px,
      # dark theme; fails on a page error, console error, sideways overflow or a critical axe finding.
      - name: Panel crawl (every page, phone + computer, dark theme)
        working-directory: apps/dashboard
        run: |
          npx playwright install --with-deps chromium
          node scripts/crawl.mjs

      # UAT work package 5 (17 Oct 2026): the admin app driven the way an owner and a front-desk
      # person use it on a phone (390 x 844, touch, en-IN, India time, clock fixed at 17 Oct 2026
      # 10:00). Real taps and typing on the real forms: sell, collect, cancel a receipt, renew,
      # freeze, enquiries, expenses, check-in, import + undo, load demo / erase, staff limits,
      # receipt. The server is faked like the crawl (apps/dashboard/e2e/support.mjs).
      - name: Admin journeys (phone, real forms)
        working-directory: apps/dashboard
        run: npx playwright test

      - name: Admin journeys - traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-journeys-traces
          path: apps/dashboard/e2e/.results
          retention-days: 3
          if-no-files-found: ignore
          # The folder's name starts with a dot: without this nothing was ever uploaded (17 Oct 2026).
          include-hidden-files: true

  # Audit toolkit pick 6 (15 Oct 2026): every migration applied, in order, to a throw-away local
  # Supabase. Then the security check (RLS on, fixed search paths, the exact list of functions
  # callable without signing in, gym A never reads gym B) and the feature tests must all pass.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local Supabase (applies every migration)
        run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: plpgsql lint (broken function bodies)
        run: supabase db lint --level error --fail-on error

      - name: Security check and feature tests
        run: bash scripts/ci/db_checks.sh
