name: CI

# Typecheck + unit tests for every workspace, on every push and PR.
#
# The release workflow already gates the MOBILE app before its Gradle build, but
# that only runs when a v* tag is pushed. The CRM (apps/dashboard) ships as a web
# build with no tag in the loop, so without this it would have no gate at all —
# and it is the workspace that handles money.
on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # v* tags are covered by release-apk.yml, which runs the same checks
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Audit toolkit (14 Oct 2026): a caught-and-dropped error hid the dead Health Connect button
      # for 11 releases. The count of silent catches may only go down; a new one fails here.
      # 15 Oct 2026: a phone-test file Maestro cannot parse wasted a 2-hour cloud run (a heredoc
      # ate a backslash). Every qa/*.yaml must parse before anything else runs.
      - name: Phone-test files parse
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import glob,yaml,sys; bad=[]
          for p in glob.glob('apps/mobile/qa/*.yaml'):
              try: list(yaml.safe_load_all(open(p, encoding='utf-8')))
              except Exception as e: bad.append(f'{p}: {e}')
          print(chr(10).join(bad) or 'all phone-test files parse'); sys.exit(1 if bad else 0)"

      - name: Silent-catch ratchet
        run: python3 scripts/ci/silent_catch_ratchet.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck (mobile)
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Unit tests (mobile)
        working-directory: apps/mobile
        run: npm test

      # Time-zone matrix (audit QA-14 / H12). The runner is UTC; members are in India
      # (+5:30, a half-hour offset) and a daylight-saving zone catches DST bugs that neither
      # UTC nor IST can. Same suite, ~15 s each. A test red in only one of these is a real
      # date bug, not a flake.
      - name: Unit tests (mobile, TZ=Asia/Kolkata)
        working-directory: apps/mobile
        env:
          TZ: Asia/Kolkata
        run: npm test

      - name: Unit tests (mobile, TZ=America/New_York)
        working-directory: apps/mobile
        env:
          TZ: America/New_York
        run: npm test

      - name: Typecheck (dashboard/CRM)
        working-directory: apps/dashboard
        run: npm run typecheck

      # Money maths, calendar maths, membership state and the storage adapter.
      - name: Unit tests (dashboard/CRM)
        working-directory: apps/dashboard
        run: npm test

      # A build failure here is a shipping failure — the CRM is served as static
      # files, so `vite build` succeeding IS the deployability check.
      - name: Build (dashboard/CRM)
        working-directory: apps/dashboard
        run: npm run build

      # Audit toolkit pick 9 (15 Oct 2026): every panel page of a demo gym at 390 px and 1280 px,
      # English and Hinglish; fails on a page error, console error or sideways overflow.
      - name: Panel crawl (every page, phone + computer, both languages)
        working-directory: apps/dashboard
        run: |
          npx playwright install --with-deps chromium
          node scripts/crawl.mjs

  # Audit toolkit pick 6 (15 Oct 2026): every migration applied, in order, to a throw-away local
  # Supabase. Then the security check (RLS on, fixed search paths, the exact list of functions
  # callable without signing in, gym A never reads gym B) and the feature tests must all pass.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local Supabase (applies every migration)
        run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: plpgsql lint (broken function bodies)
        run: supabase db lint --level error --fail-on error

      - name: Security check and feature tests
        run: bash scripts/ci/db_checks.sh
