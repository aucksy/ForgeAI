name: Device QA (Android emulator)

# Real-device check of the member app's workout screen, run in the cloud (the owner's
# PC never builds). Builds the app for the emulator's x86_64 chip from the same code
# as the release, boots an Android 14 emulator, taps through the workout with Maestro,
# puts the phone to sleep during a rest to prove the "Rest is over" alert fires, and
# uploads every screenshot, the notification list and logcat as the `qa-out` artifact.
on:
  workflow_dispatch:

jobs:
  device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Build an emulator APK (x86_64)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/qa.apk" \;
          ls -la "$GITHUB_WORKSPACE/qa.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the workout QA on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/mobile/qa/run-device-qa.sh "$GITHUB_WORKSPACE/qa.apk"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: qa-out
          retention-days: 7
