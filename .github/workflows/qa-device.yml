name: Device QA (Android emulator)

# Real-device check of the member app's workout screen, run in the cloud (the owner's
# PC never builds). Builds the app for the emulator's x86_64 chip from the same code
# as the release, boots an Android 14 emulator, taps through the workout with Maestro,
# puts the phone to sleep during a rest to prove the "Rest is over" alert fires, and
# uploads every screenshot, the notification list and logcat as the `qa-out` artifact.
#
# Manual only, to save runner minutes (about 50 min a run). A release needs a PASSING run of
# this workflow on the tagged commit or its parent (release-apk.yml's phone-gate job). The
# `workflow_call` trigger lets a later release workflow call it directly with `uses:` + `needs:`;
# note that a called run is recorded under the CALLER's workflow, not under this file's name.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only these parts, comma separated: any of the whole run's (a b c d e f g h h3 p1 p2 i link i2 j j2 j3 k l n p9 r br inv invf p7 p0 m) and w (real workout), dnd, longrest, anim, mk (Monkey). Empty = the whole phone test. A partial run never opens the release gate."
        required: false
        default: ""
      extra:
        description: "Opt-in parts added to a whole run: dnd, longrest, anim, mk. Empty = the whole run exactly as before."
        required: false
        default: ""
      api:
        description: "Android API level of the emulator (34 = Android 14, 35 = 15, 36 = 16). Only 34 can open the release gate."
        required: false
        default: "34"
        type: choice
        options: ["34", "35", "36"]
      profile:
        description: "default = the emulator as it boots (411 dp, font 1.0, UTC). owner = his phone for every part (360 dp, font 1.3, Asia/Kolkata). Only default can open the release gate."
        required: false
        default: "default"
        type: choice
        options: ["default", "owner"]
  workflow_call:

# Audit v2 (16 Oct 2026): ONLY a whole run (no `only`) on API 34 with the default profile can
# open the release gate - that is the phone every release so far was proven on. Every other run
# (some parts only, another Android version, the owner's-phone profile) is named "(partial ...)",
# which scripts/ci/phone_gate.py ignores; its failures are findings for the audit, and it becomes
# a gate only once it is green on main. `extra` parts only ADD checks, so a whole default run with
# extras can still open the gate (it fails if any extra fails).
run-name: >-
  ${{ ((inputs.only != '' && inputs.only != null) || (inputs.api != '' && inputs.api != null && inputs.api != '34') || (inputs.profile != '' && inputs.profile != null && inputs.profile != 'default'))
  && format('Device QA (partial {0}, api {1}, profile {2}{3})', (inputs.only != '' && inputs.only != null) && inputs.only || 'whole run', inputs.api || '34', inputs.profile || 'default', (inputs.extra != '' && inputs.extra != null) && format(', + {0}', inputs.extra) || '')
  || ((inputs.extra != '' && inputs.extra != null) && format('Device QA (Android emulator, + {0})', inputs.extra) || 'Device QA (Android emulator)') }}

jobs:
  device-qa:
    runs-on: ubuntu-latest
    # 170 until audit v2: a whole run takes ~140 min; the owner profile and the opt-in parts add
    # up to ~40 more.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Build an emulator APK (x86_64)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/qa.apk" \;
          ls -la "$GITHUB_WORKSPACE/qa.apk"

      # The same merged-manifest permission list the release checks gate on, read from this
      # build (warn only here), so a wrong scripts/ci/approved-permissions.txt shows up before
      # anyone tags a release.
      - name: Permission list of this build
        run: |
          mkdir -p qa-out
          python3 scripts/ci/release_checks.py qa.apk --only permissions --warn-only --out-dir qa-out 2>&1 | tee qa-out/permissions-check.txt || echo "::warning::Could not read the permission list of this build (it never fails the phone test)."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the workout QA on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: QA_ONLY="${{ inputs.only }}" QA_EXTRA="${{ inputs.extra }}" QA_PROFILE="${{ inputs.profile || 'default' }}" bash apps/mobile/qa/run-device-qa.sh "$GITHUB_WORKSPACE/qa.apk"

      # Parts run / passed / failed, every skipped step, the crash / ANR / JS-error scan and the
      # rest-alert timing, on the run's summary page.
      - name: Phone test summary
        if: always()
        run: python3 apps/mobile/qa/qa_report.py summary qa-out || true

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: qa-out
          retention-days: 30
